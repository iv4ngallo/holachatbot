<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Præstantia Show Bible (Dôjo)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&family=Courier+Prime:wght@400;700&family=Michroma&display=swap">
<style>
:root{--bg:#05070b;--panel:#0d1218;--ac:#00B4FF;--ac2:#FF3B3B;--tx:#C0C0C0;--hi:#fff;--bd:#1b2530}
body[data-t=lab]{--bg:#0a0f14;--panel:#121a22;--ac:#6D8CA6;--ac2:#CCE0FF;--tx:#EAF3FF;--bd:#22303c}
body[data-t=war]{--bg:#0c0b0a;--panel:#181614;--ac:#D2A86E;--ac2:#A1270A;--tx:#cfcac2;--bd:#2b2824}
body[data-t=ice]{--bg:#0e161e;--panel:#1E2A37;--ac:#99D9EA;--ac2:#FFFFFF;--tx:#d6e4ea;--bd:#2d3d4d}
body[data-t=sodium]{--bg:#0c0a07;--panel:#181510;--ac:#F2B94A;--ac2:#FFFFFF;--tx:#d8d4cc;--bd:#3a352b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Roboto Condensed',system-ui,sans-serif;font-size:16px;line-height:1.5;transition:background .4s,color .4s}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.logo{font-family:'Bebas Neue';font-size:28px;letter-spacing:.14em;color:var(--hi)}
.logo b{color:var(--ac);font-weight:400}
.lang{display:flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.lang button{background:none;border:0;color:var(--tx);padding:6px 12px;font:700 13px 'Courier Prime';cursor:pointer}
.lang button.on{background:var(--ac);color:#000}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--tx);font:700 12px 'Michroma';letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;cursor:pointer;opacity:.7}
nav button.on{color:var(--hi);border-color:var(--ac);opacity:1}
main{max-width:1060px;margin:0 auto;padding:22px 16px 60px}
h1,h2{font-family:'Bebas Neue';font-weight:400;letter-spacing:.06em;color:var(--hi);margin:0}
h1{font-size:clamp(44px,12vw,92px);line-height:.95}
h2{font-size:34px;margin:0 0 4px}
h3{font-family:'Michroma';font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:26px 0 10px;font-weight:400}
.sub{font-family:'Courier Prime';color:var(--ac);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.lead{font-size:18px;max-width:760px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;position:relative}
.card h4{margin:0 0 4px;color:var(--hi);font-size:18px;font-weight:700}
.card p{margin:6px 0 0;font-size:15px}
.tag{display:inline-block;font:12px 'Courier Prime';border:1px solid var(--bd);color:var(--ac);padding:1px 8px;border-radius:20px;margin:2px 4px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{background:none;border:1px solid var(--bd);color:var(--tx);font:700 13px 'Roboto Condensed';padding:6px 12px;border-radius:20px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#000}
.bar{height:3px;background:linear-gradient(90deg,var(--ac),var(--ac2));margin:10px 0 18px;width:90px}
input[type=search]{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--bd);color:var(--hi);padding:9px 12px;font:15px 'Courier Prime';border-radius:4px}
.char{cursor:pointer;border-left:4px solid var(--c,var(--ac))}
.char .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.7,.2,1),margin .45s;margin-top:0;font-size:15px}
.char .more>.mi{overflow:hidden;min-height:0;border-top:1px dashed transparent;transition:border-color .3s}
.char.open .more{grid-template-rows:1fr;margin-top:10px}
.char.open .more>.mi{border-color:var(--bd);padding-top:10px}
.char .more b{color:var(--hi)}
.sym{font-family:'Courier Prime';font-size:12px;color:var(--c,var(--ac))}
.ep{display:grid;grid-template-columns:48px 1fr;gap:12px;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:8px;position:relative}
.ep .n{font-family:'Bebas Neue';font-size:38px;color:var(--ac);line-height:1}
.ep small{display:block;font:11px 'Michroma';letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin-top:6px}
.ep small:first-child{margin-top:0}
.sw{display:flex;gap:0;border-radius:6px;overflow:hidden;border:1px solid var(--bd)}
.sw button{flex:1;min-height:64px;border:0;cursor:pointer;font:700 11px 'Courier Prime';padding:4px;display:flex;align-items:flex-end;justify-content:center}
.hl{color:var(--ac2)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:#1B1F3B;color:#fff;text-align:left;padding:8px 10px;font:12px 'Michroma';letter-spacing:.05em}
td{padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
tbody tr:nth-child(odd) td{background:color-mix(in srgb,var(--panel) 90%,transparent)}
.scroll{overflow-x:auto}
.axis{margin:12px 0}
.axis .l{display:flex;justify-content:space-between;font-size:14px}
.axis .t{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ac2),var(--ac));margin-top:4px}
.stepper{display:flex;flex-wrap:wrap;gap:6px}
.stepper button{width:40px;height:40px;border:1px solid var(--bd);background:var(--panel);color:var(--tx);font:700 15px 'Courier Prime';border-radius:4px;cursor:pointer}
.stepper button.on{background:var(--ac);color:#000;border-color:var(--ac)}
.slide{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:22px;margin-top:14px;aspect-ratio:16/9;min-height:220px;display:flex;flex-direction:column;justify-content:center}
.slide .big{font-family:'Bebas Neue';font-size:clamp(30px,7vw,56px);color:var(--hi);line-height:1}
.brow{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.btrack{height:14px;background:var(--bd);position:relative;border-radius:2px}
.bfill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:2px}
.note{border-left:3px solid var(--ac2);padding:8px 12px;background:var(--panel);font-size:14px;margin:14px 0}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 12px;border-bottom:1px solid var(--bd)}
.check input{margin-top:5px;accent-color:var(--ac)}
.check.done span{opacity:.5;text-decoration:line-through}
footer{border-top:1px solid var(--bd);padding:18px 16px;font:13px 'Courier Prime';text-align:center;opacity:.7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ac);color:#000;font:700 13px 'Courier Prime';padding:8px 16px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
@media(max-width:560px){.brow{grid-template-columns:90px 1fr 56px}.ep{grid-template-columns:36px 1fr}}

/* ---------- ANIMACION ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.95;transition:opacity .4s ease}
main,footer{position:relative;z-index:1}
body::before{content:'';position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%)}
body::after{content:'';position:fixed;inset:0;z-index:30;pointer-events:none;opacity:.06;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px);animation:scan 9s linear infinite}
@keyframes scan{from{background-position:0 0}to{background-position:0 60px}}
#wipe{position:fixed;top:0;bottom:0;left:0;width:3px;z-index:40;pointer-events:none;background:var(--ac);box-shadow:0 0 22px 8px var(--ac),0 0 80px 30px color-mix(in srgb,var(--ac) 45%,transparent);transform:translateX(-10vw);opacity:0}
#prog{display:block;height:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));transform-origin:left;transform:scaleX(0);transition:transform .1s linear}
#view{transition:opacity .26s ease,transform .26s ease,filter .26s ease}
#view.leave{opacity:0;transform:translateX(var(--dx,-24px))}
#view.pre{transition:none;opacity:0;transform:translateX(var(--dx,24px))}
.rv{opacity:0;transform:translateY(18px);transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .25s,background .25s}
.rv.in{opacity:1;transform:none}
.rv.nt{transition:none!important}
.card.in:hover,.ep.in:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 65%,var(--bd));box-shadow:0 8px 28px -10px color-mix(in srgb,var(--ac) 55%,transparent)}
.card,.ep{isolation:isolate}
.card::before,.ep::before{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--ac) 24%,transparent),transparent 62%)}
.card:hover::before,.ep:hover::before{opacity:1}
.char{transition:border-color .3s}
.char:active{transform:scale(.99)}
.logo{position:relative}
.logo::before,.logo::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:0;pointer-events:none;white-space:nowrap}
.logo::before{color:var(--ac2);clip-path:inset(0 0 52% 0);animation:gl1 7s infinite steps(1)}
.logo::after{color:var(--ac);clip-path:inset(48% 0 0 0);animation:gl2 7s infinite steps(1) .35s}
@keyframes gl1{0%,92%,100%{opacity:0;transform:none}93%{opacity:.9;transform:translate(-4px,0)}95%{opacity:.9;transform:translate(3px,1px)}97%{opacity:.9;transform:translate(-2px,0)}}
@keyframes gl2{0%,92%,100%{opacity:0;transform:none}93%{opacity:.9;transform:translate(4px,0)}96%{opacity:.9;transform:translate(-3px,-1px)}}
h1{animation:h1in 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes h1in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{animation:h2in .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes h2in{from{opacity:0;transform:translateX(-22px);letter-spacing:.3em}to{opacity:1;transform:none;letter-spacing:.06em}}
.sub{animation:fadein .8s .1s both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{transform-origin:left;animation:barin .9s .25s cubic-bezier(.2,.7,.2,1) both}
@keyframes barin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hl{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{text-shadow:0 0 14px color-mix(in srgb,var(--ac2) 70%,transparent)}}
.marq{overflow:hidden;white-space:nowrap;margin:16px 0;border-block:1px solid var(--bd);padding:7px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq div{display:inline-block;animation:mq 26s linear infinite;font:12px 'Michroma';letter-spacing:.22em;text-transform:uppercase;color:var(--ac)}
@keyframes mq{to{transform:translateX(-50%)}}
nav button{position:relative;overflow:hidden;transition:color .25s,border-color .25s,opacity .25s,background .25s}
nav button:hover{opacity:1;background:color-mix(in srgb,var(--ac) 12%,transparent)}
.chip,.stepper button,.lang button{position:relative;overflow:hidden;transition:background .25s,color .25s,border-color .25s,transform .15s}
.chip:hover,.stepper button:hover{border-color:var(--ac);color:var(--hi)}
.chip.on:hover,.stepper button.on:hover{color:#000}
.chip:active,.stepper button:active{transform:scale(.92)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.35;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sw button{position:relative;overflow:hidden;transition:flex .35s cubic-bezier(.2,.7,.2,1),filter .2s}
.sw button:hover{flex:2;filter:brightness(1.15)}
.bfill{transition:width 1s cubic-bezier(.2,.7,.2,1)}
.axis .t{transform:scaleX(0);transform-origin:left;transition:transform 1.3s .25s cubic-bezier(.2,.7,.2,1)}
.axis.in .t{transform:none}
.slide{animation:slidein .5s cubic-bezier(.2,.7,.2,1) both;position:relative;overflow:hidden}
.slide::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,color-mix(in srgb,var(--ac) 14%,transparent) 50%,transparent 60%);transform:translateX(-120%);animation:shine 1.2s .3s ease-out forwards;pointer-events:none}
@keyframes slidein{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(120%)}}
.ep .n{transition:text-shadow .3s,transform .3s}
.ep:hover .n{text-shadow:0 0 18px var(--ac);transform:scale(1.12)}
.check span{transition:opacity .3s}
.tag{transition:background .2s,color .2s}
.tag:hover{background:var(--ac);color:#000}
input[type=search]{transition:border-color .25s,box-shadow .25s}
input[type=search]:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}

/* ---------- HERO ---------- */
.hero{position:relative;padding:6px 0 20px}
.htitle{font-family:'Bebas Neue';font-size:clamp(44px,12.6vw,190px);line-height:.9;letter-spacing:.05em;color:var(--hi);margin:6px 0 10px;animation:none;filter:none;opacity:1;white-space:nowrap}
.htitle span{display:inline-block;opacity:0;transform:translateY(40px);animation:ltr .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*75ms + 120ms)}
.htitle .ae{color:var(--ac);animation:ltr .95s cubic-bezier(.2,.7,.2,1) forwards,flick 5s 2s infinite;animation-delay:calc(var(--i)*75ms + 120ms),2s}
@keyframes ltr{to{opacity:1;transform:none}}
@keyframes flick{0%,92%,100%{text-shadow:0 0 22px var(--ac)}93%{text-shadow:none;opacity:.45}94%{text-shadow:0 0 22px var(--ac);opacity:1}96%{opacity:.5}97%{opacity:1}}
.hlead{font-size:17px;margin-top:6px}
.helix{position:absolute;right:1%;top:2%;width:150px;height:440px;display:flex;flex-direction:column;justify-content:space-between;opacity:.5;pointer-events:none;z-index:0}
.helix i{display:block;height:2px;position:relative;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:hxl 3.4s ease-in-out infinite;animation-delay:calc(var(--k)*-.21s)}
.helix i::before,.helix i::after{content:'';position:absolute;top:-3px;width:8px;height:8px;border-radius:50%;animation:inherit;animation-delay:inherit;animation-name:hxd}
.helix i::before{left:0;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.helix i::after{right:0;background:var(--ac2);box-shadow:0 0 8px var(--ac2);animation-name:hxe}
@keyframes hxl{0%,100%{clip-path:inset(0 0 0 0)}50%{clip-path:inset(0 66px 0 66px)}}
@keyframes hxd{0%,100%{transform:translateX(0)}50%{transform:translateX(66px)}}
@keyframes hxe{0%,100%{transform:translateX(0)}50%{transform:translateX(-66px)}}
@media(max-width:760px){.helix{display:none}}
.hero>*:not(.helix){position:relative;z-index:1}
.hstats{display:grid;grid-template-columns:repeat(4,auto);gap:6px 26px;justify-content:start;margin:18px 0}
.hstats div{border-left:2px solid var(--ac);padding-left:10px}
.hstats b{display:block;font:400 34px 'Bebas Neue';color:var(--hi);line-height:1;letter-spacing:.05em}
.hstats span{font:11px 'Michroma';letter-spacing:.06em;text-transform:uppercase;opacity:.75}
@media(max-width:560px){.hstats{grid-template-columns:repeat(2,1fr)}}
.hcta{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.btn{position:relative;overflow:hidden;border:1px solid var(--ac);background:transparent;color:var(--hi);font:12px 'Michroma';letter-spacing:.08em;text-transform:uppercase;padding:13px 22px;border-radius:3px;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s,transform .15s}
.btn:hover{box-shadow:0 0 24px -4px var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}
.btn.pri{background:var(--ac);color:#000}
.btn.pri:hover{background:var(--hi);box-shadow:0 0 28px 0 var(--ac)}
.btn:active{transform:scale(.96)}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s}
.btn:hover::after{transform:translateX(120%)}
.hero .tl{animation:fadein 1s .9s both}
.tl{position:relative;margin:22px 0 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tl::before{content:'';position:absolute;left:12.5%;right:12.5%;top:21px;height:2px;background:var(--bd)}
.tl::after{content:'';position:absolute;left:12.5%;top:21px;height:2px;width:calc(75% * var(--p,0));background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 12px var(--ac);transition:width .9s cubic-bezier(.6,0,.2,1)}
.pulse{position:absolute;top:17px;left:calc(12.5% + 75% * var(--p,0));width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;box-shadow:0 0 14px 4px var(--ac);transition:left .9s cubic-bezier(.6,0,.2,1),top .9s cubic-bezier(.6,0,.2,1);animation:pls 1.8s ease-in-out infinite;z-index:2}
@keyframes pls{50%{box-shadow:0 0 22px 9px var(--ac)}}
.hnode{background:none;border:0;color:var(--tx);cursor:pointer;text-align:center;padding:0 4px;font:inherit;position:relative;z-index:1}
.hnode .dot{display:block;margin:0 auto 10px;width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);position:relative;transition:all .35s}
.hnode .dot::after{content:'';position:absolute;inset:12px;border-radius:50%;background:var(--bd);transition:background .35s}
.hnode.past .dot{border-color:var(--ac)}
.hnode.past .dot::after{background:var(--ac)}
.hnode.on .dot{border-color:var(--ac2);transform:scale(1.14);box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 20%,transparent),0 0 22px var(--ac)}
.hnode.on .dot::after{background:var(--ac2)}
.hnode:hover .dot{border-color:var(--ac)}
.hnode b{display:block;font:11px 'Courier Prime';color:var(--ac);letter-spacing:.06em}
.hnode .nm{display:block;font:400 22px 'Bebas Neue';color:var(--hi);letter-spacing:.05em;line-height:1.1;transition:text-shadow .3s}
.hnode.on .nm{text-shadow:0 0 14px var(--ac)}
@media(max-width:640px){
 .tl{grid-template-columns:1fr;gap:16px}
 .tl::before{left:21px;right:auto;top:22px;bottom:22px;width:2px;height:auto}
 .tl::after{left:21px;top:22px;width:2px;height:calc((100% - 44px) * var(--p,0));transition:height .9s cubic-bezier(.6,0,.2,1)}
 .pulse{left:22px;top:calc(18px + (100% - 44px) * var(--p,0))}
 .hnode{display:flex;align-items:center;gap:14px;text-align:left;padding:0}
 .hnode .dot{margin:0;flex:none}
}
.hctl{display:flex;align-items:center;gap:8px;margin:6px 0 4px}
.hctl button{position:relative;overflow:hidden;width:38px;height:38px;border:1px solid var(--bd);background:var(--panel);color:var(--hi);font:22px/1 'Roboto Condensed';border-radius:4px;cursor:pointer;transition:border-color .2s,background .2s,transform .15s}
.hctl button:hover{border-color:var(--ac)}
.hctl button:active{transform:scale(.9)}
.hpanel{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:6px;padding:18px 20px;margin-top:8px;min-height:250px}
.hpanel.swap{animation:panelin .55s cubic-bezier(.2,.7,.2,1)}
@keyframes panelin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hname{font:400 clamp(34px,8vw,54px) 'Bebas Neue';color:var(--hi);letter-spacing:.06em;line-height:1;margin:6px 0 10px}
.badge{display:inline-block;font:11px 'Michroma';letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ac);color:var(--ac);padding:3px 10px;border-radius:20px}
.badge.dev{border-color:var(--ac2);color:var(--ac2)}
.hpts{list-style:none;margin:0;padding:0}
.hpts li{position:relative;padding:0 0 10px 18px;font-size:16px}
.hpts li::before{content:'';position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.hpanel.swap .hpts li{animation:fadein .6s both;animation-delay:calc(var(--i)*110ms + 150ms)}

  document.querySelectorAll('#hmatrix .mcell').forEach(c=>c.classList.toggle('hot',+c.dataset.c===HERO[S.hn].col));
 }
}

function pagerHTML(id,pos){
 const i=SECS.findIndex(x=>x[0]===id),p=SECS[i-1],n=SECS[i+1];
 const lab=lang==='es'?['Anterior','Siguiente']:['Previous','Next'];
 const b=(t,d,c)=>t?`<button type="button" class="pg ${c}" data-s="${t[0]}" aria-label="${d}: ${L(t[2])}"><em>${d}</em><b>${c==='pv'?'\u2190 ':''}${L(t[2])}${c==='nx'?' \u2192':''}</b></button>`:'';
 const al=lang==='es'?'Navegaci\u00f3n entre secciones':'Section navigation';
 if(pos==='top')return (n&&id!=='inicio')?`<nav class="pager pager-top" aria-label="${al}">${b(n,lab[1],'nx')}</nav>`:'';
 return p?`<nav class="pager" aria-label="${al}">${b(p,lab[0],'pv')}</nav>`:'';
}
function secHTML(id,i){
 const head=id==='inicio'?'':`<div class="sh"><span class="sn">${String(i).padStart(2,'0')}</span><h2>${L(SECS[i][2])}</h2></div>`;
 return `<div class="ps" id="${id}" data-sec="${id}">${pagerHTML(id,'top')}${head}${R[id]()}${pagerHTML(id)}</div>`;
}
function rs(id,mode){
 const el=document.getElementById(id);if(!el)return;
 const i=SECS.findIndex(x=>x[0]===id);
 const t=document.createElement('div');t.innerHTML=secHTML(id,i);const n=t.firstElementChild;
 el.replaceWith(n);
 decorate(mode!=='soft',n);
 if(id==='ost')OSTKIT.bind(n);
 if(id==='inicio'){heroPanel(false);heroMatrix(false);heroSet(S.hn,false,true)}
 return n;
}
function render(mode='full'){
 const y=window.scrollY;
 document.documentElement.lang=lang;
 view.innerHTML=SECS.map((s,i)=>secHTML(s[0],i)).join('');
 document.getElementById('foot').textContent=U('foot');
 decorate(mode!=='soft');
 OSTKIT.bind(document);
 heroPanel(false);heroMatrix(false);
 setTimeout(()=>heroSet(S.hn,false,true),mode==='soft'?0:650);
 renderNav();
 if(mode==='soft')window.scrollTo(0,y);
 onScroll();
}
function hdrH(){const h=document.querySelector('header');return h?h.offsetHeight:100}
window.__ostGo=()=>go('ost');
function setHH(){document.documentElement.style.setProperty('--hh',(hdrH()+8)+'px')}
function setTheme(){
 const t=SECS.find(s=>s[0]===sec);
 document.body.dataset.t=t[1];BG.set(t[1]);
}
function go(s,instant){
 if(!SECS.some(x=>x[0]===s))s='vision';
 const e=document.getElementById(s);if(!e)return;
 setHH();
 if(s==='inicio')window.scrollTo({top:0,behavior:(RM||instant)?'auto':'smooth'});
 else e.scrollIntoView({behavior:(RM||instant)?'auto':'smooth',block:'start'});
 try{history.replaceState(null,'','#'+s)}catch(x){}
}
function spy(){
 const y=hdrH()+Math.min(180,innerHeight*.28);
 let cur=SECS[0][0];
 for(const s of SECS){const e=document.getElementById(s[0]);if(e&&e.getBoundingClientRect().top<=y)cur=s[0]}
 if(innerHeight+scrollY>=document.documentElement.scrollHeight-6)cur=SECS[SECS.length-1][0];
 if(cur!==sec){sec=cur;setTheme();renderNav()}
}
function step(d){
 if(sec==='inicio'){const n=S.hn+d;if(n>=0&&n<HERO.length){heroSet(n,true);return}}
 if(sec==='pitch'){const n=S.slide+d;if(n>=0&&n<PITCH.length){S.slide=n;rs('pitch','swap')}}
}

const hostOf=el=>el.closest('.ps').id;
document.addEventListener('click',e=>{
 const q=sel=>e.target.closest(sel);
 let el;
 if(el=q('[data-s]'))return go(el.dataset.s);
 if(el=q('[data-go]'))return go(el.dataset.go);
 if(el=q('[data-scroll]')){const t=document.getElementById(el.dataset.scroll);if(t)t.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});return}
 if(el=q('[data-hn]'))return heroSet(+el.dataset.hn,true);
 if(el=q('[data-hp]'))return heroSet(S.hn+(+el.dataset.hp),true);
 if(el=q('[data-ax]')){S.ax=el.dataset.ax;document.querySelectorAll('#hax .chip').forEach(c=>c.classList.toggle('on',c.dataset.ax===S.ax));return heroMatrix(true)}
 if(el=q('.lang button')){lang=el.dataset.l;render('soft');if(window.__uuRefresh)window.__uuRefresh();return}
 if(el=q('[data-grp]')){S.chGroup=el.dataset.grp;return rs(hostOf(el),'swap')}
 if(el=q('[data-hex]')){const h=el.dataset.hex;try{navigator.clipboard.writeText(h).then(()=>toast(U('copied')+h),()=>toast(h))}catch(x){toast(h)}return}
 if(el=q('[data-ch]')){const n=el.dataset.ch;if(S.open.has(n)){S.open.delete(n);el.classList.remove('open')}else{S.open.add(n);el.classList.add('open')}return}
 if(el=q('[data-ss]')){S.season=+el.dataset.ss;return rs(hostOf(el),'swap')}
 if(el=q('[data-loc]')){S.loc=+el.dataset.loc;const hid=hostOf(el);rs(hid,'swap');const d=document.getElementById(hid).querySelector('h3');if(d)setTimeout(()=>d.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'}),120);return}
 if(el=q('[data-tc]')){S.tcat=el.dataset.tc;return rs(hostOf(el),'swap')}
 if(el=q('[data-sl]')){S.slide=+el.dataset.sl;return rs(hostOf(el),'swap')}
 if(el=q('[data-ck]')){const i=+el.dataset.ck;S.done.has(i)?S.done.delete(i):S.done.add(i);return rs(hostOf(el),'soft')}
});
document.addEventListener('input',e=>{
 if(e.target.id==='tq'){S.tq=e.target.value;const p=e.target.selectionStart;rs(hostOf(e.target),'soft');const n=document.getElementById('tq');n.focus();n.setSelectionRange(p,p)}
});
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest('.chip,.stepper button,nav button,.lang button,.sw button,.btn,.hctl button');
 if(!b||RM)return;
 const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2;
 const sp=document.createElement('span');sp.className='ripple';
 sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
 b.appendChild(sp);setTimeout(()=>sp.remove(),650);
});
let pmE=null,pmR=0;
addEventListener('pointermove',e=>{
 if(e.pointerType==='touch')return;
 pmE=e;if(pmR)return;
 pmR=requestAnimationFrame(()=>{
  pmR=0;const e=pmE;
  BG.mouse(e.clientX/innerWidth,e.clientY/innerHeight);
  const c=e.target.closest&&e.target.closest('.card,.ep');
  if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}
 });
},{passive:true});
function onScroll(){
 spy();
 const h=document.documentElement.scrollHeight-innerHeight;
 document.getElementById('prog').style.transform=`scaleX(${h>0?Math.min(1,scrollY/h):0})`;
}
let scR=0;addEventListener('scroll',()=>{if(scR)return;scR=requestAnimationFrame(()=>{scR=0;onScroll()})},{passive:true});
addEventListener('keydown',e=>{
 if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key==='ArrowRight')step(1);
 if(e.key==='ArrowLeft')step(-1);
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==sec&&SECS.some(x=>x[0]===h))go(h)});
addEventListener('resize',setHH);

sec=(location.hash.slice(1)&&SECS.some(x=>x[0]===location.hash.slice(1)))?location.hash.slice(1):'inicio';
BG.init(SECS.find(s=>s[0]===sec)[1]);
render('full');
setHH();
if(sec!=='inicio')setTimeout(()=>go(sec,true),60);
else{sec='inicio';setTheme()}
</script>

<style id="mm-css">.dj-legal{position:relative;z-index:1;text-align:center;padding:14px 16px 22px;font:11px 'Courier Prime','IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--tx);opacity:.55;border-top:1px solid var(--bd)}

 .mm-bd{position:fixed;inset:0;z-index:2147482000;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s,visibility 0s linear .3s}

 .mm-x:focus-visible{outline:2px solid currentColor;outline-offset:2px}
 .mm-list{display:flex;flex-direction:column}

 .mm-pn .mm-uni{margin:0}
 .mm-pn .mm-uni span{display:inline}
}
@media (prefers-reduced-motion:reduce){.mm-pn,.mm-bd,.mm-burger i{transition:none!important}}

@media (max-width:760px){
 .mm-row{border-top:1px solid var(--bd);padding-bottom:8px}
 .mm-burger{color:var(--hi);border:1px solid var(--bd);border-radius:4px;background:var(--panel)}
 .mm-cur{font:700 12px 'Michroma';letter-spacing:.06em;text-transform:uppercase;color:var(--hi);border-left:2px solid var(--ac);padding-left:10px}
 .mm-pn{background:linear-gradient(180deg,var(--panel),var(--bg));border-right:1px solid var(--bd);color:var(--tx);padding:16px 0 28px;box-shadow:12px 0 40px rgba(0,0,0,.5)}
 .mm-hd{padding:0 14px 0 20px}

 .mm-it em{font:700 11px 'Courier Prime';font-style:normal;color:var(--ac);opacity:.8;min-width:22px}
 .mm-it:hover{background:color-mix(in srgb,var(--ac) 8%,transparent);opacity:1}
 .mm-it[aria-current=true]{opacity:1;color:var(--hi);border-left-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
 .mm-foot{margin:auto 20px 0;padding-top:20px}
 .mm-foot .mm-uni{width:100%;justify-content:center}

<script>
(function(){
 var CFG={row:'#nav',num:1,head:function(t){return '<div class="mm-hd"><div class="mm-logo">PR<b>Æ</b>STANTIA</div><button type="button" class="mm-x" aria-label="'+t.c+'">&times;</button></div><div class="mm-bar"></div>'}};
 var URL_='../';
 function lg(){try{if(typeof lang!=='undefined')return lang}catch(e){}return (document.documentElement.lang||'es').slice(0,2)}
 var T={es:{u:'Universo',a:'Ir al menú del universo Dôjo',m:'Menú',c:'Cerrar menú',s:'Secciones',k:'Capítulos'},en:{u:'Universe',a:'Go to the Dôjo universe menu',m:'Menu',c:'Close menu',s:'Sections',k:'Chapters'}};
 function tt(){return T[lg()==='en'?'en':'es']}
 function icon(){return '<svg viewBox="0 0 22 12" aria-hidden="true"><line x1="2" y1="6" x2="20" y2="6"/><circle cx="2" cy="6" r="2"/><circle cx="11" cy="6" r="2"/><circle cx="20" cy="6" r="2"/></svg>'}
 function uni(){return '<a class="mm-uni" href="'+URL_+'" aria-label="'+tt().a+'">'+icon()+'<span>'+tt().u+'</span></a>'}
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 var nav,row,burger,cur,bd,pn,open=false,last=null;
 function items(){
  return [].slice.call(nav.children).filter(function(e){return !e.classList.contains('nav-logo')&&!e.classList.contains('mm-skip')}).map(function(e){
   var c=e.cloneNode(true);[].slice.call(c.querySelectorAll('i')).forEach(function(i){i.remove()});
   return {el:e,label:c.textContent.trim(),on:e.classList.contains('on')||e.getAttribute('aria-current')==='true'};
  });
 }
 function curLabel(){var a=items().filter(function(x){return x.on})[0];return a?a.label:''}
 function paintCur(){if(cur)cur.textContent=curLabel()||tt().m}
 function build(){
  var its=items(),t=tt();
  var list=its.map(function(x,i){return '<button type="button" class="mm-it" data-i="'+i+'"'+(x.on?' aria-current="true"':'')+'><em>'+(CFG.num?String(i+(CFG.base||0)).padStart(2,'0'):String(i+1).padStart(2,'0'))+'</em><span>'+esc(x.label)+'</span></button>'}).join('');
  pn.innerHTML=CFG.head(t)+'<div class="mm-list" role="list">'+list+'</div><div class="mm-foot">'+uni()+'</div>';
  pn.setAttribute('aria-label',t.m);
 }
 function show(){last=document.activeElement;build();open=true;document.documentElement.classList.add('mm-open');burger.setAttribute('aria-expanded','true');document.documentElement.style.overflow='hidden';var a=pn.querySelector('[aria-current=true]')||pn.querySelector('.mm-it');if(a){a.focus({preventScroll:true});a.scrollIntoView({block:'center'})}}
 function hide(){if(!open)return;open=false;document.documentElement.classList.remove('mm-open');burger.setAttribute('aria-expanded','false');document.documentElement.style.overflow='';if(last&&last.focus)last.focus({preventScroll:true})}
 function label(){var t=tt();burger.setAttribute('aria-label',t.m);var u=row.querySelector(':scope > .mm-uni');if(u){u.setAttribute('aria-label',t.a);u.querySelector('span').textContent=t.u}paintCur();var L=document.querySelector('.dj-legal');if(L)L.textContent='\u00A9 D\u00F4jo 2026 \u00B7 '+(lg()==='en'?'All rights reserved':'Todos los derechos reservados')}
 function mount(){
  nav=document.querySelector(CFG.row);if(!nav)return;
  row=document.createElement('div');row.className='mm-row';
  nav.parentNode.insertBefore(row,nav);
  burger=document.createElement('button');burger.type='button';burger.className='mm-burger';burger.setAttribute('aria-expanded','false');burger.setAttribute('aria-haspopup','dialog');burger.innerHTML='<i></i><i></i><i></i>';
  row.appendChild(burger);
  if(CFG.logo){var lb=document.createElement('button');lb.type='button';lb.className='mm-logo-m';lb.setAttribute('aria-label',CFG.logoLabel||'Inicio');lb.innerHTML=CFG.logo;lb.addEventListener('click',function(){var o=document.getElementById('navLogo');if(o)o.click()});row.appendChild(lb)}
  else{cur=document.createElement('div');cur.className='mm-cur';cur.setAttribute('aria-live','polite');row.appendChild(cur)}
  row.appendChild(nav);nav.classList.add('mm-fill');
  var d=document.createElement('div');d.innerHTML=uni();row.appendChild(d.firstChild);
  bd=document.createElement('div');bd.className='mm-bd';
  pn=document.createElement('div');pn.className='mm-pn';pn.setAttribute('role','dialog');pn.setAttribute('aria-modal','true');
  document.body.appendChild(bd);document.body.appendChild(pn);
  burger.addEventListener('click',function(){open?hide():show()});
  bd.addEventListener('click',hide);
  pn.addEventListener('click',function(e){
   if(e.target.closest('.mm-x'))return hide();
   var b=e.target.closest('.mm-it');
   if(b){var x=items()[+b.dataset.i];hide();if(x)setTimeout(function(){x.el.click()},30)}
  });
  document.addEventListener('keydown',function(e){
   if(!open)return;
   if(e.key.indexOf('Arrow')===0&&!e.target.closest('.mm-pn'))e.stopPropagation();
   if(e.key==='Escape'){e.preventDefault();hide();return}
   if(e.key==='Tab'){var f=[].slice.call(pn.querySelectorAll('button,a[href]'));if(!f.length)return;var a=document.activeElement,i=f.indexOf(a);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}
  },true);
  window.addEventListener('resize',function(){if(open&&window.innerWidth>760)hide()});
  var mo=new MutationObserver(function(){paintCur();if(open)build()});
  mo.observe(nav,{subtree:true,childList:true,attributes:true,characterData:true,attributeFilter:['class','aria-current']});
  label();
  window.__uuRefresh=function(){label();if(open)build()};
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script>
