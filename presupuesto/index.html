<!DOCTYPE html>

<meta name="description" content="Tu presupuesto mensual en pesos colombianos: ingresos, pagos, fechas y balance, mes a mes. Parte de Hola Apps.">

<style>
/* Presupuesto Personal · Hola Apps
   Sistema de diseño: Hola Chatbot (tokens.json). Superficies planas, sin degradados ni sombras.
   Tokens de marca: purple-primary, purple-secondary, gray-neutral, white, surface, surface-raised, ink, ink-muted,
   brand, on-brand, accent, on-accent, line, control-border, focus-ring.
   Extensiones provisionales (el sistema no las define): estados de pago (ok, warn, soon) y paleta categórica. */
:root {
  --purple-primary: #3D3A86;
  --purple-secondary: #8C3F71;
  --gray-neutral: #96989A;
  --white: #FEFEFE;

  --surface: #FEFEFE;
  --surface-raised: #F1F0F8;
  --ink: #1E1C46;
  --ink-muted: #5B5D60;
  --brand: #3D3A86;
  --on-brand: #FEFEFE;
  --accent: #8C3F71;
  --on-accent: #FEFEFE;
  --line: #96989A;
  --control-border: #767880;
  --focus-ring: #3D3A86;

  /* Derivados del tinte de marca */
  --brand-tint: color-mix(in srgb, var(--brand) 10%, var(--surface-raised));
  --brand-soft: color-mix(in srgb, var(--brand) 28%, var(--surface));

  /* Extensión provisional: estados de pago */
  --ok: #1F7A46; --ok-soft: #DDF1E6;
  --warn: #B3261E; --warn-soft: #FCE4E1;
  --soon: #7A5A00; --soon-soft: #FBF0C8;

  --font-display: "Climate Crisis", Impact, "Arial Black", sans-serif;
  --font-body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 20px; --radius-pill: 999px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #15142E; --surface-raised: #1F1D44; --ink: #F4F3FB; --ink-muted: #B4B6BA;
    --brand: #B9B6F2; --on-brand: #15142E; --accent: #E3A0CB; --on-accent: #15142E;
    --line: #6A6C72; --control-border: #8A8C92; --focus-ring: #B9B6F2;
    --ok: #7FD9A3; --ok-soft: #1F3A2B; --warn: #FF9A90; --warn-soft: #4A2420; --soon: #F5D760; --soon-soft: #4A3F12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #15142E; --surface-raised: #1F1D44; --ink: #F4F3FB; --ink-muted: #B4B6BA;
  --brand: #B9B6F2; --on-brand: #15142E; --accent: #E3A0CB; --on-accent: #15142E;
  --line: #6A6C72; --control-border: #8A8C92; --focus-ring: #B9B6F2;
  --ok: #7FD9A3; --ok-soft: #1F3A2B; --warn: #FF9A90; --warn-soft: #4A2420; --soon: #F5D760; --soon-soft: #4A3F12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--surface); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding: 0 0 var(--space-12);
}
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { padding-inline: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-muted); }

/* Encabezado: bloque sólido de marca */
.top {
  background: var(--brand); color: var(--on-brand);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--space-6) var(--space-4);
}
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-6); justify-content: space-between; }
.brand { min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 36px; line-height: 42px; margin: 0; text-transform: uppercase; overflow-wrap: anywhere; }
.brand small { display: block; font-weight: 400; font-size: 14px; line-height: 22px; }
.top-ctls { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-6); align-items: center; min-width: 0; }
.month-ctl { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; }
.month-ctl label { font-weight: 600; font-size: 14px; }
select#mes, select#tema {
  background: var(--surface); color: var(--ink); border: 2px solid var(--control-border); border-radius: var(--radius-md);
  padding: 7px 12px; font-weight: 600; font-size: 14px; min-width: 170px;
}
.btn {
  background: var(--surface); color: var(--ink); border: 2px solid var(--control-border); border-radius: var(--radius-md);
  padding: 7px 14px; font-weight: 600; font-size: 14px; line-height: 20px; transition: background .15s ease;
}
.btn:hover { background: var(--brand-tint); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.small { padding: 3px 10px; font-size: 14px; }
.btn.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.btn.primary:hover { background: color-mix(in srgb, var(--brand) 88%, var(--ink)); }
.btn.danger { color: var(--warn); }
.top .btn { background: var(--surface); color: var(--ink); border-color: var(--surface); }
.top .btn:hover { background: var(--surface-raised); }
.top :focus-visible { outline-color: var(--on-brand); }

/* Barra de vistas */
.viewbar { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; justify-content: flex-start; min-width: 0; }
.menuwrap { position: relative; }
.caret { display: inline-block; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); margin-left: var(--space-1); }
.menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 25; min-width: min(240px, 80vw); display: grid; gap: var(--space-1); padding: var(--space-2); background: var(--surface); border: 2px solid var(--control-border); border-radius: var(--radius-md); }
.menu[hidden] { display: none; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: 14px; width: 100%; background: none; border: 0; border-radius: var(--radius-sm); padding: 9px 12px; font-weight: 600; font-size: 14px; text-align: left; color: var(--ink); }
.mitem:hover { background: var(--brand-tint); }
.mitem[aria-checked="true"] { background: var(--brand); color: var(--on-brand); }
.mcheck { width: 12px; height: 7px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg) translate(1px, -1px); visibility: hidden; }
.mitem[aria-checked="true"] .mcheck { visibility: visible; }
.curview { font-size: 14px; color: var(--ink-muted); }
.curview b { color: var(--ink); font-weight: 600; }

main { padding-top: var(--space-6); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-6); }
.bal-body[hidden], [id^="gb-"][hidden] { display: none; }
.card { background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); min-width: 0; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 28px; margin: 0; text-transform: uppercase; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.toolbar .grow { flex: 1; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--ink-muted); vertical-align: -2px; margin-right: var(--space-2); flex: none; }

/* Balance */
.balance { padding: 0; }
.bal-body { padding: var(--space-6); display: grid; gap: var(--space-6); }
.bal-note { margin: 0; font-size: 14px; line-height: 22px; color: var(--ink-muted); max-width: 60ch; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
.fig { border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); background: var(--surface); min-width: 0; }
.fig.real { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.fig .lbl { font-weight: 600; font-size: 14px; line-height: 20px; }
.fig .val { font-weight: 700; font-size: 28px; line-height: 36px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.fig .sub { font-size: 14px; line-height: 22px; }
.neg { color: var(--warn); }
.fig.real .neg { color: inherit; text-decoration: underline; }
.bars { display: grid; gap: var(--space-3); }
.bar-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 120px; gap: var(--space-3); align-items: center; }
.bar-row .name { font-weight: 600; font-size: 14px; }
.track { height: 18px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--surface); overflow: hidden; position: relative; }
.track.sm { height: 14px; }
.fill { position: absolute; inset: 0 auto 0 0; background: var(--brand); border-radius: var(--radius-pill); }
.fill.exp { background: var(--brand-soft); }
.bar-row .amt { text-align: right; font-weight: 600; font-size: 14px; }
.legend { display: flex; gap: var(--space-4); flex-wrap: wrap; font-size: 14px; color: var(--ink-muted); }
.legend i { display: inline-block; width: 22px; height: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); vertical-align: -1px; margin-right: var(--space-2); }
.legend .l-exp { background: var(--brand-soft); }
.legend .l-real { background: var(--brand); }

/* Alertas */
.alert { border: 1px solid currentColor; border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; gap: var(--space-3); align-items: flex-start; }
.alert.late { background: var(--warn-soft); color: var(--warn); }
.alert.soon { background: var(--soon-soft); color: var(--soon); }
.alert .ic { flex: none; width: 28px; height: 28px; }
.abody { display: grid; gap: var(--space-1); min-width: 0; color: var(--ink); }
.alert strong { font-weight: 600; }
.alert p { margin: 0; font-size: 14px; line-height: 22px; }

/* Tarjetas de categoría */
.group-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); background: var(--brand-tint); border-radius: 19px 19px 0 0; }
.card.closed .group-head { border-bottom: 0; border-radius: 19px; }
.group-head h2 { min-width: 0; text-transform: none; font-family: var(--font-body); }
.gtoggle { display: flex; align-items: center; gap: var(--space-2); background: none; border: 0; padding: 2px 0; margin: 0; font-family: var(--font-body); font-weight: 600; font-size: 18px; line-height: 28px; color: inherit; text-align: left; min-width: 0; }
.chev { width: 9px; height: 9px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg) translate(-2px, -2px); transition: transform .15s ease; flex: none; margin-right: var(--space-1); }
.card.closed .chev { transform: rotate(-45deg); }
.group-stats { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); font-size: 14px; line-height: 22px; }
.group-stats b { font-weight: 600; }
.cols { display: none; }
ul.rows { list-style: none; margin: 0; padding: 0; }
.row {
  display: grid; gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); align-items: center;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  grid-template-areas: "chk nm edit" "valor valor valor" "pagado pagado pagado" "fecha fecha fecha" "chip chip chip";
}
.row:first-child { border-top: 0; }
.row.paid { background: color-mix(in srgb, var(--ok-soft) 55%, transparent); }
.row .chk { grid-area: chk; }
.row .nm { grid-area: nm; min-width: 0; }
.row .nm strong, .tn strong { display: block; font-weight: 600; overflow-wrap: anywhere; }
.row .nm small, .tn small { color: var(--ink-muted); font-size: 14px; line-height: 22px; overflow-wrap: anywhere; display: block; }
.row .f-valor { grid-area: valor; } .row .f-pagado { grid-area: pagado; } .row .f-fecha { grid-area: fecha; }
.row .chip { grid-area: chip; justify-self: start; }
.row .edit { grid-area: edit; }
.mini { display: block; font-size: 14px; font-weight: 600; color: var(--ink-muted); margin-bottom: 2px; }
.field input[type="text"], .field input[type="date"], .modal input[type="text"], .modal input[type="number"], .modal input[type="email"], .modal input[type="password"], .modal select, .filters select {
  width: 100%; min-width: 0; background: var(--surface); color: var(--ink); border: 2px solid var(--control-border); border-radius: var(--radius-md); padding: 6px 12px; font-weight: 500; font-size: 16px; line-height: 24px;
}
.field input[type="text"] { text-align: right; font-variant-numeric: tabular-nums; }
.field input:disabled { background: var(--surface-raised); color: var(--ink-muted); border-style: dashed; }
.chk input { position: absolute; opacity: 0; width: 28px; height: 28px; margin: 0; }
.chk { position: relative; width: 28px; height: 28px; display: block; }
.box { width: 28px; height: 28px; border: 2px solid var(--control-border); border-radius: var(--radius-sm); background: var(--surface); display: grid; place-items: center; }
.chk input:checked + .box { background: var(--brand); border-color: var(--brand); }
.chk input:checked + .box::after { content: ""; width: 12px; height: 7px; border-left: 3px solid var(--on-brand); border-bottom: 3px solid var(--on-brand); transform: rotate(-45deg) translate(1px, -1px); }
.chk input:focus-visible + .box { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.chip { display: inline-block; border: 1px solid var(--control-border); border-radius: var(--radius-pill); padding: 0 12px; font-size: 14px; line-height: 22px; font-weight: 600; white-space: nowrap; background: var(--surface); }
.chip.paid { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.chip.late { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.chip.posp { background: var(--surface-raised); color: var(--ink-muted); border-style: dashed; }
.row.posp, tr.posp { opacity: .72; background: var(--surface-raised); }
.row.posp .nm strong, tr.posp .tn strong { text-decoration: line-through; }
.modal .mnote { background: var(--soon-soft); color: var(--ink); border: 1px solid var(--soon); border-radius: var(--radius-md); padding: var(--space-3); font-size: 14px; line-height: 22px; }
.chip.soon { background: var(--soon-soft); color: var(--soon); border-color: var(--soon); }
.group-foot { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); flex-wrap: wrap; background: var(--surface); border-radius: 0 0 19px 19px; font-size: 14px; color: var(--ink-muted); }
.empty-g { padding: var(--space-4); color: var(--ink-muted); }
/* Categoría vacía */
.card.empty { border-style: dashed; border-color: var(--ink-muted); background: var(--surface); }
.card.empty .group-head { background: var(--surface); border-bottom: 1px dashed var(--ink-muted); }
.card.empty .dot { opacity: .5; }
.emptyflag { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 600; font-size: 14px; color: var(--ink-muted); background: var(--surface-raised); border: 1px dashed var(--ink-muted); border-radius: var(--radius-pill); padding: 0 12px; line-height: 22px; }
.emptyflag .ic { width: 16px; height: 16px; }
.empty-g.vacia { display: flex; align-items: center; gap: var(--space-3); }
.empty-g.vacia .ic { width: 34px; height: 34px; flex: none; }

@media (min-width: 780px) {
  .cols, .row { grid-template-columns: 34px minmax(160px, 1.6fr) 135px 135px 150px 128px 64px; }
  .cols { display: grid; gap: var(--space-3); padding: var(--space-2) var(--space-4); font-size: 14px; font-weight: 600; color: var(--ink-muted); border-bottom: 1px solid var(--line); }
  .cols span:nth-child(3), .cols span:nth-child(4) { text-align: right; padding-right: 12px; }
  .row { grid-template-areas: "chk nm valor pagado fecha chip edit"; }
  .mini { display: none; }
}

/* Tabla */
.filters { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-4); padding: var(--space-4); align-items: end; border-bottom: 1px solid var(--line); background: var(--brand-tint); border-radius: 19px 19px 0 0; }
.filters label { display: grid; gap: 2px; font-size: 14px; font-weight: 600; min-width: 160px; }
.tablewrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; min-width: 980px; }
table.t th, table.t td { padding: var(--space-2) var(--space-3); text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
table.t thead th { border-bottom: 2px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink-muted); white-space: nowrap; }
table.t th button { background: none; border: 0; padding: 0; font: inherit; color: inherit; }
table.t th button:hover { color: var(--ink); text-decoration: underline; }
table.t tr.paid td { background: color-mix(in srgb, var(--ok-soft) 55%, transparent); }
table.t td.r, table.t th.r { text-align: right; }
table.t td.field input { min-width: 108px; }
table.t td.field input[type="date"] { min-width: 140px; }
table.t tfoot td { border-top: 2px solid var(--line); border-bottom: 0; font-weight: 600; background: var(--surface); }
.tn { min-width: 170px; }
.modal label[hidden] { display: none; }
/* Categoría al día */
.card.done { border-color: var(--ok); }
.card.done .group-head { background: var(--ok-soft); border-bottom-color: var(--ok); }
.doneflag { font-weight: 600; font-size: 14px; line-height: 22px; color: var(--ok); background: var(--surface); border: 1px solid var(--ok); border-radius: var(--radius-pill); padding: 0 12px; animation: flagPop .6s ease-out 1; }
@keyframes flagPop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
#party { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.conf { position: absolute; display: block; will-change: transform, opacity; }
.party-msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: var(--brand); color: var(--on-brand); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-6); text-align: center; display: grid; gap: 2px; max-width: min(92vw, 360px); animation: partyPop 2.5s ease both; }
.party-msg strong { font-weight: 700; font-size: 24px; line-height: 32px; }
.party-msg span { font-size: 14px; line-height: 22px; }
@keyframes partyPop {
  0% { opacity: 0; transform: translateX(-50%) scale(.6); }
  12% { opacity: 1; transform: translateX(-50%) scale(1.06); }
  22% { transform: translateX(-50%) scale(1); }
  85% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-12px) scale(.98); }
}
/* Enfoque al rellenar el valor pagado */
.field input.flash { animation: focusPulse 1.2s ease-out 1; border-color: var(--brand); }
@keyframes focusPulse {
  0% { background: var(--brand); color: var(--on-brand); transform: scale(1.06); }
  35% { outline: 4px solid var(--brand-soft); outline-offset: 0; }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) { .party-msg, .doneflag { animation: none; } .field input.flash { animation: none; background: var(--brand-tint); } }
.row .nm small.ref, .tn small.ref { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: center; margin-top: 2px; }
.ref .refv { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; user-select: all; }
.ref .btn.small { padding: 0 8px; font-size: 14px; line-height: 22px; }
table.t tfoot tr + tr td { border-top: 1px solid var(--line); }
table.t tfoot .ft-head td { font-size: 14px; color: var(--ink-muted); }
table.t tfoot .ft-bal td { border-top: 2px solid var(--line); background: var(--brand-tint); }

/* Calendario */
.cal { padding: var(--space-4); display: grid; gap: var(--space-3); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { font-size: 14px; font-weight: 600; color: var(--ink-muted); text-align: center; padding: 2px 0; }
.day { min-height: 58px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); padding: var(--space-1) 5px; display: flex; flex-direction: column; gap: var(--space-1); align-items: stretch; text-align: left; min-width: 0; overflow: hidden; }
.day.blank { border: 0; background: transparent; min-height: 0; pointer-events: none; }
.day.today { background: var(--brand-tint); border-color: var(--brand); }
.day.sel { outline: 3px solid var(--focus-ring); outline-offset: 1px; }
.day.late { border-color: var(--warn); }
.dtop { display: flex; justify-content: space-between; align-items: center; gap: var(--space-1); }
.dn { font-weight: 600; font-size: 14px; }

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Presupuesto</h1>
      <small>Hola Apps · Pesos colombianos (COP)</small>
    </div>

    </div>
  </div>
</header>
<div class="wrap">
  <main id="app" aria-live="polite"><section class="card state"><h2>Cargando presupuesto</h2><p>Estamos trayendo tus meses y pagos.</p></section></main>
</div>
<div id="toast" hidden role="status"></div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../suite/config.js?v=2"></script>
<script src="../suite/suite.js?v=6"></script>
<script>
(function () {

  /* Paleta categórica provisional: el sistema de diseño de Hola Chatbot no define una. */

  var MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
  var DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  var DOW = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];  var app = document.getElementById("app");
  var monthCtl = document.getElementById("monthCtl");
  var THEMES = [["", "Automático"], ["light", "Claro"], ["dark", "Oscuro"]];
  var temaSel = document.getElementById("tema");

  temaSel.innerHTML = THEMES.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + "</option>"; }).join("");
  applyTheme(store("pp-tema") || "");
  var modalRoot = document.getElementById("modalRoot");
  var toastEl = document.getElementById("toast");

  var db = null, canWrite = true, dbMissing = false;
  var sb = null, session = null;

  var dragState = null, dragDirty = false, unlocked = {}, lastDragEnd = 0;
  var menuOpen = false, view = "tarjetas", collapsed = {}, calDay = 0, tabla = { cat: "", est: "", sort: "cat", dir: 1 };
  var queues = {};

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function monthKey(y, m) { return y + "-" + pad(m); }

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } return null; }
  function safeColor(c) { return /^#[0-9a-fA-F]{6}$/.test(c || "") ? c : "#96989A"; }

  /* Categorías */
  function catOf(it) { return catMap[it.grupo] || { id: it.grupo, nombre: "Sin categoría", tipo: "gasto", color: "#96989A", orphan: true }; }
  function isIng(it) { return catOf(it).tipo === "ingreso"; }

  }

  /* Estado de pago de un item */
  function estado(it, key) {
    var ing = isIng(it);
    if (it.pospuesto) return { c: "posp", t: "Pospuesto", level: 0, diff: 9999 };
    if (it.pagado) return { c: "paid", t: ing ? "Recibido" : "Pagado", level: 0, diff: 9999 };

  function sums(list) {
    var prog = 0, pag = 0, n = 0, npag = 0;

  }

  /* Escritura en la base: una a la vez por documento */
  function ref(id) { return db.collection("items").doc(id); }
  function write(id, fn) {
    var p = (queues[id] || Promise.resolve()).then(fn).catch(function (e) { toast("No se pudo guardar el cambio. Intenta de nuevo."); if (window.console) console.error(e); });
    queues[id] = p; return p;
  }
  function findItem(id) { return items.filter(function (x) { return x.id === id; })[0]; }

  var pendingFlash = {}, lastDone = { mes: null, map: {} };
  function toggle(id, on) {
    var it = findItem(id); if (!it) return;
    var data = { pagado: on };
    if (on) {
      var vacio = it.valorPagado == null || it.valorPagado === 0;
      data.valorPagado = vacio ? (it.valor || 0) : it.valorPagado;
      if (vacio && data.valorPagado > 0) pendingFlash[id] = Date.now();
      if (!it.fechaPago) data.fechaPago = todayISO();
    }
    else data.fechaPago = null;
    write(id, function () { return ref(id).update(data); });
  }
  function editField(id, field, raw) {
    var it = findItem(id); if (!it) return;
    var data = {};
    if (field === "valor") data.valor = parseMoney(raw);
    else if (field === "valorPagado") {
      data.valorPagado = parseMoney(raw);
      if (data.valorPagado > 0 && !it.pagado) { data.pagado = true; if (!it.fechaPago) data.fechaPago = todayISO(); }
    } else if (field === "fechaPago") {
      if (!it.pagado) { toast("Marca el item como pagado antes de asignar la fecha de pago."); render(); return; }
      data.fechaPago = raw || null;
    }
    write(id, function () { return ref(id).update(data); });
  }

  /* Meses */
  /* Copia limpia de un item para otro mes: sin pagos ni marcas de posposición */
  function dupItem(it) {
    var c = Object.assign({}, it); delete c.id;
    c.pagado = false; c.valorPagado = null; c.fechaPago = null;

  }
  function nextKey(key) { var p = key.split("-"), y = +p[0], m = +p[1] + 1; if (m > 12) { m = 1; y++; } return monthKey(y, m); }

        chain = chain.then(function () { var c = dupItem(x); c.mes = to; return db.collection("items").add(c); });
      });
    }
    chain = chain.then(function () {
      var c = dupItem(it); c.mes = to; c.nota = nota; c.pospuestoDe = from; c.origenId = id;
      return db.collection("items").add(c);
    }).then(function (r) { return ref(id).update({ pospuesto: true, pospuestoA: to, pospuestoId: r.id }); });
    chain.then(function () { toast("Pospusiste " + it.nombre + " a " + monthLabel(to) + (exists ? "." : ". Creé ese mes duplicando " + monthLabel(from) + ".")); })
      .catch(function () { toast("No se pudo posponer el item. Intenta de nuevo."); })
      .then(function () { busy = false; render(); });
  }
  function deshacerPosponer(id) {
    var it = findItem(id);
    if (it && !it.pospuesto && it.origenId) { var o = findItem(it.origenId); if (o && o.pospuesto) { it = o; id = o.id; } }
    if (!it || !db || busy || !it.pospuesto) return;
    var copy = it.pospuestoId ? findItem(it.pospuestoId) : null;
    if (copy && (copy.pagado || (copy.valorPagado || 0) > 0)) { toast("Ese pago ya se registró en " + monthLabel(copy.mes) + ". No se puede deshacer."); return; }

    var chain = Promise.resolve();
    if (copy) chain = chain.then(function () { return ref(copy.id).delete(); });
    chain = chain.then(function () { return ref(id).update({ pospuesto: false, pospuestoA: null, pospuestoId: null }); });

  }
  function createMonth() {

  function drawMonthModal() {
    var p = sel.split("-"), y = +p[0], m = +p[1];
    var mo = MESES.map(function (n, i) { return '<option value="' + (i + 1) + '"' + (i + 1 === m ? " selected" : "") + ">" + n + "</option>"; }).join("");

  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "tema") { applyTheme(t.value); store("pp-tema", t.value); return; }
    if (t.id === "mes") { sel = t.value; calDay = 0; store("pp-mes", sel); render(); return; }
    if (t.id === "m-grupo") { var gc = catMap[t.value], rw = document.getElementById("m-ref-wrap"); if (rw) rw.hidden = !!(gc && gc.tipo === "ingreso"); return; }
    if (t.id === "tb-cat") { tabla.cat = t.value; render(); return; }
    if (t.id === "tb-est") { tabla.est = t.value; render(); return; }
    if (t.getAttribute("data-act") === "toggle") { toggle(t.getAttribute("data-id"), t.checked); return; }
    var f = t.getAttribute("data-field"); if (f) editField(t.getAttribute("data-id"), f, t.value);
  });
  document.addEventListener("focusin", function (e) { if (e.target.getAttribute && e.target.getAttribute("data-field") && e.target.type === "text") e.target.select(); });
  document.addEventListener("keydown", function (e) {
    if (dragState && e.key === "Escape") { dragEnd(true); return; }
    var gr = e.target.closest && e.target.closest(".grip");
    if (gr && canWrite && gr.classList.contains("on") && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); moveCat(gr.getAttribute("data-grip"), e.key === "ArrowUp" ? -1 : 1); return; }
    if (e.key === "Escape" && modal) closeModal();
    else if (e.key === "Escape" && menuOpen) { menuOpen = false; render(); var vb2 = document.getElementById("vistas-btn"); if (vb2) vb2.focus(); }
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && e.target.closest && e.target.closest(".menu")) {
      e.preventDefault();
      var its = [].slice.call(document.querySelectorAll(".menu .mitem")), ix = its.indexOf(e.target);
      var nx = its[(ix + (e.key === "ArrowDown" ? 1 : its.length - 1)) % its.length]; if (nx) nx.focus();
    }
    if (e.key === "Enter" && e.target.getAttribute && e.target.getAttribute("data-field")) e.target.blur();
    if (e.key === "Enter" && modal && e.target.tagName === "INPUT" && e.target.type !== "checkbox" && e.target.type !== "radio") saveModal();
  });

  /* Conexión con los datos */
  function pickMonth() {
    if (sel && months.some(function (m) { return m.id === sel; })) return;
    var saved = store("pp-mes"), now = new Date(), cur = monthKey(now.getFullYear(), now.getMonth() + 1);
    var ids = months.map(function (m) { return m.id; });
    sel = ids.indexOf(saved) >= 0 ? saved : ids.indexOf(cur) >= 0 ? cur : ids[0] || null;
    calDay = 0;
  }
  function loadPrefs() {
    var v = store("pp-vista"); if (v && VIEWS.some(function (x) { return x[0] === v; })) view = v;
    try { var c = JSON.parse(store("pp-colapsadas") || "{}"); if (c && typeof c === "object") collapsed = c; } catch (e) { collapsed = {}; }
  }
  function safe(fn) { return function (snap) { try { fn(snap); } catch (e) { if (window.console) console.error(e); toast("Ocurrió un problema al mostrar los datos."); } }; }

  /* Almacén en memoria con la misma forma de uso que una base de documentos: colección, documento, onSnapshot, add, set, update, delete. */
  function newId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "").slice(0, 20); } catch (e) { /* ignorar */ }
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function createStore(persist) {
    var data = {}, subs = {}, ready = false;
    function col(n) { return data[n] || (data[n] = {}); }
    function snapOf(n) {
      return { docs: Object.keys(col(n)).map(function (id) { var d = col(n)[id]; return { id: id, data: function () { return clone(d); } }; }) };
    }
    function notify(n) { (subs[n] || []).forEach(function (s) { try { s(snapOf(n)); } catch (e) { /* cada suscriptor maneja sus errores */ } }); }
    function put(n, id, obj) {
      var prev = col(n)[id];
      col(n)[id] = obj; notify(n);
      return persist.save(n, id, obj).catch(function (e) { if (prev === undefined) delete col(n)[id]; else col(n)[id] = prev; notify(n); throw e; });
    }
    function del(n, id) {
      var prev = col(n)[id];
      delete col(n)[id]; notify(n);
      return persist.remove(n, id).catch(function (e) { if (prev !== undefined) col(n)[id] = prev; notify(n); throw e; });
    }
    function docRef(n, id) {
      return {
        id: id,
        set: function (obj) { return put(n, id, clone(obj)); },
        update: function (patch) { return put(n, id, Object.assign({}, col(n)[id] || {}, clone(patch))); },
        delete: function () { return del(n, id); }
      };
    }
    return {
      isReady: function () { return ready; },
      collection: function (n) {
        return {
          doc: function (id) { return docRef(n, id); },
          add: function (obj) { var id = newId(); return put(n, id, clone(obj)).then(function () { return { id: id }; }); },
          onSnapshot: function (cb, errCb) {
            (subs[n] = subs[n] || []).push(cb);
            if (ready) setTimeout(function () { cb(snapOf(n)); }, 0);
            return function () { subs[n] = (subs[n] || []).filter(function (x) { return x !== cb; }); };
          }
        };
      },
      has: function (n, id) { return col(n)[id] !== undefined; },
      count: function (n) { return Object.keys(col(n)).length; },
      load: function () {
        return persist.loadAll().then(function (all) {
          data = all || {}; ready = true;
          Object.keys(subs).forEach(notify);
          ["meses", "items", "categorias"].forEach(function (n) { if (!subs[n]) col(n); });
        });
      }
    };
  }

  /* Persistencia local (modo sin cuenta): localStorage del navegador */
  function localPersist() {
    var KEY = "hola-presupuesto-v1";
    function read() { try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { return {}; } }
    function write(all) { try { localStorage.setItem(KEY, JSON.stringify(all)); return Promise.resolve(); } catch (e) { return Promise.reject(e); } }
    return {
      loadAll: function () { return Promise.resolve(read()); },
      save: function (n, id, obj) { var all = read(); (all[n] = all[n] || {})[id] = obj; return write(all); },
      remove: function (n, id) { var all = read(); if (all[n]) delete all[n][id]; return write(all); }
    };
  }
  /* Persistencia en Supabase: una fila por documento, separadas por usuario con RLS (ver supabase.sql) */
  function cloudPersist(userId) {
    var T = "presupuesto_docs";
    return {
      loadAll: async function () {
        var all = {}, from = 0, size = 1000;
        for (;;) {
          var r = await sb.from(T).select("coleccion,doc_id,data").order("coleccion").order("doc_id").range(from, from + size - 1);
          if (r.error) throw r.error;
          (r.data || []).forEach(function (row) { (all[row.coleccion] = all[row.coleccion] || {})[row.doc_id] = row.data; });
          if (!r.data || r.data.length < size) break;
          from += size;
        }
        return all;
      },
      save: async function (n, id, obj) {
        var r = await sb.from(T).upsert({ user_id: userId, coleccion: n, doc_id: id, data: obj, updated_at: new Date().toISOString() }, { onConflict: "user_id,coleccion,doc_id" });
        if (r.error) throw r.error;
      },
      remove: async function (n, id) {
        var r = await sb.from(T).delete().eq("coleccion", n).eq("doc_id", id);
        if (r.error) throw r.error;
      }
    };
  }

  /* Categorías iniciales para una cuenta nueva. Paleta categórica provisional: el sistema de diseño no define una. */
  var DEFAULT_CATS = [
    ["ingresos", "Ingresos", "ingreso", "#1F7A5A"],
    ["servicios", "Servicios y suscripciones", "gasto", "#2F7F9E"],
    ["hogar", "Hogar y familia", "gasto", "#8C3F71"],
    ["profesionales", "Gastos profesionales", "gasto", "#3D3A86"],
    ["deudas", "Deudas y cuotas", "gasto", "#B5651D"],
    ["extras", "Extras y control de gastos", "gasto", "#5B5D60"]
  ];
  function seedIfNew(st) {
    if (st.has("meta", "init") || st.count("categorias") > 0) return Promise.resolve();
    var writes = DEFAULT_CATS.map(function (c, i) { return st.collection("categorias").doc(c[0]).set({ nombre: c[1], tipo: c[2], color: c[3], orden: i + 1 }); });
    writes.push(st.collection("meta").doc("init").set({ at: new Date().toISOString() }));
    return Promise.all(writes);
  }

  var timer = null, lastLoad = 0;
  function done() { if (loadedM && loadedI && loadedC) clearTimeout(timer); }
  function subscribeAll() {
    db.collection("meses").onSnapshot(safe(function (snap) {
      months = snap.docs.map(function (d) { return { id: d.id }; }).sort(function (a, b) { return a.id < b.id ? 1 : -1; });
      loadedM = true; done(); pickMonth(); render();
    }));
    db.collection("items").onSnapshot(safe(function (snap) {
      items = snap.docs.map(function (d) { return Object.assign({}, d.data() || {}, { id: d.id }); });
      loadedI = true; done(); render();
      if (modal && modal.kind === "cats" && modal.view === "list") drawModal();
    }));
    db.collection("categorias").onSnapshot(safe(function (snap) {
      cats = snap.docs.map(function (d) { return Object.assign({}, d.data() || {}, { id: d.id }); });
      rebuildCats(); loadedC = true; done(); render();
      if (modal && modal.kind === "cats" && modal.view === "list") drawModal();
    }));
  }
  function connect(persist) {
    months = []; items = []; cats = []; catMap = {}; sel = null;
    loadedM = loadedI = loadedC = false; slow = false; dbMissing = false; canWrite = true;
    var st = createStore(persist); theStore = st; db = st;
    subscribeAll(); render();
    clearTimeout(timer); timer = setTimeout(function () { slow = true; render(); }, 10000);
    lastLoad = Date.now();
    st.load().then(function () { return seedIfNew(st); }).catch(function (e) {
      if (st !== theStore) return;
      if (window.console) console.error(e);
      clearTimeout(timer); dbMissing = true; render();
    });
  }
  function disconnect() {
    theStore = null; db = null; months = []; items = []; cats = []; catMap = {}; sel = null;
    loadedM = loadedI = loadedC = false; modal = null; modalRoot.innerHTML = "";
  }
  var theStore = null;
  /* Refresca cuando vuelves a la pestaña (por si editaste en otro dispositivo) */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !session || !theStore || modal || dragState || busy) return;
    if (Date.now() - lastLoad < 30000) return;
    lastLoad = Date.now();
    theStore.load().catch(function () { /* se conserva lo que ya se ve */ });
  });

  /* Acceso compartido de Hola Apps: lo gestiona Suite (barra negra superior + login único) */
  function onUser(user, client) {
    sb = client; session = { user: user };
    connect(cloudPersist(user.id));
  }
  function onLogout() { session = null; sb = null; disconnect(); render(); }
  loadPrefs(); render();
  Suite.init({ app: "presupuesto", gate: true, onUser: onUser, onLogout: onLogout });
})();
</script>
