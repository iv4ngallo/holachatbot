      if(o.kind==='fijo'){o.type='neu';o.identityIds=[];o.twoMin='';o.exp=null}
      else{const wantExp=F(f,'exp').checked;if(wantExp&&!(h&&h.exp))o.exp={start:dk(new Date()),end:dk(addDays(new Date(),14))};else if(!wantExp)o.exp=null;else o.exp=h.exp}
      if(h)Object.assign(h,o);else S.habits.push(newHabit({...o,start:dk(new Date())}));
      commit();toast(h?'Cambios guardados':(o.kind==='fijo'?'Evento fijo añadido':'Hábito registrado'));

}
function deleteHabit(id){
  const h=habitById(id);if(!h)return;
  const uses=S.stacks.filter(st=>st.anchorHabitId===id||st.steps.some(p=>p.habitId===id)).length;
  confirmModal(`Se eliminará «${esc(h.name)}».${uses?` Está en ${uses} ${uses===1?'cadena':'cadenas'}: ahí se conservará como texto.`:''}`,()=>{
    S.stacks.forEach(st=>{if(st.anchorHabitId===id){st.anchorHabitId='';st.anchorText=h.name}st.steps.forEach(p=>{if(p.habitId===id){p.habitId='';p.text=h.name;p.duration=p.duration||h.duration}})});
    S.card.forEach(c=>{if(c.habitId===id)c.habitId=''});
    S.contracts=S.contracts.filter(c=>c.habitId!==id);
    S.habits=S.habits.filter(x=>x.id!==id);commit();toast('Hábito eliminado');
  });
}

    ${L('hide','Hacerlo invisible','Ej. Sacar el celular del cuarto',h.hide)}

    ${L('friction','Hacerlo difícil','Ej. Cerrar sesión y quitar la app',h.friction)}

  openModal({title:c?'Editar contrato':'Nuevo contrato de hábito',
    body:`<div class="form" style="display:flex;flex-direction:column;gap:12px">
      <label class="fld"><span>Hábito</span><select name="habitId">${opts}</select></label>
      <label class="fld"><span>Mi compromiso</span><input name="commit" value="${esc(c?c.commit:'')}" maxlength="140" placeholder="Ej. No revisaré redes antes de las 8"><small class="err"></small></label>
      <label class="fld"><span>Si fallo, pasa esto</span><input name="penalty" value="${esc(c?c.penalty:'')}" maxlength="140" placeholder="Ej. Dono 20.000 pesos a una causa que no me gusta"></label>
      <label class="fld"><span>Mi compañero de rendición de cuentas</span><input name="partner" value="${esc(c?c.partner:'')}" maxlength="80" placeholder="Nombre de quien lo verifica"></label>
      <label class="fld"><span>Fecha de revisión</span><input type="date" name="until" value="${esc(c?c.until:'')}"></label>
      <label class="check"><input type="checkbox" name="signed" ${c&&c.signed?'checked':''}><span>Lo firmo y me comprometo</span></label>
      ${why('Un costo inmediato vuelve insatisfactorio el mal hábito.','contract')}</div>`,

function shareContract(id){
  const c=S.contracts.find(x=>x.id===id);if(!c)return;
  const h=habitById(c.habitId);let st=h?statsFor(h):null;
  const txt=`Resumen semanal del contrato\nHábito: ${h?h.name:'—'}\nCompromiso: ${c.commit}\nSi fallo: ${c.penalty||'por definir'}\nÚltimos 7 días: ${st&&st.n7?Math.round(st.r7*100)+'% cumplido':'sin datos'}\nRacha: ${st?st.streak:0} días`;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Resumen copiado')).catch(()=>toast('No se pudo copiar'));
}

/* --- Revisiones --- */
function reviewModal(type){
  const wk=type==='week',tk=dk(new Date());
  let sum='';
  if(wk){const ws=weekStart(new Date());let d=0,t=0;for(let i=0;i<=dayIdx(new Date());i++){const x=addDays(ws,i);const its=itemsForDate(x).filter(y=>y.checkable);t+=its.length;d+=its.filter(y=>isDone(dk(x),y.key)).length}sum=`Esta semana marcaste ${d} de ${t} hábitos.`}
  else{const y=new Date().getFullYear()+'-';let n=0;for(const k in S.done)if(k.startsWith(y))n+=S.done[k].length;sum=`Este año llevas ${n} votos registrados.`}
  const Q=wk?['¿Qué salió bien esta semana?','¿Qué no funcionó?','¿Qué ajusto para la próxima?']:['¿Qué logré este año?','¿Qué aprendí de mí?','¿Qué quiero sostener el próximo año?'];
  openModal({title:wk?'Revisión semanal':'Revisión anual',
    body:`<div class="form" style="display:flex;flex-direction:column;gap:12px"><p class="hint" style="margin:0">${sum}</p>
    ${['a','b','c'].map((n,i)=>`<label class="fld"><span>${Q[i]}</span><textarea name="${n}" rows="2" maxlength="400"></textarea></label>`).join('')}${why('Revisar con regularidad evita que el plan se oxide.','bored')}</div>`,
    submit:'Guardar revisión',
    onSubmit:f=>{S.reviews.unshift({id:uid(),type:wk?'week':'year',date:tk,a:fv(f,'a'),b:fv(f,'b'),c:fv(f,'c')});S.reviews=S.reviews.slice(0,40);commit();toast('Revisión guardada')}});
}

/* --- Sugerencias --- */
function doSugg(el){
  const h=habitById(el.dataset.id),act=el.dataset.do,tk=dk(new Date()),mo=tk;
  if(act==='rev-open'){reviewModal('week');return}
  if(act==='rev-skip'){S.dismiss['rev:'+el.dataset.id]=tk;commit();return}
  if(!h)return;
  if(act==='up'){h.level=Math.min(3,h.level+1);h.levelSince=tk;h.suggAt=tk;toast('Subiste al nivel '+h.level);party(lastPt.x,lastPt.y,40)}
  else if(act==='down'){h.level=Math.max(1,h.level-1);h.levelSince=tk;h.suggAt=tk;toast('Bajaste al nivel '+h.level+': lo importante es seguir')}
  else if(act==='later'){h.suggAt=tk}
  else if(act==='rw-keep'){h.rewardAt=tk;S.dismiss['rw:'+h.id]=dk(addDays(new Date(),28))}
  else if(act==='rw-change'){h.rewardAt=tk;commit();fichaModal(h.id);return}
  else if(act==='pl-ok'){S.dismiss['pl:'+h.id]=dk(addDays(new Date(),30))}
  else if(act==='exp-keep'){h.exp=null;toast('Experimento superado: el hábito se queda')}
  else if(act==='exp-adjust'){h.exp={start:tk,end:dk(addDays(new Date(),14))};toast('Otras dos semanas de prueba')}
  else if(act==='exp-drop'){h.exp=null;h.archived=true;toast('Hábito pausado; puedes retomarlo cuando quieras')}
  commit();
}


/* --- Cadenas --- */
function stackModal(st){
  const anchorSel=st?(st.anchorHabitId||'__custom'):(S.habits.length?(S.habits.find(h=>h.type==='neu'||h.kind==='fijo')||S.habits[0]).id:'__custom');
  const opts=S.habits.map(h=>`<option value="${h.id}" ${anchorSel===h.id?'selected':''}>${h.kind==='fijo'?'Fijo · ':TYPE[h.type].sym+' '}${esc(h.name)}${h.time?' · '+h.time:''}</option>`).join('');
  openModal({title:st?'Editar cadena':'Nueva cadena de hábitos',
    body:`<div class="form" data-anchor="${anchorSel==='__custom'?'custom':'habit'}" style="display:flex;flex-direction:column;gap:14px">
      <label class="fld"><span>Nombre de la cadena</span><input name="name" value="${esc(st?st.name:'')}" maxlength="60" placeholder="Ej. Rutina de mañana"><small class="err"></small></label>
      <label class="fld"><span>Hábito actual (ancla)</span><select name="anchorHabitId">${opts}<option value="__custom" ${anchorSel==='__custom'?'selected':''}>Escribir otro hábito…</option></select><small class="hint">Elige algo que ya haces todos los días, a la misma hora y en el mismo lugar.</small></label>
      <label class="fld anchor-text"><span>Escribe el hábito actual</span><input name="anchorText" value="${esc(st?st.anchorText:'')}" maxlength="80" placeholder="Ej. Servirme el café"><small class="err"></small></label>
      <label class="fld"><span>Hora de inicio <em>(hora del ancla)</em></span><input type="time" name="time" value="${esc(st?st.time:'')}"><small class="hint">Si la dejas vacía y el ancla es un hábito con hora, se usa esa hora.</small></label>
      <div class="fld"><span>Días</span>${dayChips(st?st.days:[])}<small class="hint">Sin días seleccionados = todos los días.</small></div>
    </div>`,
    onSubmit:f=>{
      const name=fv(f,'name')||'Mi cadena';const sel=fv(f,'anchorHabitId');
      const text=fv(f,'anchorText');
      if(sel==='__custom'&&!text)return fErr(f,'anchorText','Escribe el hábito ancla.');
      const o={name,anchorHabitId:sel==='__custom'?'':sel,anchorText:sel==='__custom'?text:'',time:fv(f,'time'),days:fDays(f)};
      if(st)Object.assign(st,o);else{const n={id:uid(),...o,steps:[]};S.stacks.push(n);commit();toast('Cadena creada: añade el primer hábito');setTimeout(()=>stepModal(n.id),250);return}
      commit();toast('Cadena actualizada');
    }});
}
function stepModal(stackId,stepId){
  const st=S.stacks.find(x=>x.id===stackId);if(!st)return;
  const sp=stepId?st.steps.find(x=>x.id===stepId):null;
  const p=stackPlan(st);

      <div class="row2"><label class="fld"><span>Hora <em>(vacía = automática)</em></span><input type="time" name="time" value="${esc(sp?sp.time:'')}"></label><label class="fld"><span>Duración (min)</span><input type="number" name="duration" min="1" max="600" inputmode="numeric" value="${sp?(sp.duration||''):5}"></label></div>
      <p class="hint" style="margin:0">La hora automática empieza justo cuando termina el paso anterior.</p>

      }else habitId=s;

  const done=isDone(k,key);const h=habitById(it.habitId);
  const idents=h?hIds(h).map(stmtById).filter(Boolean):[];
  const st=it.checkable&&!it.neg?statsForItem(it):null;
  const reps=it.habitId&&h?repsFor(h):(it.checkable?repsForKey(key):0);
  const skip=(S.skips[k]||[]).includes(key),slip=(S.slips[k]||[]).includes(key);
  const kind={pila:'Paso de cadena',ancla:'Hábito ancla',fijo:'Evento fijo',pos:'Hábito positivo',neg:'Hábito negativo',neu:'Hábito neutral'}[it.cls];
  const sm=skipsThisMonth(key,k);
  const level=h&&h.type==='pos'&&h.level>1?`Nivel ${h.level}: ${levelText(h)}`:(h&&h.twoMin?'2 minutos: '+h.twoMin:'');
  const state=it.checkable?(done?(it.neg?'Lo evitaste':'Completado'):slip?'Te pasó (cuenta en contra)':skip?'Omitido sin culpa':'Pendiente'):'Referencia';
  const late=it.checkable&&!done&&k<dk(new Date());
  const lateWarn=late&&(Date.now()-parseDk(k).getTime())>(36*3600*1000)?'<p class="hint" style="margin:0">Es un día pasado: se marcará como registro tardío.</p>':'';
  const exp=it.neg&&h&&(h.reframe||h.hide)?`<div class="hmini">${h.reframe?'Lo que ganas al evitarlo: '+esc(h.reframe):'Recuerda: '+esc(h.hide)}</div>`:'';
  openModal({title:it.title,

      <dt>Hora</dt><dd>${it.start!=null?fromMin(it.start)+' – '+fromMin(it.start+it.dur):'Sin hora'} · ${it.dur} min</dd>

      ${st?`<dt>Racha</dt><dd><span class="streak">${ic('flame')}${st.streak} ${st.streak===1?'día':'días'}</span>${st.state==='rescue'?' <span class="tag red">Modo rescate</span>':''}</dd>`:''}
      ${reps?`<dt>Repeticiones</dt><dd>${reps} en total</dd>`:''}
      <dt>Estado</dt><dd>${state}</dd>
    </dl>${exp}${it.neg?'<p class="hint" style="margin:0">Es un hábito negativo: marca «Lo evité» si lo lograste o «Me pasó» si recaíste. Si no marcas nada, no cuenta en contra.</p>':''}${lateWarn}
    ${it.checkable&&!done&&!it.neg?`<div class="btns" style="margin-top:6px"><button type="button" class="btn ghost sm" data-act="skip-item" data-key="${esc(key)}" data-date="${k}" ${sm>=4&&!skip?'disabled':''}>${skip?'Quitar omisión':'Omitir hoy sin culpa'}</button><button type="button" class="btn ghost sm" data-act="ng-item" data-key="${esc(key)}" data-date="${k}">Hoy no tengo ganas</button></div><p class="hint" style="margin:6px 0 0">Omisiones este mes: ${sm} de 4. ${srcLink('never')}</p>`:''}
    </div>`,
    extra:`<button type="button" class="btn ghost sm" data-act="edit-source" data-key="${esc(key)}">${ic('edit')} Editar</button>${it.neg&&!done?`<button type="button" class="btn ghost sm" data-act="slip-item" data-key="${esc(key)}" data-date="${k}">${slip?'Quitar «me pasó»':'Me pasó'}</button>`:''}`,
    submit:done?'Desmarcar':(it.neg?'Lo evité':'Marcar como hecho'),
    onSubmit:it.checkable?()=>{toggleDone(key,k)}:null});
}
function toggleDone(key,k){
  const list=S.done[k]||(S.done[k]=[]);
  const i=list.indexOf(key);
  if(i>=0){list.splice(i,1);if(!list.length)delete S.done[k];if(S.meta[k]){delete S.meta[k][key];if(!Object.keys(S.meta[k]).length)delete S.meta[k]}}
  else{
    list.push(key);
    const sk=S.skips[k];if(sk){S.skips[k]=sk.filter(x=>x!==key);if(!S.skips[k].length)delete S.skips[k]}
    const sl=S.slips[k];if(sl){S.slips[k]=sl.filter(x=>x!==key);if(!S.slips[k].length)delete S.slips[k]}
    const h=habitById(keyHabitId(key));
    const late=k<dk(new Date())&&(Date.now()-parseDk(k).getTime())>(36*3600*1000);
    (S.meta[k]||(S.meta[k]={}))[key]={t:new Date().toTimeString().slice(0,5),lvl:h?h.level:1,late,ng:false};
    const ids=h&&h.type!=='neu'?hIds(h).map(stmtById).filter(Boolean):[];
    toast(ids.length?'+1 voto: '+ids[0].text:(late?'Registro tardío anotado':'¡Hecho! Un paso más.'));
    var celebrate=true;
  }
  commit();
  checkUnlocks();
  if(typeof celebrate!=='undefined'){
    const el=document.querySelector(`.chk[data-key="${CSS.escape(key)}"][data-date="${k}"]`);if(el)el.classList.add('pop');
    party(lastPt.x,lastPt.y,26);
    const its=itemsForDate(parseDk(k)).filter(i=>i.checkable);
    if(its.length&&its.every(i=>isDone(k,i.key))){setTimeout(()=>{bigParty();toast('¡Día completo! Cada voto cuenta.')},250)}
  }
}

/* ================= Fiesta ================= */
let lastPt={x:innerWidth/2,y:innerHeight/2};
document.addEventListener('pointerdown',e=>{lastPt={x:e.clientX,y:e.clientY}},true);
const reduceFx=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function party(x,y,n=24,spread=1){
  if(reduceFx())return;
  let root=$('#fx');if(!root){root=document.createElement('div');root.id='fx';document.body.appendChild(root)}
  for(let k=0;k<n;k++){
    const el=document.createElement('i');
    const star=k%6===0;
    if(star){el.className='st';el.textContent=['★','✦','●'][k%3];el.style.color=FXC[k%FXC.length]}
    else{const w=6+Math.random()*7,h=w*(Math.random()<.5?1:2.2);el.style.cssText=`width:${w}px;height:${h}px;background:${FXC[k%FXC.length]};border-radius:${Math.random()<.4?'50%':'2px'}`}
    el.style.left=x+'px';el.style.top=y+'px';root.appendChild(el);
    const a=(-Math.PI/2)+(Math.random()-.5)*Math.PI*1.6*spread,v=140+Math.random()*260;
    const dx=Math.cos(a)*v,dy=Math.sin(a)*v;
    const an=el.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${(Math.random()-.5)*360}deg)`,opacity:1,offset:.45},{transform:`translate(${dx*1.25}px,${dy+320+Math.random()*160}px) rotate(${(Math.random()-.5)*900}deg)`,opacity:0}],{duration:1100+Math.random()*800,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
    an.onfinish=()=>el.remove();
  }
}
function bigParty(){
  if(reduceFx())return;
  const w=innerWidth,h=innerHeight;
  party(w*.2,h*.7,34,1.1);setTimeout(()=>party(w*.8,h*.7,34,1.1),180);setTimeout(()=>party(w*.5,h*.45,46,1.6),360);
}

function wizCollect(){
  const f=$('#wiz-form');if(!f)return 0;
  const id=wsteps()[wiz.i].id,g=n=>{const e=f.elements.namedItem(n);return e?String(e.value||'').trim():''};
  if(id==='afirm'){const t=g('text');if(t.length<3||/^soy$/i.test(t))return 0;S.identity.statements.push({id:uid(),text:t,quality:g('quality'),created:dk(new Date())});commit();return 1}
  if(id==='habito'){const name=g('name');if(!name)return 0;const ids=[...f.querySelectorAll('input[name=identityIds]:checked')].map(i=>i.value);
    const h=newHabit({name,type:'pos',twoMin:g('twoMin'),place:g('place'),time:g('time'),duration:Math.max(1,parseInt(g('duration'))||10),want:g('want'),identityIds:ids,showCal:true,lvl3:name,lvl2:''});S.habits.push(h);wiz.made.push(h.id);commit();return 1}
  if(id==='habitoN'){const name=g('name');if(!name||realHabits().length)return 0;const ids=[...f.querySelectorAll('input[name=identityIds]:checked')].map(i=>i.value);
    const h=newHabit({name,type:'pos',twoMin:g('twoMin'),place:g('place'),time:g('time'),duration:5,identityIds:ids,showCal:true,lvl3:name,lvl2:'',start:dk(new Date())});S.habits.push(h);S.first=h.id;wiz.made.push(h.id);commit();return 1}
  if(id==='soltar'){const name=g('name');if(!name)return 0;const h=newHabit({name,type:'neg',reframe:g('reframe'),hide:g('hide'),showCal:true,duration:10});S.habits.push(h);wiz.made.push(h.id);commit();return 1}
  if(id==='ancla'){const name=g('name');if(!name)return 0;const h=newHabit({name,type:'neu',time:g('time'),duration:5,showCal:false});S.habits.push(h);wiz.made.push(h.id);commit();return 1}
  if(id==='cadena'){const steps=[...f.querySelectorAll('input[name=steps]:checked')].map(i=>i.value);if(!steps.length)return 0;
    const a=g('anchor'),at=g('anchorText');if(a==='__custom'&&!at)return 0;
    const st={id:uid(),name:g('name')||'Mi cadena',anchorHabitId:a==='__custom'?'':a,anchorText:a==='__custom'?at:'',time:g('time'),days:[],steps:steps.map(hid=>{const h=habitById(hid);return {id:uid(),habitId:hid,text:'',time:'',duration:h&&h.duration?h.duration:5}})};
    S.stacks.push(st);commit();return 1}
  return 0;
}
function wizRender(){
  const root=$('#wiz-root');if(!root||!wiz.open)return;
  const n=wsteps().length,st=wsteps()[wiz.i],pct=Math.round(wiz.i/(n-1)*100);
  const last=wiz.i===n-1,gi=wgroups().indexOf(st.g==='Bienvenida'?'Identidad':st.g);
  root.innerHTML=`<div class="wiz" role="dialog" aria-modal="true" aria-label="Modo asistido">
    <div class="wiz-top"><div class="wiz-brand">${mascot('sol',40)}<b>Modo asistido</b></div><button type="button" class="wiz-x" data-act="wiz-close" aria-label="Cerrar y retomar luego">Guardar y salir</button></div>
    <div class="wiz-prog" aria-label="Progreso ${pct}%"><div class="wiz-stages">${wgroups().map((x,i)=>`<span class="${st.g!=='Bienvenida'&&i<gi?'ok':''} ${st.g!=='Bienvenida'&&i===gi?'on':''}">${x}</span>`).join('')}</div><div class="wiz-bar"><i style="width:${pct}%"></i></div></div>
    <div class="wiz-main"><form id="wiz-form" class="wiz-card tile" autocomplete="off" novalidate><span class="wiz-mascot">${mascot(st.m,92)}</span><div class="wiz-step">Paso ${wiz.i+1} de ${n}</div>${WB[st.id]()}</form></div>
    <div class="wiz-foot"><button type="button" class="btn ghost" data-act="wiz-prev" ${wiz.i===0?'disabled':''}>${ic('left')} Atrás</button><span class="sp"></span>${(!last&&wiz.i>0&&st.id!=='habitoN')?`<button type="button" class="btn ghost" data-act="wiz-skip">Saltar</button>`:''}<button type="button" class="btn primary" data-act="wiz-next">${wiz.i===0?'Empezar':last?'Terminar':'Siguiente'}${last?'':' '+ic('right')}</button></div></div>`;
  const sc=root.querySelector('.wiz');sc.scrollTop=0;
  setTimeout(()=>{const f=root.querySelector('#wiz-form textarea,#wiz-form input:not([type=checkbox]):not([type=time]):not([type=number])');if(f&&innerWidth>860)f.focus()},40);
}

function wizGo(d){wiz.i=Math.max(0,Math.min(wsteps().length-1,wiz.i+d));wizSave();wizRender()}
function wizFinish(toCal){bigParty();wiz.done=true;wiz.open=false;document.body.style.overflow='';$('#wiz-root').innerHTML='';wizSave();if(isNov()){go('inicio');render();toast('¡Listo! Marca tu primer hábito hoy')}else{if(toCal){go('calendario')}else render();toast('¡Listo! Tu sistema está en marcha')}}

let tipEl=null,tipBtn=null,tipTimer=null,tipAt=0;
function tipHide(now){
  clearTimeout(tipTimer);
  const el=tipEl,b=tipBtn;tipEl=null;tipBtn=null;
  if(b)b.setAttribute('aria-expanded','false');
  if(!el)return;
  if(now){el.remove();return}
  el.classList.add('out');setTimeout(()=>el.remove(),160);
}
function tipShow(btn){
  clearTimeout(tipTimer);
  if(tipBtn===btn&&tipEl&&!tipEl.classList.contains('out'))return;
  tipHide(true);
  const src=btn.closest('.help').querySelector('.help-tip');if(!src)return;
  const el=document.createElement('div');el.className='tip-pop';el.setAttribute('role','tooltip');el.innerHTML=src.innerHTML;
  const vw=document.documentElement.clientWidth,vh=innerHeight,w=Math.min(380,vw-24);
  el.style.width=w+'px';el.style.visibility='hidden';document.body.appendChild(el);
  const r=btn.getBoundingClientRect(),h=el.offsetHeight,cx=r.left+r.width/2;
  const left=Math.max(12,Math.min(cx-w/2,vw-w-12));
  let up=false,top=r.bottom+14;
  if(top+h>vh-12&&r.top-14-h>12){up=true;top=r.top-14-h}
  el.style.left=left+'px';el.style.top=top+'px';
  el.style.setProperty('--ax',Math.max(22,Math.min(cx-left,w-22))+'px');
  el.style.setProperty('--dy',(up?8:-8)+'px');
  el.style.transformOrigin=(cx-left)+'px '+(up?'100%':'0');
  el.classList.add(up?'up':'down');el.style.visibility='';
  tipEl=el;tipBtn=btn;tipAt=Date.now();btn.setAttribute('aria-expanded','true');
}
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('.help-btn');if(b&&matchMedia('(hover:hover)').matches)tipShow(b)});
document.addEventListener('mouseout',e=>{const b=e.target.closest&&e.target.closest('.help-btn');if(b&&b===tipBtn&&matchMedia('(hover:hover)').matches){clearTimeout(tipTimer);tipTimer=setTimeout(()=>tipHide(),120)}});
document.addEventListener('focusin',e=>{const b=e.target.closest&&e.target.closest('.help-btn');if(b)tipShow(b)});
document.addEventListener('focusout',e=>{if(matchMedia('(hover:hover)').matches&&e.target.closest&&e.target.closest('.help-btn'))tipHide()});
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.help-btn');
  if(b){e.preventDefault();if(tipBtn===b&&tipEl&&!tipEl.classList.contains('out')){if(Date.now()-tipAt>450)tipHide()}else tipShow(b);return}
  if(tipEl&&!e.target.closest('.tip-pop'))tipHide();
},true);
window.addEventListener('scroll',()=>tipHide(true),{passive:true,capture:true});
window.addEventListener('resize',()=>tipHide(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape')tipHide()});
document.addEventListener('submit',e=>{
  if(e.target.id!=='card-form')return;e.preventDefault();
  const f=e.target,t=f.elements.text.value.trim();if(!t){f.elements.text.focus();return}
  S.card.push({id:uid(),text:t,val:f.elements.val.value||'neu',habitId:''});commit();
  const n=$('#card-text');if(n)n.focus();
});

  const t=e.target,form=t.closest&&t.closest('.form');if(!form)return;

  if(t.name==='type'&&form.dataset.new==='1'&&!form.dataset.touched){const c=form.querySelector('input[name=showCal]');if(c)c.checked=t.value==='pos'}
  if(t.name==='anchorHabitId')form.dataset.anchor=t.value==='__custom'?'custom':'habit';
  if(t.name==='habitId'){form.dataset.step=t.value==='__new'?'new':'habit';const sp=$('#sp-new');if(sp){const h=habitById(t.value);sp.textContent=h?lcFirst(h.name):(lcFirst(fv(form.closest('form'),'text'))||'…')}}
});

/* --- Arrastrar para reordenar pasos (ratón y táctil) --- */
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.drag-handle');if(!h)return;
  const li=h.closest('.step'),list=li.parentElement;
  e.preventDefault();
  try{h.setPointerCapture(e.pointerId)}catch(_){}
  li.classList.add('dragging');
  const before=[...list.children].map(x=>x.dataset.step).join(',');
  const move=ev=>{
    const items=[...list.children];
    for(const s of items){
      if(s===li)continue;
      const r=s.getBoundingClientRect(),mid=r.top+r.height/2,lr=li.getBoundingClientRect();
      if(ev.clientY<mid&&lr.top>r.top){list.insertBefore(li,s);break}
      if(ev.clientY>mid&&lr.top<r.top){list.insertBefore(li,s.nextSibling);break}
    }
  };
  const up=()=>{
    h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
    li.classList.remove('dragging');
    const order=[...list.children].map(x=>x.dataset.step);
    if(order.join(',')===before)return;
    const st=S.stacks.find(x=>x.id===list.dataset.stack);if(!st)return;
    st.steps.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
    commit();toast('Orden actualizado');
  };
  h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});

function toast(msg){const t=$('#toast');t.querySelector('span').textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

  LS_KEY='habitos-atomicos-v1.'+user.id;WIZ_KEY='habitos-wizard-v1.'+user.id;

  fromHash();
  setStatus(raw!=null||lsSet(JSON.stringify(S))?'local':'none');

  initCloud(sb,user.id);
