<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hábitos Atómicos · (Versión Beta)</title>
<link rel="stylesheet" href="../suite/suite.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
(function(){
const H=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const X=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const p=H(a),q=H(b);return X(p.map((v,i)=>v+(q[i]-v)*t))};
const lum=c=>{const p=H(c).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*p[0]+.7152*p[1]+.0722*p[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const ensure=(c,bg,min,to)=>{let t=0,o=c;while(cr(o,bg)<min&&t<1){t+=.04;o=mix(c,to||'#000000',t)}return o};
window.THEMES=[
{id:'lavanda',n:'Bruma de lavanda',d:'Calma profunda',c:['#F6F3FC','#B9A9E3','#DAD1F4','#A9C8EA','#F4D9E7'],ink:'#4A4560'},
{id:'salvia',n:'Salvia y arena',d:'Natural y estable',c:['#F1F5EC','#A9CDB0','#D6E6CF','#F0E2C8','#D9C7AE'],ink:'#3F4A42'},
{id:'cielo',n:'Cielo y mar',d:'Fresca y despejada',c:['#EBF5F9','#9FD0E2','#CDE7EF','#BDE4D8','#F5EBDA'],ink:'#3A4F5A'},
{id:'rosa',n:'Rosa de atardecer',d:'Cálida y suave',c:['#FCF1EF','#F0BEBA','#F8DDD4','#F6DDB8','#D9C8E6'],ink:'#5A4443'},
{id:'menta',n:'Menta y durazno',d:'Amable y de buen ánimo',c:['#F1F9F5','#A5DAC5','#D4F0E4','#FBD3BC','#FCEBC4'],ink:'#3F5148'},
{id:'niebla',n:'Niebla de té',d:'Neutra y sobria',c:['#F5F2ED','#BFB3A3','#DCD5C8','#B7CBC5','#E8D8D3'],ink:'#4B4640'},
{id:'original',n:'Naranja festivo',d:'El diseño original',c:['#FFF7F1','#FF5A0F','#FFDFC9','#13C4BC','#D81B6A'],ink:'#3B2521',orig:true}
];
window.FXC=['#FF5A0F','#FFC31A','#13C4BC','#D81B6A','#1BB8F2','#7ED321','#F03A4F','#ffffff'];
window.themeId=function(){try{return localStorage.getItem('habitos-tema')||'lavanda'}catch(e){return 'lavanda'}};
window.applyTheme=function(id){
  const T=THEMES.find(t=>t.id===id)||THEMES[0],r=document.documentElement,s=r.style;
  r.dataset.theme=T.id;
  const names=['--g1','--g2','--g3','--onc','--oncs','--or','--or-2','--or-d','--or-50','--or-100','--soft','--soft2','--bg','--line','--ink','--muted','--pk','--pk-d','--pk-50','--rd','--tq','--tq-50','--tq-d','--yl','--cy','--neu','--neu-50','--shc','--shd','--cal1','--cal2','--t-or1','--t-or2','--t-rd1','--t-rd2','--t-yl1','--t-yl2','--t-tq1','--t-tq2','--t-pk1','--t-pk2','--t-cy1','--t-cy2','--f-or','--f-rd','--f-yl','--f-tq','--f-pk','--f-cy'];
  names.forEach(n=>s.removeProperty(n));
  if(T.orig){window.FXC=['#FF5A0F','#FFC31A','#13C4BC','#D81B6A','#1BB8F2','#7ED321','#F03A4F','#ffffff'];return T}
  const [bg,a,b,c,d]=T.c,W='#ffffff';
  const ink=mix(T.ink,'#000000',.22);
  const g1=mix(a,W,.35),g3=mix(a,c,.5);
  const onc=ensure(ink,mix(a,W,.1),5,'#000000');
  const set=(k,v)=>s.setProperty(k,v);
  const rgb=x=>H(x).join(',');
  set('--g1',g1);set('--g2',a);set('--g3',g3);set('--onc',onc);set('--oncs',onc);
  set('--or',a);set('--or-2',g1);
  const ord=ensure(mix(a,ink,.3),mix(a,W,.82),4.6,ink);set('--or-d',ord);
  set('--or-50',mix(a,W,.82));set('--or-100',mix(a,W,.62));set('--line',mix(a,W,.45));
  set('--soft',mix(bg,W,.45));set('--soft2',mix(b,W,.5));set('--bg',bg);
  set('--ink',ink);set('--muted',ensure(mix(ink,W,.38),W,4.6,ink));
  const pk=ensure(mix(d,ink,.45),W,4.6,ink);set('--pk',pk);set('--pk-d',ensure(mix(pk,ink,.3),mix(d,W,.55),6,ink));set('--pk-50',mix(d,W,.55));
  set('--rd','#C0485F');
  const tq=ensure(mix(c,ink,.35),W,3.4,ink);set('--tq',tq);set('--tq-50',mix(c,W,.7));set('--tq-d',ensure(mix(tq,ink,.3),mix(c,W,.7),4.6,ink));
  set('--yl','#F2C96B');set('--cy',c);
  set('--neu',mix(ink,W,.55));set('--neu-50',mix(a,W,.9));
  set('--shc',rgb(mix(a,ink,.3)));set('--shd',rgb(ink));
  set('--cal1',mix(bg,W,.6));set('--cal2',mix(b,W,.55));
  set('--t-or1',g1);set('--t-or2',a);set('--f-or',mix(d,W,.2));
  set('--t-rd1',mix(d,W,.1));set('--t-rd2',mix(d,a,.35));set('--f-rd',a);
  set('--t-yl1','#F8E3A6');set('--t-yl2','#F1CC73');set('--f-yl',a);
  set('--t-tq1',mix(c,W,.2));set('--t-tq2',c);set('--f-tq',a);
  set('--t-pk1',d);set('--t-pk2',mix(d,a,.5));set('--f-pk',c);
  set('--t-cy1',mix(c,W,.3));set('--t-cy2',mix(c,a,.4));set('--f-cy',d);
  window.FXC=[a,c,d,tq,'#F2C96B',g1,pk,'#ffffff'];
  return T;
};
applyTheme(themeId());
})();
</script>
<style>
:root{
  --or:#FF5A0F;--or-2:#FF9A00;--or-d:#E24500;--or-50:#FFF2E9;--or-100:#FFDFC9;
  --rd:#F03A4F;--pk:#D81B6A;--pk-50:#FFE7F0;--pk-d:#A8124F;
  --yl:#FFC31A;--tq:#13C4BC;--tq-50:#E0F9F7;--tq-d:#0A8C86;--cy:#1BB8F2;--gr:#7ED321;--li:#C9EC1C;
  --ink:#3B2521;--muted:#8C6F68;--bg:#fff;--soft:#FFF7F1;--soft2:#FFEFE4;--neu:#A39591;--neu-50:#F6F0EC;
  --g1:#FF9A00;--g2:#FF5A0F;--g3:#F23A00;--onc:#fff;--oncs:#FFF1C9;--line:var(--line);--shc:255,90,15;--shd:130,30,0;--cal1:#FFFBF8;--cal2:#FFF1E4;
  --t-or1:#FF9A00;--t-or2:#FF5A0F;--t-rd1:#FF5A66;--t-rd2:#E52B50;--t-yl1:#FFD21A;--t-yl2:#FFAA00;--t-tq1:#2BDACB;--t-tq2:#12B4C4;--t-pk1:#E8337C;--t-pk2:#C4195F;--t-cy1:#34C9F7;--t-cy2:#1496E0;
  --f-or:#FFD21A;--f-rd:#D81B6A;--f-yl:#FF7A1A;--f-tq:#1BA0E8;--f-pk:#FF8A00;--f-cy:#D81B6A;
  --r:22px;--sh:0 8px 24px rgba(var(--shc),.10),0 1px 3px rgba(59,37,33,.05);
  --fh:'Fredoka','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);font-weight:600;letter-spacing:-.005em;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:18px;height:18px;flex:none}
.mascot{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.side{background:radial-gradient(ellipse at 25% 38%,var(--g1) 0%,var(--g2) 52%,var(--g3) 100%);color:var(--onc);padding:26px 66px 26px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;overflow:hidden}
.wave{position:absolute;top:0;right:-1px;height:100%;width:56px;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;position:relative}
.brand b{font-family:var(--fh);font-size:20px;font-weight:600;display:block;line-height:1.05}
.brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-top:4px;opacity:.9}
.nav{display:flex;flex-direction:column;gap:6px;position:relative}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;color:var(--onc);text-decoration:none;font-weight:800;font-size:14.5px;transition:background .15s,transform .15s}
.nav a:hover{background:rgba(255,255,255,.22)}
.nav a.on{background:#fff;color:var(--or-d);box-shadow:0 8px 18px rgba(var(--shd),.25)}
.nav a .n{margin-left:auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.28);padding:1px 8px;border-radius:99px}
.nav a.on .n{background:var(--or-50);color:var(--or-d)}
.side-quote{margin-top:auto;font-family:var(--fh);font-size:14.5px;line-height:1.4;color:var(--onc);padding:16px;border-radius:18px;background:rgba(255,255,255,.2);position:relative}
.side-quote span{display:block;font-family:'Nunito',sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--oncs);font-weight:800;margin-bottom:6px}
.status{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700}
.side .status{padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.22);color:var(--onc);position:relative}
.dot{width:9px;height:9px;border-radius:50%;background:#FFE3B0;flex:none}
.status.cloud .dot{background:#B6F23A}.status.saving .dot{background:var(--yl)}.status.none .dot,.status.error .dot{background:#fff;box-shadow:0 0 0 3px rgba(216,27,106,.8)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:22px 36px 0}
.t-date{color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.t-date::first-letter{text-transform:uppercase}
.topbar .sp{flex:1}
.mob-brand{display:none;align-items:center;gap:8px}
.mob-brand b{font-family:var(--fh);font-size:18px;font-weight:600;color:var(--onc)}
.topbar .status{color:var(--muted);display:none}
#view{padding:18px 36px 60px;max-width:1280px;width:100%}
.tabbar{display:none}

/* ---------- Fichas con esquina doblada ---------- */
.tile{--fs:26px;position:relative;color:var(--onc);border-radius:18px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--fs)),calc(100% - var(--fs)) 100%,0 100%)}
.tile::after{content:"";position:absolute;right:0;bottom:0;width:var(--fs);height:var(--fs);background:linear-gradient(135deg,var(--fold,#fff) 50%,transparent 50%);pointer-events:none}
.t-or{background:linear-gradient(135deg,var(--g1),var(--g2));--fold:#FFD21A}
.t-rd{background:linear-gradient(135deg,var(--t-rd1),var(--t-rd2));--fold:var(--f-rd)}
.t-yl{background:linear-gradient(135deg,var(--t-yl1),var(--t-yl2));--fold:var(--f-yl);color:var(--ink)}
.t-tq{background:linear-gradient(135deg,var(--t-tq1),var(--t-tq2));--fold:var(--f-tq)}
.t-pk{background:linear-gradient(135deg,var(--t-pk1),var(--t-pk2));--fold:var(--f-pk)}
.t-cy{background:linear-gradient(135deg,var(--t-cy1),var(--t-cy2));--fold:var(--f-cy)}

/* ---------- Comunes ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ph{display:flex;align-items:center;gap:18px;min-width:0;flex:1 1 520px}
.ph-tile{--fs:16px;width:84px;height:84px;display:grid;place-items:center;flex:none;border-radius:22px}
.page-head h1{font-size:34px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--or-d);font-weight:800;margin-bottom:6px}
.lead{color:var(--muted);margin:8px 0 0;max-width:660px;font-weight:600}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.card h2{font-size:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-sub{color:var(--muted);font-size:13.5px;margin-top:3px;font-weight:600}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:8px 0 14px;flex-wrap:wrap}
.sec-head h2{font-size:23px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:11px 18px;font-weight:800;font-size:14px;border:2px solid transparent;cursor:pointer;transition:filter .15s,transform .08s,background .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--onc);box-shadow:0 8px 16px rgba(var(--shc),.28)}.btn.primary:hover{filter:brightness(1.05)}
.btn.red{background:var(--pk);color:#fff}.btn.red:hover{filter:brightness(1.06)}
.btn.danger{background:var(--rd);color:#fff}
.btn.ghost{background:#fff;border-color:var(--or-100);color:var(--ink)}.btn.ghost:hover{background:var(--soft);border-color:var(--line)}
.btn.soft{background:var(--or-50);color:var(--or-d)}.btn.soft:hover{background:var(--or-100)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--or-50);color:var(--or-d)}
.icon-btn.del:hover{background:var(--pk-50);color:var(--pk)}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--or-50);color:var(--or-d);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.red{background:var(--pk-50);color:var(--pk-d)}
.tag.gray{background:var(--neu-50);color:#6B5A55}
.muted{color:var(--muted)}
.empty{border-radius:20px;padding:26px 22px;text-align:center;color:var(--muted);background:var(--soft);font-weight:600}
.empty .mascot{margin:0 auto 6px}
.empty b{display:block;color:var(--ink);font-family:var(--fh);font-size:18px;margin-bottom:4px;font-weight:600}
.empty .btn{margin-top:14px}
:focus-visible{outline:3px solid rgba(var(--shc),.4);outline-offset:2px}

/* ---------- Inicio ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;color:var(--onc);padding:34px;margin-bottom:20px;min-height:220px;background:radial-gradient(ellipse at 15% 30%,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%)}
.hero-copy{position:relative;z-index:2;max-width:56%}
.hero-splash{position:absolute;right:0;top:0;height:100%;width:46%;z-index:1}
.hero-mascot{position:absolute;right:9%;top:50%;transform:translateY(-50%);z-index:2}
.hero .eyebrow{color:var(--oncs)}
.hero h1{font-size:31px}
.hero p{margin:10px 0 0;color:var(--onc);font-weight:600}
.id-line{display:inline-block;margin-top:14px;background:rgba(255,255,255,.24);padding:8px 14px;border-radius:14px;font-weight:800}
.stat{display:flex;align-items:center;gap:14px;padding:20px 20px 22px}
.stat .k{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.stat .v{font-family:var(--fh);font-size:32px;font-weight:600;line-height:1.1}
.stat .v small{font-size:16px;font-family:'Nunito',sans-serif;font-weight:800;opacity:.85}
.stat .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.28);color:inherit}
.stat .card-sub{color:inherit;opacity:.9}
.ring{flex:none}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.nav-tile{display:flex;flex-direction:column;justify-content:flex-end;min-height:176px;padding:18px;text-decoration:none;transition:transform .15s}
.nav-tile:hover{transform:translateY(-3px)}
.nav-tile .mascot{position:absolute;right:10px;top:10px}
.nav-tile b{font-family:var(--fh);font-size:19px;font-weight:600;line-height:1.15;max-width:92%}
.nav-tile small{font-size:12.5px;font-weight:700;opacity:.92;margin-top:4px;max-width:88%}
.chip{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.32);padding:3px 11px;border-radius:99px;font-size:12px;font-weight:800}
.today-list{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--soft)}
.trow .tm{font-weight:800;font-size:13px;color:var(--or-d);width:46px;flex:none;font-variant-numeric:tabular-nums}
.trow .tt{flex:1;min-width:0}
.trow .tt b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tt small{color:var(--muted);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.trow.done{background:var(--tq-50)}
.trow.done .tt b{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;border-radius:10px;border:2.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:transparent;flex:none;transition:all .15s}
.chk:hover{border-color:var(--or)}
.chk.on{background:var(--tq);border-color:var(--tq);color:#fff}
.chk.neg.on{background:var(--pk);border-color:var(--pk)}
.chk .i{width:16px;height:16px}
.bullet{width:30px;height:30px;display:grid;place-items:center;flex:none}
.bullet i{width:12px;height:12px;border-radius:4px;background:var(--yl);display:block}
.bullet.ancla i{background:#fff;border:2.5px dashed var(--or)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-radius:18px;background:#FFF0C7;color:#6B3A12;margin-bottom:20px;font-weight:600}
.alert .i{color:var(--or-d);margin-top:2px}
.alert b{color:var(--or-d)}
.votes{display:flex;flex-direction:column;gap:16px}
.vote-row .vt{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px}
.vote-row .vt span:last-child{color:var(--or-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:12px;border-radius:99px;background:var(--or-50);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yl),var(--or))}

/* ---------- Identidad ---------- */
.id-duo{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1fr);align-items:stretch;margin-bottom:20px}
.id-arrow{display:grid;place-items:center;color:var(--or)}
.id-arrow svg{width:32px;height:32px}
.id-card{display:flex;flex-direction:column}
.id-card.future{background:linear-gradient(160deg,#fff 0%,var(--or-50) 100%)}
.id-card .lbl{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.id-card .lbl .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--yl);color:var(--ink)}
.id-card.future .lbl .ico{background:var(--or);color:var(--onc)}
.id-card textarea{flex:1;min-height:150px;width:100%;resize:vertical;border:2px solid var(--or-100);border-radius:16px;padding:12px 14px;background:#fff;line-height:1.55;font-weight:600}
.id-card textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 4px rgba(var(--shc),.12)}
.prompts{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.prompts li::before{content:"\2192  ";color:var(--or);font-weight:800}
.stmt{display:flex;align-items:center;gap:14px;padding:12px;margin-top:8px;border-radius:18px;background:var(--soft)}
.stmt .vc{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#FFD21A,#FFAA00);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.stmt .vc b{font-family:var(--fh);font-size:23px;line-height:1}
.stmt .vc small{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.stmt .st{flex:1;min-width:0}
.stmt .st b{display:block;font-family:var(--fh);font-size:17px;font-weight:600}
.stmt .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.how{display:flex;flex-direction:column;gap:16px}
.how .h{display:flex;gap:12px}
.how .h span{width:32px;height:32px;border-radius:12px;background:var(--pk);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:14px;font-family:var(--fh)}
.how .h b{display:block}
.how .h p{margin:2px 0 0;color:var(--muted);font-size:13.5px;font-weight:600}

/* ---------- Habitos ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:2px solid var(--or-100);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:800;cursor:pointer;color:var(--muted)}
.fchip.on{border-color:var(--or);background:var(--or);color:var(--onc)}
.fchip .c{opacity:.7;margin-left:4px}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-top:8px;border-radius:18px;background:var(--soft)}
.hrow:first-child{margin-top:0}
.badge{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:21px;flex:none;font-family:var(--fh)}
.badge.pos{background:var(--tq);color:#fff}
.badge.neg{background:var(--pk);color:#fff}
.badge.neu{background:var(--neu-50);color:#7B6A65}
.badge.fijo{background:var(--yl);color:var(--ink)}
.badge.fijo .i{width:18px;height:18px}
.hmain{flex:1;min-width:0}
.hname{font-weight:800;font-size:15px}
.hmeta{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px;font-weight:600}
.hmeta .i{width:13px;height:13px;vertical-align:-2px}
.hmeta > span{display:inline-flex;align-items:center;gap:4px}
.hmini{font-size:12.5px;color:var(--or-d);margin-top:5px;font-weight:600}
.hmini b{font-weight:800}
.hside{display:flex;align-items:center;gap:8px;flex:none}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--pk)}
.streak .i{width:15px;height:15px}
.acts{display:flex;gap:2px;flex:none}
.legend3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.legend3 div{border-radius:16px;padding:12px;font-size:13px;font-weight:700}
.legend3 b{display:block;font-size:22px;line-height:1.1;font-family:var(--fh)}
.legend3 .p{background:var(--tq-50);color:var(--tq-d)}
.legend3 .n{background:var(--pk-50);color:var(--pk-d)}
.legend3 .z{background:var(--neu-50);color:#6B5A55}

/* ---------- Acumulacion ---------- */
.stack{margin-bottom:20px}
.stack-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.chain{position:relative;padding-left:4px}
.anchor-node,.step{display:flex;align-items:center;gap:12px;position:relative}
.anchor-node{padding:12px 16px;border-radius:18px;background:var(--soft2);margin-left:30px}
.anchor-node .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--or-d)}
.anchor-node .nm{font-weight:800}
.anchor-node .grow,.step-body{flex:1;min-width:0}
.time-chip{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;background:#fff;padding:4px 10px;border-radius:10px;white-space:nowrap;color:var(--ink)}
.time-chip.auto{color:var(--or-d);background:var(--or-50)}
.time-chip.none{color:var(--muted);background:var(--neu-50)}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:51px;top:-10px;bottom:22px;width:4px;border-radius:4px;background:repeating-linear-gradient(to bottom,var(--or-2) 0 6px,transparent 6px 12px)}
.step{padding:10px 8px 10px 0;margin-top:6px;border-radius:18px;background:transparent;transition:background .15s,box-shadow .15s}
.step:hover{background:var(--soft)}
.step.dragging{background:#fff;box-shadow:0 14px 34px rgba(var(--shc),.28);z-index:5;position:relative}
.drag-handle{width:26px;height:36px;display:grid;place-items:center;color:#E0B9A3;cursor:grab;touch-action:none;flex:none;border-radius:10px}
.drag-handle:hover{background:var(--or-50);color:var(--or-d)}
.step.dragging .drag-handle{cursor:grabbing}
.node{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--or);flex:none;position:relative;z-index:1;margin:0 6px 0 1px}
.formula{font-size:15px;line-height:1.95;font-weight:600}
.pill{display:inline;padding:3px 11px;border-radius:10px;font-weight:800;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pill.cur{background:var(--neu-50);color:#5B4A45}
.pill.new{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--onc)}
.formula .w{color:var(--muted);font-weight:700}
.add-step{margin:12px 0 0 46px;border:2px dashed var(--line);background:transparent;color:var(--or-d);border-radius:14px;padding:10px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.add-step:hover{background:var(--or-50)}
.warn{font-size:12.5px;color:var(--pk-d);background:var(--pk-50);border-radius:14px;padding:8px 12px;margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.preview{padding:24px}
.preview h2{font-size:20px;margin-bottom:12px}
.preview ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--onc);font-weight:600}
.preview ol b{color:var(--onc)}
.preview ol em{font-style:normal;color:var(--oncs);font-weight:800}

/* ---------- Calendario ---------- */
.cal-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cal-bar h2{font-size:23px;flex:1;min-width:180px}
.seg{display:inline-flex;background:#fff;border:2px solid var(--or-100);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center}
.seg button.on{background:var(--or);color:var(--onc)}
.seg button:hover:not(.on){background:var(--or-50);color:var(--or-d)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px;font-size:12.5px;color:var(--muted);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block;border-left:4px solid}
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.daystrip button{border:2px solid var(--or-100);background:#fff;border-radius:16px;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.daystrip button small{font-size:10.5px;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.daystrip button b{font-family:var(--fh);font-size:19px;font-weight:600}
.daystrip button.on{background:var(--or);border-color:var(--or);color:var(--onc)}
.daystrip button.on small{color:var(--onc)}
.daystrip button.today::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--pk)}
.cal-wrap{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.cal-x{overflow-x:auto}
.cal.week{min-width:780px}
.cal-row{display:grid;grid-template-columns:58px repeat(var(--n),minmax(0,1fr))}
.dh{padding:10px 6px;text-align:center;cursor:pointer;background:#fff}
.dh:hover{background:var(--soft)}
.dh .dn{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;display:block}
.dh .dd{font-family:var(--fh);font-size:22px;font-weight:600;line-height:38px;width:38px;height:38px;display:inline-block;border-radius:50%}
.dh.today .dd{background:var(--or);color:var(--onc)}
.dh .dp{display:block;font-size:10.5px;color:var(--muted);font-weight:800}
.cal-allday{background:var(--soft)}
.gut{font-size:10.5px;color:var(--muted);padding:8px 8px 8px 4px;text-align:right;font-weight:800;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.ad{padding:5px;display:flex;flex-direction:column;gap:4px;min-height:34px}
.cal-scroll{max-height:66vh;overflow-y:auto;position:relative}
.cal-body{display:grid;grid-template-columns:58px repeat(var(--n),minmax(0,1fr));position:relative}
.hours{position:relative}
.hours span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.hours span:first-child{transform:none}
.col{position:relative;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent var(--pph),rgba(255,138,0,.07) var(--pph),rgba(255,138,0,.07) calc(var(--pph)*2))}
.col:nth-child(even){background-color:var(--cal1)}
.col.today{background-color:var(--cal2)}
.ev{position:absolute;border-radius:10px;padding:3px 7px;font-size:12px;line-height:1.25;text-align:left;overflow:hidden;border:0;border-left:4px solid;cursor:pointer;display:flex;flex-direction:column;z-index:2;transition:filter .15s,box-shadow .15s}
.ev:hover{box-shadow:0 6px 16px rgba(var(--shc),.3);z-index:4}
.ev.short{flex-direction:row;gap:6px;align-items:center;white-space:nowrap}
.ev.static{position:static;width:auto;flex-direction:row;gap:6px;white-space:nowrap}
.ev-t{font-weight:800;font-size:10.5px;opacity:.9;font-variant-numeric:tabular-nums}
.ev-n{font-weight:800;overflow:hidden;text-overflow:ellipsis}
.ev .i{width:12px;height:12px;flex:none}
.c-pos{background:var(--tq-50);border-color:var(--tq);color:var(--tq-d)}
.c-pila{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:var(--or-d);color:var(--onc)}
.c-neg{background:repeating-linear-gradient(135deg,var(--pk-50) 0 6px,#fff 6px 12px);border-color:var(--pk);color:var(--pk-d)}
.c-neu{background:var(--neu-50);border-color:var(--neu);color:#5B4A45}
.c-fijo{background:var(--yl);border-color:#E09A00;color:var(--ink)}
.c-ancla{background:#fff;border:2px dashed var(--or);border-left:4px solid var(--or);color:var(--or-d)}
.legend i.c-ancla{border-left-width:4px}
.ev.done{opacity:.5}
.ev.done .ev-n{text-decoration:line-through}
.now{position:absolute;left:0;right:0;height:3px;border-radius:3px;background:var(--pk);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--pk)}

/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(80,25,5,.45);backdrop-filter:blur(2px)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:#fff;border-radius:26px;box-shadow:0 28px 70px rgba(80,25,5,.35);display:flex;flex-direction:column;overflow:hidden}
.modal form{display:flex;flex-direction:column;min-height:0;max-height:inherit}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 10px;gap:12px}
.m-head h3{font-size:22px}
.m-body{padding:6px 22px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;gap:8px;padding:14px 22px;background:var(--soft);align-items:center;flex-wrap:wrap}
.m-foot .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld > span{font-size:13px;font-weight:800;color:#5B4A45}
.fld > span em{font-style:normal;font-weight:700;color:var(--muted)}
.fld input:not([type=checkbox]):not([type=radio]),.fld select,.fld textarea{width:100%;border:2px solid var(--or-100);border-radius:14px;padding:10px 12px;background:#fff;min-height:44px;font-weight:600}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 4px rgba(var(--shc),.12)}
.fld .err{color:var(--pk);font-size:12.5px;font-weight:800;min-height:0}
.fld .err:empty{display:none}
.hint{color:var(--muted);font-size:12px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--or)}
.seg-radio{display:grid;grid-template-columns:1fr 1fr;background:var(--soft2);border-radius:16px;padding:4px;gap:4px}
.seg-radio label{cursor:pointer}
.seg-radio input,.type-radio input,.chip-day input{position:absolute;opacity:0;pointer-events:none}
.seg-radio span{display:block;text-align:center;padding:8px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.seg-radio input:checked+span{background:#fff;color:var(--or-d);box-shadow:0 2px 6px rgba(var(--shc),.2)}
.type-radio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.type-radio label{cursor:pointer}
.type-radio .opt{display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid var(--or-100);border-radius:16px;padding:9px 6px;text-align:center;font-size:12px;color:var(--muted);height:100%;font-weight:600}
.type-radio .opt b{font-size:22px;line-height:1.1;font-family:var(--fh)}
.type-radio .opt strong{font-size:13px;color:var(--ink)}
.type-radio input:checked+.opt.pos{border-color:var(--tq);background:var(--tq-50);color:var(--tq-d)}
.type-radio input:checked+.opt.neg{border-color:var(--pk);background:var(--pk-50);color:var(--pk-d)}
.type-radio input:checked+.opt.neu{border-color:var(--neu);background:var(--neu-50)}
.type-radio input:focus-visible+.opt,.seg-radio input:focus-visible+span,.chip-day input:focus-visible+span{outline:3px solid rgba(var(--shc),.4)}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.chip-day span{display:inline-flex;min-width:46px;justify-content:center;padding:7px 10px;border-radius:999px;border:2px solid var(--or-100);font-weight:800;font-size:13px;cursor:pointer;background:#fff}
.chip-day input:checked+span{background:var(--or);border-color:var(--or);color:var(--onc)}
.presets{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.presets button{border:0;background:none;color:var(--or-d);font-weight:800;font-size:12.5px;cursor:pointer;padding:2px 4px}
.presets button:hover{text-decoration:underline}
.form[data-kind=fijo] .only-habit{display:none}
.form:not([data-anchor=custom]) .anchor-text{display:none}
.form:not([data-step=new]) .step-new{display:none}
.sentence-prev{background:var(--or-50);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--or-d);font-weight:600}
.detail{display:flex;flex-direction:column;gap:10px}
.detail .dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.detail .dl dt{color:var(--muted);font-weight:800}
.detail .dl dd{margin:0;font-weight:700}
.settings-sec{padding:12px 0 14px}
.settings-sec:first-child{padding-top:0}
.settings-sec h4{margin:0 0 4px;font-size:16px;font-family:var(--fh);font-weight:600}
.settings-sec p{margin:0 0 10px;color:var(--muted);font-size:13.5px;font-weight:600}
.settings-sec textarea{width:100%;min-height:90px;border:2px solid var(--or-100);border-radius:14px;padding:10px;font-size:12px;font-family:ui-monospace,monospace}
.btns{display:flex;gap:8px;flex-wrap:wrap}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;box-shadow:0 12px 30px rgba(80,25,5,.35);display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast i{width:10px;height:10px;border-radius:50%;background:var(--or-2);flex:none}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .g4,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{padding:12px 16px;position:sticky;top:0;background:linear-gradient(135deg,var(--g1),var(--g2));z-index:20;color:var(--onc);border-radius:0 0 22px 22px;box-shadow:0 8px 20px rgba(var(--shc),.25)}
  .mob-brand{display:flex}
  .topbar .t-date{display:none}
  .topbar .status{display:flex;color:var(--onc)}
  .topbar .status .lbl{display:none}
  .topbar .icon-btn{color:var(--onc)}
  .topbar .icon-btn:hover{background:rgba(255,255,255,.2);color:var(--onc)}
  #view{padding:18px 16px 104px}
  .page-head h1{font-size:27px}
  .ph{gap:12px}
  .ph-tile{width:64px;height:64px}
  .ph-tile .mascot{width:50px;height:50px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:30;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(var(--shc),.14)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:3px;color:var(--muted);text-decoration:none;font-weight:800;padding:6px 0;position:relative;border-radius:16px;margin:0 2px}
  .tabbar a.on{color:var(--or-d);background:var(--or-50)}
  .tabbar .i{width:22px;height:22px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .hero{padding:24px 22px;min-height:0}
  .hero-copy{max-width:100%}
  .hero h1{font-size:25px;max-width:calc(100% - 70px)}
  .hero-splash{display:none}
  .hero-mascot{right:12px;top:16px;transform:none}
  .hero .eyebrow{max-width:calc(100% - 84px)}
  .hero-mascot .mascot{width:70px;height:70px}
  .id-duo{grid-template-columns:minmax(0,1fr);gap:0}
  .id-arrow{height:44px;transform:rotate(90deg)}
  .card{padding:18px}
  .stat{padding:16px 14px 20px;gap:10px}
  .stat .v{font-size:25px}
  .stat .ico{width:38px;height:38px}
  .tiles{gap:10px}
  .nav-tile{min-height:150px;padding:14px}
  .nav-tile b{font-size:16px}
  .modal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;border-radius:26px 26px 0 0;max-height:92vh}
  .m-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .hrow{flex-wrap:wrap;gap:10px}
  .hrow .hmain{flex-basis:calc(100% - 100px)}
  .hrow .hside{order:3;margin-left:54px}
  .step{flex-wrap:wrap}
  .step .acts{width:100%;justify-content:flex-end;padding-left:56px}
  .steps::before{left:39px}
  .anchor-node{margin-left:20px}
  .add-step{margin-left:30px}
  .legend3{grid-template-columns:minmax(0,1fr)}
  .detail .dl{grid-template-columns:90px 1fr}
  #toast{bottom:96px}
}
@media (max-width:420px){
  .row2{grid-template-columns:minmax(0,1fr)}
}
/* ---------- Método: avisos, bucle, sugerencias ---------- */
.why{font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 0;line-height:1.5}
.why.on-dark{color:var(--onc)}
.src{color:var(--or-d);font-weight:800;text-decoration:underline;text-underline-offset:2px}
.on-dark .src{color:var(--onc)}
.loop{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.lp{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--neu-50);color:#8B7A75}
.lp.on{background:var(--tq-50);color:var(--tq-d)}

/* ---------- Animaciones de fiesta e interacción ---------- */
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}

<script>
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseDk=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const dayIdx=d=>(d.getDay()+6)%7;
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const weekStart=d=>addDays(d,-dayIdx(d));
const toMin=t=>{if(!t||!/^\d{1,2}:\d{2}$/.test(t))return null;const [h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>{m=Math.max(0,Math.min(1439,Math.round(m)));return pad(Math.floor(m/60))+':'+pad(m%60)};
const lcFirst=s=>{s=String(s||'');return s?s.charAt(0).toLowerCase()+s.slice(1):s};
const DAYS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYS_L=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TYPE={pos:{label:'Positivo',sym:'+',desc:'Te acerca a quien quieres ser'},neg:{label:'Negativo',sym:'−',desc:'Te aleja de quien quieres ser'},neu:{label:'Neutral',sym:'=',desc:'No suma ni resta'}};
const longDate=d=>DAYS_L[dayIdx(d)]+', '+d.getDate()+' de '+MONTHS[d.getMonth()]+' de '+d.getFullYear();

const ICONS={
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/>',
  chain:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  up:'<path d="M6 15l6-6 6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',left:'<path d="M15 6l-6 6 6 6"/>',right:'<path d="M9 6l6 6-6 6"/>',
  grip:'<circle cx="9" cy="6" r="1.3"/><circle cx="15" cy="6" r="1.3"/><circle cx="9" cy="12" r="1.3"/><circle cx="15" cy="12" r="1.3"/><circle cx="9" cy="18" r="1.3"/><circle cx="15" cy="18" r="1.3"/>',
  check:'<path d="M5 12l5 5L20 7"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flame:'<path d="M12 3c1 4 5 5.5 5 10.5a5 5 0 0 1-10 0c0-3 2-4 2-6.5 1.5 1 2 2.2 2 3.5 1-2 1.3-4.5 1-7.5z"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  pin:'<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  vote:'<path d="M4 12l5 5L20 6"/><path d="M4 20h16"/>',
  alert:'<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/>',
  arrow:'<path d="M4 12h15M13 6l6 6-6 6"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1.9-1.1 1.8M12 17h.01"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'
};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ================= Estado ================= */
let LS_KEY='habitos-atomicos-v1.invitado'; // pasa a habitos-atomicos-v1.<id de usuario> al iniciar sesión
const emptyState=()=>({v:2,path:'',unlocked:0,first:'',identity:{now:'',future:'',statements:[]},habits:[],stacks:[],done:{},skips:{},slips:{},meta:{},card:[],contracts:[],reviews:[],dismiss:{}});
const arr=x=>Array.isArray(x)?x:[];
const sv=x=>String(x==null?'':x);
const newHabit=o=>({id:uid(),name:'',type:'pos',kind:'habito',time:'',duration:0,days:[],identityIds:[],twoMin:'',showCal:false,notes:'',place:'',cue:'',want:'',benefit:'',group:'',prep:'',commit:'',reward:'',hide:'',reframe:'',friction:'',lvl2:'',lvl3:'',level:1,levelSince:'',suggAt:'',rewardAt:'',start:dk(new Date()),goal:'',exp:null,archived:false,...o});
function normalize(o){
  if(!o||typeof o!=='object')return emptyState();
  const id=o.identity||{};
  const dm=(m,f)=>(m&&typeof m==='object')?Object.fromEntries(Object.entries(m).filter(([k])=>/^\d{4}-\d{2}-\d{2}$/.test(k)).map(([k,v])=>[k,f(v)])):{};
  const R={v:2,
    identity:{now:sv(id.now),future:sv(id.future),statements:arr(id.statements).filter(s=>s&&s.id).map(s=>({id:sv(s.id),text:sv(s.text),quality:sv(s.quality),created:sv(s.created)}))},
    habits:arr(o.habits).filter(h=>h&&h.id).map(h=>({id:sv(h.id),name:sv(h.name),type:TYPE[h.type]?h.type:'neu',kind:h.kind==='fijo'?'fijo':'habito',time:sv(h.time),duration:+h.duration||0,days:arr(h.days).map(Number).filter(n=>n>=0&&n<7),identityIds:(arr(h.identityIds).length?arr(h.identityIds):(h.identityId?[h.identityId]:[])).map(sv),twoMin:sv(h.twoMin),showCal:!!h.showCal,notes:sv(h.notes),place:sv(h.place),cue:sv(h.cue),want:sv(h.want),benefit:sv(h.benefit),group:sv(h.group),prep:sv(h.prep),commit:sv(h.commit),reward:sv(h.reward),hide:sv(h.hide),reframe:sv(h.reframe),friction:sv(h.friction),lvl2:sv(h.lvl2),lvl3:sv(h.lvl3),level:[1,2,3].includes(+h.level)?+h.level:1,levelSince:sv(h.levelSince),suggAt:sv(h.suggAt),rewardAt:sv(h.rewardAt),start:sv(h.start),goal:sv(h.goal),exp:(h.exp&&h.exp.end)?{start:sv(h.exp.start),end:sv(h.exp.end)}:null,archived:!!h.archived})),
    stacks:arr(o.stacks).filter(s=>s&&s.id).map(s=>({id:sv(s.id),name:sv(s.name||'Cadena'),anchorHabitId:sv(s.anchorHabitId),anchorText:sv(s.anchorText),time:sv(s.time),days:arr(s.days).map(Number).filter(n=>n>=0&&n<7),steps:arr(s.steps).filter(p=>p&&p.id).map(p=>({id:sv(p.id),habitId:sv(p.habitId),text:sv(p.text),time:sv(p.time),duration:+p.duration||0}))})),
    done:dm(o.done,v=>arr(v).map(sv)),
    skips:dm(o.skips,v=>arr(v).map(sv)),
    slips:dm(o.slips,v=>arr(v).map(sv)),
    meta:dm(o.meta,v=>(v&&typeof v==='object')?Object.fromEntries(Object.entries(v).map(([key,m])=>[key,{t:sv(m&&m.t),lvl:+(m&&m.lvl)||1,late:!!(m&&m.late),ng:!!(m&&m.ng)}])):{}),
    card:arr(o.card).filter(c=>c&&c.id).map(c=>({id:sv(c.id),text:sv(c.text),val:['pos','neg','neu'].includes(c.val)?c.val:'neu',habitId:sv(c.habitId)})),
    contracts:arr(o.contracts).filter(c=>c&&c.id).map(c=>({id:sv(c.id),habitId:sv(c.habitId),commit:sv(c.commit),penalty:sv(c.penalty),partner:sv(c.partner),signed:!!c.signed,until:sv(c.until)})),
    reviews:arr(o.reviews).filter(r=>r&&r.id).map(r=>({id:sv(r.id),type:r.type==='year'?'year':'week',date:sv(r.date),a:sv(r.a),b:sv(r.b),c:sv(r.c)})),
    dismiss:(o.dismiss&&typeof o.dismiss==='object')?Object.fromEntries(Object.entries(o.dismiss).map(([k,v])=>[String(k),String(v)])):{}
  };
  R.path=o.path==='novato'?'novato':(o.path==='full'?'full':(hasContent(R)?'full':''));
  R.unlocked=Math.max(0,Math.min(4,Math.floor(+o.unlocked)||0));
  R.first=sv(o.first);
  return R;
}
const hasContent=s=>!!(s.identity.now||s.identity.future||s.identity.statements.length||s.habits.length||s.stacks.length||s.card.length);


let S=emptyState();
const ui={view:'inicio',filter:'all',habTab:'registro',contractsOpen:false,calMode:innerWidth<760?'day':'week',calDate:new Date()};
let dayCache=new Map(),statCache=new Map();function resetCache(){dayCache=new Map();statCache=new Map()}

/* ================= Persistencia ================= */
const store={ref:null,writing:false,dirty:false,timer:null,retry:false,editedBeforeCloud:false,cloudChecked:false};
function lsGet(){try{return localStorage.getItem(LS_KEY)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,v);return true}catch(e){return false}}
function setStatus(mode){
  const txt={cloud:'Guardado en tu cuenta',saving:'Guardando…',local:'Guardado en este navegador',none:'Sin guardado: exporta un respaldo',error:'No se pudo guardar'}[mode]||'';
  $$('.status-el').forEach(el=>{el.className='status status-el '+mode;el.querySelector('.lbl').textContent=txt;el.title=txt});
}
function persist(){
  resetCache();
  if(!store.cloudChecked)store.editedBeforeCloud=true;
  const ok=lsSet(JSON.stringify(S));
  if(store.ref){store.dirty=true;clearTimeout(store.timer);setStatus('saving');store.timer=setTimeout(flush,700)}
  else setStatus(ok?'local':'none');
}
async function flush(){
  if(!store.ref||store.writing||!store.dirty||store.retry)return;
  store.writing=true;store.dirty=false;
  try{
    await store.ref.set({json:JSON.stringify(S),updatedAt:Date.now()});
    setStatus(store.dirty?'saving':'cloud');
  }catch(e){
    const code=e&&e.code;
    if(code==='unavailable'||code==='resource_exhausted'){
      store.dirty=true;store.retry=true;
      setTimeout(()=>{store.retry=false;flush()},1500+Math.random()*1500);
    }else if(code==='quota_exceeded'){setStatus('error');toast('Tu espacio de guardado está lleno. Exporta un respaldo.')}
    else{store.ref=null;setStatus(lsGet()?'local':'none')}
  }
  store.writing=false;
  if(store.dirty&&store.ref&&!store.retry)flush();
}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))])}
async function initCloud(sb,uid){
  try{
    if(!sb||!uid)return;
    const r=await withTimeout(sb.from('habitos_docs').select('json').eq('user_id',uid).maybeSingle(),10000);
    if(r.error)throw r.error;
    if(!Suite.user||Suite.user.id!==uid)return; // se cerró la sesión mientras se leía
    store.ref={set:async o=>{
      const w=await sb.from('habitos_docs').upsert({user_id:uid,json:o.json,updated_at:new Date().toISOString()});
      if(w.error){const m=String(w.error.message||'');throw {code:/fetch|network/i.test(m)?'unavailable':(w.error.code||'error')}}
    }};
    const d=r.data;
    if(d&&typeof d.json==='string'&&!store.editedBeforeCloud){
      try{S=normalize(JSON.parse(d.json));lsSet(d.json);resetCache();render();if((wiz.open&&wiz.i===0||$('#wiz-root .path-wrap'))&&hasContent(S)){wiz.open=false;document.body.style.overflow='';$('#wiz-root').innerHTML=''}}catch(e){}
      setStatus('cloud');
    }else if(hasContent(S)){store.dirty=true;flush()}
    else setStatus('cloud');
  }catch(e){/* se queda en modo local */}
  finally{if(Suite.user&&Suite.user.id===uid)store.cloudChecked=true}
}

/* ================= Lógica de hábitos ================= */
const habitById=id=>id?S.habits.find(h=>h.id===id):null;
const stmtById=id=>id?S.identity.statements.find(s=>s.id===id):null;
const onDay=(days,di)=>!days||!days.length||days.includes(di);
function fmtDays(days){
  if(!days||!days.length||days.length===7)return 'Todos los días';
  const s=[...days].sort((a,b)=>a-b).join(',');
  if(s==='0,1,2,3,4')return 'Lun–Vie';
  if(s==='5,6')return 'Fin de semana';
  return [...days].sort((a,b)=>a-b).map(i=>DAYS[i]).join(' · ');
}
function stackPlan(st){
  const ah=habitById(st.anchorHabitId);
  const anchorName=ah?ah.name:(st.anchorText||'mi hábito actual');
  let aStart=toMin(st.time); if(aStart==null&&ah)aStart=toMin(ah.time);
  const aDur=ah?(+ah.duration||5):5;
  let cursor=aStart!=null?aStart+aDur:null, prev=anchorName, last=aStart, disorder=false;
  const steps=st.steps.map(sp=>{
    const h=habitById(sp.habitId);
    const name=h?h.name:(sp.text||'nuevo hábito');
    const manual=toMin(sp.time);
    const start=manual!=null?manual:cursor;
    const dur=+sp.duration||(h?+h.duration:0)||5;
    if(start!=null&&last!=null&&start<last)disorder=true;
    if(start!=null)last=start;
    const o={sp,h,name,prev,start,dur,auto:manual==null&&start!=null};
    cursor=start!=null?start+dur:null; prev=name;
    return o;
  });
  return {ah,anchorName,aStart,aDur,steps,disorder,end:cursor};
}
function itemsForDate(d){
  const k=dk(d);
  if(dayCache.has(k))return dayCache.get(k);
  const di=dayIdx(d), out=[], stacked=new Set();
  for(const st of S.stacks){
    if(!onDay(st.days,di))continue;
    const p=stackPlan(st);
    const anchorShown=p.ah&&p.ah.showCal&&p.ah.time&&onDay(p.ah.days,di);
    if(!anchorShown)out.push({key:'a:'+st.id,title:p.anchorName,start:p.aStart,dur:p.aDur,cls:'ancla',checkable:false,sub:'Ancla de «'+st.name+'»',stackId:st.id});
    p.steps.forEach(o=>{
      if(o.h)stacked.add(o.h.id);
      if(o.h&&o.h.archived)return;
      out.push({key:'s:'+st.id+':'+o.sp.id,title:o.name,start:o.start,dur:o.dur,cls:'pila',checkable:true,habitId:o.h?o.h.id:'',sub:'Después de '+lcFirst(o.prev)+' · '+st.name,stackId:st.id,stepId:o.sp.id});
    });
  }
  for(const h of S.habits){
    if(h.archived||!h.showCal||!onDay(h.days,di)||stacked.has(h.id))continue;
    const fijo=h.kind==='fijo';
    out.push({key:'h:'+h.id,title:h.name,start:toMin(h.time),dur:+h.duration||(fijo?60:15),cls:fijo?'fijo':h.type,checkable:!fijo,neg:h.type==='neg'&&!fijo,habitId:h.id,sub:fijo?'Evento fijo':'Hábito '+TYPE[h.type].label.toLowerCase()});
  }
  out.sort((a,b)=>(a.start??1e9)-(b.start??1e9));
  dayCache.set(k,out);
  return out;
}
const isDone=(k,key)=>(S.done[k]||[]).includes(key);
function keyHabitId(key){
  if(key.startsWith('h:'))return key.slice(2);
  if(key.startsWith('s:')){const [,sid,pid]=key.split(':');const st=S.stacks.find(x=>x.id===sid);const sp=st&&st.steps.find(x=>x.id===pid);return sp?sp.habitId:''}
  return '';
}
/* --- Ayudas del método --- */
const hIds=h=>h.identityIds||[];
const contractFor=hid=>S.contracts.find(c=>c.habitId===hid);
const freqOf=days=>(days&&days.length)?days.length:7;
const daysBetween=(a,b)=>Math.round((parseDk(b)-parseDk(a))/86400000);
const levelTextAt=(h,l)=>l===3?(h.lvl3||'Versión completa'):l===2?(h.lvl2||'Versión intermedia'):(h.twoMin||'Versión de 2 minutos');
const levelText=h=>levelTextAt(h,h.level);
function stackedIds(){const s=new Set();S.stacks.forEach(st=>{if(st.anchorHabitId)s.add(st.anchorHabitId);st.steps.forEach(p=>{if(p.habitId)s.add(p.habitId)})});return s}
const SRC={

/* --- Votos a favor y en contra --- */
function voteStats(){
  const m={},cut=dk(addDays(new Date(),-29));
  const add=(id,f,k)=>{const o=m[id]||(m[id]={favor:0,against:0,f30:0,a30:0});o[f]++;if(k>=cut)o[f==='favor'?'f30':'a30']++};
  for(const k in S.done)for(const key of S.done[k]){const h=habitById(keyHabitId(key));if(h&&h.kind!=='fijo'&&h.type!=='neu')hIds(h).forEach(id=>add(id,'favor',k))}
  for(const k in S.slips)for(const key of S.slips[k]){const h=habitById(keyHabitId(key));if(h)hIds(h).forEach(id=>add(id,'against',k))}
  return m;
}
function linkedHabits(stmtId){return S.habits.filter(h=>hIds(h).includes(stmtId))}

/* --- Seguimiento: racha tolerante y modo rescate --- */
function habitStart(h){
  if(h.start)return h.start;
  let m=null;
  for(const k in S.done)for(const key of S.done[k])if(keyHabitId(key)===h.id&&(!m||k<m))m=k;
  return m||dk(new Date());
}
function statusOn(d,match){
  const k=dk(d),tk=dk(new Date());
  const its=itemsForDate(d).filter(x=>x.checkable&&match(x));
  if(!its.length)return null;
  const has=(m,key)=>(m[k]||[]).includes(key);
  if(its.some(x=>has(S.done,x.key)))return 'done';
  if(its.some(x=>has(S.skips,x.key)))return 'skip';
  if(its.some(x=>x.neg))return its.some(x=>has(S.slips,x.key))?'fail':(k<tk?'unk':'pend');
  return k<tk?'fail':'pend';
}
function habitStats(match,from){
  const today=new Date(),tk=dk(today);
  let d=parseDk(from);const lim=addDays(today,-150);if(d<lim)d=lim;
  const seq=[];
  for(;dk(d)<=tk;d=addDays(d,1)){const st=statusOn(d,match);if(st==='done'||st==='fail')seq.push({k:dk(d),st})}
  let streak=0,cf=0,cd=0,state='ok';
  for(const x of seq){
    if(x.st==='done'){streak++;cd++;cf=0;if(state==='rescue'&&cd>=2)state='ok'}
    else{cf++;cd=0;if(cf>=2){streak=0;state='rescue'}}
  }
  const win=n=>{const cut=dk(addDays(today,-(n-1)));const a=seq.filter(x=>x.k>=cut);return {n:a.length,r:a.length?a.filter(x=>x.st==='done').length/a.length:0}};
  const w7=win(7),w14=win(14),w30=win(30);
  return {streak,state:state==='rescue'?'rescue':(cf===1?'one':'ok'),n7:w7.n,r7:w7.r,n14:w14.n,r14:w14.r,n30:w30.n,r30:w30.r};
}
function statsFor(h){
  const key='h:'+h.id;
  if(!statCache.has(key))statCache.set(key,habitStats(x=>x.habitId===h.id,habitStart(h)));
  return statCache.get(key);
}
function statsForItem(it){
  if(it.habitId){const h=habitById(it.habitId);if(h)return statsFor(h)}
  const key='k:'+it.key;
  if(!statCache.has(key)){let m=null;for(const k in S.done)if(S.done[k].includes(it.key)&&(!m||k<m))m=k;statCache.set(key,habitStats(x=>x.key===it.key,m||dk(new Date())))}
  return statCache.get(key);
}
function repsFor(h){let n=0;for(const k in S.done)for(const key of S.done[k])if(keyHabitId(key)===h.id)n++;return n}
function repsForKey(key){let n=0;for(const k in S.done)if(S.done[k].includes(key))n++;return n}
function skipsThisMonth(key,k){
  const hid=keyHabitId(key),mo=k.slice(0,7);let n=0;
  for(const d in S.skips){if(d.slice(0,7)!==mo)continue;for(const x of S.skips[d])if(x===key||(hid&&keyHabitId(x)===hid))n++}
  return n;
}

/* --- Revisión del hábito: señal, anhelo, respuesta, recompensa --- */
function loopState(h){
  if(h.type==='neg')return [{k:'Invisible',ok:!!h.hide},{k:'Poco atractivo',ok:!!h.reframe},{k:'Difícil',ok:!!(h.friction||h.commit)},{k:'Insatisfactorio',ok:!!contractFor(h.id)}];
  const anch=stackedIds().has(h.id);
  return [{k:'Señal',ok:!!(h.place||h.cue)&&!!(h.time||anch)},{k:'Anhelo',ok:!!(h.want||h.benefit||h.group)},{k:'Respuesta',ok:!!(h.twoMin||h.prep)},{k:'Recompensa',ok:!!h.reward}];
}
const loopHtml=h=>`<div class="loop" aria-label="Bucle del hábito">${loopState(h).map(x=>`<span class="lp ${x.ok?'on':''}" title="${x.ok?'Completo':'Por completar'}">${x.k}</span>`).join('')}</div>`;
function habitIssues(h){
  if(h.kind==='fijo'||h.archived)return [];
  const out=[];
  if(h.type==='pos'){
    if(!hIds(h).length)out.push({k:'R1',t:'Este hábito todavía no vota por ninguna identidad. ¿A cuál lo conectamos?'});
    if(!h.time&&!stackedIds().has(h.id))out.push({k:'R2a',t:'Dale una señal: una hora fija o un hábito de tu día al que pegarlo.'});
    if(!h.place)out.push({k:'R2',t:'Ya sabemos cuándo. ¿Y dónde? Entre más claro, más fácil arrancar.'});
    if(!h.twoMin)out.push({k:'R4',t:'Arranquemos en chiquito: ¿cuál es la versión de 2 minutos? Primero aparecer, después mejorar.'});
    if(!h.showCal&&!stackedIds().has(h.id))out.push({k:'V',t:'Para marcarlo cada día, muéstralo en el calendario o ponlo en una cadena.'});
  }
  if(h.type==='neg'&&!(h.hide||h.reframe||h.friction||contractFor(h.id)))out.push({k:'R10',t:'¿Qué ganas al evitarlo? Escríbelo y te lo recordamos en tu zona de riesgo.'});
  return out;
}

/* --- Señales y sugerencias para Inicio --- */
function signals(items,k){
  const rescue=[],one=[];
  items.filter(i=>i.checkable&&!i.neg&&!isDone(k,i.key)).forEach(it=>{const st=statsForItem(it);if(st.state==='rescue')rescue.push(it.title);else if(st.state==='one')one.push(it.title)});
  const q=a=>a.slice(0,3).map(x=>'«'+esc(x)+'»').join(', ');
  let h='';
  if(rescue.length)h+=`<div class="alert">${ic('alert')}<div><b>Modo rescate.</b> Volvamos a lo básico con ${q(rescue)}: solo la versión mínima, dos días seguidos, y retomamos. ${srcLink('lally')}</div></div>`;
  if(one.length)h+=`<div class="alert">${ic('alert')}<div><b>Nunca falles dos veces.</b> Se te pasó ${q(one)}. Fallar una vez le pasa a cualquiera: hoy con la versión de 2 minutos basta. ${srcLink('never')}</div></div>`;
  return h;
}
function suggestions(){
  const out=[],now=new Date(),tk=dk(now),mo=tk.slice(0,7);
  const live=id=>!(S.dismiss[id]&&S.dismiss[id]>=tk);
  for(const h of S.habits){
    if(h.kind==='fijo'||h.archived)continue;
    const st=statsFor(h),since=h.levelSince||habitStart(h),dl=daysBetween(since,tk),age=daysBetween(habitStart(h),tk);
    if(h.exp&&h.exp.end<=tk)out.push({kind:'exp',id:h.id,title:'Terminó tu experimento',text:`Pasaron las dos semanas de prueba con «${h.name}». ¿Lo mantienes, lo ajustas o lo dejas?`,src:'bored'});
    else if(h.type==='pos'&&h.suggAt.slice(0,7)!==mo){
      if(h.level<3&&dl>=14&&st.n14>=8&&st.r14>=.8)out.push({kind:'up',id:h.id,title:'Hora de subir un nivel',text:`Llevas dos semanas dándole con toda a «${h.name}». ¿Le subimos un poquito a la dificultad? Siguiente nivel: ${levelTextAt(h,h.level+1)}.`,src:'goldi'});
      else if(h.level>1&&st.n7>=4&&st.r7<.5)out.push({kind:'down',id:h.id,title:'Bajemos un nivel',text:`Esta semana estuvo pesada con «${h.name}». Bajemos un nivel; lo importante es no soltarlo.`,src:'goldi'});
      else if(h.level===3&&dl>=30&&st.n30>=24&&st.r30>=.95)out.push({kind:'variety',id:h.id,title:'Que no te gane el aburrimiento',text:`Llevas un mes casi perfecto con «${h.name}». ¿Sumamos variedad o un reto nuevo?`,src:'bored'});
    }
    if(h.want&&daysBetween(h.rewardAt||habitStart(h),tk)>=28&&live('rw:'+h.id))out.push({kind:'reward',id:h.id,title:'Revisemos tu premio',text:`Ya van cuatro semanas con «${h.want}» como premio de «${h.name}». ¿Sigue siendo atractivo?`,src:'milkman'});
    if(h.type==='pos'&&age>=7&&age<=60&&h.level===1&&st.n7>=4&&st.r7>=.7&&live('pl:'+h.id))out.push({kind:'plateau',id:h.id,title:'Ojo con la meseta',text:`El hielo no se derrite en el primer grado. Lo que haces con «${h.name}» se está acumulando aunque no se vea. Formar un hábito toma de semanas a meses; en el estudio de Lally el rango fue de 18 a 254 días.`,src:'plateau'});
  }
  const wk=dk(weekStart(now));
  if(dayIdx(now)===6&&!S.reviews.some(r=>r.type==='week'&&r.date>=wk)&&!S.dismiss['rev:'+wk])out.push({kind:'review',id:wk,title:'Revisión semanal',text:'Cinco minutos para mirar la semana: ¿qué funcionó, qué no y qué ajustamos?',src:'bored'});
  const rank={exp:0,review:1,up:2,down:2,variety:3,reward:4,plateau:5};
  return out.sort((a,b)=>rank[a.kind]-rank[b.kind]);
}
function suggButtons(x){

const ATOMS={
  identidad:{name:'Hidro',tilts:[-28],per:1,fill:'#FFFFFF',ec:'#FFC31A',shape:'circle',d:3.4,bd:0,td:0},
  habitos:{name:'Helio',tilts:[-38,38],per:1,fill:'#FFF3BF',ec:'#13C4BC',shape:'squircle',d:3.0,bd:1.3,td:1.9},
  cadenas:{name:'Carbo',tilts:[0,60,120],per:1,fill:'#E4EEF2',ec:'#F03A4F',shape:'hex',d:3.8,bd:2.4,td:3.4},
  calendario:{name:'Oxi',tilts:[-30,30],per:2,fill:'#FFDDE3',ec:'#1BB8F2',shape:'blob',d:3.2,bd:3.5,td:.8}
};
function atom(kind,size=64){
  const A=ATOMS[kind]||ATOMS.identidad,ink='#3B2521',cx=40,cy=40;
  let orb='',els='';
  A.tilts.forEach((t,i)=>{
    orb+=`<ellipse cx="40" cy="40" rx="34" ry="12" transform="rotate(${t} 40 40)" fill="none" stroke="${ink}" stroke-width="2.2" opacity=".8"/>`;
    for(let k=0;k<A.per;k++){
      const ph=(i/A.tilts.length+k/A.per)*A.d*2,h=A.d;
      els+=`<g transform="rotate(${t} 40 40)"><g class="ex" style="animation-duration:${h}s;animation-delay:-${(ph%(h*2)).toFixed(2)}s"><g class="ey" style="animation-duration:${h}s;animation-delay:-${((ph+h/2)%(h*2)).toFixed(2)}s"><circle cx="40" cy="40" r="4.2" fill="${A.ec}" stroke="${ink}" stroke-width="2"/></g></g></g>`;
    }
  });
  const sw=`stroke="${ink}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
  let nuc;
  if(A.shape==='squircle')nuc=`<rect x="22" y="22" width="36" height="36" rx="14" fill="${A.fill}" ${sw}/>`;
  else if(A.shape==='hex'){const p=[0,1,2,3,4,5].map(i=>{const a=(30+60*i)*Math.PI/180;return (cx+19*Math.cos(a)).toFixed(1)+' '+(cy+19*Math.sin(a)).toFixed(1)}).join(' L');nuc=`<path d="M${p} Z" fill="${A.fill}" ${sw}/>`}
  else if(A.shape==='blob')nuc=`<ellipse cx="40" cy="40" rx="20" ry="17" fill="${A.fill}" ${sw}/>`;
  else nuc=`<circle cx="40" cy="40" r="18" fill="${A.fill}" ${sw}/>`;
  const eye=x=>`<g class="eye" style="animation-delay:-${A.bd}s"><circle cx="${x}" cy="38" r="2.9" fill="${ink}"/><circle cx="${x+1}" cy="37" r="1" fill="#fff"/></g>`;
  const face=eye(34)+eye(46)+`<ellipse cx="31" cy="44" rx="2.4" ry="1.5" fill="#FF8FA3" opacity=".85"/><ellipse cx="49" cy="44" rx="2.4" ry="1.5" fill="#FF8FA3" opacity=".85"/><path class="m-smile" style="animation-delay:-${A.td}s" d="M35.5 43.5 Q40 49 44.5 43.5" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/><g class="m-talk" style="animation-delay:-${A.td}s"><ellipse cx="40" cy="46" rx="3.8" ry="3.4" fill="${ink}"/><ellipse cx="40" cy="47.6" rx="2" ry="1.2" fill="#FF8FA3"/></g>`;
  return `<svg class="mascot atom" width="${size}" height="${size}" viewBox="0 0 80 80" aria-hidden="true">${orb}${els}${nuc}${face}</svg>`;
}

function mascot(kind,size=64){
  if(kind!=='sol')return atom(kind,size);
  const ink='#3B2521',sw=`stroke="${ink}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"`;
  const eye=(x,y,r=4.2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${ink}"/><circle cx="${x+r*.35}" cy="${y-r*.4}" r="${r*.38}" fill="#fff"/>`;
  const face=(cx,cy,g=9)=>eye(cx-g,cy)+eye(cx+g,cy)+`<path d="M${cx-4} ${cy+7} Q${cx} ${cy+11} ${cx+4} ${cy+7}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="${cx-g-4}" cy="${cy+6}" rx="3.2" ry="2" fill="#FF8FA3" opacity=".85"/><ellipse cx="${cx+g+4}" cy="${cy+6}" rx="3.2" ry="2" fill="#FF8FA3" opacity=".85"/>`;
  let b='';
  if(kind==='identidad')b=`<path d="M40 20 C36 8 27 8 25 12 C29 15 34 19 40 20Z" fill="#7ED321" ${sw}/><path d="M40 20 C44 7 54 8 56 12 C52 16 46 19 40 20Z" fill="#C9EC1C" ${sw}/><circle cx="40" cy="48" r="27" fill="#fff" ${sw}/>${face(40,48,10)}`;
  else if(kind==='habitos')b=`<path d="M40 22 V12" fill="none" ${sw}/><circle cx="40" cy="10" r="4.5" style="fill:var(--or)" ${sw}/><rect x="14" y="22" width="52" height="48" rx="14" fill="#fff" ${sw}/>${face(40,40,11)}<path d="M33 58 L38 63 L48 53" fill="none" stroke="#13C4BC" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  else if(kind==='cadenas')b=`<rect x="36" y="28" width="38" height="28" rx="14" fill="none" stroke="${ink}" stroke-width="8"/><rect x="36" y="28" width="38" height="28" rx="14" fill="none" stroke="#FFC31A" stroke-width="3.6"/><rect x="6" y="26" width="42" height="32" rx="16" fill="#fff" ${sw}/>${face(27,40,8)}`;
  else if(kind==='calendario')b=`<rect x="14" y="18" width="52" height="54" rx="12" fill="#fff" ${sw}/><path d="M14 32 V30 a12 12 0 0 1 12 -12 H54 a12 12 0 0 1 12 12 V32 Z" style="fill:var(--or)" ${sw}/><path d="M27 11 V24 M53 11 V24" fill="none" stroke="${ink}" stroke-width="4.4" stroke-linecap="round"/>${face(40,52,10)}`;
  else{let rays='';for(let i=0;i<8;i++){const a=i*Math.PI/4,x1=40+Math.cos(a)*30,y1=40+Math.sin(a)*30,x2=40+Math.cos(a)*38,y2=40+Math.sin(a)*38;rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#FFC31A" stroke-width="5" stroke-linecap="round"/>`}
    b=rays+`<circle cx="40" cy="40" r="25" fill="#FFC31A" ${sw}/>${face(40,40,9)}`}
  return `<svg class="mascot" width="${size}" height="${size}" viewBox="0 0 80 80" aria-hidden="true">${b}</svg>`;
}

const UNLOCK_EVERY=2;
const UNLOCK=[
  {id:'ficha',n:'Ficha de diseño y tarjeta de puntuación',s:'Ficha y tarjeta',d:'Diseña cada hábito con las cuatro leyes y observa tu día con la tarjeta de puntuación.'},
  {id:'acum',n:'Acumulación de hábitos',s:'Acumulación',d:'Pega un hábito nuevo a uno que ya haces: «después de [actual], yo [nuevo]».'},
  {id:'cal',n:'Calendario y eventos fijos',s:'Calendario',d:'Ve tu semana completa, ordena tus hábitos por hora y registra tus eventos fijos.'},
  {id:'contr',n:'Contratos de hábito',s:'Contratos',d:'Ponle un costo inmediato a lo que quieres soltar y suma a alguien que te acompañe.'}
];
const isNov=()=>S.path==='novato';
const lvlOf=f=>UNLOCK.findIndex(u=>u.id===f)+1;
const lk=f=>isNov()&&S.unlocked<lvlOf(f);
const realHabits=()=>S.habits.filter(h=>h.kind!=='fijo');
const firstHab=()=>habitById(S.first)||realHabits().find(h=>h.type==='pos')||realHabits()[0]||null;
function bestRun(h){
  if(!h)return {best:0,cur:0};
  const tk=dk(new Date());let d=parseDk(habitStart(h));const lim=addDays(new Date(),-150);if(d<lim)d=lim;
  let best=0,run=0;
  for(;dk(d)<=tk;d=addDays(d,1)){
    const st=statusOn(d,x=>x.habitId===h.id);
    if(st==='done'){run++;if(run>best)best=run}
    else if(!(st==='pend'&&dk(d)===tk))run=0;
  }
  return {best,cur:run};
}
function unlockInfo(){
  const h=firstHab(),r=bestRun(h),lvl=S.unlocked,next=UNLOCK[lvl]||null;
  return {h,best:r.best,cur:r.cur,lvl,next,need:next?(lvl+1)*UNLOCK_EVERY:0};
}
function checkUnlocks(){
  if(!isNov())return;
  const h=firstHab();if(!h)return;
  const t=Math.min(UNLOCK.length,Math.floor(bestRun(h).best/UNLOCK_EVERY));
  if(t>S.unlocked){
    S.unlocked=t;persist();render();
    setTimeout(()=>{bigParty();toast('¡Se abrió: '+UNLOCK[t-1].n+'!')},380);
  }
}
function lockedMsg(f){
  const u=UNLOCK[lvlOf(f)-1],i=unlockInfo();
  return 'Se abre al completar tu hábito '+(lvlOf(f)*UNLOCK_EVERY)+' días seguidos ('+u.s+'). Llevas '+i.best+'.';
}
const lockChip=f=>`<span class="lock-chip" title="${esc(lockedMsg(f))}">${ic('lock')}</span>`;
function progressBar(){

function todayRow(it,k){

function stackWarnings(st,p){
  const w=[];

  if(!p.ah&&(a.length<4||/\b(mañana|tarde|noche|cuando pueda|después del trabajo|más tarde)\b/i.test(a)))w.push('El ancla se ve vaga. Mejor algo concreto que ya haces seguido, como «servirme el café» o «lavarme los dientes».');
  const af=p.ah?freqOf(p.ah.days):freqOf(st.days);
  p.steps.forEach(o=>{if(o.h&&o.h.type!=='neu'&&freqOf(o.h.days)>af)w.push('«'+o.name+'» se hace más seguido que el ancla («'+a+'»): habrá días sin señal.')});
  const same=S.stacks.filter(x=>x.id!==st.id&&((p.ah&&x.anchorHabitId===p.ah.id)||(!p.ah&&x.anchorText&&x.anchorText===st.anchorText)));
  if(same.length)w.push('Otra cadena usa la misma ancla («'+same[0].name+'»). Dos hábitos compitiendo por la misma señal se estorban.');
  return w;
}

/* ================= Vista: Calendario ================= */
let PPH=64; const MINH=22;
function weekTitle(d){
  const a=weekStart(d),b=addDays(a,6);
  if(a.getMonth()===b.getMonth())return `${a.getDate()} – ${b.getDate()} de ${MONTHS[a.getMonth()]} ${b.getFullYear()}`;
  return `${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MONTHS[b.getMonth()].slice(0,3)} ${b.getFullYear()}`;
}
function layoutDay(items,ppm){
  const ev=items.filter(i=>i.start!=null).map(i=>({...i,vStart:i.start,vEnd:i.start+Math.max(i.dur,MINH/ppm)}));
  ev.sort((a,b)=>a.start-b.start||b.dur-a.dur);
  let pr=null;
  for(const e of ev){
    if(pr&&e.start>=pr.start+pr.dur&&e.vStart<pr.vEnd){const d=pr.vEnd-e.vStart;e.vStart+=d;e.vEnd+=d}
    pr=e;
  }
  const res=[];let cl=[],clEnd=-1;
  const flush=()=>{const cols=[];cl.forEach(e=>{let c=cols.findIndex(end=>end<=e.vStart);if(c<0){c=cols.length;cols.push(0)}cols[c]=e.vEnd;e.col=c});cl.forEach(e=>e.cols=cols.length);res.push(...cl);cl=[];clEnd=-1};
  for(const e of ev){if(cl.length&&e.vStart>=clEnd)flush();cl.push(e);clEnd=Math.max(clEnd,e.vEnd)}
  if(cl.length)flush();
  return res;
}
function vCalendario(){
  const d=ui.calDate,mode=ui.calMode,today=new Date(),tk=dk(today);
  PPH=mode==='day'?84:64;
  const ws=weekStart(d);

  const data=days.map(x=>({date:x,k:dk(x),items:itemsForDate(x)}));
  let minM=6*60,maxM=22*60;
  data.forEach(o=>o.items.forEach(it=>{if(it.start!=null){minM=Math.min(minM,Math.floor(it.start/60)*60);maxM=Math.max(maxM,Math.ceil((it.start+it.dur)/60)*60)}}));
  maxM=Math.min(maxM+60,24*60);
  const ppm=PPH/60,H=(maxM-minM)*ppm;
  const anyItems=S.habits.length||S.stacks.length;
  const hours=[];for(let m=minM;m<maxM;m+=60)hours.push(`<span style="top:${(m-minM)*ppm}px">${fromMin(m)}</span>`);
  const evHtml=(it,k)=>{
    const done=isDone(k,it.key);const h=Math.max(it.dur*ppm,MINH);const short=h<38;
    return `<button class="ev c-${it.cls} ${done?'done':''} ${(S.skips[k]||[]).includes(it.key)?'skip':''} ${(S.slips[k]||[]).includes(it.key)?'slip':''} ${short?'short':''}" style="top:${(it.vStart-minM)*ppm}px;height:${h-2}px;left:calc(${it.col/it.cols*100}% + 2px);width:calc(${100/it.cols}% - 4px)" data-act="open-item" data-key="${esc(it.key)}" data-date="${k}" title="${esc(fromMin(it.start)+' · '+it.title)}">${done?ic('check'):''}<span class="ev-t">${fromMin(it.start)}</span><span class="ev-n">${esc(it.title)}</span></button>`;
  };
  const nowM=today.getHours()*60+today.getMinutes();
  return `
  <div class="page-head"><div class="ph">${phTile('calendario')}<div><div class="eyebrow">Tu sistema en acción</div><h1>Calendario personalizado</h1><p class="lead">Todos tus hábitos, cadenas y eventos fijos en un solo lugar. Toca un bloque para marcarlo como hecho.</p></div></div></div>
  <div class="cal-bar">
    <div class="seg"><button data-act="cal-nav" data-d="-1" aria-label="Anterior">${ic('left')}</button><button data-act="cal-today">Hoy</button><button data-act="cal-nav" data-d="1" aria-label="Siguiente">${ic('right')}</button></div>
    <h2>${mode==='week'?weekTitle(d):longDate(d).replace(/^./,c=>c.toUpperCase())}</h2>
    <div class="seg"><button class="${mode==='week'?'on':''}" data-act="cal-mode" data-m="week">Semana</button><button class="${mode==='day'?'on':''}" data-act="cal-mode" data-m="day">Día</button></div>
  </div>
  <div class="legend"><span><i class="c-pila"></i>Cadena de hábitos</span><span><i class="c-ancla"></i>Ancla</span><span><i class="c-pos"></i>Hábito positivo</span><span><i class="c-neg"></i>Hábito negativo (zona de riesgo)</span><span><i class="c-neu"></i>Neutral</span><span><i class="c-fijo"></i>Evento fijo</span></div>
  ${mode==='day'?`<div class="daystrip">${[0,1,2,3,4,5,6].map(i=>{const x=addDays(ws,i);return `<button class="${dk(x)===dk(d)?'on':''} ${dk(x)===tk?'today':''}" data-act="cal-goday" data-date="${dk(x)}"><small>${DAYS[i]}</small><b>${x.getDate()}</b></button>`}).join('')}</div>`:''}
  ${anyItems?'':`<div class="empty" style="margin-bottom:14px">${mascot("sol",64)}<b>Tu calendario está vacío</b>Registra hábitos con hora o crea cadenas para verlos aquí.<br><button class="btn primary sm" data-act="load-example">Ver con datos de ejemplo</button></div>`}
  <div class="cal-wrap"><div class="cal-x"><div class="cal ${mode}" style="--n:${days.length};--pph:${PPH}px">
    <div class="cal-row cal-head"><div class="gut"></div>${data.map(o=>`<div class="dh ${o.k===tk?'today':''}" data-act="cal-goday" data-date="${o.k}" role="button" tabindex="0"><span class="dn">${DAYS[dayIdx(o.date)]}</span><span class="dd">${o.date.getDate()}</span><span class="dp">${(()=>{const c=o.items.filter(i=>i.checkable);return c.length?c.filter(i=>isDone(o.k,i.key)).length+'/'+c.length:'·'})()}</span></div>`).join('')}</div>
    <div class="cal-row cal-allday"><div class="gut">Sin<br>hora</div>${data.map(o=>`<div class="ad">${o.items.filter(i=>i.start==null).map(it=>`<button class="ev static c-${it.cls} ${isDone(o.k,it.key)?'done':''}" data-act="open-item" data-key="${esc(it.key)}" data-date="${o.k}"><span class="ev-n">${esc(it.title)}</span></button>`).join('')}</div>`).join('')}</div>
    <div class="cal-scroll"><div class="cal-body" style="height:${H}px">
      <div class="hours">${hours.join('')}</div>
      ${data.map(o=>`<div class="col ${o.k===tk?'today':''}">${layoutDay(o.items,ppm).map(it=>evHtml(it,o.k)).join('')}${o.k===tk&&nowM>=minM&&nowM<=maxM?`<div class="now" style="top:${(nowM-minM)*ppm}px"></div>`:''}</div>`).join('')}
    </div></div>
  </div></div></div>`;
}
function afterCalendar(){
  const sc=$('.cal-scroll');if(!sc)return;
  const evs=$$('.cal-body .ev').map(e=>e.offsetTop).sort((a,b)=>a-b);const now=$('.now');
  let target=0;
  if(now){const nt=now.offsetTop;const next=evs.find(t=>t>=nt-90);target=next!=null?Math.min(nt,next)-40:(evs.length?evs[evs.length-1]-80:nt-120)}
  else if(evs.length)target=evs[0]-20;
  sc.scrollTop=Math.max(0,target);
}

function openModal({title,body,submit='Guardar',danger=false,onSubmit,extra='',noCancel=false}){
  const root=$('#modal-root');
  root.innerHTML=`<div class="scrim" data-act="modal-close"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><form id="m-form" novalidate><div class="m-head"><h3 id="m-title">${esc(title)}</h3><button type="button" class="icon-btn" data-act="modal-close" aria-label="Cerrar"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="m-body">${body}</div><div class="m-foot">${extra}<span class="sp"></span>${noCancel?'':`<button type="button" class="btn ghost" data-act="modal-close">${onSubmit?'Cancelar':'Cerrar'}</button>`}${onSubmit?`<button type="submit" class="btn ${danger?'danger':'primary'}">${esc(submit)}</button>`:''}</div></form></div>`;
  root.classList.add('open');
  const f=$('#m-form');
  f.onsubmit=ev=>{ev.preventDefault();if(!onSubmit)return;const r=onSubmit(f);if(r!==false)closeModal()};
  setTimeout(()=>{const first=f.querySelector('.m-body input:not([type=hidden]):not([type=checkbox]):not([type=radio]),.m-body textarea,.m-body select');if(first&&innerWidth>860)first.focus()},40);
}
function closeModal(){$('#modal-root').classList.remove('open');$('#modal-root').innerHTML=''}
function confirmModal(text,onYes,label='Eliminar'){openModal({title:'¿Estás seguro?',body:`<p style="margin:0">${text}</p>`,submit:label,danger:true,onSubmit:()=>{onYes()}})}
const F=(f,n)=>f.elements.namedItem(n);
const fv=(f,n)=>{const e=F(f,n);return e?String(e.value||'').trim():''};
const fErr=(f,n,msg)=>{const e=F(f,n);const s=e&&e.closest('.fld')&&e.closest('.fld').querySelector('.err');if(s)s.textContent=msg;if(e)e.focus();return false};
const fDays=f=>$$('input[name=days]:checked',f).map(i=>+i.value);
function dayChips(sel){
  sel=sel||[];
  return `<div class="daychips">${DAYS.map((d,i)=>`<label class="chip-day"><input type="checkbox" name="days" value="${i}" ${sel.includes(i)?'checked':''}><span>${d}</span></label>`).join('')}</div><div class="presets"><button type="button" data-act="days-preset" data-p="all">Todos</button><button type="button" data-act="days-preset" data-p="week">Lun–Vie</button><button type="button" data-act="days-preset" data-p="weekend">Fin de semana</button><button type="button" data-act="days-preset" data-p="none">Ninguno</button></div>`;
}
function identityOptions(selected){return S.identity.statements.map(s=>`<option value="${s.id}" ${selected===s.id?'selected':''}>${esc(s.text)}</option>`).join('')}

/* --- Afirmaciones --- */
const NEG_RE=/\b(no\s+soy|nunca|dejar|dejo)\b/i;
function stmtModal(s,after){
  openModal({title:s?'Editar afirmación':'Nueva afirmación',
    body:`<label class="fld"><span>Afirmación de identidad</span><input name="text" value="${esc(s?s.text:'Soy ')}" maxlength="120" placeholder="Soy una persona que…"><small class="err"></small></label><p class="hint" style="margin:0 0 4px">Escríbela en presente y en positivo, como algo que ya eres: «Soy un lector», «Soy alguien que entrena». Mejor «soy una persona saludable» que «no soy sedentario».</p>
    <label class="fld"><span>Cualidad de fondo <em>(opcional)</em></span><input name="quality" value="${esc(s?s.quality:'')}" maxlength="120" placeholder="Ej. Alguien curioso que disfruta aprender"><small class="hint">Las cualidades aguantan mejor los cambios de la vida que los roles.</small></label>`,
    onSubmit:f=>{const t=fv(f,'text');if(t.length<3||/^soy$/i.test(t))return fErr(f,'text','Escribe una afirmación.');
      if(NEG_RE.test(t)&&!f.dataset.warned){f.dataset.warned='1';return fErr(f,'text','Se lee en negativo. Prueba en positivo, por ejemplo «Soy una persona que…». Si así la quieres, guarda de nuevo.')}
      const q=fv(f,'quality');
      let id;if(s){s.text=t;s.quality=q;id=s.id}else{id=uid();S.identity.statements.push({id,text:t,quality:q,created:dk(new Date())});party(lastPt.x,lastPt.y,16)}
      commit();toast(s?'Afirmación actualizada':'Afirmación creada');if(after)after(id)}});
}

/* --- Hábitos --- */
function idChecks(sel){
  if(!S.identity.statements.length)return `<div class="hint">Aún no tienes identidades. <button type="button" class="btn soft sm" data-act="new-stmt-from-habit">Crear la primera</button></div>`;
  return `<div class="chk-list">${S.identity.statements.map(s=>`<label class="check"><input type="checkbox" name="identityIds" value="${s.id}" ${sel.includes(s.id)?'checked':''}><span>${esc(s.text)}</span></label>`).join('')}</div>`;
}
function habitModal(h,kind){
  const isNew=!h;
  const d=h||newHabit({kind:kind||'habito',duration:kind==='fijo'?60:10,showCal:true,start:dk(new Date())});

  const fld=(n,l,ph,v,hint)=>`<label class="fld"><span>${l}</span><input name="${n}" value="${esc(v)}" maxlength="120" placeholder="${esc(ph)}">${hint?`<small class="hint">${hint}</small>`:''}</label>`;
  openModal({title:isNew?(d.kind==='fijo'?'Nuevo evento fijo':'Nuevo hábito'):'Editar '+(d.kind==='fijo'?'evento':'hábito'),

      <div class="row2"><label class="fld"><span>Hora <em>(opcional)</em></span><input type="time" name="time" value="${esc(d.time)}"></label><label class="fld"><span>Duración (min)</span><input type="number" name="duration" min="1" max="720" inputmode="numeric" value="${d.duration||''}"></label></div>
      <label class="fld"><span>Lugar <em>(dónde lo haces)</em></span><input name="place" value="${esc(d.place)}" maxlength="80" placeholder="Ej. Sala, escritorio, parque"></label>
      <div class="fld"><span>Días</span>${dayChips(d.days)}<small class="hint">Si no eliges ninguno, se repite todos los días.</small></div>

          <label class="fld"><span>Nivel 2 <em>(un poco más)</em></span><input name="lvl2" value="${esc(d.lvl2)}" maxlength="100" placeholder="Ej. Leer 5 páginas"></label>
          <label class="fld"><span>Nivel 3 <em>(versión completa)</em></span><input name="lvl3" value="${esc(d.lvl3)}" maxlength="100" placeholder="Ej. Leer 10 páginas"></label>
