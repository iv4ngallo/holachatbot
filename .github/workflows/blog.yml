name: Blog estático (Iván Gallo)

# Genera las páginas estáticas del blog desde los posts publicados en Supabase,
# para que buscadores y modelos de IA lean el contenido sin ejecutar JavaScript.
on:
  schedule:
    - cron: '17 * * * *'   # cada hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar blog
        run: node tools/build-blog.mjs
      - name: Publicar cambios
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add -A ivangallo/blog sitemap.xml llms.txt
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Blog: actualizar páginas estáticas" && git push; fi
