'use strict';
/*M-START*/
const M={
  fv(P,pmt,r,fee,infl,yrs){
    const i=(r-fee)/100/12,n=Math.round(yrs*12);let v=P;
    const nom=[P],real=[P],con=[P];
    for(let m=1;m<=n;m++){
      v=v*(1+i)+pmt;
      if(m%12===0){const y=m/12;nom.push(v);real.push(v/Math.pow(1+infl/100,y));con.push(P+pmt*m);}
    }
    return{nom,real,con};
  },
  bond(face,cp,y,n){
    const c=face*cp/100,r=y/100;
    if(r===0)return face+c*n;
    return c*(1-Math.pow(1+r,-n))/r+face*Math.pow(1+r,-n);
  },
  gordon(D1,r,g){return r>g?D1/((r-g)/100):null;},
  loan(P,r,n){const i=r/100/12;return i===0?P/n:P*i/(1-Math.pow(1+i,-n));},
  vol(n,s,rho){return s*Math.sqrt(1/n+(1-1/n)*rho);},
  eq(sd,ss){const A=100+sd,C=10+ss,b=10,d=10;const p=(A-C)/(b+d);return{p,q:A-b*p,A,C,b,d};},
  grow(price,r,y){return price*Math.pow(1+r/100,y);},
  mul(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};},
  gauss(r){let u=r();if(u<1e-9)u=1e-9;const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
};
/*M-END*/

/* Gráfico de líneas simple. series:[{n,c:'s1|s2|s3',d:bool,v:[]}] */
function lineChart(o){
  const W=640,H=250,L=58,R=18,T=14,B=30,xs=o.xs,N=xs.length;
  let mx=0;o.series.forEach(s=>s.v.forEach(v=>{if(isFinite(v)&&v>mx)mx=v;}));
  if(mx<=0)mx=1;
  const mag=Math.pow(10,Math.floor(Math.log10(mx))),u=mx/mag;
  const nice=(u<=1?1:u<=2?2:u<=2.5?2.5:u<=5?5:10)*mag;
  const X=i=>L+(N<2?0:(W-L-R)*i/(N-1)),Y=v=>T+(H-T-B)*(1-v/nice);
  let g='';
  for(let k=0;k<=4;k++){const v=nice*k/4,y=Y(v);g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${esc(o.yf(v))}</text>`;}
  const step=Math.max(1,Math.ceil(N/6));
  for(let i=0;i<N;i+=step)g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(xs[i])}</text>`;
  const lines=o.series.map(s=>`<polyline class="${s.c}${s.d?' dash':''}" points="${s.v.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`).join('');
  const lg=o.series.map(s=>`<span><i class="sw ${s.c}${s.d?' d':''}"></i>${esc(s.n)}</span>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}${lines}${o.extra?o.extra(X,Y):''}</svg><div class="lgs">${lg}</div>`;
}

 cards:[
 {t:'Demanda: cuánto queremos comprar',p:'Cuando el precio de algo baja, normalmente compras más. Cuando sube, compras menos o buscas un sustituto. La demanda es esa relación entre el precio y la cantidad que los compradores aceptan comprar.',e:['Café a 2 dólares: compras 5 por semana.','Café a 4 dólares: compras 2 y preparas el resto en casa.','Si dibujas esos puntos obtienes una línea que baja: más precio, menos cantidad.'],i:'Mayor precio, menor cantidad demandada.',s:['fd']},
 {t:'Oferta: cuánto queremos vender',p:'Para los vendedores es al revés. Un precio más alto hace rentable producir más y atrae a más productores. La oferta es la cantidad que los vendedores aceptan ofrecer a cada precio.',e:['Una panadería vende pan a 1 dólar y le sobra poco.','Si el pan sube a 2 dólares, hornea más tandas y abre más temprano.','Su línea sube: más precio, más cantidad ofrecida.'],i:'Mayor precio, mayor cantidad ofrecida.',q:['¿Por qué un precio más alto atrae a más productores?','Porque cada unidad deja más ganancia, así que compensa producir más.'],s:['fd']},
 {t:'El punto de equilibrio',p:'Donde la línea de demanda y la de oferta se cruzan, la cantidad que quieren comprar y la que quieren vender coinciden. Ese es el precio de equilibrio. Si el precio está por encima, sobran productos y los vendedores bajan precios. Si está por debajo, faltan productos y el precio sube.',sim:'equilibrio',i:'Los precios se ajustan hasta que el mercado se despeja: nadie se queda con sobrantes ni con faltantes.',s:['fd']},
 {t:'Choques: cuando algo se mueve',p:'Los precios cambian cuando se desplaza la oferta o la demanda. Prueba los controles de la tarjeta anterior para ver cada caso.',e:['Una helada daña la cosecha de café: la oferta baja y el precio sube.','Una moda hace que más gente tome café: la demanda sube y el precio sube.','Llega una máquina que abarata producir: la oferta sube y el precio baja.'],i:'Para predecir el precio, pregunta primero qué se movió: ¿los compradores o los vendedores?',s:['fd']}
 ],
 quiz:[
 {q:'Si la oferta de un producto baja por una mala cosecha y la demanda no cambia, ¿qué pasa con el precio?',o:['Baja','Sube','No cambia','Primero baja y luego sube sin razón'],c:1,x:'Hay menos producto para los mismos compradores, así que el precio de equilibrio sube.'},
 {q:'Si el precio está por encima del equilibrio, ¿qué esperas?',o:['Faltantes y precios al alza','Sobrantes y presión a la baja','Nada, el precio queda fijo','Menos vendedores y más compradores'],c:1,x:'A un precio alto los vendedores quieren vender más de lo que los compradores quieren comprar, así que quedan sobrantes y bajan precios.'},
 {q:'Una moda duplica el interés por unas zapatillas. ¿Qué se desplaza?',o:['La oferta hacia la izquierda','La demanda hacia la derecha','Ninguna','La oferta hacia la derecha'],c:1,x:'Más compradores dispuestos a cada precio desplazan la demanda hacia la derecha y el precio sube.'}
 ]},

{id:'inflacion',lv:0,t:'Inflación: por qué tu plata rinde menos',r:'Qué es, cómo se mide y qué hacen los bancos centrales.',
 obj:['Definir inflación y poder adquisitivo','Calcular el efecto de la inflación en el tiempo','Explicar la meta de inflación de los bancos centrales'],
 cards:[
 {t:'Qué es la inflación',p:'Es el aumento general y sostenido de los precios. No se trata de que un producto suba, sino de que la canasta completa cueste más con el tiempo. Por eso cada unidad de dinero compra menos.',e:['Hoy una canasta de mercado cuesta 100 dólares.','Con inflación de 5 % anual, el próximo año cuesta 105.','Tus mismos 100 dólares ahora compran lo que antes costaba cerca de 95.'],i:'Inflación es perder poder adquisitivo: el mismo dinero compra menos.',q:['Si ganas lo mismo todos los años y hay inflación, ¿tu salario subió o bajó en términos reales?','Bajó: el número es igual pero alcanza para menos cosas.'],s:['bls_cpi']},
 {t:'Cómo se mide',p:'Las oficinas de estadística siguen mes a mes el precio de una canasta de bienes y servicios típicos de los hogares, como comida, vivienda, transporte y salud. Esa canasta se resume en un índice de precios al consumidor (IPC). La inflación es el porcentaje en que ese índice cambia entre dos fechas.',e:['Índice hace un año: 200.','Índice hoy: 210.','Inflación anual: (210 − 200) ÷ 200 = 5 %.'],i:'La inflación es la variación porcentual de un índice de precios.',n:'Tu inflación personal puede diferir de la oficial según qué compras más.',s:['bls_cpi']},
 {t:'Simulador: el poder adquisitivo',p:'Mueve el precio, la inflación y los años para ver cuánto costará algo en el futuro y cuánto alcanzará tu dinero de hoy.',sim:'inflacion',s:['bls_cpi']},
 {t:'Qué hacen los bancos centrales',p:'Muchos bancos centrales buscan inflación baja y estable. La Reserva Federal de EE. UU., por ejemplo, tiene como metas el máximo empleo y la estabilidad de precios, y fija una meta de inflación de 2 % anual en promedio. Su herramienta principal es la tasa de interés de corto plazo, que veremos en el Nivel 2.',i:'Ni inflación muy alta ni deflación: se busca estabilidad, no cero.',s:['fedmp','fedfaq']}
 ],
 quiz:[
 {q:'Un índice de precios pasa de 250 a 260 en un año. ¿Cuál es la inflación anual?',o:['2 %','4 %','10 %','26 %'],c:1,x:'(260 − 250) ÷ 250 = 0,04, es decir 4 %.'},
 {q:'Tu cuenta paga 2 % al año y la inflación es 5 %. ¿Qué ocurre con tu poder adquisitivo?',o:['Sube cerca de 3 puntos','Baja cerca de 3 puntos','No cambia','Depende solo del banco'],c:1,x:'Tu dinero crece 2 % pero los precios 5 %, así que pierdes poder de compra en términos reales.'},
 {q:'¿Qué objetivo suelen buscar los bancos centrales con la inflación?',o:['Que sea siempre negativa','Que sea cero exacto','Que sea baja y estable','Que cambie mucho para estimular'],c:2,x:'La estabilidad de precios, con inflación baja y predecible, ayuda a planear gastos e inversiones.'}
 ]},

{id:'interes',lv:0,t:'Interés compuesto: el tiempo trabaja por ti',r:'La idea financiera más poderosa, a favor y en contra.',
 obj:['Distinguir interés simple y compuesto','Aplicar la regla del 72','Usar el simulador para ver el efecto del tiempo y de los costos'],
 cards:[
 {t:'Interés simple y compuesto',p:'Con interés simple ganas siempre sobre el dinero inicial. Con interés compuesto ganas sobre el dinero inicial y también sobre los intereses que ya ganaste. Es interés sobre interés.',e:['Pones 1.000 dólares al 10 % anual.','Simple: ganas 100 cada año, así que en 3 años tienes 1.300.','Compuesto: año 1 = 1.100, año 2 = 1.210, año 3 = 1.331.'],i:'El interés compuesto crece cada vez más rápido porque la base también crece.',q:['¿Por qué empezar a ahorrar joven importa tanto?','Porque más años permiten más ciclos de interés sobre interés, y el efecto es exponencial.'],s:['stl_ci','moneysense']},
 {t:'La regla del 72',p:'Un atajo mental: divide 72 entre la tasa anual y obtienes aproximadamente los años que tarda en duplicarse tu dinero.',e:['Tasa 8 %: 72 ÷ 8 = 9 años para duplicar.','Tasa 4 %: 72 ÷ 4 = 18 años.','Tasa 12 %: 72 ÷ 12 = 6 años.'],i:'Es una aproximación, útil para comparar. Para precisión usa la fórmula completa o el simulador.',s:['stl_ci']},
 {t:'Simulador de crecimiento',p:'Cambia los controles. Mira la línea de arriba (lo que tienes) frente a la línea de abajo (lo que aportaste): la diferencia son intereses.',sim:'interes',s:['stl_ci']},
 {t:'Cuando juega en tu contra: las deudas',p:'El interés compuesto no distingue entre ahorrar y deber. En una deuda, los intereses no pagados se suman al saldo y generan más intereses.',e:['Deuda de 1.000 dólares al 36 % anual sin pagar.','Año 1: 1.360. Año 2: 1.850. Año 3: 2.515.','En 3 años una deuda de 1.000 se vuelve más del doble.'],i:'Una tasa alta de deuda es como una inversión al revés: el tiempo trabaja en tu contra.',s:['moneysense']}
 ],
 quiz:[
 {q:'¿Cuántos años tarda en duplicarse tu dinero al 6 % anual según la regla del 72?',o:['6 años','12 años','18 años','36 años'],c:1,x:'72 ÷ 6 = 12 años.'},
 {q:'¿Qué distingue al interés compuesto del simple?',o:['Que la tasa es mayor','Que se gana también sobre los intereses acumulados','Que se paga al final','Que solo aplica a deudas'],c:1,x:'Con interés compuesto, los intereses ganados se suman al capital y ellos mismos generan intereses.'},
 {q:'¿Qué hace más para aumentar el valor final de un ahorro a 30 años?',o:['Empezar antes y mantenerse en el tiempo','Revisar el saldo todos los días','Esperar a que suban las tasas','Gastar primero y ahorrar después'],c:0,x:'El tiempo es el ingrediente central del interés compuesto: más años, más ciclos de interés sobre interés.'}
 ]},

{id:'ahorro',lv:0,t:'Presupuesto, ahorro y deuda',r:'Ordenar tu flujo de plata y entender el costo de endeudarte.',
 obj:['Armar un presupuesto sencillo','Explicar para qué sirve un fondo de emergencia','Calcular la cuota y los intereses de un préstamo'],
 cards:[
 {t:'Tu mapa de plata: ingresos, gastos y saldo',p:'Un presupuesto no es una prohibición, es un mapa. Te muestra a dónde se va tu plata para que decidas tú, no la costumbre.',e:['Anota tus ingresos netos del mes, lo que realmente te llega.','Lista gastos fijos (arriendo, servicios, cuotas) y variables (mercado, salidas, transporte).','Resta: ingresos − gastos = saldo. Si es negativo, estás financiando tu vida con deuda.','Decide una cantidad de ahorro y sepárala el día que te pagan, antes de gastar.'],i:'Paga primero tu ahorro: lo que queda después es lo que puedes gastar.',n:'Muchas personas usan reglas prácticas como dividir entre necesidades, gustos y ahorro. No son leyes: ajústalas a tu realidad.',s:['inv_start']},
 {t:'Fondo de emergencia',p:'Es una reserva de dinero fácil de sacar para imprevistos: una calamidad médica, un daño en el carro, perder el empleo. Su trabajo no es rendir mucho, es evitar que un problema te obligue a endeudarte caro o a vender inversiones en mal momento.',e:['Calcula tus gastos esenciales de un mes.','Muchas guías proponen cubrir varios meses de esos gastos. Más si tu ingreso es variable.','Guárdalo aparte, en una cuenta de fácil acceso.'],i:'Primero la red de seguridad, después las inversiones.',q:['¿Por qué el fondo de emergencia no se invierte en bolsa?','Porque lo necesitas disponible y estable; la bolsa puede estar baja justo cuando lo necesites.'],s:['inv_start']},
 {t:'Simulador de préstamo',p:'Mira cómo se comportan la cuota y los intereses al cambiar tasa y plazo. Observa la última tarjeta de resultados: con la mitad del plazo la cuota sube, pero los intereses totales bajan mucho.',sim:'prestamo',s:['moneysense']},
 {t:'Deuda cara y deuda barata',p:'No toda deuda es igual. Lo que importa es la tasa, el plazo y para qué la usas. Una deuda con tasa baja que financia algo que mejora tus ingresos es muy distinta de una con tasa alta que financia consumo.',e:['Lista tus deudas con su tasa anual.','Paga el mínimo en todas y destina el extra a la de mayor tasa (método avalancha).','Cuando la termines, pasa ese dinero a la siguiente.'],i:'Pagar primero la deuda de mayor tasa es lo que más intereses ahorra.',s:['moneysense','inv_start']}
 ],
 quiz:[
 {q:'¿Para qué sirve principalmente un fondo de emergencia?',o:['Para obtener la máxima rentabilidad','Para evitar endeudarte o vender inversiones a la fuerza ante un imprevisto','Para pagar vacaciones','Para comprar acciones baratas'],c:1,x:'Es una red de seguridad: su valor está en estar disponible cuando algo sale mal.'},
 {q:'Tienes dos deudas, una al 12 % y otra al 40 %, y plata extra. ¿Cuál conviene atacar primero?',o:['La del 12 %','La del 40 %','La más pequeña siempre','Ninguna, mejor invertir'],c:1,x:'La de 40 % genera más intereses por dólar, así que pagarla primero ahorra más.'},
 {q:'Si acortas el plazo de un préstamo, ¿qué ocurre normalmente?',o:['La cuota baja y los intereses suben','La cuota sube y los intereses totales bajan','Todo queda igual','Solo cambia la tasa'],c:1,x:'Pagas más rápido, con cuotas más altas, pero el dinero genera intereses durante menos tiempo.'}
 ]},

{id:'medir',lv:0,t:'Medir una economía: PIB y empleo',r:'Los dos números que más aparecen en las noticias económicas.',
 obj:['Definir PIB y sus cuatro componentes','Distinguir PIB nominal y real','Explicar cómo se mide el desempleo y qué no dice'],
 cards:[
 {t:'PIB: cuánto produce un país',p:'El producto interno bruto (PIB) mide el valor de los bienes y servicios finales producidos dentro de un país en un periodo. Se cuentan solo los bienes finales para no contar dos veces lo mismo.',e:['Un agricultor vende trigo por 1 dólar a una panadería.','La panadería hace pan y lo vende por 3 dólares.','El PIB suma 3 (el pan final), no 1 + 3, porque el trigo ya está dentro del pan.'],i:'PIB = valor de lo producido y vendido como producto final.',s:['bea','stl_gdp']},
 {t:'Los cuatro bloques del PIB',p:'Se puede ver el PIB por el lado del gasto. Todo lo producido lo compra alguien: los hogares, las empresas, el gobierno o el exterior.',e:['C, consumo de los hogares.','I, inversión de las empresas (máquinas, edificios, inventarios).','G, gasto del gobierno.','X − M, exportaciones menos importaciones.'],i:'PIB = C + I + G + (X − M).',q:['Si los hogares compran más, ¿qué bloque del PIB sube?','El consumo (C).'],s:['bea_gl']},
 {t:'PIB nominal y PIB real',p:'El PIB nominal usa precios del momento, así que puede subir solo porque subieron los precios. El PIB real descuenta la inflación y mide si realmente se produjo más.',e:['PIB nominal crece 6 %.','La inflación fue 4 %.','El crecimiento real es de cerca de 2 %.'],i:'Para saber si una economía creció, mira el PIB real.',s:['bea','stl_gdp']},
 {t:'Desempleo: quién cuenta como desempleado',p:'Una persona se clasifica como desempleada si no tiene trabajo, está disponible y buscó empleo activamente. La tasa de desempleo es esa cifra dividida entre la fuerza laboral, que suma a empleados y desempleados.',e:['Fuerza laboral: 100 personas, 94 empleadas y 6 desempleadas.','Tasa de desempleo: 6 ÷ 100 = 6 %.','Si 3 de las 6 se desaniman y dejan de buscar, ya no cuentan: la tasa baja a 3 ÷ 97 ≈ 3,1 % sin que nadie haya conseguido trabajo.'],i:'La tasa de desempleo puede bajar por malas razones. Mírala junto con la participación laboral.',s:['bls','pew']}
 ],
 quiz:[
 {q:'¿Por qué el PIB cuenta solo bienes finales?',o:['Porque los intermedios son ilegales','Para no contar dos veces el mismo valor','Porque no tienen precio','Porque se exportan'],c:1,x:'El trigo ya está incluido en el valor del pan. Sumarlo aparte duplicaría su valor.'},
 {q:'El PIB nominal crece 7 % y la inflación es 5 %. ¿Cuánto creció aproximadamente el PIB real?',o:['12 %','7 %','2 %','Nada'],c:2,x:'El crecimiento real es cercano a nominal menos inflación: 7 − 5 = 2 %.'},
 {q:'¿Quién no cuenta como desempleado en la medición oficial?',o:['Quien buscó trabajo activamente este mes','Quien está disponible y sin empleo y envió solicitudes','Quien dejó de buscar trabajo hace meses','Quien perdió su empleo y busca otro'],c:2,x:'Quien no buscó activamente queda fuera de la fuerza laboral, por eso el desempleo oficial no cuenta a todas las personas sin trabajo.'}
 ]},

/* ===================== NIVEL 2 ===================== */
{id:'bancos',lv:1,t:'Bancos centrales y política fiscal',r:'Quién mueve las tasas, cómo lo hace y qué hace el gobierno.',
 obj:['Describir los objetivos de un banco central','Explicar cómo la tasa de política llega a tu bolsillo','Diferenciar política monetaria y fiscal'],
 cards:[
 {t:'Qué hace un banco central',p:'Un banco central es la institución encargada de la política monetaria de un país o región. En EE. UU., la Reserva Federal tiene por ley metas de máximo empleo y precios estables. Otros bancos centrales tienen metas parecidas, a veces con diferencias en el detalle.',i:'Su trabajo es dar estabilidad: precios predecibles y una economía que no se enfríe ni se recaliente.',s:['fedmp']},
 {t:'La tasa de política y su cadena',p:'La herramienta principal de la Reserva Federal es la tasa de fondos federales, lo que los bancos se cobran por préstamos de un día. Al moverla, cambian los costos de crédito de hogares y empresas y las condiciones financieras en general.',e:['El banco central sube su tasa.','Los bancos suben las tasas de los créditos.','Hogares y empresas piden menos prestado y gastan menos.','Con menos demanda, la presión sobre los precios baja, aunque el empleo puede resentirse.'],i:'Subir tasas enfría la economía y la inflación. Bajarlas la estimula.',q:['Si el banco central baja la tasa, ¿qué esperas que pase con el crédito?','Que se abarate y aumente, impulsando consumo e inversión.'],s:['fedfaq','fedmp']},
 {t:'Política expansiva y restrictiva',p:'Cuando la economía se debilita y la inflación está por debajo de la meta, el banco central puede bajar tasas (política expansiva). Cuando la inflación supera la meta por un tiempo, puede subirlas (política restrictiva). Los efectos no son inmediatos: pueden tardar bastante en notarse.',i:'La política monetaria funciona con rezago, por eso se decide mirando hacia adelante.',n:'En la crisis de 2008 la Fed llevó su tasa casi a cero y recurrió a otras medidas extraordinarias.',s:['stl_exp','fedfaq']},
 {t:'Política fiscal: gasto e impuestos',p:'La política fiscal la maneja el gobierno con su presupuesto: cuánto gasta y cuánto cobra en impuestos. El gasto público es uno de los bloques del PIB. En una recesión, un gobierno puede gastar más o cobrar menos impuestos para sostener la demanda; con mucha inflación, puede hacer lo contrario. Si gasta más de lo que recauda, tiene déficit y se financia con deuda.',e:['Política monetaria: la maneja el banco central, con tasas.','Política fiscal: la maneja el gobierno, con gasto e impuestos.','Ambas buscan estabilidad, pero con herramientas distintas.'],i:'Banco central = tasas y dinero. Gobierno = gasto e impuestos.',s:['bea_gl','fedmp']}
 ],
 quiz:[
 {q:'El banco central sube su tasa de interés. ¿Qué efecto esperas sobre el crédito y la inflación?',o:['Crédito más barato e inflación al alza','Crédito más caro y presión a la baja sobre la inflación','Ningún efecto','Solo cambian los impuestos'],c:1,x:'Tasas más altas encarecen el crédito, reducen la demanda y ayudan a frenar los precios.'},
 {q:'¿Quién maneja la política fiscal?',o:['El banco central','El gobierno, con gasto e impuestos','Los bancos comerciales','La bolsa'],c:1,x:'La política fiscal es del gobierno. La monetaria es del banco central.'},
 {q:'¿Por qué los efectos de la política monetaria no se notan de inmediato?',o:['Porque no funciona','Porque actúa con rezagos en crédito, gasto y precios','Porque solo funciona los viernes','Porque se anuncia con un año de aviso'],c:1,x:'Las decisiones tardan en trasladarse a créditos, decisiones de gasto y finalmente a los precios.'}
 ]},

{id:'ciclos',lv:1,t:'Ciclos económicos y pánicos',r:'Por qué las economías suben y bajan, y qué es un pánico financiero.',
 obj:['Nombrar las fases del ciclo','Explicar por qué la bolsa mira hacia adelante','Describir qué es un pánico bancario'],
 cards:[
 {t:'Las fases del ciclo',p:'Las economías no crecen en línea recta. Pasan por periodos de expansión, llegan a un pico, entran en contracción (recesión) y tocan un fondo antes de recuperarse.',e:['Expansión: la producción y el empleo crecen.','Pico: el punto más alto antes de caer.','Recesión: caída de la actividad durante un tiempo.','Valle: el punto más bajo, desde donde empieza la recuperación.'],i:'Los ciclos son normales. Lo importante es su duración y su profundidad.',s:['fd']},
 {t:'Cómo se ven desde afuera',p:'En una recesión suele caer la producción, subir el desempleo y bajar la confianza. En una expansión sucede lo contrario. Los gobiernos y bancos centrales usan sus políticas para suavizar los golpes, no para eliminar los ciclos.',q:['¿Qué indicador mirarías para saber si se está contrayendo la economía?','El PIB real y el desempleo, entre otros.'],i:'Un solo indicador no basta: se miran varios a la vez.',s:['bea','bls']},
 {t:'La bolsa mira hacia adelante',p:'El precio de una acción refleja lo que los inversores esperan sobre el futuro de la empresa, no solo su presente. Por eso la bolsa puede caer antes de que empiece una recesión o subir antes de que termine.',e:['Una empresa gana mucho hoy, pero se espera que sus ganancias caigan el próximo año.','Los inversores venden hoy.','El precio baja aunque la empresa esté ganando dinero ahora.'],i:'Los mercados cotizan expectativas. Las noticias importan por lo que cambian en esas expectativas.',s:['finra_st','dfi']},
 {t:'Pánicos y corridas bancarias',p:'Un pánico financiero ocurre cuando muchas personas pierden la confianza al mismo tiempo y corren a retirar su dinero o a vender activos. Eso puede provocar corridas bancarias, quiebras de bancos, caídas de bolsa y contracciones de la economía.',e:['Circula el rumor de que un banco está en problemas.','Muchos clientes retiran su dinero a la vez.','El banco no tiene tanto efectivo disponible porque prestó buena parte.','Aunque el rumor sea falso, la corrida puede hacerlo quebrar.'],i:'La confianza sostiene al sistema financiero. Los seguros de depósitos y los bancos centrales existen para frenar estas espirales.',s:['bern','fdic']}
 ],
 quiz:[
 {q:'¿Cuál es la secuencia correcta de un ciclo económico?',o:['Pico, expansión, valle, recesión','Expansión, pico, recesión, valle','Valle, recesión, pico, expansión','Recesión, expansión, valle, pico'],c:1,x:'La economía crece (expansión), llega a un pico, se contrae (recesión) y toca un valle antes de recuperarse.'},
 {q:'¿Por qué una acción puede caer aunque la empresa tenga buenas ganancias hoy?',o:['Porque el precio refleja expectativas futuras','Porque la bolsa es aleatoria sin explicación','Porque las ganancias no importan','Porque el gobierno lo ordena'],c:0,x:'El precio descuenta lo que se espera a futuro. Si empeoran las expectativas, puede caer pese a buenos resultados actuales.'},
 {q:'¿Qué es una corrida bancaria?',o:['Una competencia entre bancos','Muchos clientes retirando su dinero al mismo tiempo por falta de confianza','Un aumento de tasas','Una fusión de bancos'],c:1,x:'Es un retiro masivo y simultáneo de depósitos. Los bancos no guardan todo el dinero en efectivo y pueden no resistirlo.'}
 ]},

{id:'historia',lv:1,t:'Historia económica en una línea del tiempo',r:'De las primeras monedas a la crisis de 2008, con la lección de cada hito.',
 obj:['Ubicar los grandes hitos en orden','Explicar la lección de cada uno','Conectar el pasado con las reglas actuales'],
 cards:[
 {t:'Explora la línea del tiempo',p:'Toca cada hito para ver qué pasó, por qué importa y de dónde sale la información.',tl:true,s:['lydia','euronext','imf_trade','fh_gd','fdic','fh_bw','fh_nixon','fh_gr']},
 {t:'Del oro al dinero fiat',p:'En 1944, delegados de 44 naciones acordaron en Bretton Woods un sistema de tipos de cambio fijos frente al dólar, y el dólar era convertible en oro para gobiernos y bancos centrales a 35 dólares la onza. En 1971 Estados Unidos suspendió esa convertibilidad y el sistema se acabó.',e:['Antes de 1971: moneda ligada al dólar, y dólar ligado al oro.','1971: se rompe el vínculo con el oro.','Hoy: las monedas valen por la confianza en el país y su banco central, y sus tipos de cambio flotan o se manejan según cada país.'],i:'El dinero fiat vale por confianza y reglas, no por estar respaldado por un metal.',s:['fh_bw','fh_nixon','wiki_bw']},
 {t:'Patrón repetido: auge, deuda, pánico',p:'Las grandes crisis comparten rasgos: un auge con crédito abundante, activos que suben mucho, deuda excesiva, un golpe de desconfianza y un contagio que pasa de un sector al resto. Lo que cambia es el detalle de cada época.',q:['¿Qué rasgos de 1929 y 2008 se parecen?','Crédito abundante y especulación antes, pérdida de confianza y contagio después.'],i:'Reconocer el patrón no predice la fecha, pero ayuda a desconfiar de los auges con deuda fácil.',s:['fh_crash','fh_gr']},
 {t:'Lo que se aprendió',p:'Tras 1929 se crearon protecciones como el seguro de depósitos. Tras 2008 se reformó la regulación financiera. Las lecciones suelen ser: contener los pánicos rápido, cuidar la liquidez de los bancos y no dejar que el miedo se contagie.',i:'Cada crisis deja reglas nuevas. También deja nuevos riesgos que nadie estaba vigilando.',s:['fdic','fh_gr']}
 ],
 quiz:[
 {q:'¿Qué ocurrió en 1971 con el dólar?',o:['Se creó el FMI','Se suspendió su convertibilidad en oro','Se fijó su valor al euro','Se emitió por primera vez'],c:1,x:'El presidente Nixon suspendió la conversión del dólar a oro para los bancos centrales extranjeros y terminó el sistema de Bretton Woods.'},
 {q:'¿Qué se creó en 1933 para recuperar la confianza en los bancos de EE. UU.?',o:['La Reserva Federal','El seguro de depósitos (FDIC)','La bolsa de Nueva York','El FMI'],c:1,x:'La FDIC protege a los depositantes y reduce el incentivo a correr al banco.'},
 {q:'¿Cuál de estos hitos corresponde al nacimiento de la bolsa moderna?',o:['Primeras monedas de Lidia','La VOC emite acciones en 1602','Bretton Woods en 1944','La crisis de 2008'],c:1,x:'La VOC emitió acciones transferibles y su negociación en Ámsterdam dio origen a la primera bolsa moderna.'}
 ]},

{id:'acciones',lv:1,t:'Acciones y bolsa de valores',r:'Qué compras cuando compras una acción y cómo funciona el mercado.',
 obj:['Definir acción, dividendo y ganancia de capital','Explicar qué hace una bolsa','Entender qué mueve el precio de una acción'],
 cards:[
 {t:'Qué es una acción',p:'Una acción es una parte de la propiedad de una empresa. Si una pizzería se divide en 100 acciones y compras una, eres dueño del uno por ciento. Los dueños de acciones comunes pueden votar en las juntas y recibir dividendos si la empresa los reparte.',e:['La empresa necesita dinero para crecer.','Emite acciones y los inversores las compran.','La empresa recibe el dinero. Los inversores se vuelven dueños de una parte.'],i:'Comprar una acción es comprar un pedacito de empresa, no prestarle dinero.',q:['¿En qué se diferencia ser dueño de una empresa de ser su acreedor?','El dueño comparte ganancias y riesgos; el acreedor solo cobra lo pactado.'],s:['nyag','inv_st']},
 {t:'Cómo ganas con acciones',p:'Hay dos formas principales: dividendos, que son pagos que la empresa reparte entre sus accionistas, y ganancias de capital, que ocurren cuando vendes por más de lo que pagaste. No todas las empresas pagan dividendos.',e:['Compras 10 acciones a 50 dólares: inviertes 500.','La empresa paga 1 dólar por acción: recibes 10.','El precio sube a 58 y vendes: ganas 80 por precio.','Retorno total: (80 + 10) ÷ 500 = 18 %.'],i:'Retorno total = ganancia por precio + dividendos.',s:['finra_st','inv_st']},
 {t:'La bolsa: dónde se encuentran compradores y vendedores',p:'Cuando una empresa vende acciones por primera vez al público hace una oferta pública inicial (IPO). Después, esas acciones se compran y se venden entre inversores en la bolsa. Normalmente no le compras a la empresa, sino a otro inversor, a través de un corredor.',e:['Tú quieres comprar y otro quiere vender.','Cada uno usa un corredor (broker).','La bolsa los pone en contacto y fija el precio de la operación.'],i:'La bolsa es un mercado organizado donde se negocian participaciones de empresas.',n:'La Compañía de las Indias Orientales (VOC) hizo la primera oferta pública y su negociación en Ámsterdam, desde 1602, se considera el origen de la bolsa moderna.',s:['nerd','euronext','petram']},
 {t:'Qué mueve el precio',p:'En el corto plazo, el precio de una acción lo mueven las expectativas de ganancias futuras y el equilibrio entre quienes quieren comprar y quienes quieren vender. Mucha demanda por una acción empuja su precio hacia arriba.',e:['Una empresa reporta ganancias menores a las esperadas.','Muchos inversores deciden vender.','Hay más vendedores que compradores y el precio baja, aunque la empresa siga siendo rentable.'],i:'El precio refleja expectativas, no solo resultados pasados.',q:['¿Qué pasa con el precio si muchos inversores quieren comprar y pocos vender?','Sube: más demanda que oferta.'],s:['dfi','finra_st']},
 {t:'Tipos de acciones',p:'Las acciones de crecimiento reinvierten casi todo y pagan pocos dividendos. Las de ingreso reparten dividendos con regularidad. Las blue chip son empresas grandes, conocidas y con historial sólido. Las acciones preferentes pagan dividendos antes que las comunes y suelen no votar.',i:'Cada tipo responde a un objetivo distinto: crecimiento, ingreso o estabilidad.',s:['inv_st','dfi']}
 ],
 quiz:[
 {q:'¿Qué significa tener una acción de una empresa?',o:['Haberle prestado dinero','Ser dueño de una parte de la empresa','Ser su cliente','Tener derecho a un sueldo'],c:1,x:'Una acción es una participación en la propiedad, no un préstamo.'},
 {q:'Compras 20 acciones a 10 dólares, recibes 1 dólar por acción en dividendos y luego vendes a 12. ¿Cuál es el retorno total?',o:['10 %','20 %','30 %','12 %'],c:2,x:'Invertiste 200. Ganaste 40 por precio y 20 por dividendos: 60 ÷ 200 = 30 %.'},
 {q:'Cuando compras una acción ya cotizada, ¿normalmente a quién se la compras?',o:['A la empresa directamente','A otro inversor, mediante un corredor','Al gobierno','Al banco central'],c:1,x:'Tras la IPO, el mercado secundario conecta a inversores entre sí.'}
 ]},

{id:'bonos',lv:1,t:'Bonos y tasas de interés',r:'Prestarle a un gobierno o a una empresa, y por qué sus precios se mueven al revés que las tasas.',
 obj:['Explicar qué es un bono y qué paga','Entender el balancín tasas-precios','Identificar los riesgos de un bono'],
 cards:[
 {t:'Un bono es un préstamo que haces tú',p:'Cuando compras un bono le prestas dinero al emisor, que puede ser un gobierno o una empresa. A cambio, te paga intereses periódicos llamados cupones y te devuelve el valor nominal en la fecha de vencimiento.',e:['Compras un bono de 1.000 dólares con cupón de 4 % a 5 años.','Cada año recibes 40 dólares.','Al final recuperas los 1.000.'],i:'Bono = préstamo con pagos conocidos. Acción = propiedad con resultados inciertos.',s:['stl_bond']},
 {t:'El balancín: si las tasas suben, el precio del bono baja',p:'Los bonos existentes pagan cupones fijos. Si salen bonos nuevos que pagan más, nadie querrá pagar el precio completo por uno que paga menos, así que el bono viejo baja de precio hasta que su rendimiento se iguale al del mercado. Con tasas a la baja ocurre lo contrario.',e:['Tienes un bono con cupón de 3 %.','Las tasas del mercado suben a 4 %.','Un comprador no pagará 1.000 por un bono de 3 % si puede comprar uno nuevo de 4 %.','El precio de tu bono baja hasta que su rendimiento sea competitivo.'],i:'Tasas y precios de bonos se mueven en sentidos opuestos, como un balancín.',n:'Ejemplo de la SEC: un bono comprado a 1.000 con rendimiento de 3 % valdría unos 1.082 un año después si el rendimiento de mercado bajara a 2 %.',q:['Si el banco central baja tasas, ¿qué espera que pase con el precio de tus bonos existentes?','Que suba, porque pagan más que los nuevos.'],s:['sec_ir','stl_bond']},
 {t:'Simulador de bonos',p:'Cambia el cupón, el plazo y la tasa de mercado. Observa cuánto se mueve el precio cuando las tasas suben o bajan un punto.',sim:'bonos',s:['sec_ir']},
 {t:'Los riesgos de un bono',p:'Un bono no es libre de riesgo. Riesgo de tasa de interés: el precio baja si suben las tasas. Riesgo de inflación: los cupones fijos compran menos si suben los precios. Riesgo de crédito: el emisor puede no pagar. Mientras más largo es el bono, más sensible es su precio a las tasas.',i:'Un bono mantenido hasta el vencimiento paga lo prometido, pero si lo vendes antes, el precio puede ser menor.',s:['sec_ir','stl_bond']}
 ],
 quiz:[
 {q:'Las tasas de mercado suben. ¿Qué pasa con el precio de un bono existente de cupón fijo?',o:['Sube','Baja','No cambia','Se duplica'],c:1,x:'El bono viejo paga menos que los nuevos y su precio baja hasta igualar el rendimiento del mercado.'},
 {q:'¿Qué recibe quien compra un bono?',o:['Una parte de la propiedad','Cupones periódicos y el valor nominal al vencimiento','Dividendos variables','Derecho a voto'],c:1,x:'Un bono es un préstamo con pagos pactados.'},
 {q:'¿Qué tipo de bono es normalmente más sensible a cambios de tasas?',o:['Uno de vencimiento muy corto','Uno de vencimiento muy largo','Todos igual','Ninguno'],c:1,x:'Mientras más largo el plazo, más tiempo recibes un cupón que puede quedar desactualizado, y más se mueve el precio.'}
 ]},

{id:'fondos',lv:1,t:'Fondos y ETF: comprar la canasta',r:'Cómo invertir en cientos de empresas a la vez y por qué los costos importan.',
 obj:['Explicar qué es un fondo y un ETF','Entender la razón de gastos','Ver el efecto de los costos con el simulador'],
 cards:[
 {t:'Fondos mutuos y ETF',p:'Un fondo junta el dinero de muchos inversores para comprar una canasta de activos, como acciones o bonos, que gestiona un administrador. Un ETF (fondo cotizado) es un tipo de fondo que se compra y se vende en la bolsa durante el día, como una acción.',e:['Mil inversores aportan al mismo fondo.','El fondo compra cientos de acciones.','Cada inversor tiene una parte proporcional de toda la canasta.'],i:'Con un solo fondo accedes a muchas empresas a la vez, lo que da diversificación.',s:['etf']},
 {t:'Costos: la razón de gastos',p:'Todo fondo cobra por existir. La razón de gastos es el porcentaje anual de los activos que se destina a cubrir los costos de operación. Ese costo sale de tu rentabilidad cada año, aunque no veas una factura.',e:['Fondo A cobra 0,1 % anual. Fondo B cobra 1,5 % anual.','Si ambos rinden 7 % antes de costos, A te deja 6,9 % y B te deja 5,5 %.','Parece poco, pero se acumula año tras año.'],i:'Un fondo más caro debe rendir más para darte lo mismo.',q:['¿Por qué importa una diferencia de 1 % en costos?','Porque se aplica cada año sobre todo tu saldo y el efecto se compone con el tiempo.'],s:['fees','nasaa']},
 {t:'Simulador: el costo de 1 %',p:'Compara dos escenarios con el mismo aporte y rendimiento: primero con costo de 0,2 % y luego con 1,5 %. Fíjate en la diferencia en el valor final a 30 años.',sim:'interes',sv:{P:5000,m:300,r:7,c:1.5,i:3,y:30},s:['fees']},
 {t:'Indexado y gestión activa',p:'Un fondo indexado copia un índice, como una lista de las mayores empresas, y compra lo mismo que el índice. Un fondo de gestión activa intenta superar al mercado eligiendo activos. La gestión activa suele costar más. Los ETF suelen tener razones de gastos menores porque muchos replican índices.',i:'Antes de pagar más por un fondo, pregúntate qué te da a cambio.',s:['nasaa','fees']}
 ],
 quiz:[
 {q:'¿Qué diferencia práctica tiene un ETF frente a un fondo mutuo tradicional?',o:['Se negocia en bolsa durante el día','No tiene costos','Solo invierte en bonos','Garantiza ganancias'],c:0,x:'Un ETF cotiza en bolsa y se puede comprar o vender durante el horario del mercado.'},
 {q:'¿Qué mide la razón de gastos?',o:['La rentabilidad esperada','El porcentaje anual de activos que se usa para cubrir los costos del fondo','Los dividendos','El riesgo'],c:1,x:'Es un cobro anual en porcentaje que reduce lo que ganas.'},
 {q:'Un fondo rinde 7 % antes de costos y cobra 1,5 %. ¿Cuánto te queda aproximadamente?',o:['8,5 %','7 %','5,5 %','1,5 %'],c:2,x:'7 − 1,5 = 5,5 % aproximadamente, año tras año.'}
 ]},

{id:'divisas',lv:1,t:'Comercio, divisas y tipo de cambio',r:'Por qué los países comercian, qué es un tipo de cambio y cómo afecta tu bolsillo.',
 obj:['Explicar la ventaja comparativa','Distinguir tipo de cambio fijo y flotante','Anticipar el efecto de una moneda más fuerte o más débil'],
 cards:[
 {t:'Ventaja comparativa',p:'El economista David Ricardo mostró que los países se benefician del comercio aunque uno sea mejor en todo. Lo que importa no es quién produce más, sino a quién le cuesta menos renunciar a otra cosa para producirlo.',e:['En una hora, Ana hace 6 empanadas o 3 jugos. Beto hace 2 empanadas o 2 jugos.','Ana es mejor en ambos, pero para hacer 1 jugo renuncia a 2 empanadas. Beto renuncia a 1.','Beto tiene ventaja comparativa en jugos, Ana en empanadas.','Si Beto hace jugos y los cambia a 1,5 empanadas por jugo, ambos terminan con más que solos.'],i:'Especializarse en lo que se hace con menor costo de oportunidad aumenta lo que todos pueden consumir.',s:['wto','imf_trade']},
 {t:'Qué es un tipo de cambio',p:'Es el precio de una moneda en términos de otra. Puede ser flotante, cuando lo fijan la oferta y la demanda en el mercado de divisas, o fijo, cuando el gobierno o el banco central lo mantiene en un nivel determinado. Muchos países usan algo intermedio.',e:['Flotante: el valor sube y baja con el mercado.','Fijo o anclado: el banco central compra o vende divisas para mantenerlo.'],i:'Una moneda se aprecia cuando sube su valor frente a otra y se deprecia cuando baja.',q:['¿Qué pasa con el precio de tus importaciones si tu moneda se debilita?','Se encarecen: necesitas más moneda local para pagar lo mismo.'],s:['britfx','wise']},
 {t:'Simulador de divisas',p:'Mueve el valor del dólar frente al euro y mira cómo cambia el precio de productos importados y exportados.',sim:'divisas',s:['britfx']},
 {t:'Aranceles y comercio abierto',p:'Un arancel es un impuesto a los productos importados. Encarece lo importado y protege a algunos productores locales, pero los compradores pagan más. En general, quien compra gana más de lo que pierde el vendedor local desplazado, aunque las pérdidas se concentran en pocas personas y por eso generan resistencia. Tras la Segunda Guerra Mundial, los aranceles sobre productos industriales cayeron mucho y el comercio creció más rápido que la producción.',i:'El comercio crea ganancias para muchos y pérdidas visibles para pocos. Una buena política mira ambos lados.',s:['wto','imf_trade']}
 ],
 quiz:[
 {q:'Tu moneda se deprecia frente al dólar. ¿Qué pasa normalmente con lo importado desde EE. UU.?',o:['Se abarata','Se encarece','No cambia','Desaparece del mercado'],c:1,x:'Necesitas más moneda local para conseguir cada dólar, así que lo importado cuesta más.'},
 {q:'¿Qué dice la ventaja comparativa?',o:['Un país debe producir todo','Conviene especializarse en lo que cuesta menos renunciar, aunque otro sea mejor en todo','Solo comercian los países ricos','Importar siempre es malo'],c:1,x:'Lo que cuenta es el costo de oportunidad, no la capacidad absoluta.'},
 {q:'En un tipo de cambio flotante, ¿qué determina su valor?',o:['Solo el gobierno','Oferta y demanda en el mercado de divisas','El precio del oro','El PIB per cápita'],c:1,x:'En un sistema flotante, el mercado fija el valor de la moneda.'}
 ]},

/* ===================== NIVEL 3 ===================== */
{id:'valoracion',lv:2,t:'Valoración: ¿cuánto vale una acción?',r:'Precio no es lo mismo que valor. Herramientas básicas y sus límites.',
 obj:['Calcular e interpretar la razón precio-utilidad','Usar el modelo de dividendos descontados','Entender por qué todo modelo depende de supuestos'],
 cards:[
 {t:'Precio no es valor',p:'El precio es lo que el mercado paga hoy. El valor es lo que, según tus cálculos, justifican los flujos de dinero que la empresa generará. Cuando el precio está por debajo del valor, la acción puede ser una oportunidad. Cuando está por encima, puede ser cara. Pero el valor es una estimación tuya y puede estar equivocada.',i:'Valorar es comparar lo que pagas con lo que crees que recibirás.',s:['schwab_pe']},
 {t:'La razón precio-utilidad (P/U)',p:'Divide el precio de la acción entre la utilidad por acción del último año. Dice cuánto pagas por cada dólar de utilidades.',e:['Precio: 20 dólares. Utilidad por acción: 2.','P/U = 20 ÷ 2 = 10.','Pagas 10 veces las utilidades de un año.'],i:'Un P/U alto puede reflejar optimismo y crecimiento esperado, o simplemente sobreprecio. Uno bajo puede ser una ganga o un negocio con problemas.',s:['fid_pe','nas_pe','schwab_pe']},
 {t:'Simulador: P/U',p:'Mueve el precio y la utilidad por acción para ver el P/U y la rentabilidad por utilidades.',sim:'pe',q:['¿Por qué no se puede decir que una acción es barata solo porque su P/U es bajo?','Porque puede reflejar que se espera que sus utilidades caigan o que el negocio tiene riesgos.'],s:['nas_pe','schwab_pe']},
 {t:'Dividendos descontados (modelo de Gordon)',p:'Si una empresa paga un dividendo que crece a una tasa constante g para siempre, y tú exiges una rentabilidad r, su valor teórico es el dividendo del próximo año dividido entre (r − g). Es un modelo simple que ayuda a ver cómo se relacionan dividendos, crecimiento y rentabilidad exigida.',sim:'ddm',i:'Cuando r y g se acercan, el valor se dispara. Pequeños cambios en los supuestos producen grandes cambios en el resultado.',s:['gordon']}
 ],
 quiz:[
 {q:'Una acción cuesta 45 dólares y su utilidad por acción es 3. ¿Cuál es su P/U?',o:['3','15','135','0,07'],c:1,x:'45 ÷ 3 = 15.'},
 {q:'En el modelo de Gordon, ¿qué pasa si r se acerca a g?',o:['El valor se reduce a cero','El valor teórico se dispara','No cambia','El modelo da el precio de mercado'],c:1,x:'El denominador (r − g) se vuelve muy pequeño y el valor crece mucho, por eso es tan sensible a los supuestos.'},
 {q:'¿Cuál es una limitación de usar solo el P/U?',o:['No usa precios','Ignora el crecimiento esperado y los riesgos del negocio','Solo sirve para bonos','Es demasiado difícil de calcular'],c:1,x:'Un P/U aislado no dice si el precio se justifica por crecimiento futuro o si la acción está cara.'}
 ]},

{id:'riesgo',lv:2,t:'Riesgo, retorno y diversificación',r:'Por qué no poner todos los huevos en la misma canasta, y hasta dónde llega eso.',
 obj:['Relacionar riesgo y retorno esperado','Distinguir clases de activos','Medir el efecto de diversificar y definir rebalanceo'],
 cards:[
 {t:'Riesgo y retorno van juntos',p:'En general, para aceptar más riesgo los inversores exigen un posible retorno mayor. Toda inversión implica algún riesgo, y una que promete alto retorno sin riesgo debería generar desconfianza.',i:'No hay retorno alto garantizado. Quien lo ofrece suele estar vendiendo algo.',q:['¿Por qué un ahorro seguro suele rendir menos que una acción?','Porque asumes menos riesgo, y el mercado paga más por el riesgo que se asume.'],s:['ia','ia_guide']},
 {t:'Tres clases de activos',p:'Las más comunes son acciones, bonos y efectivo. Las acciones históricamente han tenido el mayor riesgo y el mayor retorno. Los bonos suelen ser menos volátiles. El efectivo es el más estable, pero su principal riesgo es que la inflación erosione su poder de compra.',e:['Acciones: más crecimiento potencial, más altibajos.','Bonos: ingresos más estables, riesgo de tasas y crédito.','Efectivo: estabilidad, pero riesgo de inflación.'],i:'Cada clase cumple un papel distinto en una cartera.',s:['ia_guide']},
 {t:'Diversificar: efectos y límites',p:'Repartir tu dinero entre muchas inversiones reduce el riesgo propio de cada empresa, porque no todas fallan al mismo tiempo. Pero no elimina el riesgo de mercado, el que afecta a casi todas a la vez. En el simulador, sube el número de acciones y mira cómo la volatilidad baja rápido y luego se acerca a un piso.',sim:'riesgo',i:'Diversificar elimina el riesgo de empresas individuales, no el riesgo de todo el mercado.',s:['ia','ia_guide']},
 {t:'Horizonte, tolerancia y rebalanceo',p:'La mezcla adecuada depende de tu horizonte (cuándo necesitarás el dinero) y de tu tolerancia al riesgo (cuánta caída aguantas sin entrar en pánico). Con el tiempo, lo que sube pesa más y la mezcla se desvía. Rebalancear es volver a la mezcla original.',e:['Defines 70 % acciones y 30 % bonos.','Las acciones suben y pasan a ser 80 % de tu cartera.','Rebalanceas: vendes algo de acciones y compras bonos para volver a 70/30.'],i:'Rebalancear obliga a hacer lo contrario de lo que el entusiasmo pide: vender un poco de lo que subió.',s:['ia','ia_guide']}
 ],
 quiz:[
 {q:'¿Qué riesgo NO se elimina diversificando entre muchas acciones?',o:['El de una empresa individual','El de mercado, que afecta a casi todas','El de un solo sector concentrado','El de elegir mal una acción'],c:1,x:'El riesgo de mercado es común a casi todas las acciones, así que no se diversifica entre ellas.'},
 {q:'Tu cartera objetivo es 60/40 y las acciones suben hasta 70 %. ¿Qué es rebalancear?',o:['Comprar más acciones','Vender algo de acciones y comprar bonos para volver a 60/40','No hacer nada','Vender todo'],c:1,x:'Rebalancear devuelve la cartera a la proporción que definiste según tu riesgo y horizonte.'},
 {q:'¿Cuál es el principal riesgo de mantener todo el dinero en efectivo por décadas?',o:['Que desaparezca','Que la inflación erosione su poder de compra','Que suba demasiado','Que sea ilegal'],c:1,x:'El efectivo es estable en cifras, pero pierde poder adquisitivo con la inflación.'}
 ]},

{id:'psicologia',lv:2,t:'Psicología del inversor',r:'Los sesgos que más cuestan dinero y cómo protegerte de ti mismo.',
 obj:['Describir la aversión a la pérdida','Reconocer el exceso de confianza y el efecto manada','Armar reglas que reduzcan decisiones emocionales'],
 cards:[
 {t:'Aversión a la pérdida',p:'Los psicólogos Daniel Kahneman y Amos Tversky mostraron que evaluamos ganancias y pérdidas frente a un punto de referencia, y que una pérdida duele más que lo que alegra una ganancia del mismo tamaño. Eso lleva a conservar demasiado tiempo lo que pierde, con la esperanza de recuperarse, y a vender muy pronto lo que gana.',e:['Compraste una acción a 100 y hoy vale 70.','Vender confirma la pérdida, así que esperas.','Pero la pregunta útil es otra: ¿la comprarías hoy a 70?'],i:'Tu precio de compra no le importa al mercado.',q:['¿Por qué cuesta tanto vender una acción que está en pérdida?','Porque vender hace real la pérdida y duele más que una ganancia equivalente.'],s:['jove']},
 {t:'Exceso de confianza',p:'Muchos inversores creen saber más de lo que saben. Los estudios de finanzas conductuales asocian el exceso de confianza con operar demasiado y asumir riesgos mal calculados. Cada operación cuesta comisiones y puede acertar o fallar por azar.',e:['Tuviste tres aciertos seguidos.','Concluyes que eres bueno eligiendo y aumentas el riesgo.','Pero la suerte también produce rachas.'],i:'Una racha corta no demuestra habilidad.',s:['nepjol']},

/* ===== Motor de la app ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const APP=$('#app');
const KEY=uid=>'economia:'+(uid||'anon');
const INT=[0,1,3,7,14,30];
const START=10000,FEE=0.001;
const blank=()=>({done:{},seen:{},best:{},lb:{},big:0,T:null,chk:{},ts:0});
let S=blank();
const ctx={uid:null,sb:null,nubeOk:false};
let tmr=null;
const loadLocal=uid=>{try{const raw=localStorage.getItem(KEY(uid));if(raw)return Object.assign(blank(),JSON.parse(raw));}catch(e){}return blank();};
const nube=()=>{
  if(!ctx.sb||!ctx.nubeOk||!ctx.uid)return;
  const uid=ctx.uid,snap=JSON.stringify(S);
  ctx.sb.from('economia_docs').upsert({user_id:uid,json:snap,updated_at:new Date().toISOString()}).then(()=>{});
};
const save=()=>{S.ts=Date.now();try{localStorage.setItem(KEY(ctx.uid),JSON.stringify(S));}catch(e){}clearTimeout(tmr);tmr=setTimeout(nube,1500);};
const today=()=>Math.floor(Date.now()/864e5);

const MOD={};MODS.forEach((m,i)=>{m.i=i;MOD[m.id]=m;});
let QZ=null,tlSel=-1,armed=false,lastKey='';

/* ---------- utilidades de vista ---------- */
const srcLine=a=>!a||!a.length?'':'<div class="srcs"><b>Fuentes:</b> '+a.map(k=>SRC[k]?`<a href="${SRC[k][1]}" target="_blank" rel="noopener noreferrer">${esc(SRC[k][0])}</a>`:'').join('')+'</div>';
const lvClass=m=>'t'+(m.lv+1);
const stateOf=m=>S.done[m.id]?'done':'todo';
const statusText=m=>S.done[m.id]?'Completado':S.seen[m.id]?'En curso':'Sin empezar';
const dueIds=()=>Object.keys(S.lb).filter(id=>S.lb[id].d<=today());
const nextMod=()=>MODS.find(m=>!S.done[m.id])||null;
function itemById(id){const[a,b]=id.split('.');const m=MOD[a];if(!m||!m.quiz[+b])return null;return Object.assign({},m.quiz[+b],{id,mod:a});}

/* ---------- vistas ---------- */
function vHome(){
  const done=MODS.filter(m=>S.done[m.id]).length,tot=MODS.length,nx=nextMod();
  let h=`<section class="hero"><p class="kick">Curso gratuito de economía y finanzas</p><h1>EconomIA</h1><p class="lead">Empieza sin saber nada y llega a entender inflación, bolsa, bonos, divisas y crisis. Un tema a la vez, con ejemplos paso a paso, práctica y fuentes verificables.</p>
  <div class="card"><div class="row sp"><b>Tu avance</b><span>${done} de ${tot} temas</span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${done}" aria-label="Temas completados"><i style="width:${done/tot*100}%"></i></div>
  <div class="row" style="margin-top:14px">${nx?`<a class="btn ok" href="#t-${nx.id}-${S.seen[nx.id]?Math.min(S.seen[nx.id],nx.cards.length):0}">${done?'Continuar':'Empezar'}: ${esc(nx.t)}</a>`:'<b>Completaste toda la ruta. Sigue con el repaso y el laboratorio de bolsa.</b>'}<a class="btn sec" href="#ayuda">Cómo funciona</a></div></div></section>`;
  LV.forEach((L,li)=>{
    const ms=MODS.filter(m=>m.lv===li);
    h+=`<section class="lvl t${li+1}" aria-labelledby="lv${li}"><h2 id="lv${li}"><span class="tag">${L.n}</span>${L.t}</h2><p class="muted">${L.d}</p><div class="line">`;
    ms.forEach(m=>{h+=`<a class="st" data-s="${stateOf(m)}" href="#t-${m.id}-0"><b>${esc(m.t)}</b><span class="m">${esc(m.r)}</span><span class="m">${m.cards.length} tarjetas y ${m.quiz.length} preguntas · <em>${statusText(m)}</em></span></a>`;});
    h+='</div></section>';
  });
  h+=`<section class="card" style="margin-top:22px"><h2>Practica lo aprendido</h2><p>El repaso espaciado te devuelve las preguntas justo antes de olvidarlas. El laboratorio de bolsa te deja practicar con dinero ficticio.</p><div class="row"><a class="btn sec" href="#repaso">Repaso${dueIds().length?' ('+dueIds().length+' pendientes)':''}</a><a class="btn sec" href="#bolsa">Laboratorio de bolsa</a><a class="btn sec" href="#glosario">Glosario</a></div></section>`;
  return h;
}

function vIntro(m){
  const q=S.best[m.id];
  return `<p class="crumbs"><a href="#inicio">Ruta</a> / ${LV[m.lv].n}</p><div class="card ${lvClass(m)}" style="border-top:6px solid var(--lc)"><p class="kick" style="color:var(--lc)">${LV[m.lv].n}: ${LV[m.lv].t}</p><h1 id="ttl" tabindex="-1">${esc(m.t)}</h1><p class="lead">${esc(m.r)}</p>
  <h3>Al terminar podrás</h3><ul>${m.obj.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>
  <p class="muted small">${m.cards.length} tarjetas y ${m.quiz.length} preguntas de práctica. Unos ${Math.round(m.cards.length*1.5+m.quiz.length*.7)} minutos.${q!==undefined?' Mejor resultado: '+q+' de '+m.quiz.length+'.':''}</p>
  <div class="row"><a class="btn ok" href="#t-${m.id}-1">Empezar tarjetas</a><a class="btn sec" href="#t-${m.id}-q">Ir directo a las preguntas</a></div></div>`;
}

function simBox(c){return `<div class="sim" data-sim="${c.sim}"${c.sv?` data-sv='${JSON.stringify(c.sv)}'`:''}></div>`;}
function tlBox(){
  let h='<div class="tl" role="group" aria-label="Hitos">'+TL.map((e,i)=>`<button type="button" data-act="tl" data-i="${i}" aria-pressed="${i===tlSel}"><b>${esc(e.y)}</b><span>${esc(e.t)}</span></button>`).join('')+'</div>';
  if(tlSel>=0){const e=TL[tlSel];h+=`<div class="tlx" role="region" aria-label="Detalle del hito"><h3>${esc(e.y)}: ${esc(e.t)}</h3><p>${esc(e.d)}</p><p><b>Lección:</b> ${esc(e.l)}</p>${srcLine(e.s)}</div>`;}
  else h+='<p class="note">Elige un hito para ver el detalle.</p>';
  return h;
}
function chkBox(c){
  return '<div class="chk">'+c.chk.map((t,i)=>`<label><input type="checkbox" data-act="chk" data-i="${i}"${S.chk[i]?' checked':''}><span>${esc(t)}</span></label>`).join('')+'</div>';
}
function cardHTML(m,c){
  let h=`<h2 id="ttl" tabindex="-1">${esc(c.t)}</h2><p class="lead">${esc(c.p)}</p>`;
  if(c.e)h+=`<div class="ex"><h3>Ejemplo paso a paso</h3><ol>${c.e.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
  if(c.sim)h+=simBox(c);
  if(c.tl)h+=tlBox();
  if(c.chk)h+=chkBox(c);
  if(c.i)h+=`<div class="key"><b>Idea clave.</b> ${esc(c.i)}</div>`;
  if(c.q)h+=`<details class="pre"><summary>Piensa antes de seguir</summary><p><b>${esc(c.q[0])}</b></p><p>Respuesta: ${esc(c.q[1])}</p></details>`;
  if(c.n)h+=`<p class="note">${esc(c.n)}</p>`;
  return h+srcLine(c.s);
}
function vCard(m,s){
  const N=m.cards.length,c=m.cards[s-1];
  if(!S.seen[m.id]||S.seen[m.id]<s){S.seen[m.id]=s;save();}
  const dots=m.cards.map((_,i)=>`<i class="${i<s?'on':''}${i===s-1?' cur':''}"></i>`).join('');
  return `<div class="${lvClass(m)}"><p class="crumbs"><a href="#inicio">Ruta</a> / <a href="#t-${m.id}-0">${esc(m.t)}</a></p>
  <div class="row sp" style="margin-bottom:8px"><b aria-live="polite">Tarjeta ${s} de ${N}</b><div class="tools"><button type="button" class="pill" data-act="tts">Escuchar</button><button type="button" class="pill" data-act="big" aria-pressed="${!!S.big}">Letra grande</button></div></div>
  <div class="bar" aria-hidden="true"><i style="width:${s/N*100}%"></i></div>
  <article class="stage" style="margin-top:12px">${cardHTML(m,c)}</article>
  <div class="dots" aria-hidden="true">${dots}</div>
  <div class="nav2"><a class="btn sec" href="#t-${m.id}-${s-1}">Anterior</a><a class="btn ok" href="#t-${m.id}-${s<N?s+1:'q'}">${s<N?'Siguiente':'Ir a las preguntas'}</a></div>
  <p class="note" style="text-align:center">Atajo: flechas izquierda y derecha del teclado.</p></div>`;
}

/* ---------- preguntas y repaso espaciado ---------- */
function startQuiz(items,mode,modId){QZ={items,mode,modId,i:0,pick:null,ok:0,wrong:[],done:false};}
function lbUpdate(id,ok){
  const t=today(),b=S.lb[id]?S.lb[id].b:0;

 {t:'El banco central sube las tasas de interés',e:{BAN:.03,NUB:-.03,BON:-.02,IDX:-.01},n:'Tasas más altas encarecen el crédito: los bonos existentes pierden precio y las empresas de crecimiento suelen sufrir. Los bancos pueden cobrar más por prestar.'},

 {t:'Resultados de empresas mejores de lo esperado',e:{PAN:.04,BAN:.03,IDX:.02},n:'El precio sube cuando los resultados superan las expectativas, no cuando son simplemente buenos.'}
];
function tInit(){const hist={};ASSETS.forEach(a=>{hist[a.k]=[a.p];});return{seed:Math.floor(Math.random()*1e6)+1,day:0,cash:START,pos:{},hist,news:[],sel:'IDX',qty:1,trades:0,fees:0,msg:''};}
function tStep(T){
  T.day++;const r=M.mul(T.seed*7919+T.day),g=()=>M.gauss(r),m=g()*.008;let ev=null;
  if(r()<.12){ev=EVENTS[Math.floor(r()*EVENTS.length)];T.news.unshift({d:T.day,t:ev.t,n:ev.n});T.news=T.news.slice(0,5);}
  ASSETS.forEach(a=>{
    const h=T.hist[a.k],last=h[h.length-1];
    let ret=a.d+a.b*m+g()*a.s*(a.k==='IDX'?.25:.8);
    if(ev&&ev.e[a.k])ret+=ev.e[a.k];
    h.push(Math.max(1,+(last*(1+ret)).toFixed(2)));
    if(h.length>120)h.shift();
  });
}
const tPrice=(T,k)=>{const h=T.hist[k];return h[h.length-1];};
const tPrev=(T,k)=>{const h=T.hist[k];return h.length>1?h[h.length-2]:h[0];};
function spark(h){
  const w=90,hh=28,mn=Math.min(...h),mx=Math.max(...h),rg=mx-mn||1;
  const pts=h.map((v,i)=>(h.length<2?0:i/(h.length-1)*w).toFixed(1)+','+(hh-2-(v-mn)/rg*(hh-4)).toFixed(1)).join(' ');
  const up=h[h.length-1]>=h[0];
  return `<svg viewBox="0 0 ${w} ${hh}" width="90" height="28" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?'#146c3a':'#b3261e'}" stroke-width="2"/></svg>`;
}
function estHTML(){
  const T=S.T,a=ASSETS.find(x=>x.k===T.sel),p=tPrice(T,a.k),q=Math.max(1,T.qty|0),pos=T.pos[a.k],own=pos?pos.q:0;
  const buy=q*p*(1+FEE),sell=q*p*(1-FEE),canBuy=buy<=T.cash+1e-9,canSell=q<=own;
  let why='';
  if(!canBuy)why+=`No te alcanza el efectivo para comprar ${q}. `;
  if(!canSell)why+=own?`Solo tienes ${own} para vender. `:'No tienes unidades de este activo para vender. ';
  return `<div class="stats">${stat('Comprar '+q+' costaría',usd2(buy))}${stat('Vender '+q+' te daría',usd2(sell))}</div>
  <div class="row"><button type="button" class="btn ok" data-act="buy"${canBuy?'':' disabled'}>Comprar</button><button type="button" class="btn sec" data-act="sell"${canSell?'':' disabled'}>Vender</button></div>
  ${why?`<p class="note">${esc(why)}</p>`:''}${T.msg?`<p class="fb ok" role="status">${esc(T.msg)}</p>`:''}`;
}

  <div class="card"><div class="stats">${stat('Día '+T.day+': valor total',usd2(tot))}${stat('Tu resultado',(ret>=0?'+':'')+pc(ret,2))}${stat('Efectivo',usd2(T.cash))}${stat('Si hubieras solo mantenido el fondo índice',(br>=0?'+':'')+pc(br,2))}</div>
  ${top>40?`<div class="alert"><b>Alerta de concentración.</b> ${esc(topK)} pesa ${pc(top,0)} de tu cartera. Si le va mal, tu resultado se hunde. Recuerda la tarjeta sobre diversificación.</div>`:''}
  <div class="row"><button type="button" class="btn ok sm" data-act="adv" data-n="1">Avanzar 1 día</button><button type="button" class="btn sec sm" data-act="adv" data-n="5">5 días</button><button type="button" class="btn sec sm" data-act="adv" data-n="20">20 días</button></div></div>
  <div class="card"><h2>Mercado</h2><div style="overflow-x:auto"><table class="t"><thead><tr><th>Activo</th><th>Tendencia</th><th class="n">Precio</th><th class="n">Tienes</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>

function parse(){

  if(p[0]==='t'&&MOD[p[1]]){const m=MOD[p[1]];return{v:'t',m,s:p[2]==='q'?'q':Math.max(0,Math.min(m.cards.length,parseInt(p[2],10)||0))};}
  return{v:['inicio','repaso','bolsa','glosario','ayuda'].includes(p[0])?p[0]:'inicio'};
}
function navHTML(cur){
  const items=[['inicio','Ruta'],['repaso','Repaso'],['bolsa','Bolsa'],['glosario','Glosario'],['ayuda','Ayuda']],d=dueIds().length;
  return items.map(([k,l])=>`<a href="#${k}"${cur===k?' aria-current="page"':''}>${l}${k==='repaso'&&d?`<span class="bd" aria-label="${d} pendientes">${d}</span>`:''}</a>`).join('');

function render(opt){
  opt=opt||{};
  const r=parse();let h='',cur=r.v;
  if(r.v==='t'){
    cur='inicio';
    if(r.s==='q')h=vQuiz(r.m);else if(r.s===0)h=vIntro(r.m);else h=vCard(r.m,r.s);
    if(r.s!=='q'&&QZ&&QZ.mode==='mod')QZ=null;
  }else if(r.v==='inicio'){h=vHome();}
  else if(r.v==='repaso'){h=QZ&&QZ.mode==='rev'?quizBody(null):vReview();}
  else if(r.v==='bolsa')h=vBolsa();
  else if(r.v==='glosario')h=vGlos();
  else h=vHelp();
  const key=location.hash||'#inicio';
  APP.innerHTML=h;
  $('#nav').innerHTML=navHTML(cur);
  $$('.sim[data-sim]').forEach(initSim);
  if(r.v==='glosario'){const q=$('#gq');q.addEventListener('input',()=>{$('#gl').innerHTML=glList(q.value);});}
  if(key!==lastKey&&!opt.keep){armed=false;try{window.scrollTo(0,0);}catch(e){}const t=$('#ttl');if(t)t.focus({preventScroll:true});}
  lastKey=key;
  if(opt.focus){const f=$(opt.focus);if(f)f.focus({preventScroll:true});}

/* ---------- simuladores ---------- */
function initSim(el){
  const d=SIMS[el.dataset.sim],pre=el.dataset.sv?JSON.parse(el.dataset.sv):{},v={};
  d.ctl.forEach(c=>{v[c.k]=pre[c.k]!==undefined?pre[c.k]:c.v;});
  el.innerHTML=d.ctl.map(c=>`<label class="ctl"><span>${c.l}<b data-o="${c.k}">${esc(c.f(v[c.k]))}</b></span><input type="range" min="${c.a}" max="${c.b}" step="${c.s}" value="${v[c.k]}" data-k="${c.k}"></label>`).join('')+'<div class="out"></div>';
  const out=$('.out',el),draw=()=>{out.innerHTML=d.out(v);};
  el.addEventListener('input',e=>{
    const k=e.target.dataset.k;if(!k)return;
    v[k]=parseFloat(e.target.value);
    const c=d.ctl.find(x=>x.k===k);$('[data-o="'+k+'"]',el).textContent=c.f(v[k]);draw();

  }
  else if(a==='retry'){startQuiz(MOD[QZ.modId].quiz.map((q,i)=>Object.assign({},q,{id:QZ.modId+'.'+i,mod:QZ.modId})),'mod',QZ.modId);render({keep:1,focus:'#ttl'});}

  }
  else if(a==='sel'){S.T.sel=b.dataset.k;S.T.msg='';save();render({keep:1,focus:'[data-act=sel][data-k="'+b.dataset.k+'"]'});}
  else if(a==='adv'){const n=+b.dataset.n;for(let i=0;i<n;i++)tStep(S.T);S.T.msg='';save();render({keep:1,focus:'[data-act=adv][data-n="'+n+'"]'});}
  else if(a==='buy'||a==='sell'){
    const T=S.T,as=ASSETS.find(x=>x.k===T.sel),p=tPrice(T,as.k),q=Math.max(1,T.qty|0),pos=T.pos[as.k]||{q:0,cost:0};
    if(a==='buy'){
      const cost=q*p*(1+FEE);if(cost>T.cash+1e-9)return;
      T.cash-=cost;T.fees+=q*p*FEE;pos.q+=q;pos.cost+=q*p;T.pos[as.k]=pos;T.msg='Compraste '+q+' de '+as.n+' a '+usd2(p)+'.';
    }else{
      if(q>pos.q)return;
      const avg=pos.cost/pos.q;T.cash+=q*p*(1-FEE);T.fees+=q*p*FEE;pos.q-=q;pos.cost-=avg*q;
      if(pos.q<=0)delete T.pos[as.k];else T.pos[as.k]=pos;
      T.msg='Vendiste '+q+' de '+as.n+' a '+usd2(p)+'. '+(p>=avg?'Resultado favorable frente a tu precio promedio.':'Vendiste por debajo de tu precio promedio.');
    }
    T.trades++;save();render({keep:1,focus:'[data-act=sel][data-k="'+T.sel+'"]'});
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='qty'&&S.T){S.T.qty=Math.max(1,parseInt(e.target.value,10)||1);$('#est').innerHTML=estHTML();}
});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  const r=parse();if(r.v!=='t'||r.s==='q'||r.s===0)return;
  const m=r.m,N=m.cards.length;
  if(e.key==='ArrowRight')location.hash='#t-'+m.id+'-'+(r.s<N?r.s+1:'q');
  if(e.key==='ArrowLeft')location.hash='#t-'+m.id+'-'+(r.s-1);
});
window.addEventListener('hashchange',()=>render());
function alEntrar(user,sb){
  ctx.uid=user.id;ctx.sb=sb||null;ctx.nubeOk=false;
  S=loadLocal(user.id);QZ=null;
  document.body.classList.toggle('big',!!S.big);render();
  if(!sb)return;
  const uid=user.id;
  sb.from('economia_docs').select('json').eq('user_id',uid).maybeSingle().then(r=>{
    if(ctx.uid!==uid||r.error)return;
    ctx.nubeOk=true;
    const d=r.data;
    if(d&&typeof d.json==='string'){
      try{
        const c=Object.assign(blank(),JSON.parse(d.json));
        if((c.ts||0)>(S.ts||0)){S=c;try{localStorage.setItem(KEY(uid),JSON.stringify(S));}catch(x){}document.body.classList.toggle('big',!!S.big);render({keep:1});return;}
      }catch(x){}
    }
    if(S.ts)nube();
  });
}
function alSalir(){clearTimeout(tmr);ctx.uid=null;ctx.sb=null;ctx.nubeOk=false;S=blank();QZ=null;}
if(window.Suite)Suite.init({app:'economia',gate:true,onUser:alEntrar,onLogout:alSalir});else alEntrar({id:'anon'},null);
</script>
