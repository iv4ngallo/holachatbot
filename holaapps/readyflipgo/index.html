<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReadyFlipGo</title>
<meta name="theme-color" content="#061246">
<meta name="description" content="ReadyFlipGo: lector de noticias y RSS con formato de revista.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--u:5px;--ink:#020718;--navy:#061246;--royal:#0F2E9C;--royal2:#2455FF;--w:#F4F7FF;--dim:#9FB1E3;--y:#FFC700;--r:#FF3B3B;--c:#2EF2FF;--line:rgba(120,155,255,.3);--paper:#F4F7FF;
--sans:'Barlow',system-ui,sans-serif;--cond:'Barlow Condensed','Barlow',sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--w);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,#01040F 0%,#061246 40%,#0F2E9C 78%,#2455FF 100%);z-index:-1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100dvh;display:flex;flex-direction:column}
.cut{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
/* header */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) 16px 10px;border-bottom:1px solid var(--line);background:rgba(2,7,24,.72);backdrop-filter:blur(10px);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font:800 26px/1 var(--cond);font-style:italic;letter-spacing:.01em;white-space:nowrap}
.logo i{color:var(--y)}
.logo .mk{width:26px;height:26px;background:var(--y);clip-path:polygon(0 0,100% 0,100% 100%,30% 100%,0 70%);position:relative}
.logo .mk::after{content:"";position:absolute;left:0;bottom:0;width:30%;height:30%;background:#B38B00}
.nav{margin-left:auto;min-width:0;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.logo{flex:none}
.nav::-webkit-scrollbar{display:none}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;height:44px;min-width:44px;padding:0 14px;justify-content:center;border:1px solid var(--line);background:rgba(4,14,52,.75);font:700 14px/1 var(--cond);font-style:italic;letter-spacing:.14em;text-transform:uppercase;color:var(--w);white-space:nowrap;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.chip:hover{border-color:var(--y)}
.chip[aria-current=page]{background:#fff;color:var(--ink)}
.chip.p{background:var(--y);color:var(--ink);border-color:var(--y)}
.chip.p:hover{background:#fff}
.chip.d{color:#FF9A9A;border-color:rgba(255,59,59,.5)}
.chip[disabled],.chip[aria-disabled=true]{opacity:.4;pointer-events:none}
.stat{flex:none;font:600 11px/1.2 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px;max-width:170px}
.stat::before{content:"";width:7px;height:7px;background:var(--dim);transform:rotate(45deg);flex:none}
.stat.live::before{background:#3DFF9A}.stat.demo::before{background:var(--y)}.stat.bad::before{background:var(--r)}
#view{flex:1;min-height:0;overflow:auto;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px calc(40px + var(--sab))}
h1,h2,h3,h4{margin:0}
.eyebrow{font:700 13px/1 var(--cond);font-style:italic;letter-spacing:.28em;text-transform:uppercase;color:var(--y);margin:0 0 12px}
.hero h1{font:900 italic clamp(44px,9vw,92px)/.92 var(--cond);text-transform:uppercase}
.hero h1 em{color:var(--y);font-style:italic}
.hero p.lead{max-width:56ch;color:#D7E1FF;font-size:18px;line-height:1.5;margin:16px 0 22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* covers */
.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;perspective:1400px}
.cv{display:flex;flex-direction:column;aspect-ratio:.74;padding:20px;position:relative;overflow:hidden;background:linear-gradient(165deg,#01040F,#061246 48%,#0F2E9C);border:1px solid var(--line);border-top:4px solid var(--ac);box-shadow:0 18px 40px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;transform-origin:left center;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.cv:hover,.cv:focus-visible{transform:rotateY(-9deg) translateY(-6px);box-shadow:0 26px 50px rgba(0,0,0,.55)}
.cv::before{content:"";position:absolute;right:-30%;top:46%;width:90%;height:12px;background:var(--ac);transform:rotate(-18deg)}
.cv .n{font:700 12px/1 var(--cond);letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.cv{container-type:inline-size}.cv .t{margin-top:auto;font:900 italic 17cqw/.9 var(--cond);text-transform:uppercase}
.cv .t span{display:block}.cv .t span:last-child{color:var(--ac)}
.cv .g{margin:12px 0 14px;color:#D7E1FF;font-size:15px;line-height:1.35}
.cv .go{align-self:flex-start;background:var(--ac);color:var(--ink);padding:10px 14px;font:800 14px/1 var(--cond);font-style:italic;letter-spacing:.2em;text-transform:uppercase}
.cv .m{margin-top:10px;font:600 12px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}
.how div{border:1px solid var(--line);border-left:3px solid var(--y);padding:14px 16px;background:rgba(3,10,40,.55)}
.how b{display:block;font:800 18px var(--cond);font-style:italic;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.how span{color:#D7E1FF;font-size:15px;line-height:1.4}
/* section */
.sec{height:100%;display:flex;flex-direction:column;--ac:var(--y)}
.sec-top{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px 6px}
.sec-top h2{font:900 italic clamp(22px,3.4vw,34px)/1 var(--cond);text-transform:uppercase;letter-spacing:.01em}
.sec-top h2 small{display:block;font:600 11px/1.3 var(--cond);letter-spacing:.2em;color:var(--dim);margin-top:3px}
.sec-top .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.banner{flex:none;margin:4px 16px 0;padding:8px 12px;border:1px solid rgba(255,199,0,.5);border-left:3px solid var(--y);background:rgba(255,199,0,.08);font-size:13.5px;line-height:1.4;color:#F6E7A8}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-y;overflow:hidden}
.book{position:relative;display:flex;justify-content:center;height:var(--ph);filter:drop-shadow(0 22px 28px rgba(0,0,0,.5))}
.face{position:relative;flex:none;width:var(--pw);height:var(--ph);overflow:hidden}
.edge{all:unset;position:absolute;top:0;bottom:0;width:min(8%,64px);z-index:600;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.4;transition:opacity .2s}
.edge.l{left:0}.edge.r{right:0}
.edge svg{width:44px;height:44px;padding:10px;border-radius:50%;background:rgba(2,7,24,.72);border:1px solid var(--line)}
.edge.r svg{transform:scaleX(-1)}
.stage:hover .edge,.edge:focus-visible{opacity:1}
.edge[aria-disabled=true]{opacity:0!important;pointer-events:none}
.ctrl{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px calc(10px + var(--sab));border-top:1px solid var(--line);background:rgba(2,7,24,.72)}
.ctrl .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ctrl .lbl{font:700 12px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:center}
input[type=range]{width:100%;accent-color:var(--y);height:24px;margin:0}
.load{margin:auto;width:min(460px,90%);text-align:center}
.load h3{font:900 italic 32px/1 var(--cond);text-transform:uppercase;margin-bottom:14px}
.bar{height:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--y);transition:width .25s}
.load p{color:var(--dim);font-size:14px;margin:10px 0 16px}
.empty{margin:auto;max-width:440px;text-align:center;padding:20px}
.empty h3{font:900 italic 30px/1 var(--cond);text-transform:uppercase;margin-bottom:10px}
.empty p{color:#D7E1FF;line-height:1.5}
/* barra superior de la revista (pantalla completa) */
.fs .top{display:none}
.sec{position:relative}
.sbar{position:relative;flex:none;display:flex;align-items:center;gap:8px;min-height:54px;padding:calc(7px + var(--sat)) 10px 7px;background:rgba(2,7,24,.92);border-bottom:1px solid var(--line);border-top:3px solid var(--ac)}
.ib{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;gap:8px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:rgba(4,14,52,.75);color:var(--w);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.ib:hover{border-color:var(--y)}
.ib.p{background:var(--y);color:var(--ink);border-color:var(--y)}
.ib[aria-expanded=true]{background:#fff;color:var(--ink)}
.ib[aria-disabled=true]{opacity:.4;pointer-events:none}
.ib svg{display:block}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:rgba(255,255,255,.1)}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.ib .tx{display:none}
@media(min-width:1000px){.ib.lb{width:auto;padding:0 16px}.ib.lb .tx{display:inline;font:700 13px/1 var(--cond);font-style:italic;letter-spacing:.16em;text-transform:uppercase}}
.skip{position:absolute;left:8px;top:-60px;z-index:100;all:unset;cursor:pointer;background:var(--y);color:var(--ink);padding:12px 16px;font:700 14px var(--sans);position:fixed;left:8px;top:-60px;z-index:100}
.skip:focus{top:8px}
.stl{flex:1;min-width:0}
.stl h2{font:900 italic clamp(17px,2.4vw,24px)/1 var(--cond);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stl small{display:block;margin-top:3px;font:600 10.5px/1.2 var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{font:700 10px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;padding:6px 8px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.mode:empty{display:none}.mode.demo{color:var(--y);border-color:rgba(255,199,0,.5)}.mode.live{color:#3DFF9A;border-color:rgba(61,255,154,.5)}.mode.bad{color:#FF9A9A;border-color:rgba(255,59,59,.5)}
.pgnav{display:flex;align-items:center;gap:6px}
.plbl{font:700 12px/1 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-width:104px;text-align:center}
.menu{position:absolute;right:10px;top:calc(60px + var(--sat));z-index:40;width:min(310px,calc(100vw - 20px));padding:8px;background:linear-gradient(180deg,rgba(6,20,78,.98),rgba(2,8,34,.99));border:1px solid var(--line);border-top:2px solid var(--y);box-shadow:0 18px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px}
.menu[hidden]{display:none}
.menu button,.menu a{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;font:600 15px/1.2 var(--sans);color:var(--w)}
.menu button:hover,.menu a:hover,.menu button:focus-visible,.menu a:focus-visible{background:rgba(255,255,255,.1)}
.menu svg{flex:none;color:var(--y)}
.menu .msep{height:1px;background:var(--line);margin:4px 0}
.menu .mnote{padding:8px 12px 10px;font-size:13px;line-height:1.4;color:var(--dim)}
.menu .mh{padding:6px 12px 2px;font:700 11px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
@media(max-width:520px){.mode{display:none}.plbl{min-width:70px;font-size:11px;letter-spacing:.08em}.pgnav{gap:4px}}
/* pages (container query units) */
.pg{--u:5px;width:100%;height:100%;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;font-family:var(--sans)}
.pg::after{content:"";position:absolute;top:0;bottom:0;width:9%;pointer-events:none}
.front .pg::after{left:0;background:linear-gradient(90deg,rgba(2,7,24,.28),transparent)}
.back .pg::after{right:0;background:linear-gradient(270deg,rgba(2,7,24,.28),transparent)}
.book.mob .front .pg::after{background:none}
.pad>*{flex-shrink:0}
.pad{position:absolute;inset:0;padding:calc(5*var(--u)) calc(6.5*var(--u)) calc(5.5*var(--u));display:flex;flex-direction:column;min-height:0}
.run{flex:none;display:flex;justify-content:space-between;gap:calc(3*var(--u));font:700 calc(2.6*var(--u))/1 var(--cond);font-style:italic;letter-spacing:.2em;text-transform:uppercase;color:#43538A;border-bottom:calc(.5*var(--u)) solid var(--ink);padding-bottom:calc(2*var(--u));margin-bottom:calc(3.5*var(--u))}
.run b{color:var(--ink)}
.run span:first-child{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.run span:last-child{flex:none}
a.ar{display:block;color:inherit;min-height:0}
a.ar h3,a.ar h4{background:linear-gradient(transparent 100%,var(--ac) 100%) no-repeat 0 100%/100% 0;transition:background-size .2s}
a.ar:hover h3,a.ar:focus-visible h3,a.ar:hover h4,a.ar:focus-visible h4{background-image:linear-gradient(transparent 62%,var(--ac) 62%);background-size:100% 100%}
a.ar:focus-visible{outline:calc(.6*var(--u)) solid var(--royal2);outline-offset:calc(.8*var(--u))}
.im{position:relative;overflow:hidden;background:var(--navy);clip-path:polygon(0 0,calc(100% - calc(4*var(--u))) 0,100% calc(4*var(--u)),100% 100%,calc(4*var(--u)) 100%,0 calc(100% - calc(4*var(--u))))}
.im svg,.im img{position:absolute;inset:0;width:100%;height:100%;display:block}
.im img{object-fit:cover}
.kick{margin:0 0 calc(1.6*var(--u));display:flex;flex-wrap:wrap;row-gap:calc(1*var(--u));gap:calc(2*var(--u));align-items:center;font:700 calc(2.7*var(--u))/1.2 var(--cond);font-style:italic;letter-spacing:.14em;text-transform:uppercase;color:#43538A}
.kick b{background:var(--ac);color:var(--ink);padding:calc(.8*var(--u)) calc(1.8*var(--u))}
.pg h3,.pg h4{overflow-wrap:break-word;font-family:var(--cond);font-style:italic;font-weight:800;line-height:1.02;letter-spacing:-.003em;text-wrap:balance}
.ex{font:400 calc(3.4*var(--u))/1.42 var(--sans);color:#1B2547;margin:0}
.more{display:inline-block;margin-top:calc(2.4*var(--u));font:800 calc(2.9*var(--u))/1 var(--cond);font-style:italic;letter-spacing:.2em;text-transform:uppercase;border-bottom:calc(.6*var(--u)) solid var(--ac)}
.c1,.c2,.c3,.c4,.c5,.c6,.c7,.c8{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.c1{-webkit-line-clamp:1}.c2{-webkit-line-clamp:2}.c3{-webkit-line-clamp:3}.c4{-webkit-line-clamp:4}.c5{-webkit-line-clamp:5}.c6{-webkit-line-clamp:6}.c7{-webkit-line-clamp:7}.c8{-webkit-line-clamp:8}
.feat .im{height:calc(44*var(--u));margin-bottom:calc(3.5*var(--u))}
.feat h3{font-size:calc(8.6*var(--u));margin-bottom:calc(2.6*var(--u))}
.trio,.duo{display:flex;flex-direction:column;justify-content:space-between;gap:calc(3.5*var(--u));flex:1 0 auto}
.trio a.ar{display:grid;grid-template-columns:calc(27*var(--u)) 1fr;gap:calc(3.5*var(--u));border-bottom:calc(.3*var(--u)) solid rgba(2,7,24,.2);padding-bottom:calc(3*var(--u))}
.trio a.ar:last-child{border:0;padding-bottom:0}
.trio .im{height:calc(27*var(--u));align-self:start}
.trio h3{font-size:calc(5.6*var(--u));margin-bottom:calc(1.6*var(--u))}
.trio .ex{font-size:calc(3*var(--u))}
.duo .im{height:calc(26*var(--u));margin-bottom:calc(2.4*var(--u))}
.duo h3{font-size:calc(6.6*var(--u));margin-bottom:calc(1.6*var(--u))}
.duo .ex{font-size:calc(3.2*var(--u))}
.brief{flex:1 0 auto;display:flex;flex-direction:column}
.brief h2{font:900 italic calc(9*var(--u))/1 var(--cond);text-transform:uppercase;margin:calc(-.5*var(--u)) 0 calc(3*var(--u))}
.brief ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-between;gap:calc(4*var(--u));flex:1 0 auto}
.brief li a.ar{display:grid;grid-template-columns:calc(11*var(--u)) 1fr;gap:calc(3*var(--u));align-items:start}
.brief .no{font:900 italic calc(7*var(--u))/1 var(--cond);background:var(--ac);width:calc(11*var(--u));height:calc(11*var(--u));display:flex;align-items:center;justify-content:center}
.brief h4{font-size:calc(4.6*var(--u));margin-bottom:calc(1*var(--u))}
.brief .kick{margin:0 0 calc(1*var(--u));font-size:calc(2.5*var(--u))}
/* cover */
.cov{background:linear-gradient(165deg,#01040F,#061246 48%,#0F2E9C);color:#fff}
.cov::before{content:"";position:absolute;right:calc(-22*var(--u));top:calc(12*var(--u));width:calc(56*var(--u));height:calc(2.6*var(--u));background:var(--ac);transform:rotate(-18deg)}
.cov .pad{padding:calc(6*var(--u))}
.cov .mast{font:900 italic calc(8*var(--u))/1 var(--cond)}.cov .mast i{color:var(--y)}
.cov .iss{margin-top:calc(1.6*var(--u));font:600 calc(2.7*var(--u))/1.3 var(--cond);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.cov .big{margin:calc(5*var(--u)) 0 0;font:900 italic calc(15*var(--u))/.9 var(--cond);text-transform:uppercase}
.cov .big span{display:block}.cov .big span:last-child{color:var(--ac)}
.cov .lead{margin-top:auto;display:block;background:rgba(2,7,24,.55);border:calc(.3*var(--u)) solid rgba(120,155,255,.35);border-top:calc(.9*var(--u)) solid var(--ac);padding:calc(3*var(--u))}
.cov .lead .im{height:calc(20*var(--u));margin-bottom:calc(2.4*var(--u))}
.cov .lead .kick{color:var(--dim)}
.cov .lead h3{font-size:calc(6.2*var(--u));color:#fff}
.cov .tz{margin-top:calc(3*var(--u));display:grid;gap:calc(1.4*var(--u))}
.cov .tz a{font:600 calc(3.1*var(--u))/1.25 var(--sans);color:#D7E1FF;border-left:calc(.8*var(--u)) solid var(--ac);padding-left:calc(2.2*var(--u))}
.cov .tz small{display:block;font:700 calc(2.4*var(--u)) var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:calc(.4*var(--u))}
.cov a.ar:hover h3{background-image:linear-gradient(transparent 62%,rgba(255,255,255,.25) 62%)}
/* sumario */
.sum h2,.end h2{font:900 italic calc(12*var(--u))/.95 var(--cond);text-transform:uppercase;margin:0 0 calc(3.5*var(--u))}
.sum ul{list-style:none;margin:0;padding:0;display:grid;gap:calc(1.6*var(--u));overflow:hidden}
.sum button{all:unset;cursor:pointer;display:grid;grid-template-columns:calc(8*var(--u)) 1fr;gap:calc(2.4*var(--u));align-items:baseline;width:100%;border-bottom:calc(.25*var(--u)) solid rgba(2,7,24,.18);padding:calc(.6*var(--u)) 0 calc(1.6*var(--u))}
.sum button:hover b,.sum button:focus-visible b{background:var(--ac)}
.sum .pn{font:900 italic calc(4.4*var(--u)) var(--cond)}
.sum b{font:700 calc(3.3*var(--u))/1.2 var(--sans);font-style:normal}
.sum small{display:block;font:600 calc(2.4*var(--u)) var(--cond);letter-spacing:.16em;text-transform:uppercase;color:#43538A;margin-top:calc(.4*var(--u))}
.end p{font-size:calc(3.4*var(--u));line-height:1.45;color:#1B2547;margin:0 0 calc(3*var(--u))}
.end .src{display:flex;flex-wrap:wrap;gap:calc(1.4*var(--u));overflow:hidden;max-height:calc(44*var(--u))}

/* ---------- Lectura de feeds ---------- */
const NET={ok:0,fail:0,blocked:false};
const PROXIES=[
 u=>({url:'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u),type:'json'}),
 u=>({url:'https://api.allorigins.win/raw?url='+encodeURIComponent(u),type:'xml'}),
 u=>({url:'https://corsproxy.io/?url='+encodeURIComponent(u),type:'xml'})
];
async function timed(url,ms){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
 try{return await fetch(url,{signal:c.signal})}finally{clearTimeout(t)}
}
function normJson(i){
 const raw=i.content||i.description||'';
 let img=i.thumbnail||'';
 if(!img&&i.enclosure&&i.enclosure.link&&(/image/.test(i.enclosure.type||'')||IMGRE.test(i.enclosure.link)))img=i.enclosure.link;
 if(!img)img=firstImg(raw);
 return {t:clean(i.title)||'(sin título)',l:i.link,d:parseDate(i.pubDate),s:clean(i.description||i.content),img};
}
function parseXml(x){
 const doc=new DOMParser().parseFromString(x,'text/xml');
 if(doc.querySelector('parsererror'))return [];
 return [...doc.querySelectorAll('item, entry')].map(n=>{
  const g=t=>{const e=n.getElementsByTagName(t)[0];return e?e.textContent:''};
  let l='';
  for(const e of n.getElementsByTagName('link')){
   const h=e.getAttribute('href');
   if(h&&(!e.getAttribute('rel')||e.getAttribute('rel')==='alternate')){l=h;break}
   if(!h&&e.textContent.trim()){l=e.textContent.trim();break}
  }
  const raw=g('content:encoded')||g('content')||g('description')||g('summary');
  let img='';
  const mt=n.getElementsByTagName('media:thumbnail')[0]||n.getElementsByTagName('media:content')[0];
  if(mt)img=mt.getAttribute('url')||'';
  if(!img){const en=n.getElementsByTagName('enclosure')[0];if(en&&(/image/.test(en.getAttribute('type')||'')||IMGRE.test(en.getAttribute('url')||'')))img=en.getAttribute('url')}
  if(!img)img=firstImg(raw);
  return {t:clean(g('title'))||'(sin título)',l,d:parseDate(g('pubDate')||g('dc:date')||g('published')||g('updated')),s:clean(g('description')||g('summary')||raw),img};
 }).filter(a=>a.l&&/^https?:/i.test(a.l));
}
function discover(html,base){
 const m=html.match(/<link[^>]+type=["']application\/(?:rss|atom)\+xml["'][^>]*>/i);
 if(!m)return null;
 const h=m[0].match(/href=["']([^"']+)["']/i);
 if(!h)return null;
 try{return new URL(h[1].replace(/&amp;/g,'&'),base).href}catch(e){return null}
}
async function fetchFeed(u,depth=0){
 if(NET.blocked)throw new Error('sin-red');
 let last=new Error('fallo');
 for(const mk of PROXIES){
  const p=mk(u);
  try{
   const r=await timed(p.url,12000);
   if(!r.ok)throw new Error('http '+r.status);
   if(p.type==='json'){
    const j=await r.json();
    if(j.status!=='ok'||!j.items||!j.items.length)throw new Error('rss2json');
    NET.ok++;return j.items.map(normJson).filter(a=>a.l);
   }
   const x=await r.text(),it=parseXml(x);
   if(it.length){NET.ok++;return it}
   const alt=depth===0&&discover(x,u);
   if(alt&&alt!==u)return await fetchFeed(alt,1);
   throw new Error('vacío');
  }catch(e){last=e;if(e instanceof TypeError)NET.fail++}
 }
 if(NET.fail>=6&&NET.ok===0)NET.blocked=true;
 throw last;
}

function fits(pad){
 const lim=pad.getBoundingClientRect().bottom-parseFloat(getComputedStyle(pad).paddingBottom);
 let bot=0;for(const c of pad.children)bot=Math.max(bot,c.getBoundingClientRect().bottom);
 return bot<=lim+1&&pad.scrollHeight<=pad.clientHeight+1;
}

 book.querySelectorAll('.pg').forEach(pg=>{
  const pad=pg.querySelector('.pad');if(!pad)return;

  for(let i=0;i<9;i++){
   const mid=(lo+hi)/2;pg.style.setProperty('--u',(base*mid)+'px');
   if(fits(pad))lo=mid;else hi=mid;
  }

 });
}

 const upd=()=>{
  if(tok!==TOK)return;
  const bar=$('#lp');if(!bar)return;
  bar.style.width=(st.total?st.done/st.total*100:100)+'%';
  $('#lt').textContent=`Fuentes leídas: ${st.done} de ${st.total}${st.err?` · ${st.err} sin respuesta`:''}`;
 };
 if(!srcs){}
 const tasks=srcs.map(s=>async()=>{
  const f=FEED[s.id];
  if(!force&&f&&f.status==='ok'&&Date.now()-f.t<FRESH){st.ok++;st.done++;upd();return}
  try{const items=await fetchFeed(s.f);FEED[s.id]={t:Date.now(),status:'ok',items};st.ok++}
  catch(e){FEED[s.id]={t:Date.now(),status:'err',items:[]};st.err++}
  st.done++;upd();
 });
 let i=0;
 const pool=Promise.all(Array.from({length:Math.min(6,tasks.length)},async()=>{while(i<tasks.length){await tasks[i++]()}}));
 const soft=new Promise(r=>setTimeout(r,10000));
 if(!srcs.length){buildSection(k,tok);return}
 await Promise.race([pool,skip,soft]);
 if(tok!==TOK)return;
 buildSection(k,tok);
 const builtCount=ARTS.length;
 pool.then(()=>{
  if(tok!==TOK||!$('#stage'))return;
  setStatusFor(k);
  const now=collect(k);
  if(now.length>builtCount)toast(`Llegaron ${now.length-builtCount} notas más.`,'Actualizar edición',()=>{if(tok===TOK)buildSection(k,tok)});
 });
}
function setStatusFor(k){
 const act=activeSources(k),ok=act.filter(s=>FEED[s.id]&&FEED[s.id].status==='ok').length;
 if(demo)setStatus('Edición de muestra','demo');
 else if(ok)setStatus(`En vivo · ${ok}/${act.length} fuentes`,'live');
 else setStatus('Sin conexión','bad');
}
function buildSection(k,tok){
 if(tok!==TOK)return;
 const arts=collect(k);ARTS=arts;
 const stg=$('#stage');
 setStatusFor(k);
 const mn=$('#mnote');if(mn)mn.textContent=demo?'Estás viendo una edición de muestra con notas reales del 20 de noviembre de 2026, porque este entorno no permite conectarse a los feeds. Al abrir ReadyFlipGo en tu navegador o en tu hosting, se actualiza en vivo.':'Edición en vivo con las fuentes activas.';
 $('#sub').textContent=`${arts.length} notas · ${srcCount(k)} · ${demo?'muestra':'en vivo'}`;
 if(!arts.length){
  stg.innerHTML=`<div class="empty"><h3>No pudimos traer notas</h3><p>${activeSources(k).length?'Ninguna de las fuentes activas respondió. Revisa tu conexión o intenta de nuevo.':'Apagaste todas las fuentes de este interés. Activa al menos una en el catálogo.'}</p><div class="row" style="justify-content:center;margin-top:16px"><button class="chip p" type="button" data-act="refresh"><span>Reintentar</span></button><button class="chip" type="button" data-act="sources"><span>Gestionar fuentes</span></button></div></div>`;
  BK=null;return;
 }
 const keep=POSP[k]||0;
 BK={k,pages:buildPages(k,arts),pos:0};
 stg.innerHTML=`<button class="edge l" type="button" tabindex="-1" aria-label="Página anterior" aria-disabled="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button><button class="edge r" type="button" tabindex="-1" aria-label="Página siguiente"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>`;
 mountBook();
 if(keep)goPage(Math.min(keep,BK.pages.length-1));
 if(!store.get('hint',false)){store.set('hint',true);toast(BK.two?'Pasa de página con las flechas del teclado o los botones laterales.':'Desliza el dedo hacia los lados para pasar de página.')}
}

function viewCatalog(k){
 BK=null;setStatus('Listo');
 k=k||catTab;catTab=k;
 const I=INT[k],list=allSources(k);
 const q=(catQ||'').trim().toLowerCase();
 const shown=list.filter(s=>!q||s.n.toLowerCase().includes(q));
 view.innerHTML=`<div class="wrap"><p class="eyebrow">Catálogo de fuentes</p><h1 style="font:900 italic clamp(34px,6vw,60px)/.95 var(--cond);text-transform:uppercase">Elige qué entra en tu revista</h1><p class="hint" style="font-size:16px;max-width:62ch;margin-top:12px">Cada interés trae 20 fuentes de acceso libre, sin muro de pago. Apaga las que no quieras o agrega las tuyas; los cambios se ven al abrir la edición.</p>`+
 `<div class="tabs" role="tablist">${KEYS.map(x=>`<button class="chip ${x===k?'':''}" role="tab" type="button" data-tab="${x}" aria-selected="${x===k}" ${x===k?'aria-current="page"':''}><span>${esc(INT[x].name)}</span></button>`).join('')}</div>`+
 `<div class="tools"><input type="search" id="cq" placeholder="Buscar una fuente" aria-label="Buscar una fuente" value="${esc(catQ||'')}"><button class="chip" type="button" data-act="all-on"><span>Activar todas</span></button><button class="chip" type="button" data-act="all-off"><span>Desactivar todas</span></button><button class="chip p" type="button" data-act="add"><span>+ Agregar RSS</span></button><a class="chip" href="#${k}"><span>Abrir edición</span></a></div>`+
 `<p class="hint" role="status" style="margin:0 0 12px">${srcCount(k)}${q?` · ${shown.length} coinciden con la búsqueda`:''}</p>`+
 `<div class="grid">${shown.map(s=>{const f=FEED[s.id];const stx=f?{ok:'En línea',err:'Sin respuesta',sample:'Muestra'}[f.status]:'Sin cargar';const on=!off.has(s.id);
  return `<div class="sc ${on?'':'off'}" style="--ac:${I.ac}"><div class="nm"><b title="${esc(s.n)}">${esc(s.n)}${s.custom?' <span class="badge">PROPIO</span>':''}</b><small><span class="dot ${f?f.status:''}"></span>${stx} · <a class="lk" href="${esc(s.w||s.f)}" target="_blank" rel="noopener noreferrer">Sitio</a></small></div>${s.custom?`<button class="xb" type="button" data-del="${s.id}" aria-label="Quitar ${esc(s.n)}">✕</button>`:''}<button class="tg" type="button" role="switch" aria-checked="${on}" data-tg="${s.id}" aria-label="${on?'Desactivar':'Activar'} ${esc(s.n)}"></button></div>`}).join('')||'<p class="hint">No encontramos fuentes con ese nombre.</p>'}</div></div>`;
}
let catTab='pm',catQ='';

/* ---------- Ruteo ---------- */
function route(){
 const h=location.hash.replace('#','')||'inicio';
 setNav();TOK++;
 closeModal();
 document.body.classList.toggle('fs',!!INT[h]);
 if(h==='catalogo')viewCatalog();
 else if(INT[h])viewSection(h);
 else viewHome();
 view.scrollTop=0;
}
window.addEventListener('hashchange',route);

/* ---------- Diálogos y avisos ---------- */
let MODAL=null,LASTF=null;
function openModal(html){
 closeModal();LASTF=document.activeElement;
 const m=document.createElement('div');m.className='ov';
 m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt" tabindex="-1" style="position:relative">${html}</div>`;
 m.addEventListener('mousedown',e=>{if(e.target===m)closeModal()});
 document.body.appendChild(m);MODAL=m;
 const d=$('.dlg',m);(d.querySelector('input,select')||d).focus();
 return m;
}
function closeMenu(back){const m=$('#menu'),b=$('#bMenu');if(m&&!m.hidden){m.hidden=true;b&&b.setAttribute('aria-expanded','false');if(back&&b)b.focus()}}
function toggleMenu(){const m=$('#menu'),b=$('#bMenu');if(!m)return;const o=m.hidden;m.hidden=!o;b.setAttribute('aria-expanded',String(o));if(o){const f=m.querySelector('button,a');f&&f.focus()}}
function toggleFs(){
 const d=document,el=d.documentElement,fail=()=>toast('Tu navegador no permitió la pantalla completa.');
 try{if(d.fullscreenElement){d.exitFullscreen()}else{const p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(fail);else if(!p)fail()}}catch(e){fail()}
}
function closeModal(){if(MODAL){MODAL.remove();MODAL=null;if(LASTF&&document.contains(LASTF))try{LASTF.focus()}catch(e){}}}
function toast(msg,label,fn){
 const t=document.createElement('div');t.className='ts';
 t.innerHTML=`<span>${esc(msg)}</span>${label?`<button type="button">${esc(label)}</button>`:''}`;
 const kill=()=>t.remove();
 if(label)t.querySelector('button').onclick=()=>{fn&&fn();kill()};
 $('#toasts').appendChild(t);setTimeout(kill,label?9000:4500);
}
const xBtn='<button class="chip x" type="button" data-close aria-label="Cerrar"><span>✕</span></button>';

function openArticle(i){
 const a=ARTS[i];if(!a)return;
 openModal(`${xBtn}<p class="meta">${esc(a.src)}${a.d?' · '+esc(rel(a.d)):''}</p><h2 id="dt" style="font-size:28px;line-height:1.05">${esc(a.t)}</h2>${im(a)}<p class="body">${esc(a.s)||'Esta fuente no incluye un resumen.'}</p><div class="acts"><button class="chip" type="button" data-close><span>Seguir hojeando</span></button><a class="chip p" href="${esc(a.l)}" target="_blank" rel="noopener noreferrer"><span>Leer en ${esc(a.src)}</span><span>↗</span></a></div>`);
}
function openHelp(){
 openModal(`${xBtn}<h2 id="dt">Ayuda rápida</h2><ul><li><kbd>←</kbd> <kbd>→</kbd> pasan de página; <kbd>Inicio</kbd> y <kbd>Fin</kbd> van a la portada y al final.</li><li>En el celular, desliza el dedo hacia los lados para hojear.</li><li>Toca una nota para ver su resumen y abrirla en el sitio original.</li><li><kbd>Esc</kbd> cierra cualquier ventana o menú.</li><li>En la revista, el botón de tres puntos guarda el sumario, la actualización, las fuentes y la pantalla completa.</li><li>En el catálogo puedes apagar fuentes y agregar tus propios feeds con <b>+ Agregar RSS</b>. Puedes pegar la dirección del feed o la del sitio.</li></ul><div class="acts"><button class="chip p" type="button" data-close><span>Entendido</span></button></div>`);
}
function openAdd(){
 const cur=INT[location.hash.replace('#','')]?location.hash.replace('#',''):catTab;
 openModal(`${xBtn}<h2 id="dt">Agregar un RSS</h2><form id="addf" novalidate><label for="fu">Dirección del feed o del sitio</label><input id="fu" name="url" type="url" inputmode="url" placeholder="https://tusitio.com/feed" autocomplete="off" required><label for="fn">Nombre (opcional)</label><input id="fn" name="n" type="text" placeholder="Cómo quieres verlo en la revista" autocomplete="off"><label for="fi">Interés</label><select id="fi" name="i">${KEYS.map(x=>`<option value="${x}" ${x===cur?'selected':''}>${esc(INT[x].name)}</option>`).join('')}</select><p class="hint">Solo se aceptan fuentes de acceso libre, sin muro de pago. Probamos la dirección antes de guardarla y, si pegas la de un sitio, intentamos encontrar su feed.</p><p class="msg" id="am" role="alert"></p><div class="acts"><button class="chip" type="button" data-close><span>Cancelar</span></button><button class="chip" type="button" id="force" hidden><span>Agregar de todas formas</span></button><button class="chip p" type="submit" id="sub1"><span>Probar y agregar</span></button></div></form>`);
 const f=$('#addf');
 const doAdd=(u,n,i,cnt)=>{
  const id='c'+hash(u).toString(36);
  custom.push({id,i,n,f:u,w:u,custom:true});saveCustom();
  FEED[id]&&delete FEED[id];
  closeModal();
  toast(`Agregamos «${n}» a ${INT[i].name}${cnt?` (${cnt} notas)`:''}.`);
  if(location.hash==='#catalogo'){catTab=i;viewCatalog(i)}
 };
 f.addEventListener('submit',async e=>{
  e.preventDefault();
  const am=$('#am'),raw=f.url.value.trim();
  am.className='msg';$('#force').hidden=true;
  let u;
  try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);if(!/\./.test(u.hostname))throw 0}catch(x){am.className='msg err';am.textContent='Esa dirección no parece válida. Revisa que tenga la forma https://sitio.com/feed.';f.url.focus();return}
  const href=u.href;
  if(isPaid(href)){am.className='msg err';am.textContent='Esa fuente tiene muro de pago. ReadyFlipGo solo incluye fuentes de acceso libre; prueba con otra.';f.url.focus();return}
  if(allSources().some(s=>s.f===href)){am.className='msg err';am.textContent='Ya tienes ese feed en tu lista.';return}
  const name=(f.n.value.trim()||u.hostname.replace(/^www\./,'')).slice(0,48),i=f.i.value;
  $('#sub1').disabled=true;am.textContent='Probando el feed…';
  try{
   const items=await fetchFeed(href);
   doAdd(href,name,i,items.length);
  }catch(x){
   $('#sub1').disabled=false;am.className='msg err';
   am.textContent='No pudimos leer ese feed desde aquí. Puede que la dirección esté mal o que el sitio no permita la lectura. Corrígela o agrégala de todas formas.';
   const fb=$('#force');fb.hidden=false;fb.onclick=()=>doAdd(href,name,i,0);
  }
 });
}

/* ---------- Eventos globales ---------- */
$('#skip').onclick=()=>$('#view').focus();
$('#bAdd').onclick=openAdd;
$('#bHelp').onclick=openHelp;
let drag=null,moved=false;
view.addEventListener('pointerdown',e=>{if(e.target.closest('#stage')&&!e.target.closest('button,input'))drag={x:e.clientX,y:e.clientY};moved=false});
view.addEventListener('pointerup',e=>{
 if(!drag||!BK){drag=null;return}
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag=null;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){moved=true;go(BK.pos+(dx<0?1:-1))}
});
view.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('#bMenu')){toggleMenu();return}
 if(!t.closest('#menu'))closeMenu();
 else if(t.closest('a'))closeMenu();
 const art=t.closest('[data-art]');
 if(art){e.preventDefault();if(!moved)openArticle(+art.dataset.art);moved=false;return}
 const gt=t.closest('[data-goto]');if(gt){goPage(+gt.dataset.goto);return}
 const tab=t.closest('[data-tab]');if(tab){viewCatalog(tab.dataset.tab);return}
 const tg=t.closest('[data-tg]');
 if(tg){const id=tg.dataset.tg;off.has(id)?off.delete(id):off.add(id);saveOff();viewCatalog();const n=$(`[data-tg="${id}"]`);n&&n.focus();return}
 const del=t.closest('[data-del]');
 if(del){const id=del.dataset.del,idx=custom.findIndex(s=>s.id===id);if(idx<0)return;const rm=custom.splice(idx,1)[0];saveCustom();viewCatalog();toast(`Quitamos «${rm.n}».`,'Deshacer',()=>{custom.splice(Math.min(idx,custom.length),0,rm);saveCustom();if(location.hash==='#catalogo')viewCatalog()});return}
 const ac=t.closest('[data-act]');
 if(ac){
  const a=ac.dataset.act,k=(BK&&BK.k)||location.hash.replace('#','');
  closeMenu();
  if(a==='sumario'){if(BK)goPage(1);return}
  if(a==='fs'){toggleFs();return}
  if(a==='help'){openHelp();return}
  if(a==='refresh'&&INT[k]){viewSection(k,true)}
  else if(a==='sources'){catTab=INT[k]?k:catTab;location.hash==='#catalogo'?viewCatalog():(location.hash='#catalogo')}
  else if(a==='add')openAdd();
  else if(a==='all-on'){allSources(catTab).forEach(s=>off.delete(s.id));saveOff();viewCatalog()}
  else if(a==='all-off'){
   const ids=allSources(catTab).map(s=>s.id),prev=ids.filter(id=>off.has(id));
   ids.forEach(id=>off.add(id));saveOff();viewCatalog();
   toast(`Apagaste las fuentes de ${INT[catTab].name}.`,'Deshacer',()=>{ids.forEach(id=>off.delete(id));prev.forEach(id=>off.add(id));saveOff();if(location.hash==='#catalogo')viewCatalog()});
  }
  return;
 }
 if(t.closest('#bPrev,.edge.l')&&BK)go(BK.pos-1);
 else if(t.closest('#bNext,.edge.r')&&BK)go(BK.pos+1);
 else if(t.closest('#bRef')){const k2=location.hash.replace('#','');if(INT[k2])viewSection(k2,true)}
});
view.addEventListener('input',e=>{
 if(e.target.id==='rng'&&BK)go(+e.target.value);
 if(e.target.id==='cq'){catQ=e.target.value;const p=e.target.selectionStart;viewCatalog();const n=$('#cq');n.focus();try{n.setSelectionRange(p,p)}catch(x){}}
});
document.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();closeMenu(true);return}
 const mn=$('#menu');
 if(mn&&!mn.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const it=[...mn.querySelectorAll('button,a')],i=it.indexOf(document.activeElement);it[(i+(e.key==='ArrowDown'?1:it.length-1))%it.length].focus();return}
 if(MODAL){
  if(e.key==='Tab'){
   const f=[...MODAL.querySelectorAll('a[href],button:not([hidden]):not([disabled]),input,select')].filter(x=>x.offsetParent!==null);
   if(!f.length)return;const a=f[0],b=f[f.length-1];
   if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}
   else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}
  }
  return;
 }
 if(!BK||/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||''))return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(BK.pos+1)}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(BK.pos-1)}
 else if(e.key==='Home'){go(0)}
 else if(e.key==='End'){go(BK.max)}
});
let rz=0;
window.addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{if(!BK||!$('#stage'))return;if(two()!==BK.two)mountBook();else{sizeBook();fit()}})});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(BK&&$('#book'))fit()});
route();
})();
</script>
</body>
</html>
