<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organic (Beta Version)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="stylesheet" href="../suite/suite.css?v=7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Lenguaje visual: formas totalmente redondeadas, negro como base y verde, azul y naranja como acentos.
   Layout: tres tarjetas (toolbox, lista, detalle) flotando sobre un lienzo. */
:root{
  --canvas:#ebe9e1; --bg:#ffffff; --panel:#f4f3ee; --raised:#ffffff; --ink:#111111; --ink2:#5e5e5b; --line:#dad8cf; --rule:#111111;
  --bar:#111111; --bar-ink:#ffffff; --on-color:#ffffff;
  --orange:#e8751a; --orange-bar:#c9560b; --orange-soft:#fbe6d1;
  --green:#2c8447; --green-soft:#dcefe0; --blue:#2a68ad; --blue-soft:#dce9f7;
  --red:#d6361c; --warn:#d6361c;
  --font-d:"Barlow Condensed","Arial Narrow",sans-serif; --font-b:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#070707; --bg:#0e0e0e; --panel:#1b1b1a; --raised:#131312; --ink:#f3f2ee; --ink2:#a3a29d; --line:#333331; --rule:#f3f2ee;
    --bar:#f3f2ee; --bar-ink:#0e0e0e; --on-color:#0e0e0e;
    --orange:#f28a2e; --orange-bar:#f28a2e; --orange-soft:#3a2615; --green:#62c882; --green-soft:#17301f; --blue:#7db4f2; --blue-soft:#16283d;
    --red:#ff5a3d; --warn:#ff6b4e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#070707; --bg:#0e0e0e; --panel:#1b1b1a; --raised:#131312; --ink:#f3f2ee; --ink2:#a3a29d; --line:#333331; --rule:#f3f2ee;
  --bar:#f3f2ee; --bar-ink:#0e0e0e; --on-color:#0e0e0e;
  --orange:#f28a2e; --orange-bar:#f28a2e; --orange-soft:#3a2615; --green:#62c882; --green-soft:#17301f; --blue:#7db4f2; --blue-soft:#16283d;
  --red:#ff5a3d; --warn:#ff6b4e; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--ink);font:15px/1.5 var(--font-b);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.c-g{--mc:var(--green);--mc-ink:var(--on-color)}
.c-b{--mc:var(--blue);--mc-ink:var(--on-color)}
.c-o{--mc:var(--orange-bar);--mc-ink:var(--on-color)}
.c-k{--mc:var(--bar);--mc-ink:var(--bar-ink)}

.app{height:100%;padding:12px;gap:12px;display:grid;grid-template-columns:268px minmax(300px,410px) 1fr;grid-template-areas:"dock list detail"}
.app.dock-right{grid-template-columns:minmax(300px,410px) 1fr 268px;grid-template-areas:"list detail dock"}
.dock{grid-area:dock;background:var(--raised);border-radius:32px;padding:20px 14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.list{grid-area:list;display:flex;flex-direction:column;min-height:0;background:var(--raised);border-radius:32px;overflow:hidden}
.detail{grid-area:detail;overflow:auto;min-width:0;background:var(--raised);border-radius:32px;position:relative}

h1,h2,h3{font-family:var(--font-d);margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.bar{display:inline-block;background:var(--bar);color:var(--bar-ink);padding:1px 14px;line-height:1.3;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:24px}
.brand svg{width:32px;height:32px;flex:none}
.tiny{font-size:12px;color:var(--ink2);line-height:1.4}
.label{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.09em;font-size:12px;color:var(--ink2);font-weight:600}
.tris{display:block;height:10px;width:56px;margin:6px 0}
.ghost{background:none;border:1.5px solid var(--rule);border-radius:999px;padding:5px 14px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:13px}
.ghost:hover{background:var(--bar);color:var(--bar-ink)}
.ghost[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink)}
.btn{background:var(--green);color:var(--on-color);border:0;border-radius:999px;padding:9px 18px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:14px;flex:none}
.btn:hover{background:var(--blue)}
.seg{display:flex;gap:6px}

.tools{display:grid;gap:7px}
.tool{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1.5px solid transparent;border-radius:999px;padding:8px 16px 8px 12px;cursor:grab;user-select:none}
.tool:hover{border-color:var(--mc)}
.tool svg{width:22px;height:22px;flex:none;color:var(--mc)}
.tool b{display:block;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-size:15px;line-height:1.15}
.tool span{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.tool.used{opacity:.5}
.tool.dragging{opacity:.35}

.list-top{padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.burger{width:42px;height:42px;border-radius:50%;border:0;background:var(--panel);display:grid;place-items:center;flex:none}
.burger:hover,.burger[aria-expanded="true"]{background:var(--bar);color:var(--bar-ink)}
.burger svg{width:20px;height:20px}
.sow{display:flex;gap:8px}
.sow input{flex:1;min-width:0;background:var(--panel);border:1.5px solid transparent;border-radius:999px;padding:10px 18px}
.sow input:focus{border-color:var(--green);outline:none}
.sow input::placeholder{color:var(--ink2)}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kind{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 13px 3px 8px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:13px}
.kind svg{width:17px;height:17px}
.kind:hover{border-color:var(--rule)}
.kind[aria-pressed="true"]{color:var(--on-color);border-color:transparent}
.kind.semilla[aria-pressed="true"]{background:var(--green)}
.kind.proyecto[aria-pressed="true"]{background:var(--blue)}
.kind.ecosistema[aria-pressed="true"]{background:var(--orange-bar)}
.tools-row{display:flex;gap:8px}
.search{flex:1;min-width:0;background:var(--panel);border:1.5px solid transparent;border-radius:999px;padding:8px 16px}
.search:focus{border-color:var(--blue);outline:none}
.selwrap{position:relative;flex:none}
.selwrap select{appearance:none;-webkit-appearance:none;background:var(--blue);color:var(--on-color);border:0;padding:9px 36px 9px 16px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:14px;cursor:pointer;max-width:100%;border-radius:999px}
.selwrap select option,.selwrap select optgroup{background:var(--raised);color:var(--ink);font-family:var(--font-b);text-transform:none;letter-spacing:0}
.selwrap::after{content:"";position:absolute;right:15px;top:50%;width:0;height:0;border:5px solid transparent;border-top:6px solid var(--on-color);transform:translateY(-25%);pointer-events:none}
.rows{overflow:auto;padding:4px 10px 18px;flex:1}
.lists{flex:1;min-height:0;display:flex;flex-direction:column}
.lsec{flex:1 1 0;min-height:0;display:flex;flex-direction:column;position:relative;transition:background-color .2s}
.lsec>.rows{flex:1 1 0;min-height:0}
.lhd{display:flex;align-items:center;gap:8px;padding:8px 18px 2px;flex:none;min-height:34px}
.lhd .label{margin:0}
.lhd .cnt{font-family:var(--font-d);font-weight:700;font-size:12px;background:var(--panel);border-radius:999px;padding:1px 9px;min-width:22px;text-align:center}
.lhd .sp{flex:1}
.lists.split #par{border-top:2px solid var(--line);margin-top:4px;background:color-mix(in srgb,var(--panel) 45%,transparent)}
.lsec.dropzone{outline:2px dashed var(--orange);outline-offset:-6px;background:var(--orange-soft)}
.parclose{padding:3px 14px;font-size:12px}
.parclose:disabled{opacity:.4;cursor:not-allowed}
.parclose.ready{background:var(--green);color:var(--on-color);border-color:transparent}
.parempty{padding:22px 14px}
#parbtn.on{background:var(--blue);color:var(--on-color)}
.parbtn{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--ink2);display:grid;place-items:center;padding:0;align-self:flex-start;margin:-2px -4px 0 0;cursor:pointer}
.parbtn svg{width:17px;height:17px}
.parbtn:hover{background:var(--bar);color:var(--bar-ink)}
.row.ghost{text-transform:none;letter-spacing:normal;font-family:var(--font-b);font-weight:400;position:fixed;background:var(--raised);border-color:var(--rule);box-shadow:0 16px 38px rgba(0,0,0,.28);opacity:.96;transition:none;margin:0}
@media (max-width:860px){.lists.split #rows{padding-bottom:8px}}
@media (min-width:1180px){
  .lists.split{flex-direction:row}
  .lists.split #par{border-top:0;border-left:2px solid var(--line);margin:0}
  .lists.split .rows{padding-left:6px;padding-right:6px}
  .lists.split #parhint{display:none}
  .lists.split .row .rowtool:not(.toseed){display:none}
  .lists.split .row:hover .rowtool:not(.toseed){display:inline-flex}
  .lists.split .parbtn svg{transform:rotate(-90deg)}
}
.row{display:flex;gap:10px;align-items:flex-start;padding:11px 14px 11px 12px;cursor:pointer;border:1.5px solid transparent;border-radius:26px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row:hover{background:var(--panel)}
.row.sel{background:var(--panel);border-color:var(--blue)}
.row.drop{outline:2px dashed var(--orange);background:var(--orange-soft)}
.chk{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--rule);border-radius:50%;margin:2px 0 0;flex:none;cursor:pointer;background:transparent;display:grid;place-content:center}
.chk:checked{background:var(--green);border-color:var(--green)}
.chk:checked::after{content:"";width:9px;height:5px;border:2px solid var(--on-color);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.row-main{min-width:0;flex:1}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row.done .row-title{text-decoration:line-through;color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:3px;font-size:12px;color:var(--ink2);align-items:center}
.stage{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.08em;font-weight:700;font-size:12.5px}
.stage svg{width:17px;height:17px}
.stage.semilla{color:var(--green)}.stage.proyecto{color:var(--blue)}.stage.ecosistema{color:var(--orange-bar)}
.late{color:var(--warn);font-weight:600}
.empty{padding:34px 14px;color:var(--ink2);font-size:14px}

.pane{max-width:780px;margin:0 auto;padding:30px 30px 90px}
.iconbtn.back{display:none;margin-bottom:12px}
.crumb{font-size:13px;color:var(--ink2);margin-bottom:8px}
.crumb button{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-decoration-color:var(--orange);text-underline-offset:3px}
.title{margin-bottom:20px;width:100%;border:0;background:transparent;resize:none;font:700 38px/1.1 var(--font-d);text-transform:uppercase;letter-spacing:.02em;padding:0;overflow:hidden}
.title:focus{outline:none}
.title::placeholder{color:var(--ink2);opacity:.6}
.mod{background:var(--panel);border-radius:30px;padding:14px;margin-bottom:14px}
.mod-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;background:var(--mc,var(--bar));color:var(--mc-ink,var(--bar-ink));padding:5px 8px 5px 14px;border-radius:999px}
.mod-head svg{width:18px;height:18px}
.mod-head h3{font-size:15px;flex:1;letter-spacing:.09em}
.x{background:none;border:0;color:var(--ink2);padding:2px 8px;border-radius:999px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:13px}
.x:hover{color:var(--warn)}
.mod-head .x{color:inherit;opacity:.8}
.mh-btn{flex:none;height:28px;min-width:28px;border:0;border-radius:999px;background:transparent;color:inherit;opacity:.85;display:inline-flex;align-items:center;justify-content:center;gap:1px;padding:0 6px}
.mh-btn svg{width:16px;height:16px}
.mh-btn .cv{width:12px;height:12px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.mh-btn:hover{opacity:1;background:rgba(0,0,0,.18)}
.mh-btn[aria-expanded=true]{opacity:1;background:rgba(0,0,0,.28)}
.mh-btn[aria-expanded=true] .cv{transform:rotate(180deg)}
.cap{margin-top:10px;min-height:44px;border-radius:18px}
#xfmenu{width:240px}
/* Sistema de diseño de PrecIA: tokens, tipografía (Climate Crisis solo en el título de marca) y radios 8/14/20 */
:root{
  --canvas:#F7F5FB; --bg:#FFFFFF; --panel:#EFEBF8; --raised:#FFFFFF; --ink:#1C1838; --ink2:#4F4A6E; --line:#E1DCF0; --rule:#1C1838;
  --bar:#4B3FC4; --bar-ink:#FFFFFF; --on-color:#FFFFFF;
  --orange:#C0398B; --orange-bar:#C0398B; --orange-soft:#FBE6F2;
  --green:#1F7A4D; --green-soft:#E2F2E9; --blue:#4B3FC4; --blue-soft:#E9E6FB;
  --red:#B3261E; --warn:#B3261E;
  --font-d:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-b:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#14122B; --bg:#14122B; --panel:#2A2652; --raised:#1E1B3C; --ink:#EEECF8; --ink2:#B9B6D3; --line:#3A3665; --rule:#EEECF8;
    --bar:#5B4FD6; --bar-ink:#FFFFFF; --on-color:#FFFFFF;
    --orange:#F08CC6; --orange-bar:#C3589B; --orange-soft:#3F2038; --green:#74D6A4; --green-soft:#173328; --blue:#A79BFF; --blue-soft:#2D2870;
    --red:#FF8E85; --warn:#FF8E85;
  }
}
:root[data-theme="dark"]{
  --canvas:#14122B; --bg:#14122B; --panel:#2A2652; --raised:#1E1B3C; --ink:#EEECF8; --ink2:#B9B6D3; --line:#3A3665; --rule:#EEECF8;
  --bar:#5B4FD6; --bar-ink:#FFFFFF; --on-color:#FFFFFF;
  --orange:#F08CC6; --orange-bar:#C3589B; --orange-soft:#3F2038; --green:#74D6A4; --green-soft:#173328; --blue:#A79BFF; --blue-soft:#2D2870;
  --red:#FF8E85; --warn:#FF8E85;
}
h1,h2,h3{letter-spacing:.03em}
.brand h1{font-family:"Climate Crisis","Work Sans",sans-serif;font-weight:400;font-size:17px;letter-spacing:0;text-transform:lowercase}
.dock,.list,.detail{border-radius:var(--r-lg)}
.mod{border-radius:var(--r-lg)}
.row{border-radius:var(--r-md)}
.cap{border-radius:var(--r-md)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
#xfmenu .mh{padding:8px 12px 4px}
#xfmenu .mi svg{width:16px;height:16px;flex:none}
#xfmenu .mi{gap:10px;justify-content:flex-start}
.mod-head .x:hover{opacity:1;background:rgba(0,0,0,.18);color:inherit}
.field{width:100%;background:var(--raised);border:1.5px solid transparent;padding:9px 16px}
input.field,select.field{border-radius:999px}
textarea.field{border-radius:24px;resize:none;min-height:70px;line-height:1.5}
.field:focus{border-color:var(--mc,var(--blue));outline:none}
.inline{display:flex;gap:8px;margin-top:8px}
.inline .field{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--green-soft);border:1.5px solid var(--green);border-radius:999px;padding:0 4px 0 12px;font-size:13px;display:inline-flex;align-items:center;gap:2px}
.task{display:flex;align-items:center;gap:8px;padding:4px 0}
.task{align-items:flex-start}
.task .chk{margin-top:7px}
.task textarea[data-f="ttext"]{flex:1;min-width:0;border:0;background:transparent;padding:4px 2px;border-bottom:1.5px solid transparent;resize:none;overflow:hidden;font:inherit;color:inherit;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.task textarea[data-f="ttext"]:focus{outline:none;border-bottom-color:var(--blue)}
.task.done textarea[data-f="ttext"]{text-decoration:line-through;color:var(--ink2)}
.task{padding:6px 0}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:8px;align-items:start}
.task>.chk{grid-column:1;grid-row:1}
.task>textarea[data-f="ttext"]{grid-column:2;grid-row:1;width:100%;display:block}
.tk-side{grid-column:3;grid-row:1;display:flex;flex-direction:row;align-items:center;gap:0;margin-right:-4px}
.tkb{width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--ink2);display:grid;place-items:center;padding:0;cursor:pointer}
.tkb svg{width:17px;height:17px}
.tkb:hover{background:var(--bar);color:var(--bar-ink)}
.tkb.del:hover{background:var(--warn);color:#fff}
.tkb.tkxf{width:auto;min-width:30px;border-radius:999px;gap:1px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.tkxf .cv{width:12px;height:12px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tkxf[aria-expanded=true]{background:var(--bar);color:var(--bar-ink)}
.tkxf[aria-expanded=true] .cv{transform:rotate(180deg)}
.tkk[aria-expanded=true]{background:var(--bar);color:var(--bar-ink)}
.mi .go{width:14px;height:14px;flex:none;margin-left:auto;opacity:.7}
.mi.dng:hover,.mi.dng:focus-visible{background:var(--warn);color:#fff}
.mi.back{background:transparent}
.mi.off{opacity:.5}
#xfmenu .mi:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tk-mods{grid-column:2/4;grid-row:2;display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.tm{background:var(--panel);border-radius:22px;padding:10px 12px}
.tm-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tm-h>svg{width:16px;height:16px;flex:none;color:var(--mc,var(--ink2))}
.tm-h span{flex:1;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.07em;font-weight:700;font-size:12px}
.tm-rm{width:26px;height:26px;border:0;border-radius:50%;background:none;color:var(--ink2);display:grid;place-items:center;padding:0;cursor:pointer}
.tm-rm svg{width:15px;height:15px}
.tm-rm:hover{background:var(--bar);color:var(--bar-ink)}
.tm .imgs{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));margin-bottom:4px}
.tm .inline{margin-top:6px}
.task .x{margin-top:3px}
.prog-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.prog-row .tiny{margin:0}
.hidebtn{width:30px;height:30px;border-radius:999px;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center;padding:0}
.hidebtn svg{width:18px;height:18px}
.hidebtn:hover{background:var(--raised);color:var(--ink)}
.hidebtn.on{background:var(--blue);color:var(--on-color)}
.prog{height:8px;background:var(--line);margin-bottom:8px;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.img{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:var(--raised)}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.img .x{position:absolute;top:6px;right:6px;background:var(--bar);color:var(--bar-ink);width:24px;height:24px;padding:0;display:grid;place-items:center}
.filebtn{display:inline-block;margin-top:8px;border:1.5px dashed var(--mc,var(--rule));border-radius:999px;padding:6px 18px;cursor:pointer;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:13px}
.filebtn:hover{background:var(--raised)}
.cm{background:var(--raised);border-radius:22px;padding:8px 16px 10px;margin-bottom:6px}
.cm-h{display:flex;justify-content:space-between;align-items:center}
.cm-t{white-space:pre-wrap;overflow-wrap:anywhere}
.li{display:flex;align-items:center;gap:8px;padding:5px 0;min-width:0}
.li a{font-weight:500;overflow-wrap:anywhere;text-decoration-color:var(--blue);text-underline-offset:3px}
.li .grow{flex:1;min-width:0}
.li button.open{background:none;border:0;text-align:left;padding:0;font-weight:500;overflow-wrap:anywhere}
.li button.open:hover{text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:3px}
.danger{color:var(--warn);border-color:var(--warn)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}

.welcome{max-width:600px;margin:0 auto;padding:54px 30px 60px;position:relative}
.welcome .hero{font-family:var(--font-d);text-transform:uppercase;font-size:44px;line-height:1.12;margin:0 0 18px}
.welcome .hero span{display:inline-block;color:var(--on-color);padding:0 16px;margin-bottom:5px;border-radius:999px}
.welcome .hero span:nth-of-type(1){background:var(--bar);color:var(--bar-ink)}
.welcome .hero span:nth-of-type(2){background:var(--green)}
.welcome .hero span:nth-of-type(3){background:var(--blue)}
.welcome .hero .b{font-weight:700}.welcome .hero .l{font-weight:500}
.welcome p.lead{color:var(--ink2);max-width:46ch;margin:0 0 6px}
.ladder{display:grid;gap:10px;margin-top:26px}
.rung{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;background:var(--panel);border-radius:28px}
.rung svg{width:40px;height:40px;flex:none}
.rung b{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.07em;font-size:18px}
.rung p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.cross{position:absolute;right:20px;top:20px;width:120px;height:120px;color:var(--green);pointer-events:none}

.menu{position:fixed;z-index:25;background:var(--raised);border-radius:28px;padding:10px;width:250px;display:flex;flex-direction:column;gap:6px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
.mi{background:var(--panel);border:0;border-radius:999px;padding:10px 16px;text-align:left;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.07em;font-weight:600;font-size:14px}
.mi:hover{background:var(--blue);color:var(--on-color)}
.menu .label{margin:8px 8px 0}
.syncst{display:flex;align-items:center;gap:8px;margin:4px 8px 6px;font-size:12px;line-height:1.3;color:var(--ink2)}
.syncst::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:#aaa}
.syncst[data-st=ok]::before{background:var(--green)}
.syncst[data-st=saving]::before,.syncst[data-st=loading]::before{background:var(--blue)}
.syncst[data-st=error]::before,.syncst[data-st=offline]::before{background:var(--orange)}
.menu .seg{padding:0 4px 4px}
.mini{position:fixed;z-index:26;background:var(--raised);border-radius:30px;padding:12px;width:272px;box-shadow:0 14px 44px rgba(0,0,0,.32);transform-origin:top left;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.mini-h{display:flex;align-items:baseline;gap:6px;margin:0 6px 8px;font-size:13px;color:var(--ink2);min-width:0}
.mini-h b{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mini-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-t{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);border:0;border-radius:22px;padding:9px 2px 7px;font-size:10.5px;line-height:1.1;text-align:center}
.mini-t svg{width:22px;height:22px;color:var(--mc)}
.mini-t:hover{background:var(--mc);color:var(--mc-ink)}
.mini-t:hover svg{color:var(--mc-ink)}
.mini-t.used{opacity:.5}

.overlay{position:fixed;inset:0;background:rgba(10,10,10,.6);display:none;place-items:center;padding:16px;z-index:40}
.overlay.on{display:grid}
.dlg{background:var(--raised);padding:20px;width:min(520px,100%);border-radius:32px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
.dlg textarea{width:100%;height:200px;font:12px/1.4 ui-monospace,monospace;background:var(--panel);border:0;padding:12px 14px;border-radius:24px;resize:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:9px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%}
.toast.on{opacity:1}

@media (max-width:860px){
  .app,.app.dock-right{padding:0;gap:0;grid-template-columns:1fr;grid-template-areas:"list"}
  .list{border-radius:0}
  .detail{position:fixed;inset:0;display:none;z-index:10;border-radius:0}
  .has-sel .detail{display:block}
  .pane{padding:16px 16px 140px}
  .iconbtn.back{display:grid}
  .dock{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:12;flex-direction:row;padding:8px 10px;gap:8px;overflow-x:auto;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .has-sel .dock{display:flex}
  .dock-head{display:none}
  .tools{display:flex;gap:8px}
  .tool{flex:none;padding:8px 14px 8px 10px}
  .tool span{display:none}
  .title{font-size:30px}
  .welcome{padding-top:30px}.welcome .hero{font-size:36px}
  .cross{width:80px;height:80px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

.wsrow{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{background:var(--bar);color:var(--bar-ink)}
.iconbtn.del:hover{background:var(--warn);color:#fff}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn:disabled:hover{background:var(--panel);color:inherit}
.wsbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:0;border-radius:999px;padding:8px 16px;text-align:left}
.wsbtn b{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsbtn .caret{width:0;height:0;border:5px solid transparent;border-top:6px solid currentColor;margin-top:6px;flex:none}
.wsbtn[aria-expanded="true"]{background:var(--bar);color:var(--bar-ink)}
.wsbtn[aria-expanded="true"] .label{color:inherit}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mi.on{background:var(--green);color:var(--on-color)}
.mi.on .tiny{color:inherit}
.mi[disabled]{opacity:.4;cursor:default}
.mi[disabled]:hover{background:var(--panel);color:inherit}
.menu{max-height:70vh;overflow:auto}
.rowtool{display:inline-flex;align-items:center;gap:5px;flex:none;align-self:flex-start;background:var(--panel);border:0;border-radius:999px;padding:4px 12px 4px 9px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12px}
.rowtool svg{width:15px;height:15px}
.rowtool:hover{background:var(--bar);color:var(--bar-ink)}
.row:hover .rowtool,.row.sel .rowtool{background:var(--raised)}
.row:hover .rowtool:hover,.row.sel .rowtool:hover{background:var(--bar);color:var(--bar-ink)}
.pick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);flex:none;margin-top:1px;display:grid;place-content:center}
.pick.on{background:var(--blue);border-color:var(--blue)}
.pick.on::after{content:"";width:9px;height:5px;border:2px solid var(--on-color);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.row.picked{background:var(--blue-soft);border-color:var(--blue)}
.selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;background:var(--bar);color:var(--bar-ink);border-radius:999px;padding:8px 8px 8px 12px;box-shadow:0 10px 34px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.selbar .cnt{font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap}
.selx{color:inherit;opacity:.85}
.btn.danger-fill{background:var(--warn);color:#fff}
.btn.danger-fill:hover{background:var(--warn);filter:brightness(1.12)}
.sug{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--blue-soft);border-radius:26px;padding:12px 18px;margin-bottom:16px;font-size:14px}
.sug div{display:flex;gap:8px;flex-wrap:wrap}
.kselect{flex:none !important;width:auto !important}
.tool.off,.mini-t.off{opacity:.4}
@media (max-width:860px){.rowtool{display:none}}

/* ---------- movimiento e interaccion ---------- */
:root{--glow:rgba(42,104,173,.2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glow:rgba(125,180,242,.28)}}
:root[data-theme="dark"]{--glow:rgba(125,180,242,.28)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translate(-50%,60px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes chkpop{0%{transform:scale(1)}35%{transform:scale(1.45)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}60%{transform:rotate(12deg)}}
@keyframes throb{50%{background:var(--orange-soft);transform:scale(1.015)}}
button{transition:background-color .2s,color .2s,transform .22s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,border-color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.93)}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.ghost:hover,.iconbtn:hover,.burger:hover{transform:scale(1.06)}
.tool{transition:transform .22s cubic-bezier(.3,1.5,.5,1),border-color .2s,background-color .2s}
.tool:hover{transform:translateX(4px)}
.tool svg,.mini-t svg,.stage svg,.burger svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tool:hover svg,.mini-t:hover svg{transform:rotate(-8deg) scale(1.2)}
.row{transition:background-color .2s,border-color .2s,box-shadow .25s,transform .22s cubic-bezier(.3,1.5,.5,1)}
.row:hover{transform:translateX(3px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
.row:hover .stage svg{transform:scale(1.25) rotate(-8deg)}
.burger:hover svg{transform:rotate(90deg)}
.brand svg:hover{animation:wiggle .7s}
.mod{transition:box-shadow .25s,transform .25s}
.mod:hover{box-shadow:0 10px 26px rgba(0,0,0,.08)}
.img{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.img:hover{transform:scale(1.04)}
.chip{transition:transform .2s}
.chip:hover{transform:translateY(-2px)}
.mi{transition:background-color .2s,color .2s,transform .2s cubic-bezier(.3,1.5,.5,1)}
.mi:hover{transform:translateX(4px)}
.field,.sow input,.search{transition:border-color .2s,box-shadow .25s}
.field:focus,.sow input:focus,.search:focus{box-shadow:0 0 0 4px var(--glow)}
.title{background:linear-gradient(var(--orange),var(--orange)) left bottom/0 3px no-repeat;transition:background-size .35s ease}
.title:focus{background-size:100% 3px}
.prog i{transition:width .7s cubic-bezier(.2,.9,.3,1.1)}
.chk,.pick{transition:background-color .2s,border-color .2s}
.chk.pop,.pick.pop{animation:chkpop .5s cubic-bezier(.3,1.6,.5,1)}
.kind{transition:background-color .2s,color .2s,border-color .2s,transform .22s cubic-bezier(.3,1.5,.5,1)}
.kind:hover{transform:translateY(-2px)}
.kind[aria-pressed="true"]{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.sug{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.row.drop{animation:throb 1s ease-in-out infinite}
.cross{transform-origin:50% 95%;animation:sway 5s ease-in-out infinite}
.menu{animation:pop .2s cubic-bezier(.2,1.3,.4,1);transform-origin:top right}
.mini-t{animation:pop .28s cubic-bezier(.2,1.4,.4,1) both}
.overlay.on{animation:fade .2s}
.overlay.on .dlg{animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.selbar{animation:rise .4s cubic-bezier(.2,1.3,.4,1)}
.toast{transform:translate(-50%,26px) scale(.95);transition:opacity .25s,transform .5s cubic-bezier(.2,1.5,.4,1)}
.toast.on{transform:translate(-50%,0) scale(1)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70;display:none}

.fold{margin-top:0}
.bmode{display:flex;gap:8px;margin:12px 0 8px}
.mode{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--raised);border:1.5px solid var(--line);border-radius:999px;padding:8px 12px;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.07em;font-weight:700;font-size:14px}
.mode svg{width:17px;height:17px}
.mode:hover{border-color:var(--mc)}
.mode[aria-pressed="true"]{background:var(--mc);border-color:var(--mc);color:var(--mc-ink)}
.fold-b{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .38s cubic-bezier(.2,.9,.3,1),visibility 0s .38s}
.fold.open>.fold-b{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .38s cubic-bezier(.2,.9,.3,1),visibility 0s}
.fold-i{overflow:hidden;min-height:0;padding:0 6px 6px;margin:0 -6px}

.filterbtn.on{background:var(--blue);color:var(--on-color)}
.filterbtn.on:hover{background:var(--blue);color:var(--on-color)}
.grip{flex:none;width:24px;height:30px;margin:-2px -2px 0 -6px;background:none;border:0;color:var(--ink2);cursor:grab;touch-action:none;display:grid;place-items:center;border-radius:12px;padding:0}
.grip svg{width:17px;height:17px}
.grip:hover{color:var(--ink);background:var(--panel)}
.grip:active{cursor:grabbing;transform:none}
.node.dragging{position:relative;z-index:8}
.node.dragging>.row{transition:none;background:var(--raised);border-color:var(--rule);box-shadow:0 16px 38px rgba(0,0,0,.22);cursor:grabbing}
.node.dragging>.row:hover{transform:none}

.inpar{display:inline-flex;align-items:center;gap:2px}
.unl{background:var(--panel);border:0;color:var(--ink2);width:18px;height:18px;padding:0;margin-left:5px;border-radius:999px;font-size:11px;line-height:1;display:inline-grid;place-items:center;font-family:var(--font-d)}
.unl:hover{background:var(--orange);color:var(--on-color)}
.crumb .unl{text-decoration:none;font-weight:400}
.off{opacity:.45}
.mini-task{display:block;width:100%;margin-top:8px;background:var(--panel);border:0;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:600}
.mini-task:not(.off):hover{background:var(--blue);color:var(--on-color)}
.mini-note{margin:6px 8px 0;font-size:11px;line-height:1.3}

.chevbtn{flex:none;width:30px;height:30px;border:0;border-radius:999px;background:var(--panel);color:var(--ink2);display:grid;place-items:center;padding:0;margin-left:4px}
.chevbtn svg{width:16px;height:16px;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.chevbtn[aria-expanded=true]{background:var(--ink);color:var(--bg)}
.chevbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.chevbtn:hover{background:var(--panel2,var(--panel));color:var(--ink)}
#itemmenu{width:230px}

.twist{flex:none;width:24px;height:24px;margin:0 -4px 0 -2px;background:none;border:0;border-radius:999px;color:var(--ink2);display:grid;place-items:center;padding:0}
.twist svg{width:16px;height:16px;transition:transform .28s cubic-bezier(.3,1.5,.5,1)}
.twist[aria-expanded=false] svg{transform:rotate(-90deg)}
.twist:hover{background:var(--panel);color:var(--ink)}
.twist-sp{flex:none;width:20px}
.branch>.fold-b>.fold-i{margin:0 0 0 22px;padding:0 0 2px 8px;border-left:2px solid var(--line);border-radius:0 0 0 16px}
.fold-i:has(.node.dragging){overflow:visible}

.toolwrap{display:flex;align-items:center;gap:6px}
.toolwrap .tool{flex:1;min-width:0}
.tool-add{flex:none;width:34px;height:34px;border:0;border-radius:999px;background:var(--panel);color:var(--mc);display:grid;place-items:center;padding:0}
.tool-add svg{width:18px;height:18px}
.tool-add:hover{background:var(--mc);color:var(--mc-ink)}
.lchip{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--mc)}
.lchip svg{width:14px;height:14px}
.dimt{color:var(--ink2);font-style:italic}
.toseed:hover{background:var(--green);color:var(--on-color)}
.lmi{display:inline-flex;align-items:center;gap:10px}
.lmi svg{width:18px;height:18px;color:var(--mc)}
#loosemenu{width:260px}
@media (max-width:860px){
  .tool-add{display:none}
  .toolwrap{flex:none}
  .rowtool.toseed{display:inline-flex}
  .rowtool.toseed span{display:none}
  .rowtool.toseed{padding:6px}
  .rowtool.toseed svg{width:20px;height:20px}
}

.dsel{border-radius:7px;width:18px;height:18px;margin:3px 2px 0 2px}
.dsel:checked{background:var(--blue);border-color:var(--blue)}
.dsel:hover{border-color:var(--blue)}

.delbtn.on{background:var(--red,#d64532);color:#fff}
.delbtn.on:hover{background:var(--red,#d64532);color:#fff}
.selbar .btn:disabled{opacity:.4;cursor:not-allowed}

.rung{border:0;width:100%;text-align:left;color:var(--ink);cursor:pointer;transition:background-color .25s,color .25s,transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s}
.rung .stage{transition:color .25s}
.rung p{transition:color .25s}
.rung:hover{transform:translateX(4px) scale(1.01);box-shadow:0 10px 26px rgba(0,0,0,.14)}
.rung[data-k=semilla]:hover{background:var(--green)}
.rung[data-k=proyecto]:hover{background:var(--blue)}
.rung[data-k=ecosistema]:hover{background:var(--orange-bar)}
.rung:hover,.rung:hover b,.rung:hover p,.rung:hover .stage{color:#fff}
.rung:hover svg{transform:rotate(-8deg) scale(1.12)}
.rung svg{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.rung:active{transform:scale(.99)}

.delbtn{transition:background-color .3s,color .3s,transform .35s cubic-bezier(.3,1.7,.5,1),box-shadow .35s}
.delbtn.on{box-shadow:0 0 0 4px rgba(214,54,28,.22);animation:delon .55s cubic-bezier(.3,1.6,.5,1)}
.delbtn.on svg{animation:dellid .6s ease-out}
@keyframes delon{0%{transform:scale(.8);box-shadow:0 0 0 0 rgba(214,54,28,.6)}55%{transform:scale(1.18)}100%{transform:scale(1);box-shadow:0 0 0 4px rgba(214,54,28,.22)}}
@keyframes dellid{0%{transform:rotate(0)}30%{transform:rotate(-14deg) translateY(-1px)}60%{transform:rotate(8deg)}100%{transform:rotate(0)}}
.selallwrap{display:inline-flex;align-items:center;gap:7px;flex:none;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transform:translateX(-10px) scale(.4);transform-origin:left center;margin-left:-8px;pointer-events:none;font-family:var(--font-d);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:13px;color:var(--ink2);transition:max-width .45s cubic-bezier(.2,.9,.3,1),opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1),margin .45s}
.selallwrap.show{max-width:110px;opacity:1;transform:none;margin-left:0;pointer-events:auto}
.selallwrap .chk{margin:0}
.selall:indeterminate{background:var(--blue);border-color:var(--blue)}
.selall:indeterminate::after{content:"";width:9px;height:2px;background:var(--on-color);border:0;transform:none}

.row.drop.conv{outline-color:var(--green);background:var(--green-soft)}

.selbar .trashfill{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%}
.selbar .trashfill svg{width:22px;height:22px}
.selbar .trashfill:not(:disabled):hover svg{animation:dellid .5s ease-out}

@media (min-width:861px){
  .app{transition:grid-template-columns .5s cubic-bezier(.2,.9,.3,1)}
  .app.dock-min{grid-template-columns:78px minmax(300px,410px) 1fr}
  .app.dock-right.dock-min{grid-template-columns:minmax(300px,410px) 1fr 78px}
  .dock{overflow-x:hidden;transition:padding .5s cubic-bezier(.2,.9,.3,1)}
  .dock-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .dock-top h2{max-width:170px;overflow:hidden;white-space:nowrap;opacity:1;transition:max-width .45s cubic-bezier(.2,.9,.3,1),opacity .25s}
  .dock-head .tiny{max-height:80px;overflow:hidden;opacity:1;transition:max-height .45s cubic-bezier(.2,.9,.3,1),opacity .25s,margin .45s}
  .dockmin{flex:none;width:36px;height:36px}
  .dockmin svg{transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
  .dockmin:hover svg{animation:nudge .6s ease-in-out infinite}
  .app.dock-right .dockmin svg{transform:rotate(180deg)}

/* ---------- transformar módulos ---------- */
function xfText(m){
  var t="",k=m.t;
  if(k==="nota"||k==="descripcion")t=m.text||"";
  else if(k==="fecha")t=m.v?fmt(m.v):"";
  else if(k==="comentarios")t=m.items.map(function(c){return c.text}).join("\n");
  else if(k==="etiquetas")t=m.items.join(", ");
  else if(k==="tareas")t=m.items.map(function(i){return i.t}).join("\n");
  else if(k==="links")t=m.items.map(function(i){return (i.label?i.label+" ":"")+i.url}).join("\n");
  else if(k==="adjuntos")t=m.items.map(function(i){return i.name}).join("\n");
  if(m.caption)t=t?t+"\n"+m.caption:m.caption;
  return t.trim();
}
function xfBuild(to,text){
  var n=mkMod(to),lines=text.split(/\n+/).map(function(x){return x.trim()}).filter(Boolean);
  if(to==="nota"||to==="descripcion")n.text=text;
  else if(to==="comentarios")n.items=lines.map(function(x){return {id:uid(),ts:Date.now(),text:x}});
  else if(to==="etiquetas"){var seen={};n.items=text.split(/[\n,]+/).map(function(x){return x.trim()}).filter(function(x){if(!x||seen[x.toLowerCase()])return false;seen[x.toLowerCase()]=1;return true})}
  else if(to==="tareas")n.items=lines.map(function(x){return {id:uid(),t:x,done:false}});
  else if(to==="links"){
    var rest=[];n.items=[];
    lines.forEach(function(x){var mm=x.match(/https?:\/\/\S+/i);if(mm)n.items.push({id:uid(),url:mm[0],label:x.replace(mm[0],"").trim()});else rest.push(x)});
    n.caption=rest.join("\n");
  }
  else{n.caption=text}
  return n;
}
function xfApply(s,from,to){
  var old=mod(s,from);if(!old||mod(s,to)&&!s.loose)return;
  var n=xfBuild(to,xfText(old));
  if(s.loose)s.mods=[n];else{s.mods[s.mods.indexOf(old)]=n;sortMods(s)}
  save();renderList();renderDetail(true);toast("Módulo transformado en "+TOOLNAME[to].n);
}
function mergeMod(s,n){
  var ex=mod(s,n.t);
  if(!ex){s.mods.push(n);return}
  if(n.t==="nota"||n.t==="descripcion")ex.text=(ex.text&&n.text?ex.text+"\n\n":ex.text||"")+(n.text||"");
  else if(n.t==="etiquetas"){var low=ex.items.map(function(x){return x.toLowerCase()});n.items.forEach(function(x){if(low.indexOf(x.toLowerCase())<0){ex.items.push(x);low.push(x.toLowerCase())}})}
  else if(n.t==="fecha"){if(!ex.v&&n.v)ex.v=n.v}
  else if(n.items)ex.items=ex.items.concat(n.items);
  if(n.caption)ex.caption=ex.caption?ex.caption+"\n"+n.caption:n.caption;
}
function dropTask(s,tk){var tm=mod(s,"tareas");if(tm)tm.items=tm.items.filter(function(z){return z.id!==tk.id})}

var cv=null,cx=null,parts=[],raf=0;
function palette(){var cs=getComputedStyle(document.documentElement);return ["--green","--blue","--orange","--red","--ink"].map(function(v,i){return cs.getPropertyValue(v).trim()||["#2c8447","#2a68ad","#e8751a","#d6361c","#111"][i]})}
function party(x,y,n,spread,power){
  if(REDUCED)return;
  if(!cv){cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);cx=cv.getContext&&cv.getContext("2d")}
  if(!cx)return;
  var dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  cv.style.display="block";
  var cols=palette();
  for(var i=0;i<n;i++){
    var a=-Math.PI/2+(Math.random()-.5)*spread,v=(power||11)*(.45+Math.random()*.75);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.3+Math.random()*.12,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:5+Math.random()*6,h:3+Math.random()*5,c:cols[i%cols.length],circle:Math.random()<.3,life:90+Math.random()*60});
  }
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  var dpr=window.devicePixelRatio||1,H=window.innerHeight;
  cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){p.vx*=.992;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;return p.life>0&&p.y<H+30});
  parts.forEach(function(p){
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;
    if(p.circle){cx.beginPath();cx.arc(0,0,p.w/2,0,6.28);cx.fill()}else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  });
  if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cv.style.display="none"}
}

var Sync={db:null,assets:null,uid:null,meta:null,col:null,ready:false,state:"local",synced:{},metaJ:null,base:null,busy:false,again:false,choosing:false,pendRender:false,warned:{},backend:null,pend:null};

function applyPar(m){if(!m||typeof m.parOn==='undefined')return false;var on=!!m.parOn,ids=Array.isArray(m.par)?m.par.filter(okSeg):[];var ch=on!==!!S.ui.parOn||JSON.stringify(ids)!==JSON.stringify(S.ui.par||[]);S.ui.parOn=on;S.ui.par=ids;return ch}

function setSync(st,msg){
  Sync.state=st;var el=$("#syncst");if(!el)return;
  var t={local:"Solo en este dispositivo",loading:"Conectando con la nube…",offline:"Sin conexión. Guardando en este dispositivo",saving:"Guardando en la nube…",ok:"Sincronizado en la nube",error:"Error al sincronizar"}[st]||"";

function isEditing(){var a=document.activeElement;return !!(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!/^(checkbox|radio|button|file)$/.test(a.type))||a.isContentEditable))}

  S.seeds=S.seeds.map(function(s,i){return [s,i]}).sort(function(a,b){var pa=a[0].id in pos?pos[a[0].id]:1e9+a[1],pb=b[0].id in pos?pos[b[0].id]:1e9+b[1];return pa-pb}).map(function(x){return x[0]});
}

/* sube a la nube las imágenes que todavía están dentro de los datos */
function uploadImages(){
  if(!Sync.assets)return Promise.resolve(false);
  var jobs=[];
  var addJ=function(m){if(m&&m.items)m.items.forEach(function(i){if(typeof i.src==="string"&&i.src.slice(0,5)==="data:"&&!i._up)jobs.push(i)})};
  S.seeds.forEach(function(s){addJ(mod(s,"imagenes"));var tm=mod(s,"tareas");if(tm&&tm.items)tm.items.forEach(function(t){addJ(tmod(t,"imagenes"))})});
  if(!jobs.length)return Promise.resolve(false);
  var changed=false,k=0;
  function next(){
    if(k>=jobs.length)return Promise.resolve();
    var i=jobs[k++],d=dataBytes(i.src);if(!d)return next();
    var mime=/^image\/(png|jpeg|gif|webp|svg\+xml)$/.test(d.mime)?d.mime:null;if(!mime)return next();
    i._up=1;
    return Sync.assets.upload(new Blob([d.bytes],{type:mime}),{type:mime}).then(function(r){
      delete i._up;if(i.src.slice(0,5)==="data:"){i.src="/_blob/"+r.id;i.mime=mime;changed=true}
    },function(err){delete i._up;var c=err&&err.code;
      if(!Sync.warned.img){Sync.warned.img=1;toast(c==="quota_or_state"?"Se llenó el espacio para imágenes en la nube":"Algunas imágenes no se pudieron subir a la nube")}
    }).then(next);
  }
  return Promise.all([next(),next(),next()]).then(function(){if(changed)localWrite();return changed});
}
function syncFlush(){
  if(!Sync.ready)return;
  if(Sync.busy){Sync.again=true;return}
  Sync.busy=true;Sync.again=false;
  doFlush().catch(function(){}).then(function(){Sync.busy=false;if(Sync.again)syncFlush();else if(Sync.backend&&Sync.backend.again){Sync.backend.again=false;Sync.backend.sched()}});
}
function doFlush(){
  return uploadImages().then(function(){
    var ops=[],seen={},failed=false;
    S.seeds.forEach(function(s){
      if(!okSeg(s.id))return;seen[s.id]=1;
      var j=JSON.stringify(s);if(Sync.synced[s.id]===j)return;
      var prev=Sync.synced[s.id];Sync.synced[s.id]=j;
      ops.push(function(){return Sync.col.doc(s.id).set(JSON.parse(j)).catch(function(err){
        if(Sync.synced[s.id]===j){if(prev===undefined)delete Sync.synced[s.id];else Sync.synced[s.id]=prev}
        failed=true;syncErr(err);
      })});
    });
    Object.keys(Sync.synced).forEach(function(id){
      if(seen[id])return;var prev=Sync.synced[id];delete Sync.synced[id];
      ops.push(function(){return Sync.col.doc(id).delete().catch(function(err){if(!(id in Sync.synced))Sync.synced[id]=prev;failed=true;syncErr(err)})});
    });
    var mj=JSON.stringify(metaObj());
    if(mj!==Sync.metaJ){var pm=Sync.metaJ;Sync.metaJ=mj;ops.push(function(){return Sync.meta.set(JSON.parse(mj)).catch(function(err){if(Sync.metaJ===mj)Sync.metaJ=pm;failed=true;syncErr(err)})})}
    if(!ops.length){saveBase();if(Sync.state!=="ok"&&Sync.state!=="error")setSync("ok");return}
    setSync("saving");
    var k=0;function lane(){if(k>=ops.length)return Promise.resolve();return ops[k++]().then(lane)}
    var lanes=[];for(var n=0;n<Math.min(6,ops.length);n++)lanes.push(lane());
    return Promise.all(lanes).then(function(){saveBase();setSync(failed?"error":"ok")});
  });
}
function syncErr(err){
  var c=err&&err.code;
  if(c==="invalid_argument"&&!Sync.warned.big){Sync.warned.big=1;toast("Un seed es demasiado grande para la nube (máx. 256 KB). Quita imágenes pesadas.")}
  else if(c==="quota_exceeded"&&!Sync.warned.q){Sync.warned.q=1;toast("Se llenó el espacio en la nube")}
  else if(c==="revoked"){Sync.ready=false;setSync("local")}
}

/* primera carga: une lo local con lo que hay en la nube */
function reconcile(metaSnap,seedsSnap){
  var remote={},rj={};
  seedsSnap.docs.forEach(function(d){var o=d.data();if(!o)return;var c=JSON.parse(JSON.stringify(o));if(!c.id)c.id=d.id;remote[c.id]=c;rj[c.id]=JSON.stringify(c)});
  var rmeta=metaSnap.exists?JSON.parse(JSON.stringify(metaSnap.data())):null;
  var base=loadBase(),local={};S.seeds.forEach(function(s){local[s.id]=s});
  if(!rmeta&&!seedsSnap.size){
    /* nube vacía: este dispositivo la llena */
    Sync.synced={};Sync.metaJ=null;finishInit(false);return;
  }
  if(!base){
    var extra=S.seeds.filter(function(s){return !(s.id in remote)});
    if(extra.length){askMerge(extra,remote,rj,rmeta);return}
    takeRemote(remote,rj,rmeta,[]);return;
  }
  /* con historial: 3 vías por seed */
  var out=[],ids={};
  Object.keys(remote).forEach(function(id){ids[id]=1});Object.keys(local).forEach(function(id){ids[id]=1});
  var keep={};Sync.synced={};
  Object.keys(ids).forEach(function(id){
    var bh=base.seeds[id],l=local[id],r=remote[id];
    var lch=l?(!bh||hsh(JSON.stringify(l))!==bh):!!bh;
    var rch=r?(!bh||hsh(rj[id])!==bh):!!bh;
    if(r)Sync.synced[id]=rj[id];
    if(lch&&!rch){if(l)keep[id]=l}
    else if(r)keep[id]=r;
  });
  var mj=rmeta?JSON.stringify(rmeta):null;Sync.metaJ=mj;
  var lmh=hsh(JSON.stringify(metaObj())),lmhOld=hsh(JSON.stringify(metaLegacyObj()));
  var localMetaChanged=base.meta&&lmh!==base.meta&&lmhOld!==base.meta&&(!mj||hsh(mj)===base.meta);
  if(rmeta&&!localMetaChanged){S.workspaces=Array.isArray(rmeta.workspaces)?rmeta.workspaces:S.workspaces;S.v=rmeta.v||S.v;applyPar(rmeta)}
  var order=(localMetaChanged||!rmeta)?S.seeds.map(function(s){return s.id}):rmeta.order;
  S.seeds=Object.keys(keep).map(function(id){var l=local[id];if(l&&keep[id]!==l){replaceInPlace(l,keep[id]);return l}return keep[id]});
  orderSeeds(order);
  finishInit(true);
}
function takeRemote(remote,rj,rmeta,extra){
  var local={};S.seeds.forEach(function(s){local[s.id]=s});
  Sync.synced=Object.assign({},rj);Sync.metaJ=rmeta?JSON.stringify(rmeta):null;
  var list=Object.keys(remote).map(function(id){var l=local[id];if(l){replaceInPlace(l,remote[id]);return l}return remote[id]});
  if(rmeta&&Array.isArray(rmeta.workspaces)&&rmeta.workspaces.length){
    var ws=rmeta.workspaces.slice();
    if(extra.length){var have={};ws.forEach(function(w){have[w.id]=1});var need={};extra.forEach(function(s){need[s.ws]=1});
      S.workspaces.forEach(function(w){if(need[w.id]&&!have[w.id])ws.push(w)})}
    S.workspaces=ws;S.v=rmeta.v||S.v;applyPar(rmeta);
  }
  S.seeds=list.concat(extra);if(rmeta)orderSeeds(rmeta.order.concat(extra.map(function(s){return s.id})));
  finishInit(true);
}
function askMerge(extra,remote,rj,rmeta){

}

function finishInit(changed){

/* cambios que llegan de otros dispositivos */
function onSeeds(snap){
  if(!Sync.ready)return;var dirty=false;
  snap.docChanges().forEach(function(ch){
    var id=ch.doc.id;
    if(ch.type==="removed"){
      if(!(id in Sync.synced))return;delete Sync.synced[id];
      var n=S.seeds.length;S.seeds=S.seeds.filter(function(s){return s.id!==id});if(S.seeds.length!==n)dirty=true;return;
    }
    var o=ch.doc.data();if(!o)return;var j=JSON.stringify(o);if(Sync.synced[id]===j)return;
    var c=JSON.parse(j);if(!c.id)c.id=id;j=JSON.stringify(c);if(Sync.synced[id]===j)return;
    Sync.synced[id]=j;var l=byId(id);
    if(l){if(JSON.stringify(l)!==j){replaceInPlace(l,c);dirty=true}}else{S.seeds.push(c);dirty=true}
  });
  if(dirty){if(Sync.metaJ){try{orderSeeds(JSON.parse(Sync.metaJ).order)}catch(e){}}saveBase();localWrite();remoteRender()}
}
function onMeta(snap){
  if(!Sync.ready||!snap.exists)return;var o=snap.data(),j=JSON.stringify(o);if(j===Sync.metaJ)return;
  Sync.metaJ=j;var m=JSON.parse(j);

/* Backend Supabase: tabla organic_docs (una fila por seed + una fila «meta» por usuario).
   Expone la misma interfaz que usaba la nube anterior (doc().set/delete y onSnapshot). */
function sbBackend(sb,uid){
  var T="organic_docs",B={dead:false,mL:[],sL:[],pS:{},pSJ:{},pMJ:null,first:true,pending:0,wseq:0,again:false,timer:null,chan:null};
  var mk=function(id,data){return {id:id,data:function(){return data}}};
  var row=function(tipo,id,data){return {user_id:uid,tipo:tipo,doc_id:id,data:data,updated_at:new Date().toISOString()}};
  function wrap(p){
    B.pending++;B.wseq++;
    return Promise.resolve(p).then(function(r){if(r&&r.error)throw r.error;return r}).then(function(v){B.pending--;return v},function(e){B.pending--;throw e});
  }
  B.upsert=function(tipo,id,data){return wrap(sb.from(T).upsert(row(tipo,id,data)))};
  B.remove=function(id){return wrap(sb.from(T).delete().eq("user_id",uid).eq("tipo","seed").eq("doc_id",id))};
  var busy=function(){return B.pending>0||Sync.busy};
  B.refresh=function(){
    if(B.dead)return Promise.resolve();
    if(!B.first&&busy()){B.again=true;return Promise.resolve()}
    var w0=B.wseq;
    return Promise.resolve(sb.from(T).select("tipo,doc_id,data").eq("user_id",uid).range(0,4999)).then(function(r){
      if(r.error)throw r.error;
      if(B.dead)return;
      if(!B.first&&(busy()||B.wseq!==w0)){B.again=true;return}
      var meta=null,seeds={},sj={},id;
      (r.data||[]).forEach(function(x){if(x.tipo==="meta")meta=x.data;else if(x.tipo==="seed"){seeds[x.doc_id]=x.data;sj[x.doc_id]=JSON.stringify(x.data)}});
      var changes=[];
      for(id in seeds){if(!(id in B.pSJ))changes.push({type:"added",doc:mk(id,seeds[id])});else if(B.pSJ[id]!==sj[id])changes.push({type:"modified",doc:mk(id,seeds[id])})}
      for(id in B.pSJ){if(!(id in sj))changes.push({type:"removed",doc:mk(id,B.pS[id])})}
      var mj=meta?JSON.stringify(meta):null,first=B.first,metaChanged=first||mj!==B.pMJ;
      B.pS=seeds;B.pSJ=sj;B.pMJ=mj;B.first=false;
      var call=function(list,snap){list.forEach(function(l){try{l.cb(snap)}catch(e){console.warn("Organic: error al aplicar la nube",e)}})};
      if(metaChanged)call(B.mL,{exists:!!meta,data:function(){return meta},metadata:{fromCache:false}});
      if(first||changes.length)call(B.sL,{docs:Object.keys(seeds).map(function(k){return mk(k,seeds[k])}),size:Object.keys(seeds).length,metadata:{fromCache:false},docChanges:function(){return changes}});
    });
  };
  B.sched=function(){clearTimeout(B.timer);B.timer=setTimeout(function(){B.refresh().catch(function(e){console.warn("Organic: no se pudo leer la nube",e)})},300)};
  B.start=function(){
    B.chan=sb.channel("organic-docs-"+uid).on("postgres_changes",{event:"*",schema:"public",table:T,filter:"user_id=eq."+uid},function(){B.sched()}).subscribe();
    var n=0;(function go(){B.refresh().catch(function(e){
      if(B.dead)return;
      if(++n<4)setTimeout(go,4000*n);
      else B.mL.concat(B.sL).forEach(function(l){if(l.fail)l.fail(e)});
    })})();
  };
  B.stop=function(){B.dead=true;clearTimeout(B.timer);try{if(B.chan)sb.removeChannel(B.chan)}catch(e){}};
  return B;
}
function stopSync(){
  if(Sync.backend)Sync.backend.stop();
  Sync.db=null;Sync.assets=null;Sync.uid=null;Sync.meta=null;Sync.col=null;Sync.ready=false;Sync.synced={};Sync.metaJ=null;Sync.base=null;
  Sync.busy=false;Sync.again=false;Sync.choosing=false;Sync.pendRender=false;Sync.warned={};Sync.backend=null;Sync.pend=null;
  setSync("local");
}
function startSync(sb,uid){
  stopSync();
  if(!sb||!uid||!okSeg(String(uid)))return;
  var B=sbBackend(sb,uid);
  Sync.backend=B;Sync.uid=String(uid);Sync.assets=null; /* las imágenes viajan dentro de cada seed */
  Sync.meta={set:function(o){return B.upsert("meta","meta",o)},onSnapshot:function(cb,fail){B.mL.push({cb:cb,fail:fail})}};
  Sync.col={doc:function(id){return {set:function(o){return B.upsert("seed",id,o)},delete:function(){return B.remove(id)}}},onSnapshot:function(cb,fail){B.sL.push({cb:cb,fail:fail})}};
  setSync("loading");
  var ms=null,ss=null,done=false;
  var tm=setTimeout(function(){if(!done&&Sync.backend===B)setSync("offline")},10000);
  var tryInit=function(){if(done||!ms||!ss||Sync.backend!==B)return;done=true;clearTimeout(tm);try{reconcile(ms,ss)}catch(e){setSync("error")}};
  var fail=function(e){clearTimeout(tm);if(!done){done=true}if(Sync.backend!==B)return;Sync.ready=false;setSync("error")};
  Sync.meta.onSnapshot(function(s){if(Sync.backend!==B)return;if(!done){ms=s;tryInit();return}onMeta(s)},fail);
  Sync.col.onSnapshot(function(s){if(Sync.backend!==B)return;if(!done){ss=s;tryInit();return}onSeeds(s)},fail);
  B.start();
}
window.addEventListener("online",function(){if(Sync.backend){Sync.backend.sched();syncFlush()}});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&Sync.backend&&Sync.ready)Sync.backend.sched()});

/* ---------- cuentas (Supabase Auth) ---------- */
var Auth={sb:null,user:null,mode:"login",recovering:false};
var AM={
  login:{t:"Iniciar sesión",ayuda:"Entra para ver tus seeds en cualquier dispositivo.",ok:"Entrar",nombre:0,correo:1,clave:1,cp:"current-password"},
  registro:{t:"Crear cuenta",ayuda:"Tus seeds quedan guardados en tu cuenta y solo tú los ves.",ok:"Crear cuenta",nombre:1,correo:1,clave:1,cp:"new-password"},
  olvide:{t:"Recuperar contraseña",ayuda:"Escribe tu correo y te enviamos un enlace para crear una contraseña nueva.",ok:"Enviar enlace",nombre:0,correo:1,clave:0},
  nueva:{t:"Nueva contraseña",ayuda:"Escribe la contraseña nueva para tu cuenta.",ok:"Guardar contraseña",nombre:0,correo:0,clave:1,cp:"new-password"}
};
var AUTH_PIE={login:[["registro","Crear cuenta"],["olvide","Olvidé mi contraseña"]],registro:[["login","Ya tengo cuenta"]],olvide:[["login","Volver"]],nueva:[["cancelar","Cancelar"]]};
var SIN_SERVICIO="No se pudo cargar el servicio de acceso. Recarga la página.";
function authMsg(e){
  var c=(e&&e.code)||"",m=String((e&&e.message)||"").toLowerCase();
  if(c==="invalid_credentials")return "Correo o contraseña incorrectos.";
  if(c==="email_not_confirmed")return "Confirma tu correo: te enviamos un enlace de verificación.";
  if(c==="user_already_exists"||c==="email_exists")return "Ya existe una cuenta con ese correo. Inicia sesión.";
  if(c==="weak_password")return "La contraseña es muy débil. Usa al menos 8 caracteres, con letras y números.";
  if(c==="same_password")return "La contraseña nueva debe ser distinta de la anterior.";
  if(c==="over_email_send_rate_limit"||c==="over_request_rate_limit")return "Demasiados intentos. Espera unos minutos e inténtalo de nuevo.";
  if(/fetch|network/.test(m))return "No hay conexión con el servicio. Revisa tu internet.";
  return "No se pudo completar la acción. Inténtalo de nuevo.";
}
function authShow(mode){
  var m=AM[mode]||AM.login;Auth.mode=mode;
  $("#au-titulo").textContent=m.t;$("#au-ayuda").textContent=m.ayuda;$("#au-ok").textContent=m.ok;
  $("#au-nombre").hidden=!m.nombre;$("#au-correo").hidden=!m.correo;$("#au-clave").hidden=!m.clave;
  if(m.cp)$("#au-clave").setAttribute("autocomplete",m.cp);
  $("#au-clave").placeholder=mode==="registro"||mode==="nueva"?"Contraseña (mínimo 8 caracteres)":"Contraseña";
  $("#au-err").hidden=true;$("#au-info").hidden=true;
  $("#au-pie").innerHTML=AUTH_PIE[mode].map(function(x){return '<button type="button" class="auth-link" data-m="'+x[0]+'">'+x[1]+'</button>'}).join("");
  $("#auth").classList.add("on");
  setTimeout(function(){var f=m.correo?$("#au-correo"):$("#au-clave");if(f)f.focus()},30);
}
function authHide(){$("#auth").classList.remove("on")}
function authFail(msg,focus){var e=$("#au-err");e.textContent=msg;e.hidden=false;if(focus)focus.focus()}
function pintarUsuario(){if(window.Suite)Suite.setUser(Auth.user,Auth.sb)}
function resetS(){S={v:3,workspaces:[],seeds:[],ui:{dock:"left",ws:null,sel:null,filter:"pendientes",q:""}};picked={};dmode=false}
function entrarUsuario(u){
  if(!u)return;
  if(Auth.user&&Auth.user.id===u.id){Auth.user=u;pintarUsuario();return}
  if(Auth.recovering)return;
  Auth.user=u;KEY="organic.v2."+u.id;SYNCKEY="organic.sync."+u.id;
  resetS();load();
  if(S.ui.sel&&!byId(S.ui.sel))S.ui.sel=null;
  if(window.innerWidth<=860)S.ui.sel=null;
  closeMenu();renderAll();authHide();pintarUsuario();
  var id=u.id;setTimeout(function(){if(Auth.user&&Auth.user.id===id)startSync(Auth.sb,id)},0);
}
function salirUsuario(){
  if(!Auth.user)return;
  Auth.user=null;stopSync();KEY="organic.v2.invitado";SYNCKEY="organic.sync.invitado";
  resetS();load();closeMenu();renderAll();pintarUsuario();authShow("login");
}
window.OrganicApp={exportar:function(){showExport()},importar:function(){showImport()},salir:function(){cerrarSesion()}};
function cerrarSesion(){
  var done=function(){salirUsuario()};
  if(!Auth.sb){done();return}
  Promise.resolve(Auth.sb.auth.signOut({scope:"local"})).catch(function(){}).then(done);
}
function iniciarAuth(){
  var cfg=window.ORGANIC_CFG||{};
  Auth.recovering=/(^|[#&?])type=recovery/.test(location.hash+location.search);
  if(window.supabase&&window.supabase.createClient&&cfg.url&&cfg.anon){
    Auth.sb=window.supabase.createClient(cfg.url,cfg.anon,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }
  var hint=false;try{hint=!!(cfg.url&&localStorage.getItem("sb-"+new URL(cfg.url).hostname.split(".")[0]+"-auth-token"))}catch(e){}
  $("#au-pie").addEventListener("click",function(e){
    var b=e.target.closest("[data-m]");if(!b)return;var m=b.dataset.m;
    if(m==="cancelar"){Auth.recovering=false;if(Auth.sb)Auth.sb.auth.signOut({scope:"local"}).catch(function(){});authShow("login");return}
    authShow(m);
  });
  $("#au-form").addEventListener("submit",function(e){
    e.preventDefault();
    var mode=Auth.mode,mail=$("#au-correo").value.trim(),pw=$("#au-clave").value,ok=$("#au-ok"),label=AM[mode].ok;
    $("#au-err").hidden=true;$("#au-info").hidden=true;
    var okMail=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail);
    if(AM[mode].correo&&!okMail){authFail("Escribe un correo válido, por ejemplo tucorreo@ejemplo.com.",$("#au-correo"));return}
    if(AM[mode].clave){
      if(mode==="login"&&!pw){authFail("Escribe tu contraseña.",$("#au-clave"));return}
      if(mode!=="login"&&pw.length<8){authFail("La contraseña debe tener al menos 8 caracteres.",$("#au-clave"));return}
    }
    if(!Auth.sb){authFail(SIN_SERVICIO);return}
    ok.disabled=true;ok.textContent="Un momento…";
    var fin=function(){ok.disabled=false;ok.textContent=label};
    var auth=Auth.sb.auth,p;
    if(mode==="login")p=auth.signInWithPassword({email:mail,password:pw}).then(function(r){
      if(r.error){authFail(authMsg(r.error),$("#au-clave"));return}
      Auth.recovering=false;$("#au-form").reset();entrarUsuario(r.data.session.user);
    });
    else if(mode==="registro")p=auth.signUp({email:mail,password:pw,options:{data:{nombre:$("#au-nombre").value.trim()},emailRedirectTo:location.origin+location.pathname}}).then(function(r){
      if(r.error){authFail(authMsg(r.error));return}
      if(r.data.session){Auth.recovering=false;$("#au-form").reset();entrarUsuario(r.data.session.user)}
      else{$("#au-form").reset();var i=$("#au-info");i.textContent="Cuenta creada. Te enviamos un correo para confirmarla: ábrelo y luego inicia sesión.";i.hidden=false}
    });
    else if(mode==="olvide")p=auth.resetPasswordForEmail(mail,{redirectTo:location.origin+location.pathname}).then(function(r){
      if(r.error){authFail(authMsg(r.error));return}
      var i=$("#au-info");i.textContent="Si el correo está registrado, te enviamos un enlace para crear una contraseña nueva.";i.hidden=false;
    });
    else p=auth.updateUser({password:pw}).then(function(r){
      if(r.error){authFail(authMsg(r.error));return}
      Auth.recovering=false;$("#au-form").reset();
      return auth.getSession().then(function(s){if(s.data&&s.data.session)entrarUsuario(s.data.session.user)});
    });
    Promise.resolve(p).catch(function(x){authFail(authMsg(x))}).then(fin);
  });
  if(!Auth.sb){authShow("login");authFail(SIN_SERVICIO);return}
  /* Dentro del callback no se llama a Supabase directamente: se difiere con setTimeout. */
  Auth.sb.auth.onAuthStateChange(function(ev,session){
    if(ev==="PASSWORD_RECOVERY"){Auth.recovering=true;setTimeout(function(){authShow("nueva")},0);return}
    if(ev==="SIGNED_OUT"){setTimeout(salirUsuario,0);return}
    if(session)setTimeout(function(){entrarUsuario(session.user)},0);
    else if(ev==="INITIAL_SESSION")setTimeout(function(){if(!Auth.user)authShow(Auth.recovering?"nueva":"login")},0);
  });
  if(!hint||Auth.recovering)authShow(Auth.recovering?"nueva":"login");
}

/* exportar e importar */
function showDlg(h){$("#dlg").innerHTML=h;$("#ov").classList.add("on")}
function closeDlg(){$("#ov").classList.remove("on")}
$("#ov").addEventListener("click",function(e){if(e.target.id==="ov"&&!Sync.choosing)closeDlg()});
function exportData(){
  var seeds=JSON.parse(JSON.stringify(S.seeds)),jobs=[];
  var addE=function(m){if(m&&m.items)m.items.forEach(function(i){if(i.src&&i.src.slice(0,5)!=="data:")jobs.push(i)})};
  seeds.forEach(function(sd){addE(mod(sd,"imagenes"));var tm=mod(sd,"tareas");if(tm&&tm.items)tm.items.forEach(function(t){addE(tmod(t,"imagenes"))})});
  return Promise.all(jobs.map(function(i){return srcBytes(i).then(function(d){if(!d)return;
    return new Promise(function(res){var r=new FileReader();r.onload=function(){i.src=r.result;delete i.mime;res()};r.onerror=function(){res()};r.readAsDataURL(new Blob([d.bytes],{type:d.mime}))})})})).then(function(){
    return JSON.stringify({v:3,workspaces:S.workspaces,seeds:seeds});
  });
}
function showExport(){exportData().then(function(txt){var ta=$("#dlg textarea[data-exp]");if(ta){ta.value=txt;ta.disabled=false}});showDlg('<h2 style="font-size:18px;margin-bottom:8px" class="bar">Exportar</h2><p class="tiny">Copia este texto o descárgalo como archivo .json. Las imágenes van incluidas.</p><textarea readonly disabled data-exp aria-label="Datos exportados">Preparando…</textarea><div class="inline" style="justify-content:flex-end"><button class="ghost" data-a="dlgclose">Cerrar</button><button class="ghost" data-a="dlexport"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:6px"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Descargar archivo</button><button class="btn" data-a="copy">Copiar</button></div>')}
function showImport(){showDlg('<h2 style="font-size:18px;margin-bottom:8px" class="bar">Importar</h2><p class="tiny">Pega aquí un export de Organic. Esto reemplaza todos los workspaces y seeds actuales, también en la nube.</p><textarea id="imp" aria-label="Datos a importar"></textarea><div class="inline" style="justify-content:flex-end"><button class="ghost" data-a="dlgclose">Cancelar</button><button class="btn" data-a="doimport">Importar</button></div>')}
function doImport(){
  try{var o=JSON.parse($("#imp").value);if(!o||!Array.isArray(o.seeds))throw 0;
    o.seeds.forEach(function(s){if(!s.id||typeof s.title!=="string"||!Array.isArray(s.mods))throw 0;s.rel=[]});
    S.seeds=o.seeds;S.workspaces=Array.isArray(o.workspaces)?o.workspaces:[];S.v=o.v||0;S.ui.ws=null;migrate();S.ui.sel=null;sm=false;dmode=false;picked={};save();closeDlg();renderAll();toast("Importación lista");
  }catch(er){toast("El texto no tiene el formato de Organic")}
}

load();
if(S.ui.sel&&!byId(S.ui.sel))S.ui.sel=null;
if(window.innerWidth<=860)S.ui.sel=null;
renderAll();
iniciarAuth();
})();
</script>

Suite.init({ app: 'organic', fit: '.app', onSignOut: function () { OrganicApp.salir(); } });
Suite.addMenuItems([
  { label: 'Exportar datos', onClick: function () { OrganicApp.exportar(); } },
  { label: 'Importar datos', onClick: function () { OrganicApp.importar(); } }
]);
</script>
