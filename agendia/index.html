<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AgendIA (Versión Beta)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="stylesheet" href="../suite/suite.css?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: misma línea de PrecIA. Navegación en píldora fija arriba; Explorar = hero morado + filtros + rejilla de negocios;
   reserva en hoja (abajo en celular, centrada en escritorio); Panel = KPIs + calendario semanal por carriles de profesional + lateral de integración. */
:root {
  --bg: #F7F5FB;
  --surface: #FFFFFF;
  --surface-2: #EFEBF8;
  --ink: #1C1838;
  --ink-2: #4F4A6E;
  --line: #E1DCF0;
  --brand: #4B3FC4;
  --brand-solid: #4B3FC4;
  --brand-soft: #E9E6FB;
  --on-brand: #FFFFFF;
  --accent: #C0398B;
  --accent-soft: #FBE6F2;
  --gray: #96989A;
  --peach: #FFB38A;
  --peach-soft: #FFEADD;
  --ok: #1F7A4D;
  --ok-soft: #E2F2E9;
  --warn: #855600;
  --warn-soft: #FBF0D9;
  --danger: #B3261E;
  --danger-soft: #FBE7E5;
  --shadow: 0 1px 2px rgba(29,27,58,.06), 0 8px 24px rgba(29,27,58,.08);
  --scrim: rgba(28,24,56,.48);
  --font-display: "Climate Crisis", "Work Sans", system-ui, sans-serif;
  --font-body: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --fx-1: #9A90F0; --fx-2: #E27CB5; --fx-3: #FFB38A;
  --dur: 200ms;
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --spring-suave: cubic-bezier(.32, 1.25, .5, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122B; --surface: #1E1B3C; --surface-2: #2A2652; --ink: #EEECF8; --ink-2: #B9B6D3; --line: #3A3665;
    --brand: #A79BFF; --brand-solid: #5B4FD6; --brand-soft: #2D2870; --on-brand: #FFFFFF;
    --accent: #F08CC6; --accent-soft: #3F2038; --gray: #96989A; --peach: #E9A27C; --peach-soft: #3B2A22;
    --ok: #74D6A4; --ok-soft: #173328; --warn: #F2C46B; --warn-soft: #352A12; --danger: #FF8E85; --danger-soft: #3B1C1C;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --scrim: rgba(6,5,16,.66);
    --fx-1: #6F63E0; --fx-2: #C3589B; --fx-3: #C98A6A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14122B; --surface: #1E1B3C; --surface-2: #2A2652; --ink: #EEECF8; --ink-2: #B9B6D3; --line: #3A3665;
  --brand: #A79BFF; --brand-solid: #5B4FD6; --brand-soft: #2D2870; --on-brand: #FFFFFF;
  --accent: #F08CC6; --accent-soft: #3F2038; --gray: #96989A; --peach: #E9A27C; --peach-soft: #3B2A22;
  --ok: #74D6A4; --ok-soft: #173328; --warn: #F2C46B; --warn-soft: #352A12; --danger: #FF8E85; --danger-soft: #3B1C1C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --scrim: rgba(6,5,16,.66);
  --fx-1: #6F63E0; --fx-2: #C3589B; --fx-3: #C98A6A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.relleno { fill: currentColor; stroke: none; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; }
[hidden] { display: none !important; }

.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }

/* Encabezado */
.encabezado { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; padding-block: 22px 0; }
.marca { display: grid; gap: 2px; min-width: 0; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.marca h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 8vw, 46px); line-height: 1; color: var(--brand); letter-spacing: .01em; }
.marca h1 .letra { display: inline-block; animation: letra 760ms var(--spring) both; animation-delay: calc(var(--i) * 70ms + 120ms); transform-origin: 50% 100%; }
.marca h1:hover .letra { animation: salto 520ms var(--spring); animation-delay: calc(var(--i) * 40ms); }
.marca p.sub { margin: 4px 0 0; color: var(--ink-2); max-width: 50ch; animation: sube 520ms var(--ease) 420ms both; }
.ubicacion { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 12px; transition: border-color var(--dur), box-shadow var(--dur); animation: sube 520ms var(--ease) 520ms both; }
.ubicacion:focus-within, .ubicacion:hover { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.ubicacion svg { color: var(--accent); transition: transform 400ms var(--spring); }
.ubicacion:hover svg { transform: translateY(-3px); }
.ubicacion label { font-size: 13px; color: var(--ink-2); }
.ubicacion select { border: 0; background: transparent; font-weight: 600; padding: 4px 2px; min-height: 32px; cursor: pointer; }

/* Navegación */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; padding-block: 8px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 4px; min-width: 0; background: var(--surface-2); border-radius: 999px; width: max-content; max-width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 999px; padding: 7px 16px; min-height: 42px; cursor: pointer; font-weight: 500; white-space: nowrap; color: var(--ink-2); transition: color 300ms var(--ease), transform 200ms var(--spring); }
.tab:hover { color: var(--ink); }
.tab:active { transform: scale(.95); }
.tab[aria-selected="true"] { color: var(--on-brand); font-weight: 600; }
.tab .cuenta { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--accent); color: #fff; }
.tab-ind { position: absolute; z-index: 0; left: 0; top: 4px; height: 42px; width: 0; border-radius: 999px; background: var(--brand-solid); box-shadow: 0 4px 14px color-mix(in srgb, var(--brand-solid) 40%, transparent); transition: transform 480ms var(--spring), width 480ms var(--spring); pointer-events: none; }
.tabs.chico { background: var(--surface-2); }
.tabs.chico .tab { min-height: 36px; padding: 6px 14px; font-size: 14px; }
.tabs.chico .tab-ind { height: 36px; }

/* Botones y controles (de PrecIA) */
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0; }
.btn { position: relative; overflow: hidden; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border-radius: 12px; border: 1.5px solid transparent; font-weight: 600; cursor: pointer; transition: background var(--dur), transform 260ms var(--spring), box-shadow 260ms var(--ease), border-color var(--dur), opacity var(--dur); white-space: nowrap; text-decoration: none; }
.btn:hover:not([disabled]) { transform: translateY(-2px); box-shadow: 0 8px 20px color-mix(in srgb, var(--brand-solid) 22%, transparent); }
.btn:active:not([disabled]) { transform: translateY(0) scale(.96); transition-duration: 80ms; }
.btn svg.i { transition: transform 400ms var(--spring); }
.btn:hover:not([disabled]) svg.i { transform: rotate(-8deg) scale(1.12); }
.btn[aria-busy="true"] svg.i { animation: girar 800ms linear infinite; }
.btn.primario { background: var(--brand-solid); color: var(--on-brand); }
.btn.primario:hover { filter: brightness(1.08); }
.btn.acento { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.acento { color: #1D1B3A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.acento { color: #1D1B3A; } }
.btn.sec { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn.sec:hover { border-color: var(--gray); }
.btn.fantasma { background: transparent; color: var(--ink-2); }
.btn.fantasma:hover:not([disabled]) { background: var(--surface-2); color: var(--ink); box-shadow: none; }
.btn.peligro { background: var(--danger-soft); color: var(--danger); }
.btn.mini { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; min-width: 42px; min-height: 42px; border: 1px solid transparent; background: transparent; border-radius: 12px; cursor: pointer; color: var(--ink-2); transition: background var(--dur), color var(--dur), transform 200ms var(--spring); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.borde { border-color: var(--line); background: var(--surface); }
.chip-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; min-height: 38px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink-2); white-space: nowrap; transition: color var(--dur), border-color var(--dur), background var(--dur), transform 240ms var(--spring); }
.chip-btn:hover { color: var(--ink); border-color: var(--gray); transform: translateY(-1px); }
.chip-btn:active { transform: scale(.94); }
.chip-btn svg.i { width: 16px; height: 16px; }
.chip-btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
.segmentado { position: relative; display: inline-flex; padding: 3px; background: var(--surface-2); border-radius: 12px; gap: 2px; }
.segmentado button { position: relative; z-index: 1; border: 0; background: transparent; border-radius: 9px; padding: 6px 12px; min-height: 36px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--ink-2); transition: color 250ms var(--ease), transform 200ms var(--spring), background 250ms, box-shadow 250ms; white-space: nowrap; }
.segmentado button:active { transform: scale(.94); }
.segmentado button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.14); font-weight: 600; }
.campo { width: 100%; min-height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; transition: border-color var(--dur), box-shadow var(--dur); }
.campo:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 4px var(--brand-soft); }
.campo.error { border-color: var(--danger); }
select.campo { cursor: pointer; }
.selector { min-height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 10px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; max-width: 100%; }
.selector:hover { border-color: var(--gray); color: var(--ink); }
.con-icono { position: relative; }
.con-icono > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray); pointer-events: none; }
.con-icono .campo { padding-left: 40px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill svg.i { width: 13px; height: 13px; }
.pill.marca-p { background: var(--brand-soft); color: var(--brand); }
.pill.acento-p { background: var(--accent-soft); color: var(--accent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.peligro { background: var(--danger-soft); color: var(--danger); }
.punto-vivo { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; position: relative; }
.punto-vivo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--ok); animation: pulso 1.8s ease-out infinite; }

/* Interruptor */
.switch-btn { position: relative; width: 48px; height: 28px; flex: none; border: 0; border-radius: 999px; background: var(--line); cursor: pointer; padding: 0; transition: background 300ms var(--ease); }
.switch-btn .knob { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform 420ms var(--spring), width 200ms var(--ease); }
.switch-btn:active .knob { width: 28px; }
.switch-btn[aria-checked="true"] { background: var(--brand-solid); }
.switch-btn[aria-checked="true"] .knob { transform: translateX(20px); }
.switch-btn[aria-checked="true"]:active .knob { transform: translateX(14px); }

/* Hero (morado fijo en ambos temas, como en PrecIA) */
.hero { --hero-1: #4B47A8; --hero-2: #2C2968; --hero-ink: #FFFFFF; --hero-ink-2: #DAD8F6; --hero-rosa: #F6C9E4;
  position: relative; overflow: hidden; isolation: isolate; display: grid; gap: 28px; padding: clamp(22px, 5vw, 44px);
  border-radius: 28px; color: var(--hero-ink); background: linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 100%);
  box-shadow: 0 24px 60px -24px rgba(44,41,104,.7), inset 0 1px 0 rgba(255,255,255,.18); animation: heroEntra 700ms var(--ease) both; }
.hero-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.hero-bg i { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .55; animation: flota 11s ease-in-out infinite alternate; }
.hero-bg i:nth-child(1) { width: 340px; height: 340px; right: -90px; top: -120px; background: #C0398B; }
.hero-bg i:nth-child(2) { width: 280px; height: 280px; left: -80px; bottom: -130px; background: #6F6AE0; animation-delay: -4s; animation-duration: 13s; }
.hero-bg i:nth-child(3) { width: 160px; height: 160px; left: 46%; top: 18%; background: #B74F90; opacity: .3; animation-delay: -7s; }
.hero-bg::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.5px); background-size: 22px 22px; mask-image: linear-gradient(120deg, transparent 20%, #000 100%); -webkit-mask-image: linear-gradient(120deg, transparent 20%, #000 100%); }
.hero-grid { display: grid; gap: 28px; align-items: center; }
@media (min-width: 860px) { .hero-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 40px; } }
.hero-txt { display: grid; gap: 14px; min-width: 0; justify-items: start; }
.hero-txt > * { animation: sube 640ms var(--ease) both; }
.hero-txt > :nth-child(2) { animation-delay: 100ms; } .hero-txt > :nth-child(3) { animation-delay: 200ms; } .hero-txt > :nth-child(4) { animation-delay: 300ms; }
.hero-eyebrow { margin: 0; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: var(--hero-rosa); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.hero-eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hero-rosa); animation: latido 1.8s ease-in-out infinite; }
.hero h2 { margin: 0; font-size: clamp(28px, 5.2vw, 46px); line-height: 1.08; font-weight: 700; letter-spacing: -.01em; }
.hero h2 em { font-style: normal; color: var(--hero-rosa); background: linear-gradient(transparent 62%, rgba(140,63,113,.65) 62%); padding: 0 .1em; }
.hero-lead { margin: 0; max-width: 54ch; font-size: clamp(15px, 2.2vw, 17px); line-height: 1.55; color: var(--hero-ink-2); }
.buscador { display: flex; gap: 8px; width: 100%; max-width: 560px; padding: 6px; border-radius: 18px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.24); }
.buscador .con-icono { flex: 1; min-width: 0; }
.buscador .campo { background: #FFFFFF; color: #1C1838; border-color: transparent; }
.buscador .campo::placeholder { color: #6E6990; }
.buscador .con-icono > svg { color: #6E6990; }
.buscador .btn { background: #FFFFFF; color: #2C2968; }
@media (max-width: 480px) { .buscador { flex-direction: column; } }
.hero-visual { min-width: 0; display: grid; animation: sube 700ms var(--ease) 260ms both; }
.hv-card { display: grid; gap: 12px; padding: 18px; border-radius: 20px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: flotaChip 4.6s ease-in-out infinite alternate; }
.hv-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hv-head .avatar { width: 40px; height: 40px; font-size: 14px; border-width: 0; }
.hv-head strong { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hv-head span { font-size: 12px; color: var(--hero-ink-2); }
.hv-slots { display: flex; flex-wrap: wrap; gap: 6px; }
.hv-slot { padding: 7px 11px; border-radius: 10px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); font-variant-numeric: tabular-nums; }
.hv-slot.tomado { animation: hvTomado 5s var(--ease) infinite; }
.hv-pie { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--hero-ink-2); }
.hv-pie .punto-vivo, .hv-pie .punto-vivo::after { background: #7EE2B0; }

/* Categorías y filtros */
.categorias { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px 6px; }
.categorias::-webkit-scrollbar { display: none; }
.cat-chip { flex: none; display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink); transition: transform 260ms var(--spring), border-color var(--dur), background var(--dur), box-shadow var(--dur); }
.cat-chip:hover { transform: translateY(-2px); border-color: var(--gray); }
.cat-chip:active { transform: scale(.95); }
.cat-chip .ico { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.cat-chip .ico svg.i { width: 17px; height: 17px; }
.cat-chip small { font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cat-chip[aria-pressed="true"] { background: var(--brand-solid); border-color: var(--brand-solid); color: var(--on-brand); box-shadow: 0 6px 18px color-mix(in srgb, var(--brand-solid) 35%, transparent); }
.cat-chip[aria-pressed="true"] small { color: var(--on-brand); opacity: .8; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; }
.filtros .sep { width: 1px; align-self: stretch; background: var(--line); margin-inline: 2px; }
@media (max-width: 640px) { .filtros .sep { display: none; } }
.resultados-cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.resultados-cab h2 { margin: 0; font-size: 20px; }
.vivo { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.vivo span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vivo strong { color: var(--ink); }

/* Tarjetas de negocio */
.grid-prov { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 268px), 1fr)); }
.prov { position: relative; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); transition: transform 320ms var(--spring), box-shadow 320ms var(--ease), border-color var(--dur); animation: sube 460ms var(--ease) both; animation-delay: calc(var(--i, 0) * 40ms); cursor: pointer; }
.prov:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); box-shadow: 0 2px 4px rgba(29,27,58,.06), 0 18px 40px -12px color-mix(in srgb, var(--brand-solid) 35%, transparent); }
.portada { position: relative; height: 78px; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; }
.portada::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.5px); background-size: 16px 16px; mask-image: linear-gradient(90deg, transparent 10%, #000 90%); -webkit-mask-image: linear-gradient(90deg, transparent 10%, #000 90%); }
.portada .marca-agua { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) rotate(-12deg); opacity: .28; transition: transform 500ms var(--spring); }
.prov:hover .portada .marca-agua { transform: translateY(-50%) rotate(4deg) scale(1.08); }
.portada .marca-agua svg.i { width: 56px; height: 56px; stroke-width: 1.6; }
.portada .badge-modo { position: absolute; left: 12px; top: 10px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3); }
.portada .badge-modo svg.i { width: 13px; height: 13px; }
.avatar { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff; letter-spacing: .02em; background: linear-gradient(135deg, var(--c1), var(--c2)); border: 3px solid var(--surface); flex: none; }
.prov .avatar { position: absolute; left: 14px; top: 50px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.prov-cuerpo { display: grid; gap: 8px; padding: 34px 16px 16px; flex: 1; align-content: start; }
.prov h3 { margin: 0; font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
.prov .meta { margin: 0; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.prov .meta span { display: inline-flex; align-items: center; gap: 4px; }
.estrellas { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 13px; color: var(--ink); }
.estrellas svg { color: #E2A120; }
.estrellas small { font-weight: 500; color: var(--ink-2); }
.proximo { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--ok-soft); font-size: 13px; color: var(--ink); }
.proximo strong { font-variant-numeric: tabular-nums; }
.proximo.sin { background: var(--surface-2); color: var(--ink-2); }
.proximo.cambio { animation: bump 520ms var(--spring); }
.sync-linea { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.sync-linea svg.i { width: 14px; height: 14px; color: var(--brand); }
.prov-acciones { display: flex; gap: 8px; padding: 0 16px 16px; }
.prov-acciones .btn { flex: 1; min-height: 42px; font-size: 14px; }
.vacio { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 20px; }
.vacio h3 { margin: 0; font-size: 18px; }
.vacio p { margin: 0; color: var(--ink-2); max-width: 44ch; }
.vacio .ico-grande { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); animation: pop 600ms var(--spring) both; }
.vacio .ico-grande svg.i { width: 30px; height: 30px; }

/* Hoja de reserva */
dialog.hoja { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 26px; width: min(600px, calc(100vw - 24px)); max-width: none; max-height: min(90dvh, 860px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); overflow: hidden; }
dialog.hoja[open] { display: flex; flex-direction: column; animation: hojaEntra 420ms var(--spring-suave) both; }
dialog.hoja::backdrop { background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
dialog.hoja.angosta { width: min(460px, calc(100vw - 24px)); }
@media (max-width: 640px) {
  dialog.hoja, dialog.hoja.angosta { margin: auto 0 0; width: 100vw; max-height: 92dvh; border-radius: 24px 24px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  dialog.hoja[open] { animation: subeHoja 440ms var(--spring-suave) both; }
}
.hoja-cab { position: relative; display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.hoja-cab .avatar { width: 46px; height: 46px; font-size: 15px; border-width: 0; border-radius: 14px; }
.hoja-cab .tit { min-width: 0; flex: 1; }
.hoja-cab h2 { margin: 0; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
.hoja-cab p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
.pasos { display: flex; gap: 6px; padding: 12px 18px 0; list-style: none; margin: 0; }
.pasos li { flex: 1; display: grid; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.pasos li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pasos li::before { content: ""; height: 4px; border-radius: 999px; background: var(--surface-2); transition: background 400ms var(--ease); }
.pasos li.hecho::before, .pasos li.actual::before { background: var(--brand-solid); }
.pasos li.actual { color: var(--brand); }
.hoja-cuerpo { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 20px; display: grid; gap: 16px; align-content: start; }
.hoja-cuerpo.anima > * { animation: sube 320ms var(--ease) both; }
.hoja-pie { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--surface); }
.hoja-pie .resumen { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); }
.hoja-pie .resumen strong { display: block; color: var(--ink); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-tit { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.bloque { display: grid; gap: 10px; }
.servicios-op { display: grid; gap: 8px; }
.serv-op { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--surface); cursor: pointer; text-align: left; transition: border-color var(--dur), background var(--dur), transform 240ms var(--spring); }
.serv-op:hover { border-color: var(--gray); }
.serv-op:active { transform: scale(.98); }
.serv-op .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--gray); display: grid; place-items: center; transition: border-color var(--dur); }
.serv-op .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand-solid); transform: scale(0); transition: transform 320ms var(--spring); }
.serv-op[aria-checked="true"] { border-color: var(--brand); background: var(--brand-soft); }
.serv-op[aria-checked="true"] .radio { border-color: var(--brand); }
.serv-op[aria-checked="true"] .radio::after { transform: scale(1); }
.serv-op strong { display: block; font-size: 15px; }
.serv-op small { color: var(--ink-2); font-size: 13px; }
.serv-op .precio { font-weight: 700; font-variant-numeric: tabular-nums; }
.franja-dias { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
.dia-op { flex: none; display: grid; justify-items: center; gap: 2px; width: 70px; padding: 8px 4px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color var(--dur), background var(--dur), transform 240ms var(--spring); }
.dia-op:hover:not([disabled]) { border-color: var(--gray); transform: translateY(-2px); }
.dia-op .d1 { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: capitalize; }
.dia-op .d2 { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dia-op .d3 { font-size: 11px; color: var(--ok); font-weight: 600; white-space: nowrap; }
.dia-op[disabled] { cursor: not-allowed; opacity: .55; }
.dia-op[disabled] .d3 { color: var(--ink-2); }
.dia-op[aria-pressed="true"] { border-color: var(--brand-solid); background: var(--brand-solid); color: var(--on-brand); }
.dia-op[aria-pressed="true"] .d1, .dia-op[aria-pressed="true"] .d3 { color: var(--on-brand); }
.franja-label { font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 4px 0 -2px; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.slot { min-height: 42px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums; transition: border-color var(--dur), background var(--dur), transform 240ms var(--spring), color var(--dur); }
.slot:hover:not([disabled]) { border-color: var(--brand); color: var(--brand); transform: translateY(-2px); }
.slot[aria-pressed="true"] { background: var(--brand-solid); border-color: var(--brand-solid); color: var(--on-brand); animation: bump 420ms var(--spring); }
.slot.tomado { cursor: not-allowed; color: var(--danger); background: var(--danger-soft); border-color: transparent; text-decoration: line-through; animation: tomado 1.6s var(--ease) both; }
.aviso { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 14px; background: var(--warn-soft); color: var(--ink); }
.aviso svg.i { color: var(--warn); margin-top: 1px; }
.aviso.peligro { background: var(--danger-soft); }
.aviso.peligro svg.i { color: var(--danger); }
.aviso.info { background: var(--brand-soft); }
.aviso.info svg.i { color: var(--brand); }
.aviso.sacude { animation: sacudir 460ms var(--ease); }
.aviso p { margin: 0; }
.nota-sync { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.form-grid { display: grid; gap: 12px; }
.form-grid label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form-grid .dos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.check-linea { display: flex !important; align-items: center; gap: 10px; font-weight: 500 !important; color: var(--ink) !important; cursor: pointer; }
.check-linea input { width: 20px; height: 20px; accent-color: var(--brand-solid); }
.error-txt { margin: 0; font-size: 12px; color: var(--danger); font-weight: 500; }
.resumen-card { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.resumen-card .fila { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; font-size: 14px; }
.resumen-card .fila + .fila { border-top: 1px solid var(--line); }
.resumen-card .fila span:first-child { color: var(--ink-2); }
.resumen-card .fila span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.resumen-card .fila.total { background: var(--surface-2); }
.resumen-card .fila.total span:last-child { font-size: 17px; }
.exito { display: grid; justify-items: center; text-align: center; gap: 12px; padding-top: 8px; }
.exito .sello-ok { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); animation: pop 700ms var(--spring) both; }
.exito .sello-ok svg.i { width: 40px; height: 40px; stroke-width: 2.6; }
.exito h3 { margin: 0; font-size: 22px; }
.exito p { margin: 0; color: var(--ink-2); max-width: 42ch; }
.exito .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.enlace-caja { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface-2); min-width: 0; }
.enlace-caja code { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; color: var(--ink); }
.info-negocio { display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.info-negocio div { display: flex; align-items: center; gap: 8px; }
.info-negocio svg.i { width: 16px; height: 16px; color: var(--accent); }
.equipo { display: flex; flex-wrap: wrap; gap: 8px; }
.staff-chip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; transition: border-color var(--dur), background var(--dur), transform 240ms var(--spring); }
.staff-chip:hover { border-color: var(--gray); }
.staff-chip:active { transform: scale(.95); }
.staff-chip .ini { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--sc, var(--brand-solid)); }
.staff-chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }

/* Mis turnos */
.mis-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.mis-cab h2 { margin: 0; font-size: 26px; }
.mis-cab p { margin: 4px 0 0; color: var(--ink-2); }
.lista-turnos { display: grid; gap: 12px; list-style: none; margin: 0; padding: 0; }
.turno { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 16px; animation: sube 420ms var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
@media (min-width: 720px) { .turno { grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; } }
.fecha-bloque { width: 64px; display: grid; justify-items: center; align-content: center; padding: 8px 4px; border-radius: 16px; background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; }
.fecha-bloque .m { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.fecha-bloque .d { font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.fecha-bloque .w { font-size: 11px; font-weight: 600; opacity: .85; text-transform: capitalize; }
.turno-info { display: grid; gap: 4px; min-width: 0; }
.turno-info h3 { margin: 0; font-size: 17px; }
.turno-info p { margin: 0; color: var(--ink-2); font-size: 14px; }
.turno-info .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.turno-acciones { display: flex; flex-wrap: wrap; gap: 8px; grid-column: 1 / -1; }
@media (min-width: 720px) { .turno-acciones { grid-column: auto; justify-content: flex-end; } }
.turno.pasado { opacity: .72; }
.turno.cancelado .turno-info h3 { text-decoration: line-through; }
.confirma-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--danger); animation: sube 220ms var(--ease) both; }

/* Panel de proveedor */
.panel-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding: 16px; }
.negocio-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
.negocio-id .avatar { border-width: 0; }
.negocio-id h2 { margin: 0; font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
.negocio-id p { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.cambiar-negocio { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.cambiar-negocio select { min-width: 0; max-width: 280px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 860px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { display: grid; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); min-width: 0; }
.kpi .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.kpi .lbl svg.i { width: 15px; height: 15px; color: var(--accent); }
.kpi .val { font-size: clamp(22px, 3.4vw, 28px); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; overflow-wrap: anywhere; }
.kpi .det { font-size: 12px; color: var(--ink-2); }
.kpi .barra { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.kpi .barra span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--brand-solid), var(--accent)); transform-origin: 0 50%; animation: crece 900ms var(--ease) both; }
.panel-grid { display: grid; gap: 20px; align-items: start; }
@media (min-width: 1080px) { .panel-grid { grid-template-columns: minmax(0, 1fr) 320px; } }
.panel-main { display: grid; gap: 14px; padding: 14px; min-width: 0; }
.panel-lado { display: grid; gap: 16px; min-width: 0; }
.lado-card { display: grid; gap: 12px; padding: 16px; }
.lado-card h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.lado-card h3 svg.i { color: var(--brand); }
.lado-card .fila-kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.lado-card .fila-kv span:first-child { color: var(--ink-2); }
.lado-card .fila-kv span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.conexion { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--ok-soft); font-size: 13px; }
.conexion strong { display: block; font-size: 14px; }
.conexion .cal-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--brand); flex: none; }
.conexion.off { background: var(--surface-2); }
.conexion .txt { min-width: 0; flex: 1; }
.conexion .txt span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.fila-switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.mini-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mini-lista li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; }
.mini-lista .hora { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 68px; }
.mini-lista .quien { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.mini-lista .quien strong { color: var(--ink); }
.mini-lista li.nuevo { animation: entraFila 2.4s var(--ease) both; border-radius: 8px; }

.cal-barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.cal-nav { display: flex; align-items: center; gap: 4px; }
.cal-nav strong { font-size: 16px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.staff-filtro { display: flex; flex-wrap: wrap; gap: 6px; }
.staff-filtro .chip-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sc); }
.staff-filtro .chip-btn[aria-pressed="false"] { opacity: .55; }
.staff-filtro .chip-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--gray); }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.leyenda .l-res { background: color-mix(in srgb, #6A5FDB 22%, var(--surface)); border: 1px solid color-mix(in srgb, #6A5FDB 50%, transparent); }
.leyenda .l-gcal { background: repeating-linear-gradient(135deg, var(--surface-2) 0 3px, var(--surface) 3px 6px); border: 1px dashed var(--gray); }
.leyenda .l-blq { background: var(--peach-soft); border: 1px solid var(--peach); }
.leyenda .l-new { background: var(--accent-soft); border: 1.5px solid var(--accent); }
.cal-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); }
.cal { display: grid; grid-template-columns: 56px repeat(var(--n), minmax(var(--colmin), 1fr)); min-width: calc(56px + var(--n) * var(--colmin)); }
.cal-cab { position: sticky; top: 0; z-index: 3; display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--ink-2); text-transform: capitalize; }
.cal-cab:first-child { border-left: 0; }
.cal-cab b { font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.cal-cab.hoy b { background: var(--brand-solid); color: var(--on-brand); }
.cal-cab small { font-size: 11px; }
.cal-horas { position: relative; }
.cal-horas span { position: absolute; right: 8px; transform: translateY(-50%); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cal-col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 60px); cursor: cell; }
.cal-col.hoy { background-color: color-mix(in srgb, var(--brand-soft) 35%, transparent); }
.cal-cerrado { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, transparent 6px 12px); pointer-events: none; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.cal-ahora { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 2; pointer-events: none; }
.cal-ahora::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.ev { position: absolute; z-index: 1; padding: 3px 6px; border-radius: 8px; font-size: 11px; line-height: 1.25; overflow: hidden; cursor: pointer; text-align: left; border: 1px solid color-mix(in srgb, var(--sc) 55%, transparent); background: color-mix(in srgb, var(--sc) 20%, var(--surface)); color: var(--ink); transition: transform 220ms var(--spring), box-shadow 220ms var(--ease), z-index 0s; }
.ev:hover { transform: scale(1.03); z-index: 4; box-shadow: var(--shadow); }
.ev b { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.ev.gcal { background: repeating-linear-gradient(135deg, var(--surface-2) 0 5px, var(--surface) 5px 10px); border: 1px dashed var(--gray); color: var(--ink-2); }
.ev.gcal b { color: var(--ink-2); font-weight: 600; }
.ev.bloqueo { background: var(--peach-soft); border-color: var(--peach); }
.ev.mia, .ev.nuevo { border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.ev.nuevo { animation: evEntra 1.4s var(--spring) both; }
.ev.pasado { opacity: .6; }

.agenda-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ag-item { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); cursor: pointer; transition: border-color var(--dur), transform 240ms var(--spring); animation: sube 360ms var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
.ag-item:hover { border-color: var(--gray); transform: translateX(3px); }
@media (min-width: 640px) { .ag-item { grid-template-columns: 90px minmax(0, 1fr) auto; } }
.ag-hora { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.ag-hora small { display: block; font-weight: 500; font-size: 12px; color: var(--ink-2); }
.ag-info { min-width: 0; display: grid; gap: 2px; }
.ag-info strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-info span { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ag-info .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); display: inline-block; }
.ag-badges { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 2; }
@media (min-width: 640px) { .ag-badges { grid-column: auto; justify-content: flex-end; } }
.ag-item.gcal { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); }
.ag-item.en-curso { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }

.disp-tabla { display: grid; gap: 8px; }
.disp-fila { display: grid; grid-template-columns: 96px auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); }
.disp-fila strong { font-size: 14px; }
.disp-fila .horas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.disp-fila.cerrado .horas { opacity: .5; }
@media (max-width: 480px) { .disp-fila { grid-template-columns: minmax(0, 1fr) auto; } .disp-fila .horas { grid-column: 1 / -1; } }
.ajustes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ajustes label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.serv-tabla { display: grid; gap: 8px; }
.serv-fila { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-md); }
.serv-fila strong { display: block; }
.serv-fila small { color: var(--ink-2); font-size: 13px; }
.serv-fila .precio { font-weight: 700; font-variant-numeric: tabular-nums; }
.serv-fila.oculto strong, .serv-fila.oculto .precio { opacity: .5; }
.seccion-txt { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 70ch; }

/* Toast y efectos */
.toasts { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 100; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: 0 12px 30px rgba(0,0,0,.3); font-size: 14px; animation: toastIn 420ms var(--spring) both; pointer-events: auto; }
.toast svg.i { color: var(--fx-3); }
.toast.sale { animation: toastOut 260ms var(--ease) both; }
.fx { position: fixed; top: -20px; width: 10px; height: 14px; border-radius: 3px; z-index: 200; pointer-events: none; animation: fxLluvia var(--t) cubic-bezier(.3,.6,.4,1) forwards; }

@keyframes letra { 0% { opacity: 0; transform: translateY(70%) rotate(-12deg) scale(.6); } 100% { opacity: 1; transform: none; } }
@keyframes salto { 0% { transform: none; } 40% { transform: translateY(-14%) rotate(-4deg); } 100% { transform: none; } }
@keyframes sube { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes heroEntra { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes flota { from { transform: translate(0,0) scale(1); } to { transform: translate(28px,-22px) scale(1.12); } }
@keyframes flotaChip { from { transform: translateY(0); } to { transform: translateY(-8px); } }
@keyframes latido { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.7); opacity: .4; } }
@keyframes pulso { from { transform: scale(1); opacity: .7; } to { transform: scale(2.8); opacity: 0; } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
@keyframes crece { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes girar { to { transform: rotate(360deg); } }
@keyframes sacudir { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
@keyframes hojaEntra { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes subeHoja { from { transform: translateY(100%); } to { transform: none; } }
@keyframes tomado { 0% { transform: scale(1.08); background: var(--danger); color: #fff; } 100% { transform: none; } }
@keyframes hvTomado { 0%, 55% { background: rgba(255,255,255,.14); text-decoration: none; } 62%, 100% { background: rgba(192,57,139,.55); text-decoration: line-through; } }
@keyframes entraFila { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
@keyframes evEntra { 0% { transform: scale(.4); opacity: 0; box-shadow: 0 0 0 0 var(--accent); } 50% { transform: scale(1.08); opacity: 1; box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 25%, transparent); } 100% { transform: none; box-shadow: none; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(30px) scale(.85); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(16px) scale(.95); } }
@keyframes fxLluvia { from { transform: translateY(0) rotate(var(--r0)); } to { transform: translateY(var(--fall)) rotate(var(--r1)); } }
@media (prefers-reduced-motion: reduce) {

const nube = { sb: null, uid: null, timer: null, escribiendo: false, sucio: false, listo: false, editadoAntes: false, fallos: 0 };
function nubeProgramar() {
  if (!nube.sb) return;
  if (!nube.listo) { nube.editadoAntes = true; return; }
  nube.sucio = true; clearTimeout(nube.timer); nube.timer = setTimeout(nubeEscribir, 700);
}
async function nubeEscribir() {
  if (!nube.sb || !nube.listo || nube.escribiendo || !nube.sucio) return;
  const sb = nube.sb, uid = nube.uid;
  nube.escribiendo = true; nube.sucio = false;
  try {
    const r = await sb.from('agendia_docs').upsert({ user_id: uid, json: JSON.stringify(estado), updated_at: new Date().toISOString() });
    if (r.error) throw r.error;
    nube.fallos = 0;
  } catch (e) {
    console.warn('AgendIA: no se pudo guardar en la nube', e);
    if (nube.sb === sb) { nube.sucio = true; if (++nube.fallos < 5) { clearTimeout(nube.timer); nube.timer = setTimeout(nubeEscribir, 3000 * nube.fallos); } }
  } finally {
    nube.escribiendo = false;
    if (nube.sb === sb && nube.sucio && nube.fallos === 0) nubeProgramar();
  }
}
function nubeDetener() { clearTimeout(nube.timer); Object.assign(nube, { sb: null, uid: null, timer: null, escribiendo: false, sucio: false, listo: false, editadoAntes: false, fallos: 0 }); }
async function nubeIniciar(sb, uid) {
  nubeDetener(); nube.sb = sb; nube.uid = uid;
  for (let intento = 0; intento < 4 && nube.sb === sb; intento++) {
    try {
      const r = await sb.from('agendia_docs').select('json').eq('user_id', uid).maybeSingle();
      if (r.error) throw r.error;
      if (nube.sb !== sb) return;
      if (r.data && typeof r.data.json === 'string' && !nube.editadoAntes) {
        aplicarEstado(JSON.parse(r.data.json));
        try { localStorage.setItem(CLAVE, r.data.json); } catch (e) {}
        refrescarTodo();
      } else nube.sucio = true; // la nube está vacía (o hubo cambios locales primero): se sube lo de este dispositivo
      nube.listo = true;
      if (nube.editadoAntes) nube.sucio = true;
      nubeEscribir();
      return;
    } catch (e) {
      console.warn('AgendIA: sin conexión con la nube, se reintenta', e);
      await new Promise((ok) => setTimeout(ok, 4000 * (intento + 1)));
    }
  }
}

/* ---------- Motor de agenda (simula lo que leería del Google Calendar del proveedor) ---------- */
const cacheSemilla = {};
function semilla(p, k) {
  const key = p.id + '|' + k;
  if (cacheSemilla[key]) return cacheSemilla[key];
  const dow = fechaDe(k).getDay();
  const h = p.horario[dow] || [480, 1200];
  const r = rng(hash(key));
  const n = diffDias(k);
  let occ = p.demanda * (n <= 0 ? 1.1 : n < 3 ? 0.85 : n < 7 ? 0.6 : 0.35) * (dow === 0 || dow === 6 ? 1.25 : 1);
  const evs = [];
  p.staff.forEach((s) => {
    let almuerzo = null;
    if (r() < 0.75) { const ini = 720 + pick(r, [0, 30, 60]); almuerzo = [ini, ini + 60]; evs.push({ id: `g-${key}-${s.id}-l`, tipo: 'gcal', staff: s.id, ini, dur: 60, titulo: r() < 0.6 ? 'Almuerzo' : 'Personal' }); }
    if (r() < 0.1) { const ini = 900 + pick(r, [0, 60]); evs.push({ id: `g-${key}-${s.id}-c`, tipo: 'gcal', staff: s.id, ini, dur: 90, titulo: pick(r, ['Capacitación', 'Cita médica', 'Proveedor de insumos']) }); }
    let t = h[0] + pick(r, [0, 0, 30]);
    let guard = 0;
    while (t < h[1] - 25 && guard++ < 60) {
      const sv = pick(r, p.servicios);
      if (t + sv.dur > h[1]) { t += 30; continue; }
      if (almuerzo && t < almuerzo[1] && t + sv.dur > almuerzo[0]) { t = almuerzo[1]; continue; }
      if (evs.some((e) => e.staff === s.id && e.tipo === 'gcal' && t < e.ini + e.dur && t + sv.dur > e.ini)) { t += 30; continue; }
      if (r() < occ) {
        evs.push({ id: `s-${key}-${s.id}-${t}`, tipo: 'reserva', staff: s.id, ini: t, dur: sv.dur, servicio: sv.id, cliente: pick(r, CLIENTES), origen: r() < 0.62 ? 'AgendIA' : 'Google Calendar', precio: sv.precio });
        t += sv.dur + (p.modo === 'domicilio' ? 30 : 0);
        t = Math.ceil(t / 15) * 15;
      } else t += 30;
    }
  });
  cacheSemilla[key] = evs;
  return evs;
}
function eventosDe(p, k) {
  const canc = estado.canceladas;
  const base = semilla(p, k).filter((e) => !canc.includes(e.id));
  const mias = estado.reservas.filter((r) => r.provId === p.id && r.dk === k && r.estado !== 'cancelada').map((r) => ({ ...r, tipo: 'reserva', origen: 'AgendIA', mia: true }));
  const ext = externas.filter((e) => e.provId === p.id && e.dk === k);
  const bl = estado.bloqueos.filter((b) => b.provId === p.id && b.dk === k && !canc.includes(b.id));
  return base.concat(mias, ext, bl).sort((a, b) => a.ini - b.ini);
}
function slotsDe(p, k, sv, staffId, aDomicilio) {
  const h = horarioDe(p, fechaDe(k).getDay());
  if (!h || !sv) return [];
  const aj = ajustesDe(p);
  const traslado = (p.modo === 'domicilio' || aDomicilio) ? 30 : 0;
  const buf = aj.buffer + traslado;
  const evs = eventosDe(p, k);
  const n = diffDias(k);
  if (n < 0) return [];
  const minIni = n === 0 ? minAhora() + aj.anticipacion : -1;

  const out = [];
  for (let t = h[0]; t + sv.dur <= h[1]; t += 30) {
    if (t < minIni) continue;
    const libres = lista.filter((s) => !evs.some((e) => e.staff === s.id && e.ini < t + sv.dur + buf && t < e.ini + e.dur + (e.tipo === 'reserva' ? buf : 0)));

}

function provsFiltrados() {
  const f = estado.filtros; const q = norm(f.q).trim();
  const hoy = hoyK();
  let lista = proveedoresDe(estado.ciudad).map((p) => ({ p, prox: proximoTurno(p) }));
  lista = lista.filter(({ p, prox }) => {
    if (f.cat !== 'todas' && p.cat !== f.cat) return false;
    if (f.modo === 'local' && p.modo === 'domicilio') return false;
    if (f.modo === 'domicilio' && p.modo === 'local') return false;
    if (f.rating && p.rating < 4.5) return false;
    if (f.barrio && p.barrio !== f.barrio) return false;
    if (f.precio && p.desde > f.precio) return false;
    if (f.hoy && (!prox || prox.dk !== hoy)) return false;
    if (q) { const txt = norm([p.nombre, catDe(p.cat).nombre, p.barrio, ...servVisibles(p).map((s) => s.nombre), p.modo !== 'local' ? 'domicilio' : ''].join(' ')); if (!q.split(/\s+/).every((w) => txt.includes(w))) return false; }

  return lista;
}

    case 'ptab': panel.tab = t.dataset.v; $$('#tabs-panel .tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === panel.tab))); moverIndicador($('#tabs-panel')); renderPanelContenido(); break;
    case 'cal-prev': panel.offset -= 1; renderPanelContenido(); break;
    case 'cal-next': panel.offset += 1; renderPanelContenido(); break;
    case 'cal-hoy': panel.offset = 0; renderPanelContenido(); break;
    case 'staff-filtro': { const pp = panelProv(); const oc = panel.ocultosStaff[pp.id] || []; const id = t.dataset.v; const i = oc.indexOf(id); if (i >= 0) oc.splice(i, 1); else if (pp.staff.length - oc.length > 1) oc.push(id); panel.ocultosStaff[pp.id] = oc; renderPanelContenido(); break; }
    case 'celda': {
      if (ev.target.closest('.ev')) return;
      const r = t.getBoundingClientRect(); const pp = panelProv();
      const lanes = staffVisibles(pp);
      const min = Number(t.dataset.h0) * 60 + Math.floor((ev.clientY - r.top) / 15) * 15;
      const lane = Math.min(lanes.length - 1, Math.max(0, Math.floor((ev.clientX - r.left) / r.width * lanes.length)));
      const h = horarioDe(pp, fechaDe(t.dataset.k).getDay());
      if (!h) { toast('Ese día está cerrado. Ábrelo en Disponibilidad.', 'info'); return; }
      if (diffDias(t.dataset.k) < 0) { toast('No puedes agendar en días pasados.', 'info'); return; }
      abrirNuevo(t.dataset.k, Math.min(Math.max(min, h[0]), h[1] - 15), lanes[lane].id); break;
    }
    case 'evento': ev.stopPropagation(); abrirEvento(t.dataset.k, t.dataset.v); break;
    case 'ev-cancelar': confirmandoEv = true; pintarEvento(panelProv(), t.dataset.k, buscarEvento(panelProv(), t.dataset.k, t.dataset.v)); break;
    case 'ev-cancelar-no': confirmandoEv = false; pintarEvento(panelProv(), t.dataset.k, buscarEvento(panelProv(), t.dataset.k, t.dataset.v)); break;
    case 'ev-cancelar-si': cancelarEvento(t.dataset.k, t.dataset.v); break;
    case 'nuevo-tipo': leerNuevo(); nuevoEv.tipo = t.dataset.v; nuevoEv.error = ''; pintarNuevo(panelProv(), horarioDe(panelProv(), fechaDe(nuevoEv.k).getDay())); break;
    case 'ag-dia': panel.agendaDk = t.dataset.v; renderPanelContenido(); break;
    case 'disp-dia': {
      const pp = panelProv(); const dow = Number(t.dataset.v);
      const hs = (estado.horarios[pp.id] || pp.horario).map((h) => (h ? h.slice() : null));
      hs[dow] = hs[dow] ? null : (pp.horario[dow] || [540, 1080]).slice();
      estado.horarios[pp.id] = hs; guardar(); renderPanel();
      toast(hs[dow] ? `${DIAS_L[dow]} abierto en AgendIA` : `${DIAS_L[dow]} cerrado, ya no se muestran turnos`, 'cal'); break;
    }
    case 'serv-toggle': {
      const pp = panelProv(); const oc = estado.ocultos[pp.id] || []; const i = oc.indexOf(t.dataset.v);
      if (i >= 0) oc.splice(i, 1); else if (pp.servicios.length - oc.length > 1) oc.push(t.dataset.v); else { toast('Deja al menos un servicio visible', 'info'); return; }
      estado.ocultos[pp.id] = oc; guardar(); renderPanelContenido(); break;
    }
    case 'sync-toggle': { const pp = panelProv(); estado.sync[pp.id] = !syncOn(pp); guardar(); renderPanel(); toast(syncOn(pp) ? 'Sincronización con Google Calendar activa' : 'Sincronización en pausa', 'cal'); break; }
    case 'sync-ahora': {
      t.setAttribute('aria-busy', 'true'); t.disabled = true;
      setTimeout(() => { ultimoSync = Date.now(); renderPanel(); toast('Calendario sincronizado con Google Calendar', 'refresh'); }, 900); break;
    }
  }
});
document.addEventListener('keydown', (ev) => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('.ag-item, .prov')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target; const c = t.dataset && t.dataset.cambio;
  if (!c) return;
  const pp = panelProv();
  if (c === 'disp-desde' || c === 'disp-hasta') {
    const dow = Number(t.dataset.v);
    const hs = (estado.horarios[pp.id] || pp.horario).map((h) => (h ? h.slice() : null));
    const v = Number(t.value);
    if (c === 'disp-desde') hs[dow][0] = Math.min(v, hs[dow][1] - 60); else hs[dow][1] = Math.max(v, hs[dow][0] + 60);
    estado.horarios[pp.id] = hs; guardar(); renderPanel();
    toast(`Horario del ${DIAS_L[dow].toLowerCase()} actualizado`, 'clock');
  } else if (c === 'aj-buffer' || c === 'aj-ant') {
    const aj = ajustesDe(pp);
    if (c === 'aj-buffer') aj.buffer = Number(t.value); else aj.anticipacion = Number(t.value);
    estado.ajustes[pp.id] = aj; guardar(); toast('Reglas de reserva guardadas', 'check');
  }
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  if (ev.target.id === 'form-nuevo') guardarNuevo();
});
$('#form-buscar').addEventListener('submit', (ev) => { ev.preventDefault(); estado.filtros.q = $('#q').value.trim(); guardar(); renderExplorar(); $('#res-titulo').scrollIntoView({ behavior: reducido() ? 'auto' : 'smooth', block: 'center' }); });
let tBusca;
$('#q').addEventListener('input', () => { clearTimeout(tBusca); tBusca = setTimeout(() => { estado.filtros.q = $('#q').value.trim(); guardar(); renderResultados(); $('#f-limpiar').hidden = !filtrosActivos(); }, 220); });
$('#seg-modo').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; estado.filtros.modo = b.dataset.modo; guardar(); renderExplorar(); });
$('#f-hoy').addEventListener('click', () => { estado.filtros.hoy = !estado.filtros.hoy; guardar(); renderExplorar(); });
$('#f-rating').addEventListener('click', () => { estado.filtros.rating = !estado.filtros.rating; guardar(); renderExplorar(); });
$('#f-barrio').addEventListener('change', (e) => { estado.filtros.barrio = e.target.value; guardar(); renderExplorar(); });
$('#f-precio').addEventListener('change', (e) => { estado.filtros.precio = Number(e.target.value); guardar(); renderExplorar(); });
$('#f-orden').addEventListener('change', (e) => { estado.filtros.orden = e.target.value; guardar(); renderExplorar(); });
$('#f-limpiar').addEventListener('click', limpiarFiltros);
$('#tabs-nav').addEventListener('click', (ev) => { const b = ev.target.closest('.tab'); if (b) irA(b.dataset.vista); });
document.addEventListener('change', (ev) => { if (ev.target.id === 'sel-negocio') { estado.panelProv = ev.target.value; panel.offset = 0; guardar(); renderPanel(); } });
$('#hoja').addEventListener('close', () => { if (reserva && reserva.paso === 'ok' && vista === 'mis-turnos') renderMis(); reserva = null; if (vista === 'explorar') renderResultados(); if (vista === 'panel') renderPanel(); });
['hoja', 'dlg'].forEach((id) => $('#' + id).addEventListener('click', (ev) => { if (ev.target === ev.currentTarget) ev.currentTarget.close(); }));
window.addEventListener('hashchange', () => irA(location.hash.slice(1), true));
let tRes, anchoPrevio = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(tRes); tRes = setTimeout(() => { moverIndicador($('#tabs-nav')); if (vista === 'panel') { moverIndicador($('#tabs-panel')); if (Math.abs(window.innerWidth - anchoPrevio) > 40 && panel.tab === 'calendario') renderPanelContenido(); } anchoPrevio = window.innerWidth; }, 160); });

/* ---------- Arranque ---------- */
montarLogo();
montarCiudad();
montarFiltros();
irA((location.hash || '#explorar').slice(1), true);
actualizarCuenta();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { moverIndicador($('#tabs-nav')); const tp = $('#tabs-panel'); if (tp) moverIndicador(tp); });
setInterval(tickTiempos, 1000);
setInterval(() => { if (!document.hidden) { ultimoSync = Date.now(); tickTiempos(); } }, 15000);
(function programar() { setTimeout(() => { simularReserva(); programar(); }, 16000 + Math.random() * 14000); })();
setTimeout(simularReserva, 7000);
Suite.init({ app: 'agendia', gate: true, onUser: iniciarUsuario, onLogout: alSalir });
setInterval(() => { if (document.hidden) return; if (vista === 'panel' && panel.tab === 'calendario' && !$('#dlg').open) renderPanelContenido(); }, 60000);
</script>
