<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>numérica. producido · Hola Apps</title>
<meta name="description" content="Compositor de piezas para redes sociales con tu sistema de diseño. Parte de Hola Apps.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C0398B">
<link rel="stylesheet" href="../suite/suite.css?v=7">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Climate+Crisis&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: el lienzo ocupa todo el ancho; los controles viven en un toolbox flotante de formas redondeadas
   (mismo lenguaje que el toolbox de Organic). La interfaz es neutra para que el único color sea el del sistema cargado. */
:root{
  /* Tokens de PrecIA */
  --paper:#F7F5FB; --raised:#FFFFFF; --panel:#EFEBF8; --ink:#1C1838; --mute:#4F4A6E; --line:#E1DCF0;
  --signal:#C0398B; --signal-ink:#FFFFFF; --stage:#E9E6FB; --bar:#4B3FC4; --bar-ink:#FFFFFF; --brand:#4B3FC4;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
  --shadow:0 1px 2px rgba(29,27,58,.06),0 8px 24px rgba(29,27,58,.08);
  --font-ui:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --font-d:'Climate Crisis','Work Sans',system-ui,sans-serif; --font-mono:'Work Sans',system-ui,sans-serif;
  --tbl:0px; --tbr:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14122B; --raised:#1E1B3C; --panel:#2A2652; --ink:#EEECF8; --mute:#B9B6D3; --line:#3A3665;
  --signal:#F08CC6; --signal-ink:#14122B; --stage:#1E1B3C; --bar:#5B4FD6; --bar-ink:#FFFFFF; --brand:#A79BFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--font-ui);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}
.top{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px}
.brand{display:flex;align-items:baseline;gap:10px}
.wm{font:400 17px var(--font-d);letter-spacing:0;text-transform:lowercase}
.wm i{font-style:normal;color:var(--signal)}
.sub{font:500 12px var(--font-mono);color:var(--mute);letter-spacing:.04em}
.keys{font:12px var(--font-mono);color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
kbd{font:inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--raised);color:var(--ink)}
.keys span{margin-right:8px}
.app{flex:1;min-height:0;position:relative}
.stagecol{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-width:0;min-height:0;margin:0 12px 12px;border-radius:var(--r-lg);overflow:hidden;background:var(--stage)}
.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden;background:var(--stage);cursor:crosshair;touch-action:none;outline-offset:-3px;padding-left:var(--tbl);padding-right:var(--tbr);transition:padding .2s}
.stage canvas{box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.18);background:#fff;display:block}
.stage.locked{box-shadow:inset 0 0 0 3px var(--signal)}
.state{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:8px;font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--raised);padding:5px 11px;border-radius:999px;pointer-events:none}
.state .dot{width:8px;height:8px;border-radius:50%;background:var(--signal)}
.stage:not(.locked) .state .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:11px var(--font-mono);color:var(--mute);pointer-events:none}
#reticle{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;pointer-events:none;opacity:0;--p:0;
  background:conic-gradient(var(--signal) calc(var(--p)*360deg),rgba(21,21,21,.22) 0);
  -webkit-mask:radial-gradient(circle,transparent 18px,#000 19px);mask:radial-gradient(circle,transparent 18px,#000 19px)}
.stage.hot #reticle{opacity:1}
.stage.locked #reticle{opacity:0}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--raised)}
.read{font:12px var(--font-mono);color:var(--mute);display:flex;gap:6px 14px;flex-wrap:wrap}
.read b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.hist{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;background:var(--raised);border-top:1px solid var(--line);min-height:80px;align-items:center}
.th{flex:none;padding:0;border:2px solid transparent;border-radius:6px;background:none;line-height:0}
.th canvas{display:block;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
.th[aria-pressed="true"]{border-color:var(--signal)}
.hist .none{font:12px var(--font-mono);color:var(--mute)}

/* controles compartidos */
.btn{padding:7px 15px;border:1.5px solid var(--bar);color:var(--bar);border-radius:999px;background:var(--raised);font:600 12px var(--font-ui);text-transform:uppercase;letter-spacing:.06em}
.btn:hover{background:var(--bar);color:var(--bar-ink)}
.btn.primary,.btn.ghost{color:inherit}
.btn.primary{color:var(--bar-ink)}
.btn.primary{background:var(--bar);border-color:var(--bar);color:var(--bar-ink)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--line)}
label{display:block;font-weight:600;font-size:12px;margin:10px 0 4px}
label.first{margin-top:0}
input[type=text],textarea{width:100%;padding:8px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--panel);resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:56px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 8px;font:600 12px var(--font-ui);white-space:nowrap}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
.seg button:disabled{cursor:default}
input[type=range]{width:100%;accent-color:var(--signal)}
.rng{display:flex;justify-content:space-between;font:11px var(--font-mono);color:var(--mute)}
.filerow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.filerow .nm{flex:1;min-width:0;font:11px var(--font-mono);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{display:flex;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.sw i{flex:1}
.pill{display:inline-block;background:var(--bar);color:var(--bar-ink);padding:2px 14px;line-height:1.35;border-radius:999px;font:700 12px var(--font-ui);text-transform:uppercase;letter-spacing:.08em}
.tag{font:500 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 8px}

/* toolbox flotante */
#tb{position:fixed;top:64px;left:auto;right:24px;width:340px;max-height:calc(100svh - 76px);display:flex;flex-direction:column;background:var(--raised);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:6;overflow:hidden}
#tb[data-pos="left"]{left:24px;right:auto}
#tb.dragging{transition:none;opacity:.94}
.tbhead{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 16px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#tb.dragging .tbhead{cursor:grabbing}
.tbhead .pill{margin-right:auto}
.tbbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--panel);display:grid;place-items:center;flex:none;padding:0}
.tbbtn:hover,.tbbtn[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink)}
.tbbtn svg{width:16px;height:16px}
.tbtabs{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 8px}
.tab{border:1.5px solid var(--line);background:none;border-radius:999px;padding:2px 12px;font:700 13px var(--font-ui);text-transform:uppercase;letter-spacing:.07em}
.tab:hover{border-color:var(--ink)}
.tab[aria-selected="true"]{background:var(--bar);color:var(--bar-ink);border-color:var(--bar)}
.tbbody{overflow:auto;padding:4px 16px 18px;flex:1;min-height:0}
#tb.min .tbtabs,#tb.min .tbbody{display:none}
.h2{font:600 12px var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.selwrap{position:relative;display:block}
.selwrap select{appearance:none;-webkit-appearance:none;width:100%;background:var(--bar);color:var(--bar-ink);border:0;padding:10px 40px 10px 18px;font:700 15px var(--font-ui);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border-radius:999px}
.selwrap select option,.selwrap select optgroup{background:var(--raised);color:var(--ink);font-family:var(--font-ui);text-transform:none;letter-spacing:0}
.selwrap::after{content:"";position:absolute;right:17px;top:50%;border:5px solid transparent;border-top:6px solid var(--bar-ink);transform:translateY(-25%);pointer-events:none}
.brief{background:var(--panel);border-radius:var(--r-md);padding:14px;margin-top:12px;display:grid;gap:10px}
.brief .bh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brief .bh b{font:700 20px var(--font-ui);text-transform:uppercase;letter-spacing:.04em}
.brief p{margin:0;font-size:13px;color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12px}
.facts dt{color:var(--mute);font:500 11px var(--font-mono);padding-top:1px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.fmts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fmt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--r-md);background:none;text-align:left}
.fmt:hover{border-color:var(--ink)}
.fmt[aria-pressed="true"]{border-color:var(--ink);background:var(--panel)}
.fmt .mini{border:1.5px solid var(--ink);border-radius:2px;flex:none}
.fmt b{display:block;font:700 14px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.fmt small{font:10px var(--font-mono);color:var(--mute)}
.elg{margin-bottom:14px}
.elrow{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.elrow .h2{margin:0;flex:1}
.el{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 12px 8px 10px;border:1.5px solid transparent;border-radius:var(--r-md);background:var(--panel);margin-bottom:5px}
.el:hover{border-color:var(--ink)}
.el .chk{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;flex:none;margin-top:1px;display:grid;place-content:center}
.el[aria-pressed="true"] .chk{background:var(--ink)}
.el[aria-pressed="true"] .chk::after{content:"";width:9px;height:5px;border:2px solid var(--bar-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.el[aria-pressed="false"]{opacity:.55}
.el b{display:block;font:700 14px var(--font-ui);text-transform:uppercase;letter-spacing:.05em;line-height:1.15}
.el small{display:block;font-size:11.5px;color:var(--mute);line-height:1.3}
.note{font-size:12px;color:var(--mute);margin:0 0 12px}

/* vista de exploración */
#explore{position:fixed;inset:0;background:var(--paper);z-index:9;overflow:auto}
.xwrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}
.xhead{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0 12px}
.xhead h2{font:400 24px var(--font-d);text-transform:uppercase;letter-spacing:.01em;margin:0 auto 0 0;line-height:1}
.xcard{background:var(--raised);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:14px}
.xcard h3{font:700 15px var(--font-ui);text-transform:uppercase;letter-spacing:.09em;margin:0 0 12px;display:inline-block;background:var(--bar);color:var(--bar-ink);padding:1px 14px;border-radius:999px}
.xcard p{margin:0 0 10px;max-width:70ch}
.xcard ul{margin:0;padding-left:18px}
.xcard li{margin-bottom:4px}
.theme{margin-bottom:14px}
.theme h4{margin:0 0 8px;font:600 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cc{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--raised)}
.cc i{display:block;height:46px}
.cc span{display:block;padding:5px 9px 7px;font:11px var(--font-mono);line-height:1.3;overflow-wrap:anywhere}
.cc span b{display:block;font:600 11px var(--font-ui)}
.spec{border-bottom:1px solid var(--line);padding:10px 0;display:grid;gap:2px}
.spec small{font:11px var(--font-mono);color:var(--mute)}
.bars{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.bars div{display:grid;gap:4px;justify-items:center;font:11px var(--font-mono);color:var(--mute)}
.bars i{display:block;background:var(--ink);min-width:6px}
.radii div i{width:54px;height:54px;background:var(--panel);border:2px solid var(--ink)}
.elgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.elcard{border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--raised)}
.elcard canvas{display:block;width:100%;height:auto;background:var(--panel)}
.elcard div{padding:9px 14px 12px}
.elcard b{display:block;font:700 15px var(--font-ui);text-transform:uppercase;letter-spacing:.05em}
.elcard small{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.elcard .tag{margin-top:6px;display:inline-block}
.comps{display:flex;gap:6px;flex-wrap:wrap}
.comps span{border:1.5px solid var(--line);border-radius:999px;padding:1px 12px;font:600 12px var(--font-mono)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.55);display:grid;place-items:center;padding:16px;z-index:12}
.dlg{background:var(--raised);border-radius:var(--r-lg);width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.dlg h3{margin:0 0 6px;font:400 20px var(--font-d);text-transform:uppercase;letter-spacing:.01em}
.dlg p{margin:0 0 14px;color:var(--mute);max-width:60ch}
.drop{display:grid;place-items:center;text-align:center;padding:22px 14px;border:2px dashed var(--line);border-radius:var(--r-md);background:var(--panel);cursor:pointer;margin-bottom:12px;font-weight:600}
.drop.over,.drop:hover{border-color:var(--signal)}
.drop small{display:block;font:11px var(--font-mono);color:var(--mute);font-weight:400;margin-top:4px}
#impReport{margin:12px 0;font-size:13px}
#impReport .sw{height:22px;margin-bottom:8px}
#impReport ul{margin:0;padding-left:18px;color:var(--mute)}
#impReport .err{color:var(--signal);margin:0}
.dlgrow{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.dlgrow input{flex:1;min-width:140px}
.prev{display:grid;place-items:center;background:var(--stage);border-radius:var(--r-md);padding:12px;margin-bottom:12px}
.prev img{max-width:100%;max-height:52vh;display:block}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.on{opacity:1}
@media (max-width:860px){
  html,body{height:auto;overflow:auto}
  body{display:block}
  .top{position:sticky;top:0;z-index:5;background:var(--paper)}
  .keys{display:none}
  .app{height:auto}
  .stagecol{position:static;display:block;margin:0 8px 8px;padding-bottom:0}
  .stage{height:62svh;padding:0}
  #tb,#tb[data-pos]{position:fixed;left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:52svh;border-radius:var(--r-lg)}
  .tbhead{cursor:default}
  #tb .tbbtn.posbtn{display:none}
  .xcard{padding:18px}
}
@media (prefers-reduced-motion:reduce){.state .dot{animation:none!important}#toast,.stage{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="wm">numérica<i>.</i></span><span class="sub">producido</span></div>
  <div class="keys" aria-hidden="true"><span><kbd>Espacio</kbd> fijar</span><span><kbd>R</kbd> mezclar</span><span><kbd>←</kbd><kbd>→</kbd> historial</span><span><kbd>E</kbd> exportar</span><span><kbd>T</kbd> toolbox</span></div>
</header>
<div class="app">
  <main class="stagecol">
    <div class="stage" id="stage" tabindex="0" aria-label="Lienzo. Mueve el cursor para generar composiciones. Espacio o clic para fijar.">
      <canvas id="cv" width="800" height="1000"></canvas>
      <div id="reticle"></div>
      <div class="state" id="state"><span class="dot"></span><span id="stText">Generando</span></div>
      <div class="tip" id="tip">Mueve el cursor sobre el lienzo. Clic para fijar.</div>
    </div>
    <div class="bar">
      <div class="read" id="readout"></div>
      <div class="acts">
        <button class="btn" type="button" id="bPrev" aria-label="Composición anterior">←</button>
        <button class="btn" type="button" id="bNext" aria-label="Composición siguiente">→</button>
        <button class="btn" type="button" id="bShuffle">Mezclar</button>
        <button class="btn" type="button" id="bLock" aria-pressed="false">Fijar</button>
        <button class="btn" type="button" id="bCopy">Copiar</button>
        <button class="btn primary" type="button" id="bExport">Exportar</button>
      </div>
    </div>
    <div class="hist" id="hist" aria-label="Historial de composiciones"></div>
  </main>

  <aside id="tb" data-pos="right" aria-label="Toolbox">
    <div class="tbhead" id="tbHead">
      <span class="pill">Toolbox</span>
      <button class="tbbtn posbtn" type="button" id="tbPos" aria-label="Cambiar posición del toolbox" title="Posición: derecha"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11" /></svg></button>
      <button class="tbbtn" type="button" id="tbMin" aria-label="Contraer toolbox" aria-expanded="true" title="Contraer (T)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10l5-5 5 5"/></svg></button>
    </div>
    <div class="tbtabs" role="tablist" id="tbTabs">
      <button class="tab" role="tab" data-t="sys" type="button">Sistema</button>
      <button class="tab" role="tab" data-t="el" type="button">Elementos</button>
      <button class="tab" role="tab" data-t="fmt" type="button">Formato</button>
      <button class="tab" role="tab" data-t="txt" type="button">Contenido</button>
      <button class="tab" role="tab" data-t="img" type="button">Imagen</button>
      <button class="tab" role="tab" data-t="out" type="button">Salida</button>
    </div>
    <div class="tbbody">
      <section data-p="sys">
        <div class="h2">Sistema de diseño</div>
        <div class="selwrap"><select id="selSys" aria-label="Sistema de diseño"></select></div>
        <div class="brief" id="brief"></div>
        <div class="h2" style="margin-top:14px">Tema</div>
        <div class="seg" id="segTheme"></div>
      </section>
      <section data-p="el" hidden>
        <p class="note" id="elNote"></p>
        <div id="elList"></div>
      </section>
      <section data-p="fmt" hidden>
        <div class="h2">Formato de la pieza</div>
        <div id="fmtList" class="fmts"></div>
      </section>
      <section data-p="txt" hidden>
        <label class="first" for="fKicker">Antetítulo</label>
        <input type="text" id="fKicker" autocomplete="off">
        <label for="fTitle">Título</label>
        <textarea id="fTitle" rows="2"></textarea>
        <label for="fBody">Texto</label>
        <textarea id="fBody" rows="3"></textarea>

  const spec = (label, stack, size, wt, text) => '<div class="spec"><small>' + label + ' · ' + esc(stack) + '</small><div style="font:' + wt + ' ' + size + 'px/1.1 ' + esc(stack).replace(/&quot;/g, "'") + ';overflow-wrap:anywhere">' + text + '</div></div>';
  const maxSp = Math.max(1, ...(sys.spacing || [1]));
  exp.innerHTML = '<div class="xwrap"><div class="xhead"><button class="btn" type="button" id="xBack">← Volver al compositor</button><h2>' + esc(sys.name) + '</h2>' +
    (sys.url ? '<a class="btn" href="' + esc(sys.url) + '" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">Abrir artefacto original ↗</a>' : '') + '</div>' +
    '<div class="xcard"><h3>Resumen</h3><p>' + esc(info.brief) + '</p><div class="comps"><span>' + (sys.builtin ? 'Artefacto' : 'Importado') + '</span><span>' + sys.themes.length + ' temas</span><span>' + (Object.values(sys.colors)[0] || []).length + ' colores</span><span>' + els.length + ' elementos</span></div>' +
    (info.rules && info.rules.length ? '<h3 style="margin-top:18px">Reglas</h3><ul>' + info.rules.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul>' : '') + '</div>' +
    '<div class="xcard"><h3>Colores</h3>' + themes + '</div>' +
    '<div class="xcard"><h3>Tipografía</h3>' + spec('Display', f.dStack, 44, 700, 'Diseña a la velocidad del cursor') + spec('Texto', f.bStack, 18, 400, 'Cada movimiento propone una composición distinta. Fija la que te guste y expórtala.') + '</div>' +
    ((sys.spacing && sys.spacing.length) || (sys.radius && sys.radius.length) ? '<div class="xcard"><h3>Espacios y radios</h3>' +
      (sys.spacing && sys.spacing.length ? '<div class="bars">' + sys.spacing.map(v => '<div><i style="width:' + Math.max(6, v) + 'px;height:' + Math.max(6, Math.min(60, 8 + v * 40 / maxSp)) + 'px"></i>' + v + '</div>').join('') + '</div>' : '') +
      (sys.radius && sys.radius.length ? '<div class="bars radii" style="margin-top:16px">' + sys.radius.map(v => '<div><i style="border-radius:' + Math.min(v, 27) + 'px"></i>' + (v >= 999 ? 'píldora' : v + 'px') + '</div>').join('') + '</div>' : '') + '</div>' : '') +
    '<div class="xcard"><h3>Elementos para componer</h3><p>Esto es lo único que dibuja el generador. Activa o apaga cada uno desde la pestaña Elementos del toolbox.</p><div class="elgrid">' +
    els.map(e => '<div class="elcard"><canvas width="420" height="260" data-el="' + e.id + '"></canvas><div><b>' + esc(e.n) + '</b><small>' + esc(e.d) + '</small><span class="tag">' + (off.has(e.id) ? 'Apagado' : 'Activo') + '</span></div></div>').join('') + '</div></div>' +
    (info.components && info.components.length ? '<div class="xcard"><h3>Componentes del artefacto</h3><div class="comps">' + info.components.map(c => '<span>' + esc(c) + '</span>').join('') + '</div></div>' : '') +
    '<div class="btnrow"><button class="btn primary" type="button" id="xUse">Componer con este sistema</button></div></div>';
  $('#xBack').onclick = closeExplore; $('#xUse').onclick = closeExplore;
  $$('canvas[data-el]', exp).forEach(c => {
    const id = c.dataset.el, P = params(sys, {off: new Set(), bgMode: 'light', content: {...DEF_CONTENT, brand: sys.name}, logo: S.logoObj, img: null});
    try { const E = makeEnv(c.getContext('2d'), c.width, c.height, hashStr(sys.id + id), P); if (!DECOR[E.kit][id]) E.k = 2.1; previewElement(E, id, {x: 0, y: 0, w: c.width, h: c.height}); } catch(err){}
  });
}
function openExplore(){
  renderExplore(); exp.hidden = false; exp.scrollTop = 0; try { history.replaceState(null, '', '#explorar'); } catch(e){}
  const b = $('#xBack'); b && b.focus();
}
function closeExplore(){
  exp.hidden = true; try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  const b = $('#bExplore'); b && b.focus();
}
window.addEventListener('hashchange', () => { if (location.hash === '#explorar' && exp.hidden) openExplore(); else if (location.hash !== '#explorar' && !exp.hidden) { exp.hidden = true; } });

/* ============ export ============ */
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }
let dlP = null;
function getDownloads(){
  if (!dlP) dlP = (window.claude && typeof claude.use === 'function') ? Promise.resolve(claude.use('downloads')).catch(() => null) : Promise.resolve(null);
  return dlP;
}
async function renderBlob(mime){
  const f = fmt(), W = f.w * S.scale, H = f.h * S.scale, off = document.createElement('canvas'); off.width = W; off.height = H;
  compose(off.getContext('2d'), W, H, S.seed);
  return new Promise(r => off.toBlob(r, mime, .94));
}
async function exportPiece(){
  const mime = S.type === 'jpg' ? 'image/jpeg' : 'image/png', blob = await renderBlob(mime);
  if (!blob){ toast('No se pudo generar la imagen. Prueba con escala 1×.'); return; }
  const name = 'numerica-' + slug(curSys().name) + '-' + fmt().id + '-' + S.seed + '.' + S.type;
  const dl = await getDownloads();
  if (dl && typeof dl.save === 'function'){
    const bytes = new Uint8Array(await blob.arrayBuffer());
    for (const data of [blob, bytes]){
      try { await dl.save({filename: name, data}); toast('Exportado: ' + name); return; }
      catch(err){ if (/cancel|declin|reject|denied/i.test(String(err && (err.code || err.name || err.message)))){ toast('Descarga cancelada.'); return; } }
    }
  }
  if (!window.claude){
    const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000); toast('Exportado: ' + name); return;
  }
  openPreview(blob, name);
}
async function copyPiece(){
  try {
    const blob = await renderBlob('image/png');
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); toast('Imagen copiada.');
  } catch(e){ toast('Tu navegador no permite copiar aquí. Usa Exportar.'); }
}

/* ============ modal ============ */
const modal = $('#modal'), dlg = $('#dlg'); let lastFocus = null;
function showModal(html){ lastFocus = document.activeElement; dlg.innerHTML = html; modal.hidden = false; const f = dlg.querySelector('button, input, textarea'); f && f.focus(); }
function closeModal(){ modal.hidden = true; dlg.innerHTML = ''; lastFocus && lastFocus.focus && lastFocus.focus(); }
modal.addEventListener('pointerdown', e => { if (e.target === modal) closeModal(); });
function openPreview(blob, name){
  const url = URL.createObjectURL(blob);
  showModal('<h3 id="dlgT">Tu pieza está lista</h3><p>Este visor no permite descargas directas. Guarda la imagen con clic derecho o pulsación larga, o cópiala.</p><div class="prev"><img alt="Pieza exportada" src="' + url + '"></div><div class="dlgrow"><span class="nm" style="margin-right:auto;font:11px var(--font-mono);color:var(--mute)">' + esc(name) + '</span><button class="btn" type="button" id="pvCopy">Copiar imagen</button><button class="btn primary" type="button" id="pvClose">Cerrar</button></div>');
  $('#pvClose').onclick = closeModal;
  $('#pvCopy').onclick = async () => { try { const png = blob.type === 'image/png' ? blob : await renderBlob('image/png'); await navigator.clipboard.write([new ClipboardItem({'image/png': png})]); toast('Imagen copiada.'); } catch(e){ toast('No se pudo copiar. Usa clic derecho.'); } };
}
let imp = {entries: [], res: null}, impAuto = '';
function openImport(files){
  imp = {entries: [], res: null}; impAuto = '';
  showModal('<h3 id="dlgT">Importar sistema de diseño</h3><p>Suelta lo que exportaste del artefacto del sistema de diseño: tokens.json, tokens.css, README.md o el .zip completo. Puedes añadir un logo y fuentes en la misma tanda.</p>' +
    '<label class="drop" id="drop" tabindex="0">Arrastra archivos o <u>elígelos</u><small>.zip .json .css .md .svg .png .woff2 .ttf</small><input type="file" id="impFile" multiple hidden accept=".zip,.json,.css,.md,.txt,.svg,.png,.jpg,.jpeg,.webp,.woff,.woff2,.ttf,.otf"></label>' +
    '<label for="impPaste">O pega JSON o CSS</label><textarea id="impPaste" rows="4" placeholder=\'{"color":{"tokens":[…]}}  o  :root{--ink:#111;…}\'></textarea>' +
    '<div id="impReport" aria-live="polite"></div>' +
    '<div class="dlgrow"><input type="text" id="impName" placeholder="Nombre del sistema" autocomplete="off"><button class="btn" type="button" id="impClear">Limpiar</button><button class="btn" type="button" id="impCancel">Cancelar</button><button class="btn primary" type="button" id="impOk" disabled>Añadir sistema</button></div>');
  const drop = $('#drop'), inp = $('#impFile');
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); inp.click(); } });
  inp.onchange = () => addImportFiles(inp.files).then(() => { inp.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => dlg.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  dlg.addEventListener('dragleave', e => { if (!dlg.contains(e.relatedTarget)) drop.classList.remove('over'); });
  dlg.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); addImportFiles(e.dataTransfer.files); });
  let pt = 0; $('#impPaste').addEventListener('input', () => { clearTimeout(pt); pt = setTimeout(rebuildImport, 300); });
  $('#impClear').onclick = () => { imp.entries = []; $('#impPaste').value = ''; rebuildImport(); };
  $('#impCancel').onclick = closeModal;
  $('#impOk').onclick = commitImport;
  if (files && files.length) addImportFiles(files);
}
async function addImportFiles(files){
  try { imp.entries.push(...await readEntries([...files])); } catch(e){ $('#impReport').innerHTML = '<p class="err">' + esc(e.message || 'No se pudo leer el archivo.') + '</p>'; return; }
  rebuildImport();
}
async function rebuildImport(){
  const rep = $('#impReport'); if (!rep) return;
  const entries = [...imp.entries], t = $('#impPaste').value.trim();
  if (t) entries.push({name: 'pegado', ext: /^\s*[\[{]/.test(t) ? 'json' : /--[\w-]+\s*:/.test(t) ? 'css' : 'md', text: t});
  const ok = $('#impOk');
  if (!entries.length){ rep.innerHTML = ''; ok.disabled = true; imp.res = null; return; }
  let res; try { res = await buildSystem(entries); } catch(e){ rep.innerHTML = '<p class="err">' + esc(e.message || 'No se pudo leer el contenido.') + '</p>'; ok.disabled = true; return; }
  imp.res = res;
  if (!res.sys){ rep.innerHTML = '<p class="err">No encontré colores en lo que cargaste. Importa el tokens.json, el tokens.css o el .zip exportado del sistema.</p>'; ok.disabled = true; return; }
  const s = res.sys, f = sysFonts(s), nc = Object.values(s.colors)[0].length;
  const nameEl = $('#impName'); if (!nameEl.value || nameEl.value === impAuto){ nameEl.value = s.name; impAuto = s.name; }
  rep.innerHTML = '<div class="sw">' + swatchHTML(s, s.themes[0].id) + '</div><ul><li>' + nc + ' colores en ' + s.themes.length + (s.themes.length === 1 ? ' tema' : ' temas') + '</li><li>Tipografía: ' + esc(f.dName || 'del sistema (sin fuente detectada)') + (f.bName && f.bName !== f.dName ? ' y ' + esc(f.bName) : '') + '</li>' +
    '<li>' + (s.radius.length ? s.radius.length + ' radios' : 'Sin radios, uso esquinas suaves') + ' · ' + (s.spacing.length ? s.spacing.length + ' espacios' : 'sin espacios, uso márgenes por defecto') + '</li>' +
    '<li>' + (s.logo ? 'Logo detectado' : 'Sin logo, uso el nombre como marca') + (s.fontFiles.length ? ' · ' + s.fontFiles.length + ' archivos de fuente' : '') + '</li>' + res.notes.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>';
  ok.disabled = false;
}
async function commitImport(){
  if (!imp.res || !imp.res.sys) return;
  const s = imp.res.sys; s.name = ($('#impName').value || s.name).trim().slice(0, 40) || 'Sistema importado';
  s.kit = 'tokens'; s.info = autoInfo(s);
  S.systems.push(s); closeModal(); await registerFontFiles(s); await selectSystem(s.id); toast('Sistema añadido: ' + s.name);
}
window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!modal.hidden || !e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  const fs = [...e.dataTransfer.files]; if (fs.some(f => ['zip','json','css','md','txt','woff','woff2','ttf','otf'].includes(extOf(f.name)))) openImport(fs);
});

/* ============ actions + keys ============ */
$('#bShuffle').onclick = () => newSeed(Math.random() * 1e4, Math.random() * 1e4);
$('#bLock').onclick = () => setLock(!S.locked);
$('#bPrev').onclick = () => step(-1);
$('#bNext').onclick = () => step(1);
$('#bExport').onclick = exportPiece;
$('#bCopy').onclick = copyPiece;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!modal.hidden){ closeModal(); return; } if (!exp.hidden){ closeExplore(); return; } }
  if (!modal.hidden || !exp.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === ' ' && (tag === 'BUTTON' || tag === 'A')) return;
  if (e.key === ' '){ e.preventDefault(); setLock(!S.locked); }
  else if (e.key === 'r' || e.key === 'R') newSeed(Math.random() * 1e4, Math.random() * 1e4);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'e' || e.key === 'E') exportPiece();
  else if (e.key === 't' || e.key === 'T'){ S.tb.open = !S.tb.open; applyTb(); persist(); }
});
document.addEventListener('pointerup', e => { const b = e.target.closest && e.target.closest('button'); if (b && e.pointerType !== 'touch') setTimeout(() => b.blur(), 0); });

/* ============ boot ============ */
renderSelect(); renderBrief(); renderThemeSeg(); renderElements(); renderFormats(); applyTb(); setLock(false);
pushSeed(S.seed);
if (location.hash === '#explorar') openExplore();
Suite.init({app: 'numerica', gate: true, onUser: onUser, onLogout: onLogout});
applyTb();
(async () => {
  const sys = curSys();
  await registerFontFiles(sys);
  await Promise.race([ensureFonts(sys), new Promise(r => setTimeout(r, 3500))]);
  render(); refreshLogo();
})();
})();
</script>
</body>
</html>
